<style>
:root{--bg:#fff;--fg:#1d1f23;--mute:#6b7078;--line:#e4e6ea;--card:#f7f8fa;--acc:#1a4c8b;--on:#e8f0fb}
@media (prefers-color-scheme:dark){:root{--bg:#16181c;--fg:#e6e8eb;--mute:#9aa0a8;--line:#2c3036;--card:#1e2126;--acc:#7fb0ff;--on:#1f2d42}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:820px;margin:0 auto;padding:16px 16px 110px}h1{font-size:19px;margin:8px 0 2px}.sub{color:var(--mute);font-size:13px;margin-bottom:14px}
label{display:flex;gap:12px;padding:14px;margin:0 0 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer}

.t{font-weight:600}.t a{color:var(--acc);text-decoration:none}.m{color:var(--mute);font-size:13px}.g{margin-top:6px}

<h1>논문 선택 — 2026-10-10</h1>
<div class="sub">체크하고 아래 「보내기」를 누르면 DOI 목록이 채워진 메일 작성창이 뜹니다. <b>전송</b>하면 5분 안에 접수 확인 메일이 옵니다.</div>
<h2>신규 10편</h2><div class="sub">체크하면 전문을 받아 노트를 씁니다.</div>
<label><input type="checkbox" value="10.1016/j.cacaie.2026.100246"><div><div class="t">1. <a href="https://doi.org/10.1016/j.cacaie.2026.100246" target="_blank">Managing societal risk externalities of HazMat transportation through automated-vehicle-enabled system-optimal traffic control</a></div><div class="m">Jinxiao Du, Shuangyuan Yu, Shao-Jie Liu 외 · Computer-Aided Civil and Infrastructure Engineering · 2026-10 </div><div class="g">위험물(HazMat) 수송 경로가 통행시간만 기준으로 정해져 인구 밀집 지역의 노출 위험을 키우는 문제를 다룬다. 자율주행차가 위험물을 중앙에서 경로 배정하고 일반 차량은 기존 패턴을 따르는 혼합교통을 가정해, 다중 클래스 double-queue 동적 네트워크 로딩 모델 기반의 system-optimal 동적 교통배정 framework를 선형계획 문제로 정식화했다. 대기행렬 spillback을 고려해 사회적 위험 외부효과를 관리하는 교통 제어 방안을 제시한다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116455"><div><div class="t">2. <a href="https://doi.org/10.1016/j.engappai.2026.116455" target="_blank">Transformer architecture incorporating discrete wavelet transform for fully automated baseline correction of near-fault ground-motion records</a></div><div class="m">Weihao Pan, Yingmin Li, Jun Han 외 · Engineering Applications of Artificial Intelligence · 2026-12 </div><div class="g">근단층 지진동 기록의 baseline 보정에서 수동 파라미터에 의존하고 pulse 특성이 왜곡되는 문제를 다룬다. pulse를 강화한 합성 데이터셋을 만들고 discrete wavelet transform을 결합한 Transformer(DWT-Transformer)로 보정을 완전 자동화했다. 영구 변위와 pulse 특성을 보존하며, 기존 deep learning·신호처리 보정 기법과 성능을 비교했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116458"><div><div class="t">3. <a href="https://doi.org/10.1016/j.engappai.2026.116458" target="_blank">Theory-informed machine learning framework for compressive strength prediction and multi-objective optimization design of masonry structures</a></div><div class="m">Fangming Jiang, Jiaxin Chen, Wenguang Chen 외 · Engineering Applications of Artificial Intelligence · 2026-12 </div><div class="g">조적 구조의 압축강도 경험식이 탄성계수·줄눈 두께 같은 핵심 변수를 빠뜨려 정확도가 낮은 문제를 다룬다. 블록-모르타르 간 구속 효과를 이론적으로 유도하고(4·6 파라미터 식), FE 해석으로 검증한 데이터셋에 machine learning 모델 3종을 학습시켜 다목적 최적 설계까지 연결했다. least-squares boosting 모델의 예측 성능이 가장 좋았다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116464"><div><div class="t">4. <a href="https://doi.org/10.1016/j.engappai.2026.116464" target="_blank">Physically inspired geometry-to-photometry rendering and lightweight convolutional neural network for real-time weld defect detection</a></div><div class="m">Ling Cao, Jiajun Qiu, Yunzhi Zhang 외 · Engineering Applications of Artificial Intelligence · 2026-12 #컴퓨터비전</div><div class="g">배터리 상판 용접 결함은 높이 차이가 아주 작고 표면이 반사성이라 2D 영상에 신호가 거의 남지 않는다. 3D 용접 형상을 물리 기반 rendering으로 판별력 있는 2D photometric 영상으로 바꾸고, wavelet을 넣은 경량 YOLO-WT로 실시간 검출하는 방법을 제안했다. 원시 depth map보다 YOLOv11n mAP@50이 5.9점 올랐다. 건설이 아닌 제조업 사례이며, 남긴 이유는 vision 기법을 참고할 수 있어서다.</div></div></label>
<label><input type="checkbox" value="10.1061/jccee5.cpeng-7708"><div><div class="t">5. <a href="https://doi.org/10.1061/jccee5.cpeng-7708" target="_blank">Three-Dimensional Concrete Printing in the Construction Industry: Landscape, Challenges, and Future Opportunities</a></div><div class="m">Ala Sati, Fatma Hosny, Bharadwaj R. K. Mantha 외 · Journal of Computing in Civil Engineering · 2027-01-01 #모듈러</div><div class="g">3D 콘크리트 프린팅(3DCP) 리뷰 논문 76편을 일반 기술·재료·보강·프린터 공정·지속가능성·적용 사례·기준 등 7개 범주로 분석했다. 재료·역학(38%)과 기술 개관(29%)에 연구가 몰려 있고, 지속가능성(7%)과 기준·가이드라인(0%)은 거의 다뤄지지 않았다. 관리·비용 등 비재료 분야를 위한 research guidance matrix를 제시한다.</div></div></label>
<label><input type="checkbox" value="10.1061/jmenea.meeng-7764"><div><div class="t">6. <a href="https://doi.org/10.1061/jmenea.meeng-7764" target="_blank">Enhancing Knowledge Management in Green Building Engineering: A Hybrid Retrieval-Augmented Generation Approach to Support Project Assessment</a></div><div class="m">Yixin Li, Dingyuan Ma, Changjun Wang 외 · Journal of Management in Engineering · 2027-01-01 </div><div class="g">녹색건축 인증 심사에서 용어가 많고 조항이 서로 얽힌 규정을 사람이 일일이 찾아봐야 하는 비효율을 다룬다. 지식 획득·조직·검색·제시(AORP) 관점에서 이중 구조 knowledge network를 만들고, 도메인 용어 가중 hybrid retrieval을 넣은 retrieval-augmented generation(RAG) 워크플로를 개발했다. 이 방식으로 LLM 기반 프로젝트 평가 의사결정을 지원한다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105367"><div><div class="t">7. <a href="https://doi.org/10.1016/j.aei.2026.105367" target="_blank">Can LLMs support altruistic decisions in fire evacuations? Analysis via an FDS-ABM model with pedestrian assistance</a></div><div class="m">Yufei Li, Peng Lu · Advanced Engineering Informatics · 2027-01 #안전행동</div><div class="g">건물 화재 피난 중 다른 사람을 돕는 이타적 행동을 LLM으로 모사할 수 있는지 검증했다. FDS(화재 시뮬레이션)와 Agent-Based Model을 결합하고, GPT-4가 생리·사회적 요인을 바탕으로 보행자의 개인별 도움 결정을 내리게 했으며 Qwen3-max로 일관성을 교차 검증했다. XGBoost와 SHAP으로 도움 행동을 분류하고 영향 요인의 기여도를 정량화했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116435"><div><div class="t">8. <a href="https://doi.org/10.1016/j.engappai.2026.116435" target="_blank">Structural continuity-aware pavement crack segmentation in unmanned aerial vehicle images with state-space feature interaction and dynamic global large-kernel attention</a></div><div class="m">Jinhao Cai, Zhihua Zhang, Yikun Li 외 · Engineering Applications of Artificial Intelligence · 2026-12 #컴퓨터비전 #구조점검</div><div class="g">UAV로 찍은 포장 영상은 스케일·시점 변화, 그림자, 모션 블러가 있어 가는 균열이 끊겨서 분할되는 문제가 있다. U자형 encoder-decoder에 state-space 기반 feature interaction, coordinate attention, ASPP, dynamic global large-kernel attention, multi-scale channel attention을 넣어 균열 구조의 연속성을 강화했다. 직접 구축한 UAV 균열 영상 7,934장으로 ablation 실험을 해 각 모듈이 상호보완적으로 성능을 높인다는 것을 확인했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116453"><div><div class="t">9. <a href="https://doi.org/10.1016/j.engappai.2026.116453" target="_blank">Optimizing multi-timescale market participation for distributed renewable energy: A Bi-level model predictive control and improved reinforcement learning framework</a></div><div class="m">Yuyuan Zhang, Ziren Wang, Wei Li · Engineering Applications of Artificial Intelligence · 2026-12 </div><div class="g">분산형 재생에너지 aggregator가 여러 시간 단위의 전력시장에 참여할 때 생기는 수급 불균형과 확률적 변동을 다룬다. 상위 계층은 WGAN-GP로 풍력·태양광 출력을 생성해 중장기·전일·녹색인증서 시장 거래를 rolling 최적화하고, 하위 계층은 실시간 시장·부하 조정·ESS로 편차를 보정하는 bi-level MPC와 개선된 reinforcement learning framework를 제안했다. 건설과의 접점은 약하다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116511"><div><div class="t">10. <a href="https://doi.org/10.1016/j.engappai.2026.116511" target="_blank">Physics-regularized deep learning for mining method selection in computational geomechanics</a></div><div class="m">Duo Zhang, Qingtong Jin, Yu Zhang 외 · Engineering Applications of Artificial Intelligence · 2026-12 </div><div class="g">광체와 상·하반이 모두 연약한 파쇄 광체에서 채광법을 고를 때 기존 MCDM은 가중치가 주관적이고 수치해석 결과를 잘 활용하지 못한다. Mohr-Coulomb 안전-응력 결합을 반영한 physics-regularized attention mask, 암반역학 실현가능성 penalty, FLAC3D에서 뽑은 특징을 결합한 Physics-Regularized Transformer를 개발했다. 실사례 leave-one-out 정확도 94.7%(18/19), 증강 데이터 정확도 98.2%로 UMT와 BPNN보다 높았다.</div></div></label>
</main>
<div class="bar"><div><span class="n"><b id="n">0</b>편 선택</span>
<button id="gm" disabled>Gmail로 보내기</button><button id="ap" class="alt" disabled>메일 앱으로 보내기</button>
<span id="msg">작성창이 열렸으면 <b>전송</b>을 눌러야 접수됩니다. 5분 안에 「접수」 확인 메일이 옵니다. 안 오면 다른 버튼으로 다시 보내세요.</span></div></div>
<script>
const TO="bjchoi13@gmail.com", ME="bchoi@ajou.ac.kr", KEY="2026-10-10", K="picks-"+KEY, OLD=false;
const boxes=[...document.querySelectorAll("input")], gm=document.getElementById("gm"), ap=document.getElementById("ap");
try{const s=JSON.parse(localStorage.getItem(K)||"[]");boxes.forEach(b=>b.checked=s.includes(b.value))}catch(e){}
const sel=()=>boxes.filter(b=>b.checked).map(b=>b.value);
function upd(){const d=sel();document.getElementById("n").textContent=d.length;
  gm.disabled=ap.disabled=!d.length&&!OLD;   // 검토 칸이 있으면 0편도 보낼 수 있다(전부 지움)
  try{localStorage.setItem(K,JSON.stringify(d))}catch(e){}}
boxes.forEach(b=>b.addEventListener("change",upd));upd();
const su=()=>"[논문선택] "+KEY+" "+sel().length+"편", body=()=>sel().join("\n")+"\n", q=encodeURIComponent;
const done=()=>document.getElementById("msg").style.display="block";
// 폰에서는 Gmail 웹 작성창 주소가 앱·받은편지함으로 넘어가며 내용을 잃는다(2026-09-27 실측). 메일 앱을 주 버튼으로.
if(matchMedia("(pointer:coarse)").matches){gm.className="alt";ap.className="";gm.parentNode.insertBefore(ap,gm)}
gm.onclick=()=>{done();window.open("https://mail.google.com/mail/?authuser="+q(ME)+"&view=cm&fs=1&to="+q(TO)+"&su="+q(su())+"&body="+q(body()),"_blank")};
ap.onclick=()=>{done();location.href="mailto:"+TO+"?subject="+q(su())+"&body="+q(body())};
</script></body></html>
