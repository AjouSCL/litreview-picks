<!doctype html>

<title>논문 선택 2026-10-25</title>
<style>
:root{--bg:#fff;--fg:#1d1f23;--mute:#6b7078;--line:#e4e6ea;--card:#f7f8fa;--acc:#1a4c8b;--on:#e8f0fb}
@media (prefers-color-scheme:dark){:root{--bg:#16181c;--fg:#e6e8eb;--mute:#9aa0a8;--line:#2c3036;--card:#1e2126;--acc:#7fb0ff;--on:#1f2d42}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:820px;margin:0 auto;padding:16px 16px 110px}h1{font-size:19px;margin:8px 0 2px}.sub{color:var(--mute);font-size:13px;margin-bottom:14px}
label{display:flex;gap:12px;padding:14px;margin:0 0 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer}
label:has(input:checked){background:var(--on);border-color:var(--acc)}
input{width:20px;height:20px;flex:none;margin-top:3px;accent-color:var(--acc)}
.t{font-weight:600}.t a{color:var(--acc);text-decoration:none}.m{color:var(--mute);font-size:13px}.g{margin-top:6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px}
.bar div{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;padding:9px 16px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:var(--bg);cursor:pointer}
button.alt{background:transparent;color:var(--acc)}button:disabled{opacity:.4;cursor:default}.n{margin-right:auto}

h2{font-size:16px;margin:26px 0 4px}h2+.sub{margin-bottom:10px}
</style></head><body><main>
<h1>논문 선택 — 2026-10-25</h1>
<div class="sub">체크하고 아래 「보내기」를 누르면 DOI 목록이 채워진 메일 작성창이 뜹니다. <b>전송</b>하면 5분 안에 접수 확인 메일이 옵니다.</div>
<h2>신규 9편</h2><div class="sub">체크하면 전문을 받아 노트를 씁니다.</div>
<label><input type="checkbox" value="10.1016/j.aei.2026.105394"><div><div class="t">1. <a href="https://doi.org/10.1016/j.aei.2026.105394" target="_blank">Resolving primitive-sharing ambiguity in long-tailed TLS-based industrial MEP point cloud segmentation via spatial context constraints</a></div><div class="m">Chao Yin, Qing Han, Zhiwei Hou 외 · Advanced Engineering Informatics · 2027-01 #컴퓨터비전 #디지털트윈</div><div class="g">TLS로 스캔한 산업 MEP 점군 segmentation에서 reducer·valve 같은 tail class가 계속 오분류되는 문제를 다룬다. 원인은 215:1의 극단적 class imbalance와 원통형 primitive 공유로 생기는 기하학적 모호성이다. Class-Balanced Loss에 Boundary-CB와 Density-CB라는 공간 맥락 제약을 더해 Industrial3D에서 mIoU 55.74%를 얻었다. tail class는 21.7% 개선됐고, reducer IoU는 0%에서 21.12%로 올랐다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116624"><div><div class="t">2. <a href="https://doi.org/10.1016/j.engappai.2026.116624" target="_blank">Soil property prediction method incorporating spatial variability through local association analysis</a></div><div class="m">Wei Hu, Zhen Liu, Cuiying Zhou 외 · Engineering Applications of Artificial Intelligence · 2026-12 </div><div class="g">측정점이 적고 흩어져 있을 때 지반 물성의 넓은 공간 추세와 국부 변동을 함께 표현하기 어려운 문제를 다룬다. 다중 스케일 local association 표현을 deep regression에 넣어 좌표·공변량·국부 공간 응답을 함께 학습하는 토질 물성 예측법을 제안했다. 불확실성 보정과 feature 분석으로 공학적 평가에 쓸 수 있게 했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116627"><div><div class="t">3. <a href="https://doi.org/10.1016/j.engappai.2026.116627" target="_blank">Morphological knowledge augmented snake convolutional network for yarn hairiness segmentation</a></div><div class="m">Chuqiao Xu, Zihui Wang, Linchen Xu 외 · Engineering Applications of Artificial Intelligence · 2026-12 #컴퓨터비전</div><div class="g">불규칙하게 얽힌 다중 스케일 곡선형 구조인 실 잔털(hairiness)을 정확히 segmentation하는 문제다. 곡률 지식으로 샘플링 경로를 유도하는 snake convolution과 다중 스케일 receptive field 선택 attention을 제안했다. 잔털 부위 IoU 60.74%, Recall 82.51%로 기존 segmentation 모델을 앞섰다. 균열 같은 가는 곡선 구조의 segmentation에 옮겨 쓸 여지가 있다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105374"><div><div class="t">4. <a href="https://doi.org/10.1016/j.aei.2026.105374" target="_blank">Large language model-guided dual-addressing memory and nonlinear subspace projection constraints for electric power equipment inspection</a></div><div class="m">Qien Yu, Hao Li, Bo Wu · Advanced Engineering Informatics · 2027-01 #컴퓨터비전 #구조점검</div><div class="g">UAV·로봇으로 전력설비를 점검할 때 대상 범주마다 따로 모델을 두면 배포·유지 비용이 커지는 문제를 다룬다. LLM이 유도하는 dual-addressing memory와 KPCA 기반 nonlinear subspace projection 제약을 넣은 convolutional autoencoder(LN-CAE)를 제안했다. 이 모델 하나로 여러 범주의 anomaly detection을 한 번에 처리한다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105396"><div><div class="t">5. <a href="https://doi.org/10.1016/j.aei.2026.105396" target="_blank">Robust indoor point cloud registration via cross-scale wall-evidence consolidation and symmetry-aware pose-hypothesis verification</a></div><div class="m">Jiahui Zou, Wenzhong Shi · Advanced Engineering Informatics · 2027-01 #컴퓨터비전 #BIM #디지털트윈</div><div class="g">실내 점군 registration에서 벽 관측이 조각나 있고 반복 배치와 가림이 많아 국부 기하 특징이 약해지는 문제를 다룬다. 벽 증거를 여러 투영 스케일에서 모으는 STRIDE와 유한 선분 제약(CAREN-Lines), 대칭을 고려한 다중 선 pose 가설 검증을 결합한 2D-first, 3D-refined 프레임워크를 제안했다. 희소화와 좌표 노이즈에도 경쟁력 있는 성능을 유지했고, SLABIM에서는 층 전체 LiDAR-to-BIM registration으로 확장될 가능성을 보였다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.dibe.2026.101088"><div><div class="t">6. <a href="https://doi.org/10.1016/j.dibe.2026.101088" target="_blank">Quantitative Assessment of Influencing Factors on Internal Soundness Mapping for RC Bridge Decks by Elastic Wave Measurements</a></div><div class="m">Kazuo Watabe, Hidefumi Takamine, Tomoya Fumikura 외 · Developments in the Built Environment · 2026-10 #구조점검</div><div class="g">통행 차량이 만드는 탄성파로 RC 교량 바닥판 내부 건전성을 짧은 시간 안에 평가하는 &#x27;Internal Deck Soundness Mapping&#x27;을 실용화하려는 연구다. 내부 수평균열이 있는 시편 4개를 시험 교량에 설치하고 차량을 반복 통과시켰다. 이를 통해 바퀴 위치·차량 중량·속도의 영향을 정량화했다. 하중과 속도가 음원 밀도를 크게 바꿔 보정이 필요했고, 음원 밀도로 내부 균열을 검출하는 데 성공했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116594"><div><div class="t">7. <a href="https://doi.org/10.1016/j.engappai.2026.116594" target="_blank">Dual-teacher frequency domain distillation for Facial Expression Recognition in low-light scenes</a></div><div class="m">Yuanlun Xie, Yibo Zhang, Yanyi Cao 외 · Engineering Applications of Artificial Intelligence · 2026-12 #컴퓨터비전</div><div class="g">저조도 환경에서 영상이 열화되면 facial expression recognition 성능이 크게 떨어지는 문제를 다룬다. 정상광 teacher와 보정광 teacher가 저조도 student를 공간·주파수 영역에서 함께 지도하는 dual-teacher knowledge distillation을 제안했다. 주파수 영역 distillation 모듈(FDDM)이 핵심이다. 어두운 현장에서 작업자 상태를 인식하는 데 참고할 수 있다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.jobe.2026.117650"><div><div class="t">8. <a href="https://doi.org/10.1016/j.jobe.2026.117650" target="_blank">Hybrid Modular Construction System “INNO3DJOINTS”: Full-Scale Building Test, 3D Modelling and Case Study</a></div><div class="m">Nemanja Milovanović, Rui Simões, Trayana Tankova 외 · Journal of Building Engineering · 2026-10 #모듈러</div><div class="g">현장 조립이 쉬운 하이브리드 모듈러 공법 INNO3DJOINTS의 전체 규모 건물을 시험하고 3D FE 모델로 검증한 연구다. 냉간성형강 트러스 거더와 SHS 기둥을 특허받은 plug-and-play 접합부로 연결하는 방식이다. 접합부 특성을 반영한 1D FE 전역 모델이 초기 강성과 변형 형상, 파괴 부위를 잘 예측했다. 기존 모멘트 골조보다 강재를 최대 27% 줄였다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.jobe.2026.117652"><div><div class="t">9. <a href="https://doi.org/10.1016/j.jobe.2026.117652" target="_blank">A fully modular-assembled lateral force-resisting system using stiffened corrugated steel plate walls for high-rise modular steel buildings</a></div><div class="m">Lifei Feng, Chao Yang, Jinping Ou 외 · Journal of Building Engineering · 2026-10 #모듈러</div><div class="g">고층 모듈러 강구조 건물은 &#x27;이중 보&#x27; 특성 때문에 모듈을 수직으로 쌓은 뒤 전체 횡력 저항 시스템을 이루기 어렵다. 보강 파형강판 벽 모듈 유닛과 기둥-기둥·보-보 볼트 접합으로 완전 모듈 조립식 횡력 저항 시스템을 개발했다. 등가 교차가새 모델로 해석을 단순화했고, 30층 모듈러 강구조를 설계해 내진 성능을 평가했다.</div></div></label>
</main>
<div class="bar"><div><span class="n"><b id="n">0</b>편 선택</span>
<button id="gm" disabled>Gmail로 보내기</button><button id="ap" class="alt" disabled>메일 앱으로 보내기</button>
<span id="msg">작성창이 열렸으면 <b>전송</b>을 눌러야 접수됩니다. 5분 안에 「접수」 확인 메일이 옵니다. 안 오면 다른 버튼으로 다시 보내세요.</span></div></div>
<script>
const TO="bjchoi13@gmail.com", ME="bchoi@ajou.ac.kr", KEY="2026-10-25", K="picks-"+KEY, OLD=false;
const boxes=[...document.querySelectorAll("input")], gm=document.getElementById("gm"), ap=document.getElementById("ap");
try{const s=JSON.parse(localStorage.getItem(K)||"[]");boxes.forEach(b=>b.checked=s.includes(b.value))}catch(e){}
const sel=()=>boxes.filter(b=>b.checked).map(b=>b.value);
function upd(){const d=sel();document.getElementById("n").textContent=d.length;
  gm.disabled=ap.disabled=!d.length&&!OLD;   // 검토 칸이 있으면 0편도 보낼 수 있다(전부 지움)
  try{localStorage.setItem(K,JSON.stringify(d))}catch(e){}}
boxes.forEach(b=>b.addEventListener("change",upd));upd();
const su=()=>"[논문선택] "+KEY+" "+sel().length+"편", body=()=>sel().join("\n")+"\n", q=encodeURIComponent;
const done=()=>document.getElementById("msg").style.display="block";
// 폰에서는 Gmail 웹 작성창 주소가 앱·받은편지함으로 넘어가며 내용을 잃는다(2026-09-27 실측). 메일 앱을 주 버튼으로.
if(matchMedia("(pointer:coarse)").matches){gm.className="alt";ap.className="";gm.parentNode.insertBefore(ap,gm)}
gm.onclick=()=>{done();window.open("https://mail.google.com/mail/?authuser="+q(ME)+"&view=cm&fs=1&to="+q(TO)+"&su="+q(su())+"&body="+q(body()),"_blank")};
ap.onclick=()=>{done();location.href="mailto:"+TO+"?subject="+q(su())+"&body="+q(body())};
</script></body></html>
