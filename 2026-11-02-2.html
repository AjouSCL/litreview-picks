<h2>신규 19편</h2><div class="sub">체크하면 전문을 받아 노트를 씁니다.</div>
<label><input type="checkbox" value="10.1016/j.aei.2026.105406"><div><div class="t">1. <a href="https://doi.org/10.1016/j.aei.2026.105406" target="_blank">Generative AI-enabled concurrent inverse design of steel composition and processing routes</a></div><div class="m">Mohammad Abu-Mualla, Fredrick Michael, Yayue Pan 외 · Advanced Engineering Informatics · 2027-01 </div><div class="g">강재(Fe 합금)의 강도·경도 목표값을 주면 조성과 열처리 공정 경로를 함께 만들어 내는 역설계 문제다. 연속값인 조성 벡터와 토큰화한 공정 시퀀스를 공유 latent space에 넣는 shared-attribute VAE-Transformer를 쓰고, 항복강도·인장강도·비커스 경도 property predictor와 연결했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105410"><div><div class="t">2. <a href="https://doi.org/10.1016/j.aei.2026.105410" target="_blank">An intelligent engineering informatics framework for Digital Twin-based structural health monitoring</a></div><div class="m">Abdullah Alqahtani, Amal Alomran, Munish Bhatia · Advanced Engineering Informatics · 2027-01 #디지털트윈 #구조점검 #컴퓨터비전</div><div class="g">노후 도시 인프라의 손상 평가와 위험 상태 모니터링을 위한 Digital Twin 기반 조기경보 시스템(DT-EWS)이다. 영상·구조·환경·운영 데이터를 동기화하고, hybrid CNN-ViT로 국부 손상과 전역 공간 의존성을 함께 잡는다. 여기에 구조 응답 시계열을 결합해 정량적인 손상 심각도 지수를 산출한다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105423"><div><div class="t">3. <a href="https://doi.org/10.1016/j.aei.2026.105423" target="_blank">Large language model-guided graph semantic attribute propagation for zero-shot industrial fault diagnosis</a></div><div class="m">Fengli Shen, Yuxi Gan, Lei Zhou 외 · Advanced Engineering Informatics · 2027-01 </div><div class="g">라벨이 거의 없는 산업 고장을 zero-shot으로 진단하는 문제다. LLM에서 뽑은 고장 메커니즘 유사도와 공학 속성 유사도를 graph로 결합하고, 신호 기반 신뢰도 보정을 더한 GSAN을 제안했다. TEP 데이터에서 82.4%로 baseline보다 5.9%p 높았다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105436"><div><div class="t">4. <a href="https://doi.org/10.1016/j.aei.2026.105436" target="_blank">Extended cognitive-intensive teleoperation for human–robot collaboration in manufacturing</a></div><div class="m">Yuyang Du, Tengfei Sun, Bi Zhang 외 · Advanced Engineering Informatics · 2027-01 #인간로봇</div><div class="g">제조 현장 human-robot collaboration에서 원격조작의 과업 안내가 부족해 작업자 인지부하가 커지는 문제를 다룬다. VR 텔레프레즌스에 AR식 과업 안내와 작업흐름 시각화를 얹고, 원격 환경을 실시간 3D reconstruction으로 재구성했다. 그 결과 조작 효율이 높아지고 인지부하가 유의하게 줄었다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105442"><div><div class="t">5. <a href="https://doi.org/10.1016/j.aei.2026.105442" target="_blank">Road surface condition detection with pavement marking removal generative adversarial network for improved segmentation performance</a></div><div class="m">Tianjie Zhang, Hao Wang, Shujun Yu 외 · Advanced Engineering Informatics · 2027-01 #컴퓨터비전</div><div class="g">노면 상태(dry/wet/ice) segmentation에서 차선 도색이 시각적 잡음으로 작용하는 문제를 다룬다. 도색을 지우면서 노면 질감은 보존하는 GAN(PMRGAN)을 제안하고 pix2pix·CycleGAN과 비교했다. 도색을 지운 영상으로 U-Net을 돌리면 BIoU 0.81로 비교 모델들보다 높았다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116610"><div><div class="t">6. <a href="https://doi.org/10.1016/j.engappai.2026.116610" target="_blank">A module-wise neural architecture search framework for maritime target detection in unmanned surface vehicles</a></div><div class="m">Huixuan Zhao, Kai Zheng · Engineering Applications of Artificial Intelligence · 2026-12 #컴퓨터비전</div><div class="g">무인수상정(USV)에서 쓸 해상 표적 탐지 네트워크를 자동으로 설계하는 문제다. backbone과 neck의 search space를 따로 두고, differential entropy와 validation loss를 surrogate 지표로 삼는 module-wise neural architecture search를 제안했다. 찾아낸 네트워크는 USV로 수집한 데이터셋에서 검증했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116637"><div><div class="t">7. <a href="https://doi.org/10.1016/j.engappai.2026.116637" target="_blank">Contrastive learning-based unsupervised domain adaptation network for pavement distress segmentation in unmanned aerial vehicle images</a></div><div class="m">Biao Yue, Jianwu Dang, Yangping Wang 외 · Engineering Applications of Artificial Intelligence · 2026-12 #컴퓨터비전 #구조점검</div><div class="g">UAV 영상으로 포장 파손을 segmentation할 때 라벨 의존도를 줄이는 unsupervised domain adaptation 문제다. CNN-transformer fusion 모델(CTF-Net)에 contrastive learning 기반 feature·pixel 수준 domain alignment를 붙이고, rare class sampling으로 long-tailed 분포에 대응했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116660"><div><div class="t">8. <a href="https://doi.org/10.1016/j.engappai.2026.116660" target="_blank">Prediction of rock seepage and mechanical properties using a graph neural network with integrated global structural information</a></div><div class="m">Xiangru Chen, Shu Tao, Shida Chen 외 · Engineering Applications of Artificial Intelligence · 2026-12 </div><div class="g">암석의 방향별 투수계수와 탄성계수를 pore-network graph로 예측하는 문제다. 전역 graph 구조 지표와 방향별 유동경로 통계를 넣은 physics-motivated GNN(PM-GNN)을 제안했다. 사암 11개 시료에서 투수계수 R² 0.92~0.94, 탄성계수 R² 0.97~0.98을 얻었다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116532"><div><div class="t">9. <a href="https://doi.org/10.1016/j.engappai.2026.116532" target="_blank">Computationally sustainable hybrid deep learning for month-ahead solar–wind power forecasting in two Saudi cities</a></div><div class="m">Haytham Elmousalami, Aljawharah A. Alnaser · Engineering Applications of Artificial Intelligence · 2026-12 </div><div class="g">사우디 태양광·풍력 발전소의 한 달 앞 발전량을 예측하는 문제다. hybrid deep learning 구조 10종을 정확도, 학습시간, 연산 CO2 배출로 비교했다. CNN-LSTM-attention이 MAPE 6.6%, R² 0.87로 가장 정확했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116518"><div><div class="t">10. <a href="https://doi.org/10.1016/j.engappai.2026.116518" target="_blank">A human-centred adaptive content generation framework integrating personality recognition and knowledge-graph reasoning</a></div><div class="m">Yongting Zhang, Jiawei Sang, Jishuai Guo 외 · Engineering Applications of Artificial Intelligence · 2026-12 </div><div class="g">LLM 기반 지식 전달 콘텐츠를 개인의 의사결정 성향에 맞춰 생성하는 CourseLLM이다. Transformer 기반 multimodal 성격 인식으로 콘텐츠를 개인화하고, knowledge graph로 생성 내용의 사실성을 제약했다. 성격 인식 정확도는 92.53%, 전문가 평가는 평균 4.5점 이상이었다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116592"><div><div class="t">11. <a href="https://doi.org/10.1016/j.engappai.2026.116592" target="_blank">Holistic representation retrieval for lead frame drawings via dual coding of drawing exchange format</a></div><div class="m">Guoxin Fan, Hong Lu, Junyong Lu 외 · Engineering Applications of Artificial Intelligence · 2026-12 </div><div class="g">반도체 패키징의 lead frame 2D CAD 도면 가운데 유사한 것을 검색해 설계를 재사용하려는 문제다. DXF 원본을 기하 정보와 편집 시퀀스로 이중 코딩하는 DualDXF를 만들고 multi-view contrastive learning으로 학습했다. 산업 수준의 복잡한 도면 데이터셋으로 검증했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116622"><div><div class="t">12. <a href="https://doi.org/10.1016/j.engappai.2026.116622" target="_blank">A novel eddy current method for electromagnetic properties and thickness measurement immune to lift-off and tilt angle fluctuation</a></div><div class="m">Pu Huang, Keyu Du, Wanpeng Zhang 외 · Engineering Applications of Artificial Intelligence · 2026-12 #구조점검</div><div class="g">전단벽 등에 쓰이는 강판의 전자기 특성과 두께를 eddy current로 비파괴 측정할 때, 센서 lift-off와 기울기가 오차를 만드는 문제다. 기울어진 코일의 해석해를 세우고 동축 적층 배열 센서로 lift-off와 각도를 먼저 추정한 뒤, 개선한 Kalman filter로 여러 변수를 동시에 추정했다. 해석과 실험으로 검증했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116632"><div><div class="t">13. <a href="https://doi.org/10.1016/j.engappai.2026.116632" target="_blank">Cooperative adaptive adversarial particle filter for online dynamic parameter estimation and uncertainty quantification in power systems</a></div><div class="m">Kai Yang, Jiaqian Chang, Yunfeng Wen · Engineering Applications of Artificial Intelligence · 2026-12 </div><div class="g">재생에너지 비중이 커진 전력계통에서 관성과 1차 주파수조정 계수를 실시간으로 추정하는 문제다. particle filter에 adversarial learning을 넣고 MMD와 optimal transport 정규화를 더해 모델 의존도와 particle degeneracy를 줄였다. 발전기·지역·계통 수준에서 점추정과 구간추정을 함께 제공한다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.jobe.2026.117685"><div><div class="t">14. <a href="https://doi.org/10.1016/j.jobe.2026.117685" target="_blank">Automated detection of floor moisture damage via ground penetrating radar and domain adaptation</a></div><div class="m">Hanli Wu, Seangkru Sreng, Jiaoli Li 외 · Journal of Building Engineering · 2026-12 #구조점검</div><div class="g">현장마다 바닥 구성이 달라 GPR 기반 바닥 습기 손상 분류가 흔들리는 문제다. 실험실 데이터와 5개 건물 현장 데이터로 1D-CNN의 맥락 입력, cross-site unsupervised domain adaptation(MMD-IM 등), 소량 라벨 fine-tuning을 평가했다. raw·max·average 입력을 31 trace로 넣었을 때 평균 정확도 86.0%였다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105390"><div><div class="t">15. <a href="https://doi.org/10.1016/j.aei.2026.105390" target="_blank">BIM-Priori — Integrating semantic–geometric BIM priors as knowledge constraints for robot localization and mapping</a></div><div class="m">Jiashuo Zheng, Yujie Zhang, Xinbao Sun 외 · Advanced Engineering Informatics · 2027-01 #BIM #디지털트윈 #진도관리</div><div class="g">GNSS가 닿지 않는 실내에서 로봇이 만든 지도를 BIM에 정렬하는 문제다. 영상 detection을 LiDAR semantic으로 올려 BIM anchor를 잡고 이를 상대 pose-graph 제약으로 쓰는 marker-free BIM-anchored LiDAR-inertial SLAM을 제안했다. FARO 기준 평면 오차를 0.82 m에서 0.17 m로 줄였다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107332"><div><div class="t">16. <a href="https://doi.org/10.1016/j.autcon.2026.107332" target="_blank">Amodal instance segmentation and monocular 3D bounding box reconstruction for preventing struck-by hazards under occlusions</a></div><div class="m">Hangdong Bu, Sheng Bao · Automation in Construction · 2027-01 #컴퓨터비전 #안전행동</div><div class="g">건설현장 충돌(struck-by) 근접 감시에서 가림 때문에 mask가 불완전해지는 문제를 다룬다. GAM과 Shape-Aware Loss로 보강한 YOLOv8-seg, PCNet amodal completion, monocular depth estimation을 결합해 가려진 장비와 작업자의 3D bounding box를 복원했다. 실제 현장 시험에서 precision 0.948을 얻었다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116590"><div><div class="t">17. <a href="https://doi.org/10.1016/j.engappai.2026.116590" target="_blank">A hybrid deep neural architecture with Dynamic Hyper Complementor for non-stationary Electroencephalogram decoding</a></div><div class="m">Ke Chen, Jiaxu Leng, Jianling Ma 외 · Engineering Applications of Artificial Intelligence · 2026-12 #웨어러블</div><div class="g">피험자 간 편차와 비정상성 때문에 EEG BCI 디코딩 성능이 떨어지는 문제다. CNN-ConvLSTM-Transformer 구조에 hyper-network가 trial별 complement token을 K/V로만 넣는 DHC-Net을 제안했다. MI·SSVEP·ICPA 세 과제에서 1.5~4.0%p 향상했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116605"><div><div class="t">18. <a href="https://doi.org/10.1016/j.engappai.2026.116605" target="_blank">Fuzzy wavelet downsampling module: A dual-approach module for small object segmentation in remote sensing images</a></div><div class="m">Yu Yan, Jindong Xu, Qianpeng Chong 외 · Engineering Applications of Artificial Intelligence · 2026-12 #컴퓨터비전</div><div class="g">원격탐사 영상의 작은 객체 segmentation에서 downsampling 중 세부 정보가 사라지는 문제다. fuzzy 경계 모델링과 learnable wavelet 분해를 결합한 plug-and-play downsampling 모듈(FWDM)과 클래스 불균형 대응 손실(MB-Loss)을 제안했다. 여러 backbone에서 mIoU와 sIoU가 꾸준히 올랐다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116619"><div><div class="t">19. <a href="https://doi.org/10.1016/j.engappai.2026.116619" target="_blank">Experimental and machine learning-assisted design of damaged reinforced concrete beams strengthened using carbon fiber reinforced polymer and fan-spike anchors</a></div><div class="m">Younes Nouri, Vahid Ghanbari, Mohammad Ali Ghanbari 외 · Engineering Applications of Artificial Intelligence · 2026-12 #구조점검</div><div class="g">손상된 RC 보를 CFRP로 보강할 때 생기는 조기 박리 문제를 다룬다. CFRP fan-spike 앵커와 ECC 균열제어층을 함께 적용해 보 6개를 실험·해석했고, ML로 설계를 보조했다. 앵커가 손상 전 강도를 회복시켰고, 새 데이터에서는 XGBoost가 가장 신뢰할 만한 모델이었다.</div></div></label>
