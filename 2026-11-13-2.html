<h2>신규 17편</h2><div class="sub">체크하면 전문을 받아 노트를 씁니다.</div>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116785"><div><div class="t">1. <a href="https://doi.org/10.1016/j.engappai.2026.116785" target="_blank">A calibrated shrinkage-theory-guided machine learning approach for designing low-shrinkage concrete</a></div><div class="m">Boyuan Cheng, Jingjie Wei, Ruben P. Borg 외 · Engineering Applications of Artificial Intelligence · 2027-01 </div><div class="g">건조수축으로 생기는 콘크리트 균열을 줄이려고, 수축을 적게 하는 배합을 설계하는 연구다. Dilger 수축 모델의 경험식 부분을 machine learning으로 보정해 physics prior로 만들고, 이를 물-시멘트비 법칙과 함께 physics-informed learning에 넣었다. 그 결과 해석 가능성과 일반화 성능이 함께 좋아졌다고 보고한다.</div></div></label>
<label><input type="checkbox" value="10.1061/jcemd4.coeng-18618"><div><div class="t">2. <a href="https://doi.org/10.1061/jcemd4.coeng-18618" target="_blank">Risk Analysis of the Construction Industry’s Transition to a Digital Platform–Based Contract Fulfillment Management Model</a></div><div class="m">Xiang Hao, Pin-Chao Liao, Tianhong Liu 외 · Journal of Construction Engineering and Management · 2027-01-01 </div><div class="g">건설산업이 디지털 플랫폼 기반 계약이행 관리 모델로 넘어갈 때 생기는 리스크를 체계적으로 찾아내고 정량화하는 평가 모델을 만들었다. 사례 연구, 민감도 분석, 비교 분석으로 모델의 강건성을 확인했다. 사례의 종합 리스크 점수는 0.4786(Category 3)이었다.</div></div></label>
<label><input type="checkbox" value="10.1108/ecam-05-2026-0963"><div><div class="t">3. <a href="https://doi.org/10.1108/ecam-05-2026-0963" target="_blank">An NLP-driven analytical pipeline for exploring Digital Twin research maturity in construction</a></div><div class="m">Faris Elghaish, Sandra T. Matarneh, Farzad Rahimian 외 · Engineering Construction &amp; Architectural Management · 2026-11-16 #디지털트윈</div><div class="g">키워드 빈도에 기대는 기존 bibliometric 분석의 한계를 넘어, AEC 분야 Digital Twin 연구의 성숙도를 측정하는 NLP 파이프라인을 만들었다. SBERT semantic filtering, BERTopic topic modelling, SHAP 설명 모델, heuristic optimisation을 엮어 논문 791편으로 Digital Twin Maturity Index(DTMI)를 산출했다. 그 결과 넓게 정의되던 초기 연구가 점점 구체화되는 흐름을 확인했다.</div></div></label>
<label><input type="checkbox" value="10.1061/jcemd4.coeng-18266"><div><div class="t">4. <a href="https://doi.org/10.1061/jcemd4.coeng-18266" target="_blank">Influencing Factors and Synergistic Paths of Successful Aging at Work for Construction Workers</a></div><div class="m">Guodong Ni, Yuying Wang, Shaobo Wang 외 · Journal of Construction Engineering and Management · 2027-01-01 #안전행동</div><div class="g">중국 건설 인력이 고령화하는 상황에서, 건설 노동자의 &#x27;성공적 직무 노화(SAW)&#x27;에 영향을 주는 요인을 찾고 요인들이 어떻게 함께 작용하는지 분석했다. grounded theory로 요인을 도출하고 설문 자료에 fsQCA를 적용했다. 개인·직무·조직·사회 차원의 요인에서 6개 구성을 찾았고, 이를 전방위 친화형·조직 주도형·자원 보완형의 세 경로로 묶었다.</div></div></label>
<label><input type="checkbox" value="10.1061/jcemd4.coeng-19225"><div><div class="t">5. <a href="https://doi.org/10.1061/jcemd4.coeng-19225" target="_blank">Blockchain Integrated Decentralized Cloud Storage and Immutable Smart Contract Platform for Secure and Trustworthy Collaborative BIM</a></div><div class="m">Rifat Sonmez, Zeinab Alipanahloo, Furkan Koc 외 · Journal of Construction Engineering and Management · 2027-01-01 #BIM</div><div class="g">중앙집중식 협업 BIM 플랫폼에는 신뢰·보안·프라이버시 문제가 있다. 이를 풀려고 blockchain에 분산 클라우드 스토리지와 변경 불가능한 smart contract를 결합한 협업 BIM 플랫폼을 제안했다. 서버나 특정 주체 없이 데이터 거버넌스를 강제하는 방식이며, 실제 프로젝트에 적용해 장점과 한계를 평가했다.</div></div></label>
<label><input type="checkbox" value="10.1061/jmenea.meeng-7542"><div><div class="t">6. <a href="https://doi.org/10.1061/jmenea.meeng-7542" target="_blank">Digitalizing Early Project Delivery: Machine Learning–Enabled Urban Regulatory Intelligence for Governance and Feasibility Decisions</a></div><div class="m">Caroll Francesconi, Eric Forcael · Journal of Management in Engineering · 2027-01-01 </div><div class="g">프로젝트 초기 단계의 규제 불확실성을 줄이려고, 정부의 건축허가 기록을 machine learning으로 분석해 도시 구역을 군집화하고 분류했다. 라틴아메리카 중규모 도시의 15년치 허가 데이터에 k-means로 개발 패턴을 찾고, random forest와 XGBoost로 건설 구역을 분류했다. 그 결과 밀도·위치·건축 유형과 관련된 지표를 얻었고, 초기 타당성 판단에 쓸 수 있음을 보였다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.cacaie.2026.100268"><div><div class="t">7. <a href="https://doi.org/10.1016/j.cacaie.2026.100268" target="_blank">Data-efficient flood depth prediction through domain-aware coreset selection and tabular foundation models</a></div><div class="m">Lipai Huang, Adithi Srinath, Manas Singh 외 · Computer-Aided Civil and Infrastructure Engineering · 2026-11 </div><div class="g">거의 실시간으로 침수 깊이를 예측하는 surrogate model에 학습 데이터가 너무 많이 필요한 문제를 다룬다. 폭우 재현기간과 공간 구조로 층화해 coreset을 고르고, 이를 tabular foundation model의 in-context learning에 넣었다. 휴스턴 9개 유역에서 전체 데이터로 학습한 supervised 모델과 통계적으로 같은 성능을 냈고, 학습에 쓰지 않은 유역과 OOD 폭우에도 잘 전이됐다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.buildenv.2026.115571"><div><div class="t">8. <a href="https://doi.org/10.1016/j.buildenv.2026.115571" target="_blank">Temperature-setting modes in residential VRF systems: a cross-season analysis of large-scale operational data</a></div><div class="m">Mingyang Qian, Jingjing Ma, Yi Wu 외 · Building and Environment · 2027-01 #건물성능</div><div class="g">주거용 VRF 시스템에서 거주자가 온도를 어떻게 설정하는지 실제 운전 데이터로 분석했다. 냉방 164,967건, 난방 12,660건의 운전 과정을 설정온도와 실내온도 차이에 기반한 무차원 계수로 유형화했다. 냉방은 저설정·비교차형이 55.3%, 난방은 고설정·비교차형이 91.4%를 차지했고, 극단적인 설정값은 실제 도달한 실내온도와 크게 차이 나는 경우가 많았다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105418"><div><div class="t">9. <a href="https://doi.org/10.1016/j.aei.2026.105418" target="_blank">Variance-guided feature projection for low-latency structural defect classifier deployment on resource-constrained edge devices</a></div><div class="m">Lok Hua Lee, Cheng-Kai Lu, Tong Boon Tang · Advanced Engineering Informatics · 2027-01 #컴퓨터비전 #구조점검</div><div class="g">구조물 결함 분류용 CNN을 자원이 적은 edge device에 올리기 위한 연구다. inverted residual bottleneck의 Expansion-Pointwise convolution을 가벼운 Variance-initialized Linear Projection(VLP) 모듈로 바꿔 FLOPs를 약 66.7~74.5% 줄였다. 양자화한 VLP-MobileNetV3를 Raspberry Pi에 올린 결과, 지연시간·전력·FLOPs 모두 baseline과 더 큰 모델보다 나았다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107346"><div><div class="t">10. <a href="https://doi.org/10.1016/j.autcon.2026.107346" target="_blank">Rule-grounded scene graph learning for structurally consistent construction safety relation understanding</a></div><div class="m">Yipeng Liu · Automation in Construction · 2027-01 #컴퓨터비전 #안전행동</div><div class="g">건설 안전 scene graph 모델이 PPE 착용 주체를 잘못 짝짓는 등 구조적으로 맞지 않는 관계를 예측하는 문제를 다룬다. 객체-술어 합법성, 하나의 PPE는 한 사람에게만 할당된다는 제약, 공간 기하 단서 같은 공학적 안전 규칙을 relation representation 학습 단계에 넣었다. 건설 이미지 1238장에서 mR@5 93.45%를 얻고 규칙 위반율(RVR)을 13.13%로 낮췄으며, MP-GNN과 Transformer backbone 모두에서 성능이 올랐다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.cacaie.2026.100267"><div><div class="t">11. <a href="https://doi.org/10.1016/j.cacaie.2026.100267" target="_blank">Predicting existing tunnel deformation induced by shield undercrossing: A transfer learning framework integrating refined FEM analysis and data-driven modeling</a></div><div class="m">Hao Huang, Bin Ruan · Computer-Aided Civil and Infrastructure Engineering · 2026-12 </div><div class="g">쉴드 TBM이 기존 터널 아래를 지날 때 기존 터널이 얼마나 변형될지 예측하는 연구다. 정밀 3D FEM과 LHS-MLP surrogate로 학습 데이터를 만들고, 역학적 사전지식을 physical information weight로 Transformer에 넣는 transfer learning 프레임워크를 제안했다. 테스트 R²는 0.921로 순수 data-driven 모델보다 9.25% 높았고, 가중치 0.7일 때 가장 좋았다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.enbuild.2026.118481"><div><div class="t">12. <a href="https://doi.org/10.1016/j.enbuild.2026.118481" target="_blank">A control-oriented Digital Twin framework for hybrid HVAC systems: conceptualization and modeling on the HESTIA energy system</a></div><div class="m">Mihail-Bogdan Carutasiu, Horia Necula · Energy and Buildings · 2027-01 #디지털트윈 #건물성능</div><div class="g">공기열원 히트펌프와 가스보일러를 함께 쓰는 하이브리드 난방 시스템을 제어하기 위한 Digital Twin 프레임워크(HESTIA)를 제안했다. 물리 시스템·데이터 수집·모델/의사결정·시각화의 4계층 구조이며, 히트펌프용 PINN, 보일러용 semi-empirical 모델, 축열조용 3-node 성층 모델을 결합했다. 실제 플랫폼은 아직 시운전 중이어서, 모델은 공개 모니터링 데이터와 제조사 데이터로 평가했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116633"><div><div class="t">13. <a href="https://doi.org/10.1016/j.engappai.2026.116633" target="_blank">Artificial-intelligence-assisted inverse design of low-carbon concrete under carbonation constraints</a></div><div class="m">Lenganji Simwanda, Paul O. Awoyera, Adewumi John Babafemi · Engineering Applications of Artificial Intelligence · 2026-12 </div><div class="g">탄산화 제약 조건 아래에서 저탄소 혼화재 콘크리트 배합을 AI로 역설계하는 워크플로를 만들었다. Optuna로 튜닝한 신경망 surrogate에 split conformal prediction, continuous-treatment forest, 다목적 탐색을 결합했다. 압축강도 MAE는 7.20 MPa(R² 0.687), 탄산화 깊이 MAE는 2.56 mm(R² 0.847)였다. 내재탄소의 R² 0.999는 배합량과 탄소 사이의 거의 결정적인 관계 때문이라는 점도 leakage 점검으로 밝혔다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116645"><div><div class="t">14. <a href="https://doi.org/10.1016/j.engappai.2026.116645" target="_blank">Annotation-efficient weakly supervised instance segmentation for crack pixel-level detection and quantification</a></div><div class="m">Man Chen, Shuai Xu, Huaping Zhou 외 · Engineering Applications of Artificial Intelligence · 2026-12 #컴퓨터비전 #구조점검</div><div class="g">도로 균열을 픽셀 단위로 찾으려면 pixel-level 라벨이 많이 드는 문제를, bounding box 라벨만 쓰는 weakly supervised instance segmentation(AWCI-Seg)으로 풀었다. 가늘고 긴 균열을 잡도록 hybrid backbone과 box-supervised·semantic head를 쓰고, MIQ 모듈로 마스크에서 균열 면적·길이·폭을 계산했다. 클릭 작업량은 1.2%만 들이면서도 높은 성능을 유지했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.jobe.2026.117602"><div><div class="t">15. <a href="https://doi.org/10.1016/j.jobe.2026.117602" target="_blank">Experimental validation of an acoustic tap-testing framework under controlled UAV dynamic disturbances for tile inspection</a></div><div class="m">Piedad J. Miranda, Ronan Reza, Leonel Lagos 외 · Journal of Building Engineering · 2026-11 #구조점검</div><div class="g">UAV로 외벽 타일을 두드려 소리로 결함을 찾을 때, 비행 중 진동이 판별 신뢰도에 주는 영향을 정량화했다. Vicon으로 측정한 UAV 비행 동역학을 Stewart platform으로 재현하고, 에너지 기반 신호 보정과 PCA 분류를 적용했다. 보정 덕분에 진동 교란 속에서도 분류 성능이 유지됐다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.jobe.2026.117725"><div><div class="t">16. <a href="https://doi.org/10.1016/j.jobe.2026.117725" target="_blank">Theoretical and experimental study on the longitudinal stiffness of modular container building structures with openings</a></div><div class="m">Yang Zuo, Xiaoxiong Zha · Journal of Building Engineering · 2026-12 #모듈러</div><div class="g">컨테이너 모듈러 건축물에서 측벽 개구율이 길이방향 강성에 주는 영향을 실물 크기 시험체 4개(개구율 0~100%)로 시험했다. 강성은 주로 파형 패널이 담당했고, 가력단 강성은 개구율 30%에서 77.4%, 60%에서 90.8% 떨어졌다. 개구율이 60%를 넘으면 순수 골조처럼 거동했다. Abaqus 모델과 강성 이론식을 검증(오차 1.65~8.92%)했고, 개구율 60% 이하를 설계 권고로 제시했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.jobe.2026.117727"><div><div class="t">17. <a href="https://doi.org/10.1016/j.jobe.2026.117727" target="_blank">Experimental study on the seismic performance of an innovative modular unit composite wall</a></div><div class="m">Jinyi Zhu, Hongwei Ma, Wei Xiong 외 · Journal of Building Engineering · 2026-12 #모듈러</div><div class="g">고층 철골 모듈러 건물용으로 공장에서 만들 수 있는 모듈러 유닛 합성벽과 그 접합부를 제안했다. 콘크리트 종류(일반 콘크리트·ECC)와 벽체 접합부 유무를 바꾼 시험체 4개로 준정적 실험을 했다. ECC는 균열과 강성 저하를 억제했고 에너지 소산과 변형 능력이 뛰어났다. 수평 강성과 전단 항복내력 산정식도 도출했다.</div></div></label>

<script>
const TO="bjchoi13@gmail.com", ME="bchoi@ajou.ac.kr", KEY="2026-11-13-2", K="picks-"+KEY, OLD=false;
const boxes=[...document.querySelectorAll("input")], gm=document.getElementById("gm"), ap=document.getElementById("ap");
try{const s=JSON.parse(localStorage.getItem(K)||"[]");boxes.forEach(b=>b.checked=s.includes(b.value))}catch(e){}
const sel=()=>boxes.filter(b=>b.checked).map(b=>b.value);
function upd(){const d=sel();document.getElementById("n").textContent=d.length;
  gm.disabled=ap.disabled=!d.length&&!OLD;   // 검토 칸이 있으면 0편도 보낼 수 있다(전부 지움)
  try{localStorage.setItem(K,JSON.stringify(d))}catch(e){}}
boxes.forEach(b=>b.addEventListener("change",upd));upd();
const su=()=>"[논문선택] "+KEY+" "+sel().length+"편", body=()=>sel().join("\n")+"\n", q=encodeURIComponent;
const done=()=>document.getElementById("msg").style.display="block";
// 폰에서는 Gmail 웹 작성창 주소가 앱·받은편지함으로 넘어가며 내용을 잃는다(2026-09-27 실측). 메일 앱을 주 버튼으로.
if(matchMedia("(pointer:coarse)").matches){gm.className="alt";ap.className="";gm.parentNode.insertBefore(ap,gm)}
gm.onclick=()=>{done();window.open("https://mail.google.com/mail/?authuser="+q(ME)+"&view=cm&fs=1&to="+q(TO)+"&su="+q(su())+"&body="+q(body()),"_blank")};
ap.onclick=()=>{done();location.href="mailto:"+TO+"?subject="+q(su())+"&body="+q(body())};
</script></body></html>
