<h1>논문 선택 — 2026-11-20</h1>
<div class="sub">체크하고 아래 「보내기」를 누르면 DOI 목록이 채워진 메일 작성창이 뜹니다. <b>전송</b>하면 5분 안에 접수 확인 메일이 옵니다.</div>
<h2>신규 37편</h2><div class="sub">체크하면 전문을 받아 노트를 씁니다.</div>
<label><input type="checkbox" value="10.1016/j.aei.2026.105431"><div><div class="t">1. <a href="https://doi.org/10.1016/j.aei.2026.105431" target="_blank">From Active Learning to inference-time governance for LLM-assisted code generation: A systematic literature review with a review-derived PLC governance roadmap</a></div><div class="m">Ketut Adnyana, Andreas Schwung · Advanced Engineering Informatics · 2027-01 </div><div class="g">LLM 기반 code generation의 불확실성 대응 기법을 PLC(programmable logic controller) 코드 합성 사례에 비춰 systematic review했다. Active Learning, LLM 코드 생성·검증, PLC·안전 코드 합성의 세 층위에서 121편을 분석했다. 그 결과를 검증·추적성·감독·통제된 배포 중심의 PLC governance roadmap으로 정리했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105452"><div><div class="t">2. <a href="https://doi.org/10.1016/j.aei.2026.105452" target="_blank">Beyond geometric matching: Semantics-enhanced pose initialization for mobile robots in indoor construction sites</a></div><div class="m">Yujie Lu, Chuan Yang, Mengxiang Lin 외 · Advanced Engineering Informatics · 2027-01 #인간로봇 #BIM #컴퓨터비전</div><div class="g">실내 건설현장은 반복 구조와 동적 잡동사니가 많아 기하 정합만으로는 이동형 건설로봇의 초기 위치 추정이 어렵다. 이를 해결하려고 BIM 구조 정보로 프레임 단위 semantic point cloud 지도를 합성하고, 시각-LiDAR 인식으로 실제 점군에 의미 정보를 입혔다. 이렇게 만든 semantics-geometry 융합 descriptor로 coarse registration의 속도와 정확도를 높였다. 사전 설치 측위 인프라는 필요 없다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105470"><div><div class="t">3. <a href="https://doi.org/10.1016/j.aei.2026.105470" target="_blank">From infrastructure to vehicle: Cooperative data generation based on roadside sensors for intersection safety enhancement</a></div><div class="m">Lingfeng Qi, Guofa Li, Wenbo Chu 외 · Advanced Engineering Informatics · 2027-01 #컴퓨터비전</div><div class="g">교차로 cooperative perception용 학습 데이터를 차량으로 직접 수집하면 비용이 크다. 그래서 노변 카메라 영상으로 장면을 복원해 원하는 차량 시점 이미지를 렌더링하는 pipeline을 제안했다. metric-depth 기반 3D Gaussian Splatting과 Syn2Real Alignment backbone을 썼다. CARLA 원시점 PSNR은 24.48 dB이고, 생성 샘플을 vehicle detection 학습 데이터 보강에 쓸 수 있음을 보였다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105482"><div><div class="t">4. <a href="https://doi.org/10.1016/j.aei.2026.105482" target="_blank">Optimising disassembly planning for aluminium-framed windows via automated adjacency data generation using collision-based geometric analysis</a></div><div class="m">Begüm Aktas, Timo Hartmann, Maximilian Sternal · Advanced Engineering Informatics · 2027-01 #BIM</div><div class="g">알루미늄 창호의 해체 계획을 세우는 데 필요한 부품 간 adjacency matrix를 자동으로 생성했다. Rhino-Grasshopper에서 Bounding Box·Convex Hull 단순화와 Boolean 교차 판정을 사용했다. 창호 17종을 수작업 정답과 셀 단위로 비교한 결과, Convex Hull과 미세 스케일링 조합이 가장 정확했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.cacaie.2026.100278"><div><div class="t">5. <a href="https://doi.org/10.1016/j.cacaie.2026.100278" target="_blank">Physics-Informed Automated Machine Learning with Attention-Based INVASE for Interpretable Seismic Response Prediction of Bridges</a></div><div class="m">Wenshan Li, Hua He, Fabio Freddi 외 · Computer-Aided Civil and Infrastructure Engineering · 2026-11 #구조점검</div><div class="g">교량 내진 평가에 쓸 지진 강도지표(IM)를 해석 가능하게 고르는 physics-informed AutoML을 제안했다. feature deletion, attention 기반 INVASE, greedy deletion을 결합했다. RC 연속거더교와 아치교에서 IM 6~7개만으로 96개 feature 기준선보다 MAE를 25~31% 줄였다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116771"><div><div class="t">6. <a href="https://doi.org/10.1016/j.engappai.2026.116771" target="_blank">From hype to reality: A survey of physical artificial intelligence in industrial robotics</a></div><div class="m">Sanghoon Lee, Jiyeong Chae, Jinhong Park 외 · Engineering Applications of Artificial Intelligence · 2027-01 #인간로봇</div><div class="g">산업용 로봇의 Physical AI를 CPS 통합 문제로 정의하고 설계-개발-배포 3단계 통합 프로세스를 제안했다. 매니퓰레이터·이동로봇·드론 연구 28,245편을 6개 기능으로 매핑하고 1,000편의 전문을 코딩했다. 실험실 근거는 많지만 실운영 근거는 드물다는 결과와 함께 다섯 가지 병목을 정리했다.</div></div></label>
<label><input type="checkbox" value="10.1061/jcemd4.coeng-18311"><div><div class="t">7. <a href="https://doi.org/10.1061/jcemd4.coeng-18311" target="_blank">Blockchain Governance and Information Falsification Behavior in Green Building Material Supply Chains: An Evolutionary Game Approach</a></div><div class="m">Bing Tang, Tumaer Hadelebieke, Botao Zhong 외 · Journal of Construction Engineering and Management · 2027-02-01 </div><div class="g">블록체인 추적이 있어도 녹색 건축자재 공급망에서는 체인에 올리기 전 정보가 위조될 수 있다. 이 문제를 공급자·플랫폼·시공사의 3자 evolutionary game으로 모델링했다. 진화적 안정 전략은 검증 비용과 편익의 균형에 달려 있었다. 평판 메커니즘은 시공사의 기회주의는 억제하지만 공급자와 플랫폼에는 영향이 작았다.</div></div></label>
<label><input type="checkbox" value="10.1061/jcemd4.coeng-18443"><div><div class="t">8. <a href="https://doi.org/10.1061/jcemd4.coeng-18443" target="_blank">Intelligent Early Safety Warning Method for High-Altitude Operations on Bridges Based on Personnel Trajectory Prediction</a></div><div class="m">Wei Tian, Xingwang Li, Jianming Wang 외 · Journal of Construction Engineering and Management · 2027-02-01 #컴퓨터비전 #안전행동</div><div class="g">교량 고소작업에서 추락을 미리 경고하는 방법을 제안했다. YOLOv5와 Canny로 안전난간 유무와 작업대 가장자리를 찾아 동적 위험구역을 설정한다. 개선 YOLOv5+DeepSORT로 작업자를 추적하고, Social LSTM으로 이동 궤적을 예측한다. 예측 궤적이 위험구역에 들어가는지는 ray casting으로 판정해 사전 경고를 낸다.</div></div></label>
<label><input type="checkbox" value="10.1108/ecam-02-2026-0303"><div><div class="t">9. <a href="https://doi.org/10.1108/ecam-02-2026-0303" target="_blank">Weather-associated construction injury patterns and severity using data-driven Bayesian networks and risk matrix</a></div><div class="m">Peiyi Lyu, Siyuan Song, Wenlin Li · Engineering Construction &amp; Architectural Management · 2026-11-20 #안전행동</div><div class="g">OSHA 재해기록과 시간 단위 기상자료를 결합하고, data-driven Bayesian Network 두 개로 날씨와 건설 재해 유형·심각도의 관계를 분석했다. 결과는 Risk Matrix로 상대적 우선순위 4단계에 매핑했다. 기온이 높고 습도가 낮을수록 재해 기록에서 건설업 비중이 컸다.</div></div></label>
<label><input type="checkbox" value="10.1108/ecam-03-2026-0473"><div><div class="t">10. <a href="https://doi.org/10.1108/ecam-03-2026-0473" target="_blank">Social life cycle assessment framework in modular construction: focus on reuse and hybrid construction processes</a></div><div class="m">Hanbyeol Jang, Dang Huy Ly, Truong Dang Hoang Nhat Nguyen 외 · Engineering Construction &amp; Architectural Management · 2026-11-20 #모듈러</div><div class="g">공장 제작과 현장 조립이 섞인 모듈러 건설의 특성과 재사용을 반영한 사회적 전과정평가(MC-S-LCA) 프레임워크를 제안했다. UNEP 지침을 바탕으로 이해관계자 5개 그룹과 하위범주 29개로 구성했다. 공장 제작률과 자재 재사용성 같은 모듈러 고유 변수를 넣어 전 생애단계를 평가한다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105469"><div><div class="t">11. <a href="https://doi.org/10.1016/j.aei.2026.105469" target="_blank">Multi-sensor Mel spectrograms and progressive multi-stage fusion for performance degradation identification in maglev systems</a></div><div class="m">Mingda Zhai, Jiashun Zheng, Lu Zhang 외 · Advanced Engineering Informatics · 2027-01 #구조점검</div><div class="g">자기부상 시스템의 성능 저하는 신호가 약하고 여러 센서에 흩어져 있어 식별이 어렵다. 가속도·부상간극·전류 신호를 3채널 Mel spectrogram으로 만들고 multi-granularity Swin Transformer(EMST-Swin)로 융합했다. 창사 자기부상열차 실측 데이터에서 정확도 98.25%, macro F1 97.98%를 얻었다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105487"><div><div class="t">12. <a href="https://doi.org/10.1016/j.aei.2026.105487" target="_blank">Graph-based semantic-instance segmentation of design features in a mechanical part</a></div><div class="m">Jun Hwan Park, Seungeun Lim, Youn-Kyoung Joung 외 · Advanced Engineering Informatics · 2027-01 </div><div class="g">기계 부품 CAD에서 여러 형상으로 이루어진 설계 특징(snap-fit hook 등)을 인식하는 graph 기반 semantic-instance segmentation을 제안했다. GAT로 대표 면을 찾은 뒤 BFS와 logit 필터링으로 instance를 정제한다. 두 패널 모델에서 F1 0.98 수준을 얻었다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.asej.2026.104535"><div><div class="t">13. <a href="https://doi.org/10.1016/j.asej.2026.104535" target="_blank">Milp-based smart home energy management for coordinated residential load scheduling with distributed energy resources</a></div><div class="m">S. Rajalingam, S. Kanagamalliga · Ain Shams Engineering Journal · 2027-01 #건물성능</div><div class="g">주택의 가전 부하와 PV·배터리 같은 분산전원을 MILP로 함께 스케줄링하는 스마트홈 에너지 관리 시스템을 제안했다. MATLAB 시뮬레이션에서 전기요금과 피크 수요가 크게 줄었고 PV 활용도는 높아졌다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107377"><div><div class="t">14. <a href="https://doi.org/10.1016/j.autcon.2026.107377" target="_blank">Scan-to-FEM for truss bridges using 3D reconstruction and vibration-based model updating</a></div><div class="m">Jaehyuk Lee, Geonhee Lee, Yeongseo Park 외 · Automation in Construction · 2027-01 #컴퓨터비전 #디지털트윈 #구조점검</div><div class="g">트러스교 유지관리용 digital twin에 쓸 as-is FE 모델을 자동으로 만들고 갱신하는 Scan-to-FEM 프레임워크를 제안했다. UAV 다시점 촬영, NeRF와 semantic segmentation으로 의미 점군을 만들고, 이를 토폴로지 복원과 부재 속성 부여로 이었다. 진동 기반 model updating으로 손상 위치와 정도도 추정한다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.cacaie.2026.100276"><div><div class="t">15. <a href="https://doi.org/10.1016/j.cacaie.2026.100276" target="_blank">Severity rating as measurement: calibrated uncertainty-aware assessment of pavement crack width from segmentation masks</a></div><div class="m">Yuan Dai, Jiangnan Zhu, Wei Zhou 외 · Computer-Aided Civil and Infrastructure Engineering · 2026-11 #컴퓨터비전 #구조점검</div><div class="g">segmentation mask에서 균열 폭(mm)을 거쳐 포장 심각도 등급에 이르는 과정을 측정 문제로 보고, 정의·추정·기하 세 종류의 불확도 예산으로 정식화했다. SAM3와 YOLO26 모두에서 boundary 오차가 출력 셀 단위로 스케일되는 granularity 모델이 성립했다. 균열 126개에서 mask 출처와 축약 방식을 합리적으로 바꾸는 것만으로 ASTM D6433 &#x27;낮음&#x27; 판정 비율이 0%에서 100%까지 움직였다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.dibe.2026.101121"><div><div class="t">16. <a href="https://doi.org/10.1016/j.dibe.2026.101121" target="_blank">Ultra-lightweight machine learning-enabled automated crack detection and quantification using high-resolution distributed fiber-optic sensors</a></div><div class="m">Xiao Tan, Xiangting Meng, Haotian Qiu 외 · Developments in the Built Environment · 2026-11 #구조점검</div><div class="g">분산형 광섬유센서(DFOS)의 변형률 데이터를 contour map으로 바꾼 뒤 RT-DETR 개량형(CAR-RTDETR-Lite)으로 균열을 탐지하고 정량화했다. 포스트텐션 콘크리트 보 2개 데이터에서 Group_hessian pruning으로 파라미터를 37.0% 줄였다. XAI로 attention과 손상 지표를 연결했고, 웹 GUI도 함께 구현했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116652"><div><div class="t">17. <a href="https://doi.org/10.1016/j.engappai.2026.116652" target="_blank">Domain-agnostic fault diagnosis via unified multi-scale kernel transformers with edge-ready temporal attention</a></div><div class="m">Qianyu Zhou, Yang Zhang, Farhad Imani 외 · Engineering Applications of Artificial Intelligence · 2027-01 </div><div class="g">설비가 바뀔 때마다 신호 변환을 다시 튜닝하지 않아도 되는 진동 기반 고장진단 모델 PM-KAT를 제안했다. 다중 스케일 고정 random convolution kernel, variance 기반 token pooling, 병렬 mini-Transformer를 결합했다. 폭을 맞춘 Transformer 대비 FLOPs는 약 45%, GPU 메모리는 38% 적게 쓰면서 기어박스 1종과 베어링 데이터 2종에서 높은 정확도를 냈다.</div></div></label>
