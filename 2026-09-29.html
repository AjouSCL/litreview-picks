<h1>논문 선택 — 2026-09-29</h1>
<div class="sub">체크하고 아래 「보내기」를 누르면 DOI 목록이 채워진 메일 작성창이 뜹니다. <b>전송</b>하면 5분 안에 접수 확인 메일이 옵니다.</div>
<h2>신규 8편</h2><div class="sub">체크하면 전문을 받아 노트를 씁니다.</div>
<label><input type="checkbox" value="10.1061/jcemd4.coeng-18715"><div><div class="t">1. <a href="https://doi.org/10.1061/jcemd4.coeng-18715" target="_blank">Changes in Hazard Recognition during Tower Crane Teleoperation: An Empirical Study</a></div><div class="m">Yu Han, Haidong Yu, Yujing Liu 외 · Journal of Construction Engineering and Management · 2026-12-01 #안전행동 #인간로봇</div><div class="g">타워크레인 조종이 현장 운전에서 원격조종으로 옮겨갈 때 위험 인지가 어떻게 달라지는지 human factor 관점에서 분석했다. 축소 고충실도 실험 플랫폼에서 참가자 40명을 대상으로 정적 위험, 동적 위험, 환경 교란의 세 유형에 대해 탐지 정확도, 작업 수행 안정성, 상황인식(SA)을 비교했다. 원격조종에서는 정적 위험과 환경 교란의 탐지가 줄었지만 작업 수행은 안정적이었고, 동적 위험은 오히려 더 잘 탐지했으나 조작 성능이 떨어지는 비대칭적 변화가 나타났다.</div></div></label>
<label><input type="checkbox" value="10.1061/jcemd4.coeng-19206"><div><div class="t">2. <a href="https://doi.org/10.1061/jcemd4.coeng-19206" target="_blank">AMSW-YOLO: A Lightweight Multimodule and Loss Function Synergistic Optimization Algorithm for Intelligent Pavement Defect Detection</a></div><div class="m">Ming Wang, Wanqi Ma, Zhaoxue Wu 외 · Journal of Construction Engineering and Management · 2026-12-01 #컴퓨터비전 #구조점검</div><div class="g">도로 포장 결함 탐지를 위해 여러 모듈과 loss function을 함께 최적화한 경량 AMSW-YOLO를 제안하고, 다출처 도로결함 데이터셋 MRDD를 구축했다. 모델 규모는 2.7M parameters, 7.4G FLOPs이며, MRDD에서 mAP50을 0.936에서 0.957로, F1-score를 0.910에서 0.940으로 높였다. RDD2022에서는 mAP50이 5.7% 올랐고 pothole AP가 8.3%로 가장 크게 개선됐다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105292"><div><div class="t">3. <a href="https://doi.org/10.1016/j.aei.2026.105292" target="_blank">Target-label-free and presence-aware crack segmentation via transferable self-organizing map prototype fingerprints for concrete and masonry image streams</a></div><div class="m">Xinxin Sun · Advanced Engineering Informatics · 2027-01 #컴퓨터비전 #구조점검</div><div class="g">기존 SOM 기반 균열 segmentation은 이미지마다 클러스터링을 다시 보정해야 하고, 균열이 없는 이미지에서도 균열 응답을 억지로 만들어낸다는 문제가 있다. 이 연구는 대표 이미지 한 장으로 한 번만 보정한 SOM prototype fingerprint를 대상 도메인 라벨 없이 콘크리트·조적 이미지 스트림에 그대로 재사용하는 presence-aware 프레임워크를 제안했다. Kaggle800의 균열 이미지에서 Dice/IoU 0.655/0.518로 이미지별 Direct-SOM(0.707/0.573)에 근접하면서 실행 시간을 줄였고, 벽돌 혼합 스트림 판별에서는 ROC-AUC 0.916~0.919를 기록했다.</div></div></label>

<label><input type="checkbox" value="10.1061/jccee5.cpeng-7659"><div><div class="t">7. <a href="https://doi.org/10.1061/jccee5.cpeng-7659" target="_blank">Visual Display Quality Effects on Operator Workload and Gaze Behavior in Lunar Construction Teleoperation</a></div><div class="m">Miran Seo, Samraat Gupta, Youngjib Ham · Journal of Computing in Civil Engineering · 2027-01-01 #인간로봇 #안전행동</div><div class="g">달 기지 건설을 위한 굴착기 원격조종에서, 대역폭이 제한되고 지연이 있는 심우주 통신 때문에 떨어지는 영상 화질이 운전자의 작업부하와 시선 행동(gaze)에 어떤 영향을 주는지 실험으로 평가했다. 그 결과 화질을 일부 낮춰도 작업 성능은 유지할 수 있다는 실증 근거를 얻었다. 이를 원격조종 화면 설계 지침의 근거로 제시했다.</div></div></label>
<label><input type="checkbox" value="10.1061/jccee5.cpeng-8002"><div><div class="t">8. <a href="https://doi.org/10.1061/jccee5.cpeng-8002" target="_blank">Absolute Urban Floodwater–Level Estimation from CCTV Imagery via Laser-Scanning–Based Image Projection</a></div><div class="m">Yoonjo Choi, Seunghwan Hong, Hong-Gyoo Sohn · Journal of Computing in Civil Engineering · 2027-01-01 #컴퓨터비전</div><div class="g">야간 조명, 반사, 비 노이즈 때문에 CCTV 영상만으로 도시 침수 수위를 절대값으로 추정하기 어렵다는 문제를 다뤘다. DLT와 SPR 2단계 photogrammetric calibration으로 보정되지 않은 CCTV의 카메라 자세를 복원한 뒤, TLS·MMS point cloud를 영상에 투영했다. 여기에 edge 기반 adaptive moving-window로 추적한 수면-구조물 접촉선을 대응시켜 침수 발생을 감지하고 절대 수위를 추정하는 통합 프레임워크를 만들었다. 초록이 잘려 있어 정량 결과는 확인할 수 없다.</div></div></label>
