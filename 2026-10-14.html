<h1>논문 선택 — 2026-10-14</h1>
<div class="sub">체크하고 아래 「보내기」를 누르면 DOI 목록이 채워진 메일 작성창이 뜹니다. <b>전송</b>하면 5분 안에 접수 확인 메일이 옵니다.</div>
<h2>신규 29편</h2><div class="sub">체크하면 전문을 받아 노트를 씁니다.</div>
<label><input type="checkbox" value="10.1016/j.aei.2026.105343"><div><div class="t">1. <a href="https://doi.org/10.1016/j.aei.2026.105343" target="_blank">LLM-assisted dynamic graph reconfiguration for post-disaster compute-power collaborative resilience in energy-informatics systems</a></div><div class="m">Junqiu Fan, Mingshun Liu, Mingyang Wang 외 · Advanced Engineering Informatics · 2027-01 </div><div class="g">극한기상으로 데이터센터·전력·통신 인프라가 함께 손상됐을 때 핵심 작업의 이전 경로를 재구성하는 LA-NADGR framework를 제안한다. schema-guided LLM extraction으로 재난 후 보고서·알람·로그를 근거가 연결된 기록으로 바꾸고, 이웃 인식 동적 graph reconfiguration과 deterministic action masking을 적용했다. 50개 샘플 benchmark에서 local instruction model 3종을 검증했고, 5~20% 필드 오염 조건에서도 masking이 위험한 승인을 크게 줄였다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107311"><div><div class="t">2. <a href="https://doi.org/10.1016/j.autcon.2026.107311" target="_blank">Life cycle assessment of a material-efficient 3D-printed concrete bridge: Comparative sustainability evaluation</a></div><div class="m">K. Chiranjeevi Reddy, Shreya Mahajan, Likith Koneru 외 · Automation in Construction · 2027-01 </div><div class="g">구조 최적화한 3D printed concrete(3DCP) 교량과 휨 성능이 같은 기존 RC 슬래브 교량을 ISO 14040에 따른 cradle-to-gate LCA로 비교했다. 3DCP 교량은 콘크리트 사용량을 55% 줄였고 배출·독성·자원·에너지 범주의 영향도 크게 낮았다. 다만 시멘트 함량이 높은 배합 탓에 GWP는 높게 나왔다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.buildenv.2026.115398"><div><div class="t">3. <a href="https://doi.org/10.1016/j.buildenv.2026.115398" target="_blank">Improving Data Quality in BIM-LCA Workflows: Foundational Data Conditions Relevant to Digital Product Passports</a></div><div class="m">Maryam Pourhosseini, Antonio García Martínez, Shayesteh Hamidkhaniha · Building and Environment · 2026-10 #BIM</div><div class="g">BIM 기반 LCA 워크플로에서 환경 데이터 교환을 막는 데이터 품질 문제를 PRISMA 체계적 문헌고찰(57편)로 정리했다. 반복되는 데이터 품질 공백 6가지를 찾았고, EPD 비교 436건 중 완전히 비교 가능한 것은 0.04%에 그쳤다. 데이터 구조·interoperability·governance를 잇는 기초 조건 3가지를 제시하고, Digital Product Passport를 그 보완 계층으로 제안했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.cacaie.2026.100247"><div><div class="t">4. <a href="https://doi.org/10.1016/j.cacaie.2026.100247" target="_blank">Revisiting urban pipeline renewal: transparent machine-learning for failure identification and elucidation</a></div><div class="m">Roya Meydani, Girish Pulinkala, John Leander 외 · Computer-Aided Civil and Infrastructure Engineering · 2026-10 #구조점검</div><div class="g">상수도 관망의 파손 원인을 찾기 위해 rule-based interpretable machine learning 모델을 제안한다. 기술·환경·관망 요인의 조합 상호작용과 파손이 나지 않는 회복력 있는 구성을 함께 모델링하고, 불완전한 유틸리티 데이터도 다룬다. 결과는 추적 가능한 의사결정 규칙으로 나와 관 갱신·보수 자산관리와 Decision Support System에 바로 넣을 수 있다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116454"><div><div class="t">5. <a href="https://doi.org/10.1016/j.engappai.2026.116454" target="_blank">Multi-objective optimized signal decomposition with explainable and reliable hybrid models for multistep significant wave height forecasting in ocean wave energy applications</a></div><div class="m">Akram Seifi, Mumtaz Ali, Anwar Ali Aldhafeeri · Engineering Applications of Artificial Intelligence · 2026-12 </div><div class="g">해안공학과 파력에너지 활용에 필요한 유의파고(Hs)를 30분~24시간 앞까지 예측하는 hybrid model이다. multi-objective Optuna로 SSA·D-MVMD 분해 파라미터를 최적화하고, XAI-SHAP으로 feature를 선택한 뒤 RVFL로 예측했다. 호주 두 지점에서 multi-objective SSA-RVFL이 모든 예측 구간에서 가장 좋았고, 6시간 앞 예측까지 신뢰도가 88%를 넘었다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116557"><div><div class="t">6. <a href="https://doi.org/10.1016/j.engappai.2026.116557" target="_blank">An unmanned aerial vehicle-assisted visual measurement framework for forest road condition assessment with overlapping distress quantification</a></div><div class="m">Lin Zhao, Xinmin Tao · Engineering Applications of Artificial Intelligence · 2026-12 #컴퓨터비전 #구조점검</div><div class="g">UAV 영상으로 산림도로 포장 손상을 측정하는 framework로, 여러 손상이 겹치는 영역의 면적 산정 오차를 다룬다. Transformer 기반 semantic segmentation(dynamic-gated backbone, frequency-modulated attention decoder)과 diffusion 기반 data augmentation을 쓰고, 2단계 전략으로 겹친 손상을 식별·정량화했다. 손상별 pixel mask에서 면적을 계산해 도로 상태 평가로 연결한다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.ssci.2026.107513"><div><div class="t">7. <a href="https://doi.org/10.1016/j.ssci.2026.107513" target="_blank">Assessing human reliability and estimating evacuation time in hospital emergencies: A Bayesian network and Petri net approach</a></div><div class="m">Morteza Mahdavi, Fakhradin Ghasemi, Matin Aleahmad 외 · Safety Science · 2027-02 #안전행동</div><div class="g">병원 비상대피에서 사람의 신뢰도와 대피 시간을 추정하려고, Bayesian network로 SLIM을 보강해 Human Error Probability를 계산했다. 그 결과를 Petri net 대피 시뮬레이션에 error network로 넣어 사람의 행동·상호작용·오류 지연을 반영했다. 수행영향인자를 식별하고, 인적 오류가 있을 때와 없을 때의 대피 시간 차이를 정량화했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.ssci.2026.107516"><div><div class="t">8. <a href="https://doi.org/10.1016/j.ssci.2026.107516" target="_blank">Masculine honor, social visibility, and safety non-compliance: intentions and approval judgments in high-risk sectors in Turkey</a></div><div class="m">Cihangir Gümüştaş · Safety Science · 2027-02 #안전행동</div><div class="g">튀르키예 건설·조선 남성 작업자 244명을 대상으로 masculine honor 가치가 안전수칙 위반 의도와 위반 용인에 미치는 영향을 설문과 within-person vignette 실험으로 분석했다. honor 가치가 높을수록 불안전 행동 의도가 크고 위험을 낮게 지각했으며, 낮은 위험 지각이 이 관계를 부분 매개했다. 위반 용인과의 연관은 남이 보는 공개 상황에서 더 강했다.</div></div></label>
<label><input type="checkbox" value="10.1061/jccee5.cpeng-7400"><div><div class="t">9. <a href="https://doi.org/10.1061/jccee5.cpeng-7400" target="_blank">Building Code Question-Answering Systems Enhanced by Large Language Models and Knowledge-Graph-Based Retrieval-Augmented Generation</a></div><div class="m">Fan Yang, Jiansong Zhang · Journal of Computing in Civil Engineering · 2027-01-01 </div><div class="g">건축법규 해석과 준수 검토를 돕는 knowledge graph 기반 RAG 질의응답 시스템이다. 조항의 의미와 조항 간 관계 구조를 함께 활용했고, query-context-answer triplet 661개로 평가했다. 사전학습 transformer와 범용 LLM보다 답변 품질이 좋았으며, chunk가 짧으면 semantic relevance가, 길면 precision이 올라갔다.</div></div></label>
<label><input type="checkbox" value="10.1061/jccee5.cpeng-8010"><div><div class="t">10. <a href="https://doi.org/10.1061/jccee5.cpeng-8010" target="_blank">VirtuAI-Safe: Personalized Situated Safety Learning through Integration of VR and LLMs</a></div><div class="m">Ali Katooziani, Rohantha Rukshan Jayasinghe, Idris Jeelani 외 · Journal of Computing in Civil Engineering · 2027-01-01 #안전행동</div><div class="g">건설 안전교육에서 위험 인지와 판단력을 기르기 위해 VR과 LLM을 결합한 몰입형 개인화 학습환경 VirtuAI-Safe를 구현했다. 가상 건설 시나리오 안에서 상황에 맞춘 적응형 지도를 제공한다. 건설관리 학부생을 대상으로 적용해 효과를 검토했다.</div></div></label>
<label><input type="checkbox" value="10.1108/ecam-08-2025-1256"><div><div class="t">11. <a href="https://doi.org/10.1108/ecam-08-2025-1256" target="_blank">Blockchain and digital twin technologies in construction data security: applications, complementary features, challenges and future research directions</a></div><div class="m">Jinghua Yang, Maxwell Fordjour Antwi-Afari, Xingyu Tao 외 · Engineering Construction &amp; Architectural Management · 2026-10-15 #디지털트윈</div><div class="g">건설 데이터 보안에서 blockchain 기반 digital twin의 적용을 체계적 문헌고찰과 science mapping으로 정리했다(Scopus 229편). 보안·프라이버시, IoT 연계, 공급망 관리 등 6개 주제를 도출했다. 두 기술의 상호보완 특성, 과제, 향후 연구 방향을 제시한다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105346"><div><div class="t">12. <a href="https://doi.org/10.1016/j.aei.2026.105346" target="_blank">RPGO-MR: Relocalization Pose Graph Optimization for accurate and latency-aware Mixed Reality localization</a></div><div class="m">Huaiyuan Weng, Syed Muhammad Raza Rizvi, Chul Min Yeum 외 · Advanced Engineering Informatics · 2027-01 #컴퓨터비전</div><div class="g">MR 헤드셋을 사전 구축 지도에 정확히 정렬하는 relocalization 문제를 다룬 plug-in framework RPGO-MR이다. plane 기반 필터링으로 2D–3D correspondence 신뢰도를 높인 single-shot image relocalization(PSSL)과 VIO pose graph optimization을 결합했다. VIO drift와 pose 갱신 지연을 줄여 실시간 정렬의 정확도와 안정성을 높였다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105350"><div><div class="t">13. <a href="https://doi.org/10.1016/j.aei.2026.105350" target="_blank">Integrating restorative benefits into age-friendly community design: A data-driven approach using multimodal psychophysiological and visual sensing</a></div><div class="m">Yiqun Lan, Chenshuang Li, Zhenwen Li 외 · Advanced Engineering Informatics · 2027-01 #웨어러블 #컴퓨터비전</div><div class="g">노인 34명이 도시·농촌 커뮤니티를 걷는 현장 실험에서 실시간 visual sensing, isovist 공간분석, 생리신호 측정을 결합했다. 환경이 심리생리적 회복에 미치는 영향을 multilevel regression, GAM, random forest로 분석해 핵심 환경 요인과 상호작용을 찾았다. 결과를 고령친화 커뮤니티 설계 근거로 연결한다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105352"><div><div class="t">14. <a href="https://doi.org/10.1016/j.aei.2026.105352" target="_blank">A RAG-enhanced multimodal large language model framework for culvert inspection</a></div><div class="m">Pouria Mohammadi, Sadegh Asgari, Abbas Rashidi 외 · Advanced Engineering Informatics · 2027-01 #컴퓨터비전 #구조점검</div><div class="g">암거(culvert) 점검을 자동화하기 위해 점검 매뉴얼과 소수의 시각 예시를 검색해 근거로 쓰는 RAG 기반 multimodal LLM framework를 제안했다. Qwen3-VL, Gemma-3, LLaVA-OneVision, Gemini-3-Flash를 precision·recall·F1과 &#x27;가장 심한 등급&#x27; 판정 규칙으로 비교했다. RAG를 적용한 Gemini-3-Flash의 성능이 가장 좋았다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105358"><div><div class="t">15. <a href="https://doi.org/10.1016/j.aei.2026.105358" target="_blank">Semantic–geometric asset mapping for fire-safety compliance inspection with multi-label state diagnosis</a></div><div class="m">Dayou Chen, Yu Zhang, Long Chen 외 · Advanced Engineering Informatics · 2027-01 #컴퓨터비전 #디지털트윈</div><div class="g">소방설비 준수 점검을 semantic–geometric 추정 문제로 정식화하고, 설비마다 위치·식별·상태 belief를 담은 Semantic–Geometric Asset Map을 제안했다. 객체 단위 localization과 하위 부품의 multi-label 상태 진단을 분리했고, 소화기의 국소 준수 속성을 진단한다. 현장 RGB-D 점검 경로에서 end-to-end pipeline이 실제로 작동함을 보였다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105364"><div><div class="t">16. <a href="https://doi.org/10.1016/j.aei.2026.105364" target="_blank">FusionLVIR: a multi-sensor mobile mapping framework with global anchoring and confidence-aware map maintenance for degenerate built environments</a></div><div class="m">Tianyu Chen, Defu Che, Jiayu Che 외 · Advanced Engineering Informatics · 2027-01 #컴퓨터비전</div><div class="g">터널·복도처럼 특징이 부족한 건축 환경에서 장거리 SLAM이 누적 drift를 일으키는 문제를 다룬다. FAST-LIVO2(LiDAR-camera-IMU)에 RTK global anchoring과 depth·confidence 기반 지도 자동 정리를 더한 FusionLVIR를 제안했다. 3.2 km 데이터셋에서 control-point RMSE 0.031 m, loop-closure 오차 0.026 m를 얻었다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107282"><div><div class="t">17. <a href="https://doi.org/10.1016/j.autcon.2026.107282" target="_blank">In situ impact printing with an autonomous legged excavator: System development, integration, and full-scale demonstration</a></div><div class="m">Kunaljit Chadha, Filippo A. Spinelli, Lauren Vasey 외 · Automation in Construction · 2027-01 #인간로봇</div><div class="g">굴착한 흙을 고속으로 쌓아 올리는 적층 공법 Impact Printing 장비를 자율 보행 굴착기에 통합해 현장 시공을 시도했다. ICP 기반 위치추정과 궤적 추종 제어, 시공을 고려한 설계·기구학 검증 소프트웨어를 구현했다. 현장 흙으로 높이 3 m 구조물을 자율 시공해 실현 가능성을 입증했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107294"><div><div class="t">18. <a href="https://doi.org/10.1016/j.autcon.2026.107294" target="_blank">Automated facade solar retrofits using feed-forward 3D reconstruction and generative image editing</a></div><div class="m">Ayca Duran, Christoph Waibel, Bernd Bickel 외 · Automation in Construction · 2027-01 #컴퓨터비전 #건물성능</div><div class="g">가로 이미지만으로 건물 일체형 태양광(BIPV) 파사드 리트로핏을 평가하고 시각화하는 자동 pipeline이다. feed-forward 3D reconstruction과 vision-language model로 파사드 비율과 치수를 추정하고, generative image editing으로 BIPV 적용 모습을 만든 뒤 발전량을 개략 추정한다. 10개 도시 데이터에서 종횡비 nMAE 9%와 15%, 층수 오차 평균 0.5층을 얻었다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107305"><div><div class="t">19. <a href="https://doi.org/10.1016/j.autcon.2026.107305" target="_blank">Review of AI agents in engineering design workflows</a></div><div class="m">Zoie McCreery, M.Z. Naser · Automation in Construction · 2027-01 </div><div class="g">엔지니어링 설계 워크플로에서 AI agent의 현황을 bibliometric 분석과 사례로 정리한 리뷰다. 관련 논문은 최근 406% 늘었다. agentic 시스템과 non-agentic 시스템의 경계를 정의하고 9개 시스템을 agent 참여 정도에 따라 분류했다. 검증·인증·감독 같은 엔지니어링 특유의 도입 장벽도 제시한다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107312"><div><div class="t">20. <a href="https://doi.org/10.1016/j.autcon.2026.107312" target="_blank">Explainable AI-integrated multi-objective optimisation for circular material routing in modular construction</a></div><div class="m">Thilina Ganganath Weerakoon, Zenonas Turskis, Jūratė Šliogerienė · Automation in Construction · 2027-01 #모듈러 #BIM</div><div class="g">모듈러 건설에서 자재를 재사용·리퍼비시·재활용 중 어디로 보낼지 BIM 데이터로 자동 결정하는 XAIOM framework다. RF로 CO₂ 절감과 경제성을 예측하고, SHAP이 NSGA-II 최적화를 안내하며 LIME으로 국소 설명을 검증했다. hypervolume 0.781과 feature 일관성 84%를 얻었고, Monte Carlo 5000회에서도 trade-off가 안정적이었다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.buildenv.2026.115397"><div><div class="t">21. <a href="https://doi.org/10.1016/j.buildenv.2026.115397" target="_blank">Cross-Room Generalization of Window-Opening Models Under Distribution Shift: Feature Distance, Adaptation, and Mechanisms</a></div><div class="m">Ziqi Zhang, Yuxiao Wang · Building and Environment · 2026-10 #건물성능</div><div class="g">재실자의 창문 개폐 행동을 예측하는 XGBoost 모델을 다른 방에 옮기면 성능이 떨어지는 문제를 다룬다. 직접 전이하면 accuracy가 17.1%, F1이 44.8% 낮아졌다. Sliced Wasserstein Distance가 대상 방의 F1과 음의 상관(r=−0.40)을 보여, 라벨 없이도 배포 전에 일반화 위험을 가려낼 수 있다. 소량 라벨로 transfer learning하는 적응법도 제시하며, 온도가 방과 무관하게 안정적인 핵심 예측변수였다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116326"><div><div class="t">22. <a href="https://doi.org/10.1016/j.engappai.2026.116326" target="_blank">Lower peaks, similar growth: Isolating the value and limits of artificial-intelligence-driven thermal sensation modeling for building-grid resilience under future climates</a></div><div class="m">Hongshan Guo, Kanxuan He · Engineering Applications of Artificial Intelligence · 2026-12 #건물성능</div><div class="g">AI 기반 열감각 예측(LightGBM, PINN–VAE)이 미래 기후에서 건물–전력망 피크에 얼마나 기여하는지 측정하려고, 감독 제어 로직은 고정하고 예측기만 바꾸는 EnergyPlus benchmark를 만들었다. 5개 ASHRAE 기후, RCP8.5, 2001~2100년 조건에서 비교했다. 피크 모델 R²의 90.6%는 도시·기상이, 5.0%만 열감각 전략이 설명했다. 데이터 기반 방식의 피크 절감은 PMV상 심한 불쾌와 함께 나타났다.</div></div></label>

<label><input type="checkbox" value="10.1016/j.engappai.2026.116537"><div><div class="t">24. <a href="https://doi.org/10.1016/j.engappai.2026.116537" target="_blank">Multi-level point cloud transform regression via overlapping region prediction</a></div><div class="m">Fan Zhang, Huazhen Zhang, Yun Wang · Engineering Applications of Artificial Intelligence · 2026-12 #컴퓨터비전</div><div class="g">point cloud registration에서 down-sampling 때문에 비중첩 영역의 간섭이 생기는 문제를 다룬 OMTRNet이다. pixel grid mapping으로 다중 스케일 feature를 뽑고, CNN으로 중첩 영역을 예측하며, frequency-domain feature fusion으로 자세 변환을 회귀한다. 자율주행을 대상으로 하지만 스캔 정합 기법으로 쓸 수 있다.</div></div></label>
