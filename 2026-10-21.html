<style>
:root{--bg:#fff;--fg:#1d1f23;--mute:#6b7078;--line:#e4e6ea;--card:#f7f8fa;--acc:#1a4c8b;--on:#e8f0fb}
@media (prefers-color-scheme:dark){:root{--bg:#16181c;--fg:#e6e8eb;--mute:#9aa0a8;--line:#2c3036;--card:#1e2126;--acc:#7fb0ff;--on:#1f2d42}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:820px;margin:0 auto;padding:16px 16px 110px}h1{font-size:19px;margin:8px 0 2px}.sub{color:var(--mute);font-size:13px;margin-bottom:14px}
label{display:flex;gap:12px;padding:14px;margin:0 0 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer}

input{width:20px;height:20px;flex:none;margin-top:3px;accent-color:var(--acc)}
.t{font-weight:600}.t a{color:var(--acc);text-decoration:none}.m{color:var(--mute);font-size:13px}.g{margin-top:6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px}
.bar div{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

h2{font-size:16px;margin:26px 0 4px}h2+.sub{margin-bottom:10px}

<h1>논문 선택 — 2026-10-21</h1>
<div class="sub">체크하고 아래 「보내기」를 누르면 DOI 목록이 채워진 메일 작성창이 뜹니다. <b>전송</b>하면 5분 안에 접수 확인 메일이 옵니다.</div>
<h2>신규 10편</h2><div class="sub">체크하면 전문을 받아 노트를 씁니다.</div>
<label><input type="checkbox" value="10.1016/j.aei.2026.105388"><div><div class="t">1. <a href="https://doi.org/10.1016/j.aei.2026.105388" target="_blank">Knowledge-Anchored constraint programming for Multi-Gantry concrete 3D printing scheduling</a></div><div class="m">Abhishek Patel, Benny Raphael · Advanced Engineering Informatics · 2027-01 #모듈러 #진도관리</div><div class="g">여러 대의 gantry로 3D concrete printing(3DCP) 프리캐스트 부재를 만들 때, 층과 층 사이 open-time 제약 때문에 배치 전체의 일정이 서로 묶이는 스케줄링 문제를 다룬다. 콘크리트 레올로지, gantry kinematics, 공간 간섭을 CP-SAT 모델의 제약으로 넣은 KARDS를 제안했고, bidirectional epsilon-constraint로 makespan과 층간 품질 페널티 사이의 Pareto frontier를 구했다. 순차 스케줄링으로 충분한지 가르는 해석적 임계값도 함께 도출했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105393"><div><div class="t">2. <a href="https://doi.org/10.1016/j.aei.2026.105393" target="_blank">Intelligent design of shear wall layout based on conditional flow matching</a></div><div class="m">Hongmei Zhang, Jiacheng Guo, Jixing Cao 외 · Advanced Engineering Informatics · 2027-01 </div><div class="g">RC 전단벽 구조의 예비설계에서 쓰이는 GAN·GNN·diffusion 기반 배치 생성 모델은 학습이 불안정하거나 샘플링이 비효율적이다. 이 한계를 넘기 위해 conditional flow matching 기반 생성 프레임워크를 제안했다. 지진 조건을 전역 조건으로 넣고, 길쭉한 벽체 형상을 반영하는 strip-attention과 엘리베이터 샤프트 같은 국부 제약을 반영하는 mixed source distribution을 도입해 설계 기준을 지키면서도 빠르게 배치를 생성한다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116432"><div><div class="t">3. <a href="https://doi.org/10.1016/j.engappai.2026.116432" target="_blank">Machine learning-based probabilistic predictions of the dynamic increase factor of mortar strength</a></div><div class="m">Youhuan Xu, Dade Lai, Yongjia Xu 외 · Engineering Applications of Artificial Intelligence · 2026-12 </div><div class="g">충격·폭발 하중에서 모르타르 강도가 변형률 속도에 따라 얼마나 커지는지 나타내는 Dynamic Increase Factor(DIF)를 확률적으로 예측한다. 압축 400건, 인장 224건의 실험 데이터베이스를 구축해 GPR, BNN, XGBoost·NGBoost 변형 등 6개 probabilistic ML 모델을 비교했다. Bayesian neural network가 정확도와 불확실성 추정에서 가장 좋았고, SHAP 분석으로 DIF를 좌우하는 주요 변수를 찾았다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116526"><div><div class="t">4. <a href="https://doi.org/10.1016/j.engappai.2026.116526" target="_blank">Intelligent motion planning method for spherical multi-retractable legged robots on sloped terrains</a></div><div class="m">Fengde Xu, Xudong Zhao, Khalid H. Alharbi · Engineering Applications of Artificial Intelligence · 2026-12 #인간로봇</div><div class="g">구형 다리 수축형 로봇의 기존 motion planning은 평지에 한정되어 있어, 경사 지형용 계획 프레임워크를 제안했다. 기구학·동역학 안정성 분석을 바탕으로 정삼각형 변을 따라 이동하는 새 gait와 임계각 제약, 발-지면 접촉 제어를 결합했다. 10°·20° 경사 시뮬레이션과 시작품 실험, 야외 잔디 경사 현장 시험으로 검증했다.</div></div></label>
<label><input type="checkbox" value="10.1061/jmenea.meeng-7625"><div><div class="t">5. <a href="https://doi.org/10.1061/jmenea.meeng-7625" target="_blank">Quantitative Framework for Assessing Bridge Component Reusability: Case Studies of Florida Bridges</a></div><div class="m">Maral Nazemi, Qian Zhang, Juyeong Choi · Journal of Management in Engineering · 2027-01-01 #구조점검</div><div class="g">순환경제 관점에서 교량을 철거할 때 부재 단위로 재사용할 수 있는지 정량 평가하는 프레임워크를 제안했다. 분해 용이성(disassemblability), 고유성, 운반성 등을 합친 복합 지표인 reusability index를 만들어 플로리다 교량 3곳에 적용했다. 재사용 가능 비율은 교량 형식과 부재 특성에 따라 크게 달랐고, 콘크리트 교량은 0%였다.</div></div></label>
<label><input type="checkbox" value="10.1061/jmenea.meeng-7784"><div><div class="t">6. <a href="https://doi.org/10.1061/jmenea.meeng-7784" target="_blank">When Building Is Not Enough: Operational Challenges of Digitally Enabled Infrastructure</a></div><div class="m">Ruochen Zeng, Yilong Han, Xin Gao · Journal of Management in Engineering · 2027-01-01 </div><div class="g">초록 없음</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105372"><div><div class="t">7. <a href="https://doi.org/10.1016/j.aei.2026.105372" target="_blank">JSL-MGNN: A spatiotemporal graph framework for unified indoor occupant density interpolation and prediction with missing data resilience</a></div><div class="m">Cong Huang, Helen H.L. Kwok, Fangli Hou 외 · Advanced Engineering Informatics · 2027-01 #건물성능</div><div class="g">IoT 센서가 듬성듬성 설치되고 데이터가 자주 빠져서 실내 재실자 밀도를 정확히 추정하기 어렵다. 이 문제에 대해 spatiotemporal interpolation과 prediction을 함께 학습하는 JSL-MGNN을 제안했다. Multi-Graph 공유 encoder로 여러 공간 관계를 포착하고, decoder에서 두 task의 의존성을 모델링했다. 결측률이 중간~높은 조건에서도 최신 baseline보다 안정적인 성능을 보였다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.buildenv.2026.115469"><div><div class="t">8. <a href="https://doi.org/10.1016/j.buildenv.2026.115469" target="_blank">A Novel UAV-based RGB-LiDAR Fusion Framework for Rapid Building Geometry Acquisition &amp;amp; Energy Modelling</a></div><div class="m">Ali Waqas, Mohamad T. Araji · Building and Environment · 2026-10 #컴퓨터비전 #BIM #건물성능</div><div class="g">노후 건물의 as-built 형상을 BIM과 에너지 모델로 빠르게 옮기는 Scan-to-BEM 워크플로를 제안했다. UAV photogrammetric point cloud(RGB 522장)와 LiDAR(262만 점)를 융합했다. 형상 평균절대오차는 RGB 단독 9.34 cm, LiDAR 단독 7.20 cm, 융합 4.54 cm였고, 전력 사용량 검증에서 NMBE 1.28%, CV(RMSE) 6.61%를 기록했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.cacaie.2026.100251"><div><div class="t">9. <a href="https://doi.org/10.1016/j.cacaie.2026.100251" target="_blank">Differentiable FEM versus PINN for pavement layer inverse analysis: enforcing physics as hard or soft constraints</a></div><div class="m">Yongjin Choi, Hyeonbin Moon, Seunghwa Ryu · Computer-Aided Civil and Infrastructure Engineering · 2026-10 #구조점검</div><div class="g">포장 FWD backcalculation(다층 포장 층별 탄성계수 역산)에서 physics를 soft constraint로 거는 PINN과 hard constraint로 거는 differentiable FEM(DiffFEM)을 synthetic benchmark로 비교했다. 표준 PINN은 층 경계의 불연속 때문에 탄성계수를 복원하지 못했고, XPINN은 loss weighting·구조·노이즈에 민감했다. DiffFEM이 가장 정확하고 안정적이며 계산도 효율적이었다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116583"><div><div class="t">10. <a href="https://doi.org/10.1016/j.engappai.2026.116583" target="_blank">Vision-language model guided three-dimensional segmentation for automated and high-fidelity strawberry point cloud reconstruction</a></div><div class="m">Pengyu Li, Yangjun Deng, Xiangchao Zhou 외 · Engineering Applications of Artificial Intelligence · 2026-12 #컴퓨터비전</div><div class="g">딸기 수확·검사 로봇에 필요한 3D point cloud를 LiDAR와 registration 없이 저비용으로 얻기 위해, 3D Gaussian Splatting(3DGS)과 vision-language model(VLM)로 multi-view segmentation을 수행하는 Straw3D를 제안했다. 회전식 촬영 장치로 multi-view RGB를 모아 딸기 400개의 고품질 point cloud 데이터셋을 구축했다. 자체 데이터셋과 Mip-NeRF 360에서 우수한 segmentation과 일반화 성능을 보였다. 농업 대상이지만 VLM 기반 3DGS segmentation 기법은 현장 3D 재구성에 옮겨 쓸 여지가 있다.</div></div></label>
</main>
<div class="bar"><div><span class="n"><b id="n">0</b>편 선택</span>
<button id="gm" disabled>Gmail로 보내기</button><button id="ap" class="alt" disabled>메일 앱으로 보내기</button>
<span id="msg">작성창이 열렸으면 <b>전송</b>을 눌러야 접수됩니다. 5분 안에 「접수」 확인 메일이 옵니다. 안 오면 다른 버튼으로 다시 보내세요.</span></div></div>
<script>
const TO="bjchoi13@gmail.com", ME="bchoi@ajou.ac.kr", KEY="2026-10-21", K="picks-"+KEY, OLD=false;
const boxes=[...document.querySelectorAll("input")], gm=document.getElementById("gm"), ap=document.getElementById("ap");
try{const s=JSON.parse(localStorage.getItem(K)||"[]");boxes.forEach(b=>b.checked=s.includes(b.value))}catch(e){}
const sel=()=>boxes.filter(b=>b.checked).map(b=>b.value);
function upd(){const d=sel();document.getElementById("n").textContent=d.length;
  gm.disabled=ap.disabled=!d.length&&!OLD;   // 검토 칸이 있으면 0편도 보낼 수 있다(전부 지움)
  try{localStorage.setItem(K,JSON.stringify(d))}catch(e){}}
boxes.forEach(b=>b.addEventListener("change",upd));upd();
const su=()=>"[논문선택] "+KEY+" "+sel().length+"편", body=()=>sel().join("\n")+"\n", q=encodeURIComponent;
const done=()=>document.getElementById("msg").style.display="block";
// 폰에서는 Gmail 웹 작성창 주소가 앱·받은편지함으로 넘어가며 내용을 잃는다(2026-09-27 실측). 메일 앱을 주 버튼으로.
if(matchMedia("(pointer:coarse)").matches){gm.className="alt";ap.className="";gm.parentNode.insertBefore(ap,gm)}
gm.onclick=()=>{done();window.open("https://mail.google.com/mail/?authuser="+q(ME)+"&view=cm&fs=1&to="+q(TO)+"&su="+q(su())+"&body="+q(body()),"_blank")};
ap.onclick=()=>{done();location.href="mailto:"+TO+"?subject="+q(su())+"&body="+q(body())};
</script></body></html>
