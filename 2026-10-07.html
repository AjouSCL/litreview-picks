<h1>논문 선택 — 2026-10-07</h1>
<div class="sub">체크하고 아래 「보내기」를 누르면 DOI 목록이 채워진 메일 작성창이 뜹니다. <b>전송</b>하면 5분 안에 접수 확인 메일이 옵니다.</div>
<h2>신규 14편</h2><div class="sub">체크하면 전문을 받아 노트를 씁니다.</div>
<label><input type="checkbox" value="10.1016/j.aei.2026.105330"><div><div class="t">1. <a href="https://doi.org/10.1016/j.aei.2026.105330" target="_blank">Using conditional diffusion models for data-driven ground motion identification of structural dynamic systems under uncertainty</a></div><div class="m">Jichuan Tang, Delin An, Patrick T. Brewick 외 · Advanced Engineering Informatics · 2027-01 #구조점검</div><div class="g">구조물 응답 계측값이 희소하고 손상된 상황에서 지진 지반가속도를 역으로 추정하는 문제를 다룬다. Vision Transformer sensor encoder와 U-Net denoiser를 결합한 conditional diffusion 프레임워크 InvSHMDiff를 제안했다. 사장교 벤치마크 모델에서 센서 masking과 noise가 있어도 지반가속도의 진폭과 위상을 복원했고, FE 기반 Tikhonov 역해석과 learned baseline 4종보다 모든 시나리오에서 성능이 좋았다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105349"><div><div class="t">2. <a href="https://doi.org/10.1016/j.aei.2026.105349" target="_blank">A large language model and knowledge graph collaborative generative framework for aircraft manufacturing system design in MBSE</a></div><div class="m">Zelong Song, Jin Chen, Shizhen Huang 외 · Advanced Engineering Informatics · 2027-01 </div><div class="g">항공기 제조 시스템 설계는 전문가 경험에 의존해 자동화와 추적성이 부족하다. LLM과 knowledge graph를 결합하고 구조화된 CoT prompt로 설계안을 생성한 뒤, KARMA 언어로 MBSE 모델로 바꾸고 시뮬레이션으로 검증하는 closed-loop 프레임워크를 제안했다. 생산 시스템 설계 자동화 사례로 탈현장 공장 설계에 참고할 수 있다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105355"><div><div class="t">3. <a href="https://doi.org/10.1016/j.aei.2026.105355" target="_blank">Damage identification and model updating using bridge displacement under moving vehicles with uncertain weight</a></div><div class="m">Qi Qi, Jinghao Fei, Zhuoran Han 외 · Advanced Engineering Informatics · 2027-01 #구조점검 #디지털트윈</div><div class="g">이동 차량의 하중을 모르는 상태에서도 교량 손상을 찾고 디지털트윈 FE 모델을 갱신하는 방법이다. 변위를 정규화하고 비율을 취해 차량 중량과 무관한 지표를 만들었고, normalized curvature로 손상 위치를, displacement ratio로 손상 정도를 구한 뒤 local gradient descent로 모델을 갱신했다. 하중 추정 오차가 손상 평가로 번지는 기존 2단계 방식의 문제를 없앴다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.cacaie.2026.100243"><div><div class="t">4. <a href="https://doi.org/10.1016/j.cacaie.2026.100243" target="_blank">Construction-state-driven virtual trial assembly of large steel structures with temperature-window identification</a></div><div class="m">Hengxu Zhou, Xinchen Zhang, Hai Fang 외 · Computer-Aided Civil and Infrastructure Engineering · 2026-10 #디지털트윈 #컴퓨터비전</div><div class="g">분절 인양으로 세우는 대형 강구조물은 가조립 상태의 형상으로 virtual trial assembly(VTA)를 평가해야 하는데, 기존 방법은 스캔 시점의 형상을 그대로 써서 상태가 어긋난다. 이를 시공 상태 매핑 문제로 정식화했다. point cloud 형상과 세우기 계획을 온도 조건별 가조립 형상으로 바꾼 뒤 시공 가능한 온도 구간을 찾는다. 17–24°C 구간을 찾아 예측 편차를 평균 85.4% 줄였고, 현장에서 잰 접합부 편차 52개가 모두 2 mm 미만이었다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116365"><div><div class="t">5. <a href="https://doi.org/10.1016/j.engappai.2026.116365" target="_blank">Holistic foreground–background guided feature learning for few-shot strip steel defect segmentation</a></div><div class="m">Xiaofei Zhou, Guanghui Wang, Yong Wu 외 · Engineering Applications of Artificial Intelligence · 2026-12 #컴퓨터비전</div><div class="g">강판 표면 결함 segmentation에서 전경과 배경의 불균형, 복잡한 결함 형태를 few-shot 조건으로 다룬다. 학습 가능한 배경 prototype으로 전경과 배경을 분리하는 FBDM과, cosine similarity 기반 non-local 연산을 쓰는 Dual Attention Module을 갖춘 FB-MFAN을 제안했다. 강재 결함 점검에 옮겨 쓸 수 있는 기법이다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116394"><div><div class="t">6. <a href="https://doi.org/10.1016/j.engappai.2026.116394" target="_blank">Multi-scale Coarse-to-fine Alignment Network for weakly aligned Red–Green–Blue and Thermal salient object detection</a></div><div class="m">Danying Lin, Feifan Sun, Zhengzheng Tu 외 · Engineering Applications of Artificial Intelligence · 2026-12 #컴퓨터비전</div><div class="g">정렬이 덜 된 RGB–열화상 영상 쌍에서 salient object detection을 할 때 생기는 모달리티 간 정렬 문제를 다룬다. affine transform network와 deformable convolution을 쓴 coarse-to-fine alignment module을 각 stage에 넣고 multi-scale consistency loss로 제약하는 MCANet을 제안했다. 현장의 RGB–열화상 융합 인식에 참고할 수 있다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116405"><div><div class="t">7. <a href="https://doi.org/10.1016/j.engappai.2026.116405" target="_blank">Runway-geometry-aware infrared monocular pose estimation for fixed-wing approach and landing</a></div><div class="m">Wei Dai, Guanfeng Yu, Long Wan 외 · Engineering Applications of Artificial Intelligence · 2026-12 #컴퓨터비전</div><div class="g">위성항법이 없을 때 고정익기가 적외선 단안 영상만으로 접근·착륙 6-DoF pose를 추정하는 문제다. 경량 네트워크로 활주로 landmark를 검출해 6-node topology graph로 구성하고, landmark마다 예측한 anisotropic covariance로 가중 reprojection 최적화를 하는 LandNavNet을 제안했다. 기하 구조 prior를 이용하는 단안 pose 추정 사례다.</div></div></label>
<label><input type="checkbox" value="10.1061/jcemd4.coeng-18697"><div><div class="t">8. <a href="https://doi.org/10.1061/jcemd4.coeng-18697" target="_blank">Analyzing the Key Influencing Factors of Contractors’ Environmentally Responsible Behavior in Megaprojects: A Social Network Analysis</a></div><div class="m">Zhao Zhai, Shirong Gao · Journal of Construction Engineering and Management · 2026-12-01 </div><div class="g">메가프로젝트에서 시공사의 환경책임행동(ERB)에 영향을 주는 요인들이 서로 어떻게 얽혀 있는지 분석했다. 문헌 검토와 Delphi로 요인 20개를 뽑고, 전문가 설문으로 요인 간 관계를 정량화한 뒤 social network analysis로 네트워크를 만들었다. 핵심 요인 13개와 주요 상호작용 21개를 찾았고, 계약 거버넌스·책임 귀속·환경 인식·조직문화가 중심 요인으로 나타났다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105345"><div><div class="t">9. <a href="https://doi.org/10.1016/j.aei.2026.105345" target="_blank">Structure-preserving Gaussian Splatting with dual-domain constraints for limited-angle industrial CT</a></div><div class="m">Jiachen Li, Xusheng Yong, Mingle Zhou 외 · Advanced Engineering Informatics · 2027-01 #컴퓨터비전</div><div class="g">초록 없음</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107298"><div><div class="t">10. <a href="https://doi.org/10.1016/j.autcon.2026.107298" target="_blank">Wall-climbing robot with two-stage acoustic perception for noise-robust hollow tile inspection</a></div><div class="m">Zhenqin Huang, Shuyi He, Jiahui Liu 외 · Automation in Construction · 2027-01 #구조점검 #인간로봇</div><div class="g">고층 외벽의 들뜬 타일을 사람이 두드려 점검하는 위험을 줄이려고 접촉 음향 센싱 벽면 등반 로봇을 만들었다. 로봇 흡착 장치의 강한 자체 소음을 DCCRN 기반 enhancement로 억제하고 ResNet18-CWT로 분류하는 2단계 구조로, SI-SNR을 10.58 dB 높이고 분류 accuracy·F1 99.12%를 얻었다. 광폭 스캔으로 흡착 1회당 점검 범위를 10배로 넓혔고, 손상 지도의 평균 위치 오차는 7.6 mm, 실험실·현장 정확도는 93.2%/97.2%였다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116302"><div><div class="t">11. <a href="https://doi.org/10.1016/j.engappai.2026.116302" target="_blank">A transferable random forest algorithm for tunneling-induced maximum ground settlement prediction across projects</a></div><div class="m">Ziheng Geng, Zihan Yang, Yi Dai 외 · Engineering Applications of Artificial Intelligence · 2026-12 #구조점검</div><div class="g">쉴드 터널 굴착에 따른 최대 지표침하 예측 ML 모델이 다른 프로젝트로 잘 옮겨지지 않는 문제를 다룬다. Data Shapley로 해로운 source 샘플을 걸러내고, 사전학습한 random forest의 트리 구조를 늘리고 가지치기해 target에 맞추는 DS-SER을 제안했다. EPB 쉴드 프로젝트 3개 사이의 전이 실험에서 R 0.86, 0.75, 0.84를 얻었다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116421"><div><div class="t">12. <a href="https://doi.org/10.1016/j.engappai.2026.116421" target="_blank">Hierarchical and explainable machine learning framework for electrical arc monitoring in wire arc additive manufacturing</a></div><div class="m">Joyce Ingrid Venceslau de Souto, Lucas José Elias Bezerra dos Santos, Keila Lucas dos Santos 외 · Engineering Applications of Artificial Intelligence · 2026-12 </div><div class="g">Wire Arc Additive Manufacturing(WAAM)의 아크 불안정으로 생기는 결함을 전기 신호만으로 모니터링한다. Isolation Forest로 이상 라벨을 만들고, 이상 구간을 먼저 찾은 뒤 정상 상태와 과도 상태를 구분하는 계층 구조를 썼다. XGBoost·LSTM·Transformer를 비교해 XGBoost가 Recall과 AP의 균형이 가장 좋았고, SHAP으로 파형 변동성·피크 특징이 주요 요인임을 밝혔다. 강구조 적층 제조 공정의 품질 관리에 참고할 만하다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116422"><div><div class="t">13. <a href="https://doi.org/10.1016/j.engappai.2026.116422" target="_blank">Dynamic agentic preference learning for robust flow shop rescheduling</a></div><div class="m">Wuzhao Li, Weian Guo · Engineering Applications of Artificial Intelligence · 2026-12 </div><div class="g">운영 중에 생산 조건과 계획자의 선호(처리량·꼬리 위험·에너지)가 바뀌는 flow shop에서 반복 재일정을 짜는 agentic AI 방법 AIREA를 제안했다. 이벤트가 발생하면 particle posterior로 선호를 갱신하고, posterior가 이끄는 다목적 memetic search와 rolling horizon commitment로 아직 확정되지 않은 작업만 다시 계획한다. 탈현장 생산 공정의 일정 관리에 응용할 여지가 있다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116441"><div><div class="t">14. <a href="https://doi.org/10.1016/j.engappai.2026.116441" target="_blank">Automated measurement of rural highway widths using transformer-based models and point cloud analysis</a></div><div class="m">Hesham Elmasry, Amr M. Sakr, Karim El-Basyouny · Engineering Applications of Artificial Intelligence · 2026-12 #컴퓨터비전</div><div class="g">LiDAR point cloud에서 지방 고속도로의 차로 폭·갓길 폭·차로 수를 자동으로 측정한다. 계층형 Transformer semantic segmentation에 기하 기반 측정 알고리즘을 결합했고, 캐나다 앨버타의 5개 구간에서 평가했다. 수동 라벨 기준 상관계수 0.99 이상, 오차 수 cm 수준이었고, 자동 segmentation 결과를 써도 신뢰할 만한 측정값이 나왔다.</div></div></label>
<h2>기존 노트 검토 4편</h2><div class="sub">옵시디언에 있는 안 읽은 노트입니다. <b>체크한 것만 남기고, 체크하지 않은 노트는 지웁니다.</b></div>
<label><input type="checkbox" value="10.1016/j.buildenv.2026.115329"><div><div class="t">15. <a href="https://doi.org/10.1016/j.buildenv.2026.115329" target="_blank">Large language model agents capture heterogeneous occupant behaviors in building energy simulation of shared office spaces</a></div><div class="m">Xiaoxiao Xu, Guanying Huang, Zonglin Li 외 · Building and Environment · 2026-09 #건물성능 #디지털트윈</div><div class="g">EnergyPlus 의 고정 schedule 을 LLM agent 로 갈아 끼워 온열 선호와 절전 의도가 다른 재실자 네 명을 모사하고, 4인 공유 사무실에서 한 사람이 전체 제어 행동의 62.1%를 차지하는 지배 구조를 재현했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.jobe.2026.117403"><div><div class="t">16. <a href="https://doi.org/10.1016/j.jobe.2026.117403" target="_blank">Structural systems and connection technologies of multi-storey and high-rise modular steel construction: A review and case study</a></div><div class="m">En-Feng Deng, Xue-Jie Liu, Jun-Dong Gao 외 · Journal of Building Engineering · 2026-09 #모듈러 #구조점검</div><div class="g">중·고층 모듈러 강구조의 구조 시스템을 세 유형으로 정리하고 접합 기술의 발전을 검토한 뒤, 중력과 횡력을 분리하는 모듈-강프레임 주-부 구조를 제안해 20층 모형의 모드 해석과 탄소성 시간이력 해석으로 단계적 항복을 확인했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107288"><div><div class="t">17. <a href="https://doi.org/10.1016/j.autcon.2026.107288" target="_blank">Toward intelligent safety assurance in construction human-robot collaboration</a></div><div class="m">Mingzhu Wang, Shijing Xu · Automation in Construction · 2027-01 #인간로봇 #안전행동</div><div class="g">2011~2025년 건설 인간-로봇 협업 연구 215편을 PRISMA 로 선별해 다섯 갈래 기술 방향으로 묶고, 54%가 실험실 검증에 머물러 있음을 보인 뒤 sensing-prediction-control-supervision 을 잇는 closed-loop 안전보증 틀을 제시했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105219"><div><div class="t">18. <a href="https://doi.org/10.1016/j.aei.2026.105219" target="_blank">Efficient visual–inertial ego-motion estimation for intelligent vehicles via Mamba2 state-space sequence modeling</a></div><div class="m">Xiaowen Tao, Yinuo Wang, Dongpu Cao 외 · Advanced Engineering Informatics · 2027-01 #컴퓨터비전 #웨어러블</div><div class="g">VIFT 계열 visual–inertial odometry 의 Transformer fusion 을 stacked Mamba2 로 바꾸고 rotation branch 에 RPMG manifold gradient 를 붙여, KITTI 세 test sequence 모두에서 APE 회전·병진 RMSE 최저를 얻으면서 parameter 는 54.7% 줄였다.</div></div></label>

const sel=()=>boxes.filter(b=>b.checked).map(b=>b.value);
function upd(){const d=sel();document.getElementById("n").textContent=d.length;
  gm.disabled=ap.disabled=!d.length&&!OLD;   // 검토 칸이 있으면 0편도 보낼 수 있다(전부 지움)
  try{localStorage.setItem(K,JSON.stringify(d))}catch(e){}}
boxes.forEach(b=>b.addEventListener("change",upd));upd();
const su=()=>"[논문선택] "+KEY+" "+sel().length+"편", body=()=>sel().join("\n")+"\n", q=encodeURIComponent;
const done=()=>document.getElementById("msg").style.display="block";
// 폰에서는 Gmail 웹 작성창 주소가 앱·받은편지함으로 넘어가며 내용을 잃는다(2026-09-27 실측). 메일 앱을 주 버튼으로.
if(matchMedia("(pointer:coarse)").matches){gm.className="alt";ap.className="";gm.parentNode.insertBefore(ap,gm)}
gm.onclick=()=>{done();window.open("https://mail.google.com/mail/?authuser="+q(ME)+"&view=cm&fs=1&to="+q(TO)+"&su="+q(su())+"&body="+q(body()),"_blank")};
ap.onclick=()=>{done();location.href="mailto:"+TO+"?subject="+q(su())+"&body="+q(body())};
</script></body></html>
