<!doctype html>

<title>논문 선택 2026-10-11</title>
<style>
:root{--bg:#fff;--fg:#1d1f23;--mute:#6b7078;--line:#e4e6ea;--card:#f7f8fa;--acc:#1a4c8b;--on:#e8f0fb}
@media (prefers-color-scheme:dark){:root{--bg:#16181c;--fg:#e6e8eb;--mute:#9aa0a8;--line:#2c3036;--card:#1e2126;--acc:#7fb0ff;--on:#1f2d42}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:820px;margin:0 auto;padding:16px 16px 110px}h1{font-size:19px;margin:8px 0 2px}.sub{color:var(--mute);font-size:13px;margin-bottom:14px}
label{display:flex;gap:12px;padding:14px;margin:0 0 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer}
label:has(input:checked){background:var(--on);border-color:var(--acc)}
input{width:20px;height:20px;flex:none;margin-top:3px;accent-color:var(--acc)}
.t{font-weight:600}.t a{color:var(--acc);text-decoration:none}.m{color:var(--mute);font-size:13px}.g{margin-top:6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px}
.bar div{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;padding:9px 16px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:var(--bg);cursor:pointer}
button.alt{background:transparent;color:var(--acc)}button:disabled{opacity:.4;cursor:default}.n{margin-right:auto}

h2{font-size:16px;margin:26px 0 4px}h2+.sub{margin-bottom:10px}

<h1>논문 선택 — 2026-10-11</h1>
<div class="sub">체크하고 아래 「보내기」를 누르면 DOI 목록이 채워진 메일 작성창이 뜹니다. <b>전송</b>하면 5분 안에 접수 확인 메일이 옵니다.</div>
<h2>신규 9편</h2><div class="sub">체크하면 전문을 받아 노트를 씁니다.</div>
<label><input type="checkbox" value="10.1016/j.aei.2026.105344"><div><div class="t">1. <a href="https://doi.org/10.1016/j.aei.2026.105344" target="_blank">Peer to multi peer energy trading for renewable communities using blockchain smart contracts and social welfare allocation</a></div><div class="m">Chunwei Han, Yuehua Bai · Advanced Engineering Informatics · 2027-01 </div><div class="g">수소충전·EV 이동 서비스를 포함한 탄소 제약 멀티캐리어 에너지 허브에서 스테이션 스케줄링, 수요반응, 탄소거래를 함께 다루는 문제를 풀었다. IESO를 상위 조정자로 두는 Stackelberg 게임 기반 가격결정에 blockchain smart contract 정산과 사회후생 배분을 결합했다. 협조 운영으로 기준안보다 탄소배출을 5.57% 줄였고, 공급자 탄소거래가 가장 큰 감축 효과를 보였다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116515"><div><div class="t">2. <a href="https://doi.org/10.1016/j.engappai.2026.116515" target="_blank">Uncertainty-aware prediction of asphalt pavement roughness using probabilistic machine learning</a></div><div class="m">Abolfazl Afshin, Soodeh Asgari, Ali Behnood · Engineering Applications of Artificial Intelligence · 2026-12 #구조점검</div><div class="g">아스팔트 포장 거칠기(roughness) 예측이 결정론적 추정에 그쳐 신뢰도를 알 수 없는 문제를 다뤘다. LTPP 1,246개 구간 데이터로 Bayesian neural network와 Gaussian process regression을 적용해 예측구간을 함께 산출했고, RF·XGBoost·SVR·ANN과 같은 검증 틀에서 비교했다. 위험 기반 자산관리 의사결정에 쓸 수 있는 불확실성 인지 예측 프레임워크를 제시했다.</div></div></label>
<label><input type="checkbox" value="10.1061/jmenea.meeng-7761"><div><div class="t">3. <a href="https://doi.org/10.1061/jmenea.meeng-7761" target="_blank">Operational Interface Governance, Digital Capability, and Resilience Support in Cross-Border Critical Infrastructure: A Capability-Pathway Perspective</a></div><div class="m">Junying Liu, Lifeng Shi, Haiwen Li 외 · Journal of Management in Engineering · 2027-01-01 </div><div class="g">국경을 넘는 핵심 인프라 운영에서 조직 간 인터페이스 거버넌스가 디지털 역량과 회복력 지원에 어떻게 이어지는지 분석했다. 실무자 371명을 대상으로 시나리오 기반 설문을 하고 SEM과 bootstrapping으로 분석했다. 거버넌스 강화는 디지털 역량과 양(+)의 관계를 보였고, 신속한 의사결정이 복구 지원으로 가는 직접 경로가 가장 강했다. 변화 실행 역량은 복구 지원을 직접 예측하지 못했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105365"><div><div class="t">4. <a href="https://doi.org/10.1016/j.aei.2026.105365" target="_blank">Adaptive threshold optimization for efficient and robust high-dimensional sensor calibration in building energy systems</a></div><div class="m">Kai Hu, Chengchu Yan, Chenxin Zhou 외 · Advanced Engineering Informatics · 2027-01 #건물성능</div><div class="g">건물 에너지 시스템 센서 편향을 현장에서 보정할 때 측정 잡음과 고차원 계산 부담이 문제였다. Gaussian 확률 기반 신뢰도 평가로 보정 후보 센서만 골라 차원을 줄이고, Bayesian optimization으로 임계값을 적응적으로 최적화하는 SIC-BO를 제안했다. 이력 데이터나 정답 라벨 없이도 낮은 MAPE를 유지하면서 계산 시간을 크게 줄였다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107291"><div><div class="t">5. <a href="https://doi.org/10.1016/j.autcon.2026.107291" target="_blank">Automated safety interpretation of crack-aperture for concrete dams using mutation-aware visual-sensor fusion and knowledge-augmented reasoning</a></div><div class="m">Hao Gu, Jiale Wang, Yixiang Fang 외 · Automation in Construction · 2027-01 #컴퓨터비전 #구조점검</div><div class="g">콘크리트 댐 균열 계측 기록의 결측과, 정상 진전과 이상 변화를 구분하기 어려운 문제를 다뤘다. MDS-YOLOv11n으로 영상에서 균열폭을 추출해 crack-gauge 계측값과 정합하고, Autoformer·dynamic 3σ·Heaviside-EMA로 급변을 인지하는 예측을 수행했다. GraphRAG로 추적 가능한 안전 해석과 운영·유지관리 권고를 생성한다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107301"><div><div class="t">6. <a href="https://doi.org/10.1016/j.autcon.2026.107301" target="_blank">Physics-guided data fusion for settlement prediction of high-fill railway embankments</a></div><div class="m">Zongyu Zhang, Zhichao Huang, Qian Su 외 · Automation in Construction · 2027-01 #구조점검</div><div class="g">고성토 철도 노반의 침하 예측이 계측 잡음과 시공·운영 단계별 변형 차이 때문에 어려웠다. SNR 기반 정제를 붙인 hybrid autoencoder로 잡음을 제거하고, 층별 합산 침하식을 넣은 temporal graph convolutional network로 시공 정보와 계측 데이터를 융합했다. R²≈0.99를 얻었고, 물리 모듈과 데이터 모듈의 출력을 분리해 해석할 수 있다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.cacaie.2026.100245"><div><div class="t">7. <a href="https://doi.org/10.1016/j.cacaie.2026.100245" target="_blank">POD-HDWNO: A hierarchical decoupled wavelet neural operator framework with POD reconstruction for efficient full-field response prediction of high-speed railway bridges</a></div><div class="m">Libing Chen, Li Song, Zhiwu Yu 외 · Computer-Aided Civil and Infrastructure Engineering · 2026-10 #구조점검</div><div class="g">고속철도 교량의 열차 유발 진동을 전체 영역에서 구하는 차량-궤도-교량 연성 해석은 계산 비용이 커 확률 해석에 쓰기 어렵다. POD로 변위·가속도 장을 저차원 모드로 투영한 뒤 hierarchical decoupled wavelet neural operator(HDWNO)로 공유 동특성과 응답별 스펙트럼 특성을 분리해 학습했다. 대규모 표본 확률 해석의 효율을 크게 높였고 잡음에도 강건했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116517"><div><div class="t">8. <a href="https://doi.org/10.1016/j.engappai.2026.116517" target="_blank">Prediction models of tunnel boring machine tunneling performance based on an improved temporal convolutional network</a></div><div class="m">Jinli Qiao, Yixin Du, Jianqin Liu 외 · Engineering Applications of Artificial Intelligence · 2026-12 </div><div class="g">TBM의 복잡한 시계열 특성 때문에 굴진 성능 예측이 어려운 문제를 다뤘다. 3σ로 데이터를 정제하고 Extremely Randomized Trees로 핵심 변수(토크, 커터헤드 속도 등)를 고른 뒤, 활성화 함수를 수정한 TCN으로 관입률(PR)과 FPI를 예측했다. CEEMDAN-TCN 하이브리드로 추력도 예측했으며 현장 데이터로 검증했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.jobe.2026.117520"><div><div class="t">9. <a href="https://doi.org/10.1016/j.jobe.2026.117520" target="_blank">Dual velocity model for extrusion-based 3D concrete printing</a></div><div class="m">Xinze Li, Zhendi Wang, Ling Wang · Journal of Building Engineering · 2026-10 #모듈러</div><div class="g">압출식 3D 콘크리트 프린팅에서 압출 속도와 프린팅 속도를 시행착오로 맞추던 문제를 다뤘다. 레올로지 시험값(소성점도, 동적 전단응력)과 장비 특성, 압출 형상을 잇는 physics-informed 이중 속도 모델(DVM)을 제안했다. 프린팅 결과를 예측하고 체적 유량을 맞출 수 있어 파라미터 조정을 정량적으로 할 수 있게 했다.</div></div></label>
</main>
<div class="bar"><div><span class="n"><b id="n">0</b>편 선택</span>
<button id="gm" disabled>Gmail로 보내기</button><button id="ap" class="alt" disabled>메일 앱으로 보내기</button>
<span id="msg">작성창이 열렸으면 <b>전송</b>을 눌러야 접수됩니다. 5분 안에 「접수」 확인 메일이 옵니다. 안 오면 다른 버튼으로 다시 보내세요.</span></div></div>
<script>
const TO="bjchoi13@gmail.com", ME="bchoi@ajou.ac.kr", KEY="2026-10-11", K="picks-"+KEY, OLD=false;
const boxes=[...document.querySelectorAll("input")], gm=document.getElementById("gm"), ap=document.getElementById("ap");
try{const s=JSON.parse(localStorage.getItem(K)||"[]");boxes.forEach(b=>b.checked=s.includes(b.value))}catch(e){}
const sel=()=>boxes.filter(b=>b.checked).map(b=>b.value);
function upd(){const d=sel();document.getElementById("n").textContent=d.length;
  gm.disabled=ap.disabled=!d.length&&!OLD;   // 검토 칸이 있으면 0편도 보낼 수 있다(전부 지움)
  try{localStorage.setItem(K,JSON.stringify(d))}catch(e){}}
boxes.forEach(b=>b.addEventListener("change",upd));upd();
const su=()=>"[논문선택] "+KEY+" "+sel().length+"편", body=()=>sel().join("\n")+"\n", q=encodeURIComponent;
const done=()=>document.getElementById("msg").style.display="block";
// 폰에서는 Gmail 웹 작성창 주소가 앱·받은편지함으로 넘어가며 내용을 잃는다(2026-09-27 실측). 메일 앱을 주 버튼으로.
if(matchMedia("(pointer:coarse)").matches){gm.className="alt";ap.className="";gm.parentNode.insertBefore(ap,gm)}
gm.onclick=()=>{done();window.open("https://mail.google.com/mail/?authuser="+q(ME)+"&view=cm&fs=1&to="+q(TO)+"&su="+q(su())+"&body="+q(body()),"_blank")};
ap.onclick=()=>{done();location.href="mailto:"+TO+"?subject="+q(su())+"&body="+q(body())};
</script></body></html>
