<h1>논문 선택 — 2026-10-06</h1>
<div class="sub">체크하고 아래 「보내기」를 누르면 DOI 목록이 채워진 메일 작성창이 뜹니다. <b>전송</b>하면 5분 안에 접수 확인 메일이 옵니다.</div>
<h2>신규 17편</h2><div class="sub">체크하면 전문을 받아 노트를 씁니다.</div>
<label><input type="checkbox" value="10.1016/j.aei.2026.105357"><div><div class="t">1. <a href="https://doi.org/10.1016/j.aei.2026.105357" target="_blank">A sensorless wind-aware multimodal feedback framework for human-drone interaction in urban environments</a></div><div class="m">Jiahao Wu, Bowen Sun, Tianyu Zhou 외 · Advanced Engineering Informatics · 2027-01 #인간로봇 #웨어러블</div><div class="g">도심에서는 건물 때문에 생기는 난류가 드론 조종을 어렵게 하고 조종사의 인지 부하를 높인다. 이 연구는 별도 풍속 센서 없이 드론의 동적 응답에서 바람을 추정한다. 추정한 바람을 시각·몸통 착용 haptic·청각 피드백으로 조종사에게 전달하는 프레임워크를 Unity 시뮬레이션으로 구현했다. 참가자 30명이 4가지 피드백 조건을 비교했고, 그중 Visual + Haptic 조합이 효과적이었다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105359"><div><div class="t">2. <a href="https://doi.org/10.1016/j.aei.2026.105359" target="_blank">Degradation stage-aware domain adaptation and individualized error compensation for remaining useful life prediction across operating conditions</a></div><div class="m">Chenchen Wu, Ming Zhang, Jialong He 외 · Advanced Engineering Informatics · 2027-01 </div><div class="g">운전 조건이 바뀌어도 장비의 잔존수명(RUL)을 예측할 수 있도록 multi-source domain adaptation 프레임워크를 제안한다. 최적 source domain 선택, dynamic convolution을 넣은 multi-scale Mamba, 열화 단계 인식 IMK-MMD를 사용했다. 여기에 self-supervised learning과 물리 열화 법칙에 기반한 개별 오차 보정 모듈을 결합했다. 건설 장비·인프라의 예지보전에 응용할 수 있다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107263"><div><div class="t">3. <a href="https://doi.org/10.1016/j.autcon.2026.107263" target="_blank">Attention-enhanced deep learning for on-site time-series construction equipment motion recognition</a></div><div class="m">Ankang Ji, Hongqin Fan, Xiaolong Xue 외 · Automation in Construction · 2027-01 #컴퓨터비전 #안전행동 #진도관리</div><div class="g">현장 건설장비의 동작을 영상으로 인식하는 deep learning 방법을 제안한다. multi-object tracking, action classification, keypoint estimation 세 과제를 한 모델에서 함께 수행한다. HANet attention 모듈로 spatiotemporal 표현을 강화했고, 공개 데이터셋 실험과 ablation에서 세 과제 모두 높은 성능을 보였다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107290"><div><div class="t">4. <a href="https://doi.org/10.1016/j.autcon.2026.107290" target="_blank">Semi-automated code compliance checking based on semantic reasoning</a></div><div class="m">Ignacio Huitzil, Lucía Pitarch, Marco Schorlemmer 외 · Automation in Construction · 2027-01 #BIM</div><div class="g">BIM 모델이 건축 법규를 지키는지 반자동으로 검사하는 SmartNorms4BIM을 제안한다. LLM이 법규 문장을 OWL 2 ontology로 바꾸고, semantic reasoner가 위반을 찾는다. 규정의 모호한 표현은 fuzzy logic으로, 기하 조건은 별도 알고리즘 두 개로 처리한다. 기업의 실제 데이터를 쓴 사례 2건으로 검증했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107297"><div><div class="t">5. <a href="https://doi.org/10.1016/j.autcon.2026.107297" target="_blank">Generative LLM for adaptive taxonomy-informed multi-label classification in construction safety</a></div><div class="m">Qing Shuang, Lujie Qi, Huaiyuan Zhai · Automation in Construction · 2027-01 #안전행동</div><div class="g">건설 재해 서술문을 OIICS 체계에 맞춰 분류하는 문제를 다룬다. OIICS는 4개 속성, 4단계 계층, 2,000개가 넘는 라벨로 이루어져 있다. 이 연구는 분류 코딩을 generative seq2seq 문제로 바꾼 AGCC를 제안하고, LoRA fine-tuning으로 학습 파라미터를 96.8% 줄였다. OIICS 3.0에서 Weighted-F1 74.36%(Flat)·84.66%를 얻었고, 분류체계가 2.0에서 3.0으로 바뀔 때 필요한 데이터를 87% 줄였다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.ssci.2026.107505"><div><div class="t">6. <a href="https://doi.org/10.1016/j.ssci.2026.107505" target="_blank">Safety and health of workers in post-disaster reconstruction: a scoping review and evidence map</a></div><div class="m">Solomon Sesesie Ajasa, Patrick Shane Crawford · Safety Science · 2027-02 #안전행동</div><div class="g">재난 후 재건 현장 작업자의 안전보건(OSH)을 PRISMA-ScR 방식으로 검토한 scoping review이자 evidence map이다. 2005~2025년 문헌 55건을 분석했다. 기존 연구는 잔해 정리·철거 작업에 몰려 있었고, 장기 재건 단계와 비공식 노동자는 거의 다뤄지지 않았다. 복구를 서두를수록 작업자 보호가 약해진다는 점도 확인했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105306"><div><div class="t">7. <a href="https://doi.org/10.1016/j.aei.2026.105306" target="_blank">CFS-Grasp: A cross-modal few-shot semantic grasping framework for unknown objects</a></div><div class="m">Xiaozheng Liu, Kechen Song, Yunhui Yan 외 · Advanced Engineering Informatics · 2027-01 #컴퓨터비전 #인간로봇</div><div class="g">처음 보는 물체를 로봇이 집도록 few-shot 3D point cloud segmentation을 grasping에 결합한 CFSGrasp를 제안한다. geometry-guided cross-modal fusion으로 RGB 외관 정보를 point 표현에 주입해, 모양은 비슷하지만 외관이 다른 대상도 구분한다. 벤치마크 3종에서 state-of-the-art segmentation 성능을 보였고 실제 로봇 실험으로 검증했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105353"><div><div class="t">8. <a href="https://doi.org/10.1016/j.aei.2026.105353" target="_blank">Spatio-temporal memory guided factor graph optimization for robust 3D LiDAR multi-object tracking in autonomous driving</a></div><div class="m">Shaoquan Feng, Xingxing Li, Chunxi Xia 외 · Advanced Engineering Informatics · 2027-01 #컴퓨터비전</div><div class="g">3D LiDAR multi-object tracking에서 손으로 설계한 motion model은 불규칙한 움직임, 가림, 노이즈 섞인 detection에 취약하다. 이 연구는 LSTM으로 불확실성을 반영한 궤적을 예측하고, 이를 factor graph의 adaptive motion factor로 넣어 detection·점군 제약과 함께 최적화한다. KITTI와 nuScenes에서 MOT 성능과 위치 정확도가 크게 좋아졌다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105356"><div><div class="t">9. <a href="https://doi.org/10.1016/j.aei.2026.105356" target="_blank">Uncertainty-aware and generalizable task prediction for human–robot collaboration in on-site timber assembly</a></div><div class="m">Yiqing Wang, Zhengyi Chen, Jack Chin Pang Cheng 외 · Advanced Engineering Informatics · 2027-01 #인간로봇 #모듈러</div><div class="g">현장 목조 조립에서 사람과 협업하는 로봇이 다음 작업을 예측하는 UATP 프레임워크를 제안한다. 조립 순서의 불확실성을 담은 ontology, 자재 재고 정보를 더한 Hidden semi-Markov model, human-feedback-in-loop 일반화 메커니즘으로 구성된다. 제안 수용률은 26%에서 59%로, 첫 제안 정밀도는 33%에서 61%로 올랐다. 처음 보는 조립 유형에서도 수용률을 최대 57%까지 유지했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107285"><div><div class="t">10. <a href="https://doi.org/10.1016/j.autcon.2026.107285" target="_blank">Composite-kernel Gaussian process regression for coating quality prediction in robotic natural-stone paint spraying</a></div><div class="m">Haoyu Shi, Juan Lu, Qinghua Liao 외 · Automation in Construction · 2027-01 #인간로봇</div><div class="g">건물 외벽에 천연석 도료를 뿌리는 로봇 도장에서, 도막 두께와 균일도를 예측하는 문제를 다룬다. 이 상황은 표본이 적고 노이즈가 크다. 연구진은 전역 선형 추세와 국소 비선형 패턴을 함께 잡는 composite-kernel Gaussian process regression(LE-CGPR)을 제안했다. ML 모델 5종과 비교하고 ablation을 수행한 결과 이 모델이 가장 우수했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107296"><div><div class="t">11. <a href="https://doi.org/10.1016/j.autcon.2026.107296" target="_blank">Artificial intelligence for two-dimensional AEC drawing analysis: Systematic and critical review</a></div><div class="m">Ifeoluwa Awotunde, Yongwei Shan · Automation in Construction · 2027-01 #컴퓨터비전 #BIM</div><div class="g">2D AEC 도면 해석에 AI를 적용한 연구 105편(2015년~2026년 2월)을 체계적으로 검토했다. 과제 배정 162건 가운데 저수준 인식이 69.8%였고, CNN이 여전히 주류였다. transformer와 hybrid 방법은 2023년 이후 늘었다. 연구 59건이 자체 데이터셋을 썼고 cross-dataset 검증은 드물었다. 저자들은 중·고수준 과제를 위한 AEC 특화 지표와 프레임워크를 제시했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107300"><div><div class="t">12. <a href="https://doi.org/10.1016/j.autcon.2026.107300" target="_blank">Review of material–process–structure synergy and engineering applications of spray-based 3D concrete printing</a></div><div class="m">Yang Qi, Guang Yang, Zhongcheng Ma 외 · Automation in Construction · 2027-01 #모듈러</div><div class="g">분사식 3D 콘크리트 프린팅(S-3DCP)을 재료·공정·구조의 상호작용이라는 관점으로 종합한 리뷰다. 재료 상태와 분사 조건이 적층 형상과 층간 계면을 함께 좌우하고, 철근 피복 방식이 구조 성능을 결정한다고 정리했다. 실용화하려면 closed-loop 제어, 내구성 검증, 표준, LCA가 필요하다고 제안한다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.buildenv.2026.115371"><div><div class="t">13. <a href="https://doi.org/10.1016/j.buildenv.2026.115371" target="_blank">Design for low carbon modular buildings: A hypergraph neural network surrogate model</a></div><div class="m">Yuchen Gao, Weisheng Lu, Bolun Wang · Building and Environment · 2026-10 #모듈러</div><div class="g">모듈러 건축의 내재탄소(EC)를 초기 설계 단계에서 모듈 배치 구성으로 줄이는 설계 도구를 개발했다. typed hypergraph neural network로 surrogate model을 만들고 evolutionary optimization 루프에 결합했다. 홍콩 등 실제 준공 배치 99건 가운데 45.5%에서 EC가 더 낮은 설계를 찾았고, 지역별 평균 감축률은 22.5~28.0%였다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.enbuild.2026.118356"><div><div class="t">14. <a href="https://doi.org/10.1016/j.enbuild.2026.118356" target="_blank">Vision-physics fusion unlocks ventilation flexibility for occupancy-centric control in large airport terminals</a></div><div class="m">Yuren Yang, Shi Pan, Hao Tang 외 · Energy and Buildings · 2026-10 #컴퓨터비전 #건물성능</div><div class="g">공항 터미널은 실제 재실 밀도와 상관없이 설계 밀도에 맞춰 환기한다. 이 연구는 실제 CCTV 영상을 deep learning crowd density estimation으로 처리해 8개 구역의 재실 매트릭스를 만들었다. 이를 CO2 발생항으로 바꿔 물리 기반 다구역 CO2 모델과 결합했다. 설계 재실 대신 영상 기반 재실을 쓰면 환기량이 최대 94.5% 줄었고, 재실과 CO2를 함께 피드백하면 DCV 환기량이 추가로 77.38% 줄었다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116410"><div><div class="t">15. <a href="https://doi.org/10.1016/j.engappai.2026.116410" target="_blank">A novel graph reinforcement learning framework for multilevel flexible scheduling in fuzzy production environments</a></div><div class="m">Yadong He, Chao Deng, Weizhi Liao 외 · Engineering Applications of Artificial Intelligence · 2026-11 </div><div class="g">가공시간이 fuzzy인 다단계 유연 생산 스케줄링 문제를 end-to-end graph reinforcement learning으로 푼다. 계층형 fuzzy 이종 스케줄링 그래프와 fuzzy-aware MDP로 문제를 모델링했다. fuzzy-aware heterogeneous graph attention network와 계층 분리 actor-critic(PPO)을 사용해, 다른 규모의 문제에도 일반화되도록 했다. 프리팹 생산 스케줄링 같은 문제에 응용할 수 있다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116417"><div><div class="t">16. <a href="https://doi.org/10.1016/j.engappai.2026.116417" target="_blank">A focusing distribution pyramid and task-aligned network for lightweight tunnel crack detection</a></div><div class="m">Jing Wang, Yunlong Zhang, Xiwei Fan 외 · Engineering Applications of Artificial Intelligence · 2026-11 #컴퓨터비전 #구조점검</div><div class="g">터널 라이닝 균열을 가볍고 정확하게 검출하려고 YOLOv11n 기반 TCD-YOLO-lite를 제안한다. 대비가 낮은 약한 균열은 FDPN이 보강하고, 가늘고 불규칙한 균열의 분류·위치 일관성은 TADDH가 높인다. 위치 정확도를 위해 CIoU와 Normalized Wasserstein Distance를 결합한 regression loss를 썼다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.ssci.2026.107498"><div><div class="t">17. <a href="https://doi.org/10.1016/j.ssci.2026.107498" target="_blank">Verifying accident causation models: A comparative analysis of representational capabilities</a></div><div class="m">Takaharu Igarashi, Karen Marais · Safety Science · 2027-02 #안전행동</div><div class="g">사고원인 모델은 비교할 정답이 없어 검증하기 어렵다. 이 연구는 사고원인 모델이 복잡한 사회기술 시스템의 실패를 목적에 맞게 표현하는지 판단하는 verification 기준을 정의했다. 새 건설 지향 모델을 포함한 4개 모델을 Sasago 터널, 허블 망원경, Mars Climate Orbiter 사례에 적용해 비교했다. 그 결과를 바탕으로 상황에 맞게 모델을 고르는 근거를 제시한다.</div></div></label>
