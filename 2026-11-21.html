<h1>논문 선택 — 2026-11-21</h1>
<div class="sub">체크하고 아래 「보내기」를 누르면 DOI 목록이 채워진 메일 작성창이 뜹니다. <b>전송</b>하면 5분 안에 접수 확인 메일이 옵니다.</div>
<h2>신규 17편</h2><div class="sub">체크하면 전문을 받아 노트를 씁니다.</div>
<label><input type="checkbox" value="10.1016/j.aei.2026.105467"><div><div class="t">1. <a href="https://doi.org/10.1016/j.aei.2026.105467" target="_blank">Leveraging CAV forward plans for proactive traffic prediction via LLM-assisted information integration</a></div><div class="m">Qi Wu, Jiaqi Zeng, Wentong Guo 외 · Advanced Engineering Informatics · 2027-01 </div><div class="g">교통 예측이 과거 교통 상태에만 기대는 바람에 앞으로의 주행 의도를 반영하지 못하는 문제를 다룬다. 커넥티드·자율주행차(CAV)의 주행 계획, 과거 관측값, 맥락 정보를 각각 encoder로 pre-trained LLM의 embedding 공간에 사상해 융합하고, regression head로 다단계 통행시간을 예측한다. 의미 정보를 붙인 실제 도로망 데이터로 검증했으며, 이상적인 oracle 조건에서 CAV 계획을 쓰면 예측이 개선됐다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105479"><div><div class="t">2. <a href="https://doi.org/10.1016/j.aei.2026.105479" target="_blank">Full-range 3D gradation estimation from rockfill image based on deep learning</a></div><div class="m">Ketian Cai, Jian Wang, Yang Lu · Advanced Engineering Informatics · 2027-01 #컴퓨터비전</div><div class="g">사력댐 다짐 품질을 좌우하는 입도를 체가름 대신 이미지로 추정한다. 이때 2D 투영으로 3D 특성을 알아내야 하고, 보이지 않는 세립분도 채워야 한다. 입자 형상을 radial sequence로 표현하는 encoder 기반 PVWR-net으로 부피와 폭을 회귀하고, SFRP 방법으로 빠진 세립분을 추론한다. 상대오차는 부피 10.1%, 폭 6.43%다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107375"><div><div class="t">3. <a href="https://doi.org/10.1016/j.autcon.2026.107375" target="_blank">Pavement crack analysis and detection: A system-oriented survey and unified taxonomy</a></div><div class="m">José María Castillo-Secilla, José Manuel Palomares, Joaquín Olivares · Automation in Construction · 2027-01 #컴퓨터비전 #구조점검 #디지털트윈</div><div class="g">포장 균열 분석 연구를 시스템 관점에서 정리한 survey다. 계측·데이터 수집, 탐지 알고리즘(고전 비전부터 deep learning, foundation model, LLM·VLM까지), 응용(예측 유지관리·디지털트윈)의 3계층 taxonomy로 묶었다. 공개 데이터셋과 평가 지표를 정리하고, 알고리즘 계열을 데이터·연산·배포 조건에 연결한 decision matrix를 제시했으며, 예측과 디지털트윈 연계에 필요한 데이터 공백을 짚었다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107379"><div><div class="t">4. <a href="https://doi.org/10.1016/j.autcon.2026.107379" target="_blank">Risk-adaptive multiple-model online learning for real-time prediction and diagnostic interpretation of TBM-induced surface settlement</a></div><div class="m">Khanh Pham, Hangseok Choi · Automation in Construction · 2027-01 #구조점검</div><div class="g">TBM 굴진으로 생기는 지표 침하를 실시간으로 예측하고 위험을 식별하는 연구다. IMM 개념을 빌린 위험 적응형 다중모델 융합에 RLS 갱신을 결합해 offline training 없이 예측한다. 심각 침하 확률에 따라 정상 regime 예측기와 심각 regime 예측기의 가중치를 동적으로 바꾼다. 도심 TBM 현장 2곳에서 20~30 ring 만에 예측이 수렴했고 recall은 83~85%였으며, fragility 분석으로 현장마다 다른 침하 메커니즘을 드러냈다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107393"><div><div class="t">5. <a href="https://doi.org/10.1016/j.autcon.2026.107393" target="_blank">Lightweight vision-based framework for real-time monitoring and early warning of water inrush during tunnel construction</a></div><div class="m">Weihao Song, Liping Li, Shuai Cheng 외 · Automation in Construction · 2027-01 #컴퓨터비전 #안전행동</div><div class="g">터널 시공 중 출수를 영상으로 실시간 감시하고 조기경보하는 연구다. PP-LCNet, scSE attention, boundary-aware Dice loss를 결합한 경량 WI-UNet으로 출수 영역을 segmentation하고, 윤곽 면적 확장과 HSV 색 변화를 지표로 삼아 3단계 경보를 낸다. TWI-Seg 데이터셋에서 mIoU 83.5%, 29.8 FPS, 파라미터 3.73M을 기록했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.cacaie.2026.100277"><div><div class="t">6. <a href="https://doi.org/10.1016/j.cacaie.2026.100277" target="_blank">Orientation-guided semantic segmentation and structural profile recognition of steel portal-frame industrial buildings from 3D point clouds</a></div><div class="m">Patricia González-Cabaleiro, Muataz S.A. Albadri, Antonio Fernández 외 · Computer-Aided Civil and Infrastructure Engineering · 2026-11 #컴퓨터비전 #BIM</div><div class="g">철골 문형 라멘 산업건물의 3D point cloud를 Scan-to-BIM용으로 자동 해석한다. orientation-guided 프레임워크로 구조·비구조 부재를 semantic segmentation하고, I형·원형강관(CHS)·L형 단면 profile을 자동으로 재구성한다. 결과를 parametric 형식으로 내보내 Scan-to-BIM 워크플로에 바로 연결할 수 있다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116685"><div><div class="t">7. <a href="https://doi.org/10.1016/j.engappai.2026.116685" target="_blank">Statistics-guided two-stage long-tailed sonar image recognition</a></div><div class="m">Jia-yi Han, Jian-wei Liu · Engineering Applications of Artificial Intelligence · 2027-01 #컴퓨터비전</div><div class="g">class 분포가 long-tailed한 sonar 이미지 인식에서 소수 class 성능이 떨어지는 문제를 다룬다. 1단계에서는 mutual information에서 착안한 목적함수로 representation을 학습하고, 2단계에서는 Dempster–Shafer 이론으로 정량화한 class 불확실성에 따라 resampling한다. 여기에 head class의 covariance를 tail class로 옮겨 가상 feature를 생성한다. 수중 구조물 점검과의 접점은 간접적이다.</div></div></label>
<label><input type="checkbox" value="10.1061/jccee5.cpeng-7592"><div><div class="t">8. <a href="https://doi.org/10.1061/jccee5.cpeng-7592" target="_blank">Local Scour Behavior of Single Pile in Cohesive Soil: Theoretical Model and Empirical Analysis</a></div><div class="m">Jian Guo, Jinzhi Wu, Jiyi Wu 외 · Journal of Computing in Civil Engineering · 2027-03-01 </div><div class="g">해상 단일 말뚝 주변의 국부 세굴을 점착성 지반에서 예측한다. 기존 모델은 입자 간 점착을 무시해 세굴 깊이를 과대평가한다. 점착토 물성을 반영한 한계 전단응력 식과 다입자 응집 개시 메커니즘을 넣은 3D 수치모델 CohesiveScourFoam을 개발했고, 수로 실험으로 시간에 따른 세굴공 발달을 검증했다.</div></div></label>
<label><input type="checkbox" value="10.1061/jccee5.cpeng-7697"><div><div class="t">9. <a href="https://doi.org/10.1061/jccee5.cpeng-7697" target="_blank">CODANet: Disagreement-Aware Cross-Modal Fusion for Anisotropic Pavement Defect Segmentation</a></div><div class="m">Fares Alhaek, Allen A. Zhang, Jing Shang 외 · Journal of Computing in Civil Engineering · 2027-03-01 #컴퓨터비전 #구조점검</div><div class="g">아스팔트 포장 결함 segmentation에서 단일 모달리티나 early fusion으로는 미세 결함을 놓치는 문제를 다룬다. dual-stream encoder 사이의 bottleneck에 CODA 모듈을 두어, 각 stream 예측의 Jensen–Shannon divergence로 픽셀 단위 불일치 지도를 만든다. 이 지도로 모달리티별 신뢰도 가중치를 학습하고, oriented 연산으로 균열의 이방성을 모델링한다.</div></div></label>
<label><input type="checkbox" value="10.1108/ecam-04-2026-0670"><div><div class="t">10. <a href="https://doi.org/10.1108/ecam-04-2026-0670" target="_blank">Synergising Lean construction and artificial intelligence: a conceptual framework</a></div><div class="m">Tolulope Caleb Akande, Shang Gao, Mehran Oraee · Engineering Construction &amp; Architectural Management · 2026-11-20 #진도관리</div><div class="g">AI와 Lean construction이 어떻게 맞물리는지 PRISMA 절차로 63편을 체계적으로 검토했다. AI 기법을 Lean 원칙, 낭비 유형, Lean 방법에 대응시켜 비교했다. machine learning, 최적화, computer vision이 주로 Last Planner System에서 작업 흐름 개선과 cycle time 단축에 쓰였다. 반면 가치 창출과 협업 원칙 쪽은 거의 연구되지 않았다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105477"><div><div class="t">11. <a href="https://doi.org/10.1016/j.aei.2026.105477" target="_blank">Replicate-aware dual-frequency physics-guided deep kernel learning for probabilistic prediction of internal strain in concrete</a></div><div class="m">Ziqian Yang, Xia Yang, Qingsong Xiong · Advanced Engineering Informatics · 2027-01 #구조점검</div><div class="g">초기 재령 콘크리트의 내부 변형률을 초음파 계측으로 확률적으로 예측한다. 반복 측정의 신뢰도를 반영하는 replicate-aware set encoder, 이중 주파수 shared-private representation, 수화 재령·등가 재령·온도 같은 열역학 변수를 결합하고, deep-kernel Gaussian process로 불확실성을 포함해 예측한다(RDF-PDKL). 시공 모니터링을 보조하는 정보를 제공하는 것이 목적이다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.buildenv.2026.115607"><div><div class="t">12. <a href="https://doi.org/10.1016/j.buildenv.2026.115607" target="_blank">A Gaussian process-based method for interactive individual occupant comfort modeling</a></div><div class="m">Gulai Shen, Ali Malkawi, Na Li · Building and Environment · 2026-11 #건물성능</div><div class="g">재실자 개인의 쾌적감을 모델링하는 연구다. LLM 기반 모바일 human-building interface로 자연어 피드백을 받고, 이를 physics-informed prior를 둔 Gaussian Process 모델에 반영해 적은 데이터로도 불확실성을 포함해 개인 쾌적 범위를 추정한다. 쾌적 범위, 말투, 전문성이 서로 다른 persona로 만든 synthetic 피드백으로 검증했으며, 개인화 occupant-centric control의 기반이 된다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.cacaie.2026.100274"><div><div class="t">13. <a href="https://doi.org/10.1016/j.cacaie.2026.100274" target="_blank">HARDIO: A Health-Aware Reliable Detection-Imputation Orchestrator for Operational Data Quality in Instrumented Water Infrastructure</a></div><div class="m">Javier Mateos-Bravo, Sergio Laso, Javier Berrocal 외 · Computer-Aided Civil and Infrastructure Engineering · 2026-11 #디지털트윈</div><div class="g">상하수도 인프라의 센서 데이터에서 drift, flatline, 결측이 생기는 문제를 다룬다. 센서 노후 점수표와 변수별 detector-imputer 연쇄 benchmark를 묶고, 운영·건전성·복원·보정 4개 축의 가중 점수로 변수마다 최적 조합을 고른다(HARDIO). 실제 하수처리장에서 432일, 19채널로 검증한 결과 모든 채널에 최적인 단일 조합은 없었고, SAITS·KNN·LSTM-AE 등이 채널별로 갈렸다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.enbuild.2026.118565"><div><div class="t">14. <a href="https://doi.org/10.1016/j.enbuild.2026.118565" target="_blank">Toward occupant-state monitoring under controlled office-like conditions: Multilevel EEG correlates of mental fatigue and a candidate reduced-electrode montage</a></div><div class="m">Shenglin Ye, Lei Zhang, Pumin Hou 외 · Energy and Buildings · 2026-11 #웨어러블 #안전행동</div><div class="g">사무실과 비슷한 통제 환경에서 정신 피로를 EEG로 객관적으로 측정하는 연구다. 18명이 45분 동안 2-back 과제를 수행하는 동안 32채널 EEG를 기록했다. 과제가 진행될수록 α power는 늘고 β power는 줄었으며, high-α 대역 connectivity와 네트워크 효율이 증가했다. FP1, FC5, P7, P8 4채널로 구성한 축소 전극 montage를 후보로 제시했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116711"><div><div class="t">15. <a href="https://doi.org/10.1016/j.engappai.2026.116711" target="_blank">Dynamic carbon-aware demand response and hierarchical reinforcement learning optimization methods for multi-park integrated energy systems</a></div><div class="m">Beichen Chen, Haoyuan Lv, Wenpeng Hong 외 · Engineering Applications of Artificial Intelligence · 2027-01 </div><div class="g">여러 단지가 묶인 통합 에너지 시스템에서 전력망 탄소집약도에 연동하는 수요반응(DC-DR) 메커니즘을 제안한다. 운영자(Leader)와 단지(Follower)의 이해 충돌을 Stackelberg game 기반 hierarchical reinforcement learning으로 풀었다. 시뮬레이션에서 Leader 수익은 늘고 Follower 운영비와 시스템 탄소배출은 줄었다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116720"><div><div class="t">16. <a href="https://doi.org/10.1016/j.engappai.2026.116720" target="_blank">Statistic and saliency-guided large kernel attention network for unsupervised change detection in polarimetric synthetic aperture radar images</a></div><div class="m">Dazhi Xu, Ming Li, Yan Wu 외 · Engineering Applications of Artificial Intelligence · 2027-01 #컴퓨터비전</div><div class="g">편파 SAR(PolSAR) 영상에서 토지피복 변화를 unsupervised 방식으로 탐지한다. Shannon entropy 기반 통계 차이와 saliency로 잡음에 강한 pseudo-label을 만들고(SGRFCM 군집), 이를 large kernel convolution에 attention을 결합한 SS-GLKAN 학습에 쓴다. 이렇게 지역 특징부터 전역 특징까지 학습한다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116794"><div><div class="t">17. <a href="https://doi.org/10.1016/j.engappai.2026.116794" target="_blank">Data-augmented probabilistic design model for shear capacity of cementitious composite strengthened reinforced concrete beams</a></div><div class="m">Xiangsheng Liu, Xia Qin, Georgia E. Thermou · Engineering Applications of Artificial Intelligence · 2027-01 </div><div class="g">FRCM으로 보강한 RC 보의 전단내력을 예측한다. GA로 최적화한 super-learner로 207개 시편 데이터를 학습하고, TVAE로 희소한 입력 공간을 보강했다. 이어 Bayesian–MCMC 보정으로 역학과 정합하는 해석 가능한 전단식을 유도하고, 모델 불확실성을 정량화해 신뢰성 기반 평가에 쓸 수 있게 했다.</div></div></label>

boxes.forEach(b=>b.addEventListener("change",upd));upd();
const su=()=>"[논문선택] "+KEY+" "+sel().length+"편", body=()=>sel().join("\n")+"\n", q=encodeURIComponent;
