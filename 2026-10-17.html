<h1>논문 선택 — 2026-10-17</h1>
<div class="sub">체크하고 아래 「보내기」를 누르면 DOI 목록이 채워진 메일 작성창이 뜹니다. <b>전송</b>하면 5분 안에 접수 확인 메일이 옵니다.</div>
<h2>신규 35편</h2><div class="sub">체크하면 전문을 받아 노트를 씁니다.</div>
<label><input type="checkbox" value="10.1016/j.aei.2026.105362"><div><div class="t">1. <a href="https://doi.org/10.1016/j.aei.2026.105362" target="_blank">A local consensus based algorithm for distributed multi-agent path finding</a></div><div class="m">Zhigang He, Jianlin Mao, Shufan Zhang 외 · Advanced Engineering Informatics · 2027-01 </div><div class="g">고밀도 환경의 분산 multi-agent path finding은 충돌 인식과 협력적 경로 분리가 부족해 계획이 실패하거나 경로 비용이 커진다. 이벤트 기반 상태 전파, 경로-위상 상관 분석, 우선순위 재구성을 갖춘 규칙 기반 LC-PIBT를 제안했다. livelock·deadlock이 줄었고 agent 1000개 규모까지 효율과 확장성이 개선됐다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105366"><div><div class="t">2. <a href="https://doi.org/10.1016/j.aei.2026.105366" target="_blank">Causal reasoning subgraph retrieval for coal mine safety risk assessment</a></div><div class="m">Hangqi Jiang, Xiangqian Wang, Xiangrui Meng 외 · Advanced Engineering Informatics · 2027-01 #안전행동</div><div class="g">석탄 광산 안전 위험평가는 전문가 주관에 의존해 서로 얽힌 위험을 평가하기 어렵다. BERT-wwm-BiLSTM-CRF로 위험요인·대책·법규를 담은 knowledge graph를 만들고, 여기서 뽑은 인과추론 subgraph를 LLM에 주는 RAG 프레임워크를 제안했다. 정확도는 95.9%였다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105384"><div><div class="t">3. <a href="https://doi.org/10.1016/j.aei.2026.105384" target="_blank">End-to-end climate-aware agentic workflow for urban building energy modelling enabled by large language models</a></div><div class="m">Jingfeng Zhou, Jingjing Dou, Ya Wen 외 · Advanced Engineering Informatics · 2027-01 #건물성능</div><div class="g">도시 건물 에너지 모델링(UBEM)의 GIS-to-BEM 작업은 재현과 감사가 어렵다. GIS 처리부터 EnergyPlus 모델 생성, 기상 시나리오 시뮬레이션까지를 Model Context Protocol tool로 정의하고 LLM agent가 조율하게 했다. 건물 1,165동과 기상 시나리오 7개에 적용해 추적성과 확장성을 높였다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107306"><div><div class="t">4. <a href="https://doi.org/10.1016/j.autcon.2026.107306" target="_blank">Engineering-aware semantic mapping of constrained urban streets for 3D swept path analysis in modular integrated construction logistics</a></div><div class="m">Feng Wang, Zhenjie Zheng, Wei Shao 외 · Automation in Construction · 2027-01 #모듈러 #컴퓨터비전</div><div class="g">대형 MiC 모듈을 좁은 도심 도로로 운송할 때 3D swept path analysis에 쓸 정밀한 시맨틱 도로 모델이 필요하다. 맞춤형 handheld mobile mapping system에 loop closure 기반 기하 매핑(LC-GMM)과 공학 기반 시맨틱 모델링(EA-SMM)을 결합했다. 평균 기하 오차는 0.034 m, 시맨틱 정확도는 93.24%였다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107316"><div><div class="t">5. <a href="https://doi.org/10.1016/j.autcon.2026.107316" target="_blank">Computer vision framework for UAV-based defect inspection of existing buildings with cement-mortar facades and BIM integration</a></div><div class="m">Zeyu Li, Qian Wang, Hong Huang 외 · Automation in Construction · 2027-01 #컴퓨터비전 #구조점검 #BIM</div><div class="g">BIM이 없는 기존 시멘트 모르타르 외벽 건물의 결함 점검을 자동화하는 연구다. RTK 기반 UAV로 촬영한 뒤 OneFormer3D로 외피, YOLOv9으로 창호, Mask2Former+SAHI로 결함 6종을 segmentation하고 Revit/Dynamo로 BIM을 생성했다. 16층 건물에서 외피 mAP@50 96.97%, 창호 92.4%, 결함 AP50 65.12%를 기록했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.cacaie.2026.100249"><div><div class="t">6. <a href="https://doi.org/10.1016/j.cacaie.2026.100249" target="_blank">SE-iTransformer-based smart predict-then-optimize method for transfer selection planning of subway and bus combined travel</a></div><div class="m">Yadan Yan, Zhenli Shi, Zhanyang Yu 외 · Computer-Aided Civil and Infrastructure Engineering · 2026-10 </div><div class="g">지하철-버스 연계 통행에서 승객이 한 환승역에 몰려 비용과 혼잡이 커지는 문제를 다룬다. 혼잡·시간·요금 비용을 STL 분해 특징과 기상 변수를 넣은 SE-iTransformer로 예측하고, Smart Predict-then-Optimize로 환승 선택을 계획했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116476"><div><div class="t">7. <a href="https://doi.org/10.1016/j.engappai.2026.116476" target="_blank">Context-Aware Detail Recovery Network for single image super-resolution</a></div><div class="m">Heping Song, Dandan Zhou, Jingyao Gong 외 · Engineering Applications of Artificial Intelligence · 2026-12 #컴퓨터비전</div><div class="g">single image super-resolution에서 미세 디테일을 복원하기 어려운 문제를 다룬다. CNN과 Transformer를 결합해 국소 디테일 추출(DEE), 전역 멀티스케일 문맥(GMCM), 양방향 정제(FRM) 모듈을 잇는 CADRN을 제안했다. 계산 효율을 유지하면서 SOTA 성능을 냈다.</div></div></label>
<label><input type="checkbox" value="10.1061/jcemd4.coeng-16221"><div><div class="t">8. <a href="https://doi.org/10.1061/jcemd4.coeng-16221" target="_blank">Comparative Analysis of Two Approaches for Improved Site Safety: Domain Approach versus General End-to-End Compliance Reasoning</a></div><div class="m">Xiyu Wang, Nora El-Gohary · Journal of Construction Engineering and Management · 2027-01-01 #안전행동 #컴퓨터비전</div><div class="g">건설현장 안전 규정 준수 점검을 자동화하는 두 접근을 비교했다. 하나는 정보추출·현장 시각 탐지·knowledge graph 추론을 결합한 도메인 접근이고, 다른 하나는 multimodal foundation model 기반 end-to-end 접근이다. 정보추출과 준수 추론의 성능·오류·한계를 평가했고, 도메인 접근이 강한 성능을 보였다.</div></div></label>
<label><input type="checkbox" value="10.1061/jcemd4.coeng-19176"><div><div class="t">9. <a href="https://doi.org/10.1061/jcemd4.coeng-19176" target="_blank">A Review of Human-Centric Construction Manufacturing: Current Practices and Research Opportunities</a></div><div class="m">Sena Assaf, Mohamed Assaf, Alaa Abu Nokta 외 · Journal of Construction Engineering and Management · 2027-01-01 #모듈러 #안전행동</div><div class="g">공장 생산 기반 건설(construction manufacturing)에서 작업자 웰빙·안전·정신건강·숙련을 중심에 두는 Industry 5.0 관점을 scoping review로 정리했다. 연구 주제, 활용 기술, 동향, 공백과 향후 연구 방향을 종합했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105368"><div><div class="t">10. <a href="https://doi.org/10.1016/j.aei.2026.105368" target="_blank">An enhanced outranking-based failure mode and effects analysis framework for supercritical water gasification systems using dual spherical fuzzy rough number clouds</a></div><div class="m">Shajeea Jamil, Muhammad Jabir Khan, Muhammad Akram 외 · Advanced Engineering Informatics · 2027-01 </div><div class="g">하수 슬러지 처리용 초임계수 가스화 시스템의 위험평가에 쓰이는 기존 FMEA는 전문가 평가의 불확실성과 위험요인 간 상호작용을 반영하지 못한다. dual spherical fuzzy rough number cloud와 확장 BWM 가중치를 결합한 outranking 기반 FMEA를 제안했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107292"><div><div class="t">11. <a href="https://doi.org/10.1016/j.autcon.2026.107292" target="_blank">Robotics for on-site construction: Structured scoping review</a></div><div class="m">Michela Rossi, Cristián Calvo Barentin, Dionysios Bournas · Automation in Construction · 2027-01 #인간로봇</div><div class="g">건설현장 투입 로봇 시스템 129건을 PRISMA-ScR로 검토하고 배치 맥락·기능·팀 구성·생애주기 단계로 분류했다. 적층제조, 조립·설치, 인지 기반 점검에 연구가 몰려 있고 단일 로봇이 약 78%였다. 다중 로봇은 아직 시연 수준에 머문다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107308"><div><div class="t">12. <a href="https://doi.org/10.1016/j.autcon.2026.107308" target="_blank">Leveraging automated inspection technologies: Economic implementability evaluation via a partially observable Markov decision process</a></div><div class="m">Daijiro Mizutani, Yuto Nakazato, Nana Sato 외 · Automation in Construction · 2027-01 #구조점검</div><div class="g">정확도가 완벽하지 않은 자동 점검 기술을 인프라 자산관리에 쓸 때의 경제성을 평가하는 방법을 제안했다. POMDP로 점검 불확실성과 확률적 열화를 모델링하고, 같은 시점에 전통 점검으로 재점검하는 경우까지 반영했다. 교량 데이터에서 재점검을 반영하자 생애주기비용이 6.5% 줄었고, 실용화에 필요한 정확도-비용 목표를 도출했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.dibe.2026.101082"><div><div class="t">13. <a href="https://doi.org/10.1016/j.dibe.2026.101082" target="_blank">Training data scaling and specificity: An empirical study of computer vision performance in multi-stage built environments</a></div><div class="m">Ziqing Wang, Yuguang Fu, Jinwoo Kim · Developments in the Built Environment · 2026-10 #컴퓨터비전</div><div class="g">건설 컴퓨터비전에서 학습 데이터를 무작정 늘리는 것과 공정 단계에 특화된 데이터를 쓰는 것을 비교했다. 토공부터 마감까지 13개 단계에 대해 통합형과 단계 특화형 데이터셋을 여러 규모로 만들어 YOLOv8 작업자 detector를 학습했다. 데이터 양보다 단계 특화성이 성능에 더 중요했고, 데이터 의존도도 낮췄다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116434"><div><div class="t">14. <a href="https://doi.org/10.1016/j.engappai.2026.116434" target="_blank">A novel fine-tuning method for long short-term memory models on edge device to adapt to dynamic user habits in smart homes</a></div><div class="m">Chen Zhong, Weiwei Lyu, Xianzhong Nie 외 · Engineering Applications of Artificial Intelligence · 2026-12 #건물성능</div><div class="g">스마트홈 자동화 모델이 변하는 사용자 습관에 적응하도록, 사용자 피드백으로 만든 소량 데이터로 사전학습 LSTM을 edge device에서 incremental fine-tuning하는 방법을 제안했다. Raspberry Pi 4B 실제 시스템에서 에어컨 F1 0.9401, 조명 F1 0.9430을 얻었고, 21일 연속 운영에서도 가장 높은 F1을 유지했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116501"><div><div class="t">15. <a href="https://doi.org/10.1016/j.engappai.2026.116501" target="_blank">CSSGNet: Co-salient space guidance based visual servoing network</a></div><div class="m">Weishuo Zhao, Guoyu Zuo, Jiyong Zhou 외 · Engineering Applications of Artificial Intelligence · 2026-12 #컴퓨터비전</div><div class="g">학습 기반 visual servoing의 상대자세 추정은 배경 간섭 때문에 일반화가 어렵다. co-saliency로 배경을 억제하고 Siamese Vision Transformer로 상대자세를 회귀하는 CSSGNet을 제안했다. 실제 환경 fine-tuning 없이 평균 병진 오차 약 0.87~0.90 mm, 회전 오차 0.0138 rad을 달성했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116510"><div><div class="t">16. <a href="https://doi.org/10.1016/j.engappai.2026.116510" target="_blank">Predict-then-optimize for automated guided vehicle opportunity recharging scheduling considering nonlinear charging time</a></div><div class="m">Mingze Li, Chenrui Qu, Kailing Li 외 · Engineering Applications of Artificial Intelligence · 2026-12 </div><div class="g">자동화 컨테이너 터미널에서 전기 AGV의 충전 시간은 비선형이고 충전기는 부족하다. Transformer로 충전 시간을 예측하고 ALNS·MILP·local search를 결합한 M-ALNS-LS로 기회충전 일정을 최적화하는 predict-then-optimize 프레임워크를 제안했다. 실데이터 실험에서 선형 가정 기준보다 실제 지연이 줄었다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116561"><div><div class="t">17. <a href="https://doi.org/10.1016/j.engappai.2026.116561" target="_blank">Road icing evolution prediction using joint visual and meteorological features with a deep learning time-series model</a></div><div class="m">Jiaqi Chen, Shuangcheng Li, Shujun Yu 외 · Engineering Applications of Artificial Intelligence · 2026-12 #컴퓨터비전</div><div class="g">노면 결빙 진행을 영상과 기상 특징으로 예측하는 2단계 모델이다. Mask2Former segmentation으로 건조·습윤·결빙 면적 비율의 시계열을 만들고, 기상 데이터와 함께 LSTM-Transformer로 48시간 결빙 비율을 예측했다. 7일 현장 실험에서 mIoU 93.3%, 결빙 시작 시점 일치율 0.83(허용 10~30분이면 0.87~0.91), 평균 오차 약 10분을 기록했다.</div></div></label>
