<h1>논문 선택 — 2026-11-13</h1>
<div class="sub">체크하고 아래 「보내기」를 누르면 DOI 목록이 채워진 메일 작성창이 뜹니다. <b>전송</b>하면 5분 안에 접수 확인 메일이 옵니다.</div>
<h2>신규 31편</h2><div class="sub">체크하면 전문을 받아 노트를 씁니다.</div>
<label><input type="checkbox" value="10.1016/j.aei.2026.105466"><div><div class="t">1. <a href="https://doi.org/10.1016/j.aei.2026.105466" target="_blank">Ontology-guided knowledge graph construction and question answering for knowledge services in urban lifeline resilience assessment</a></div><div class="m">Zhengyu Guo, Xin Xu, Qian Li 외 · Advanced Engineering Informatics · 2027-01 #구조점검</div><div class="g">도시 생명선(lifeline) 인프라의 회복력 평가 연구는 의미 체계가 서로 다르고 데이터가 이질적이어서 지식이 흩어져 있다. 평가 데이터·지표·절차·방법을 ontology로 형식화하고, 이질 데이터를 semantic mapping해 knowledge graph를 구축했다. 그 위에 질의응답과 평가 방법 추천을 하는 지식 서비스 prototype을 개발했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107340"><div><div class="t">2. <a href="https://doi.org/10.1016/j.autcon.2026.107340" target="_blank">Context-aware instance-level change interpretation across building information models and building energy models</a></div><div class="m">Zhichen Wang, Mario Bergés, Burcu Akinci · Automation in Construction · 2027-01 #BIM #건물성능</div><div class="g">BIM 설계가 바뀔 때마다 BEM(건물 에너지 모델)을 수작업으로 고쳐야 해서 지연과 오류가 생긴다. 공간 위치 같은 맥락 정보를 반영해 변경 해석을 열전달 경로 분석으로 재정의하고, knowledge graph 기반 pipeline으로 BEM 변경을 추론했다. 실제 사례로 검증했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107353"><div><div class="t">3. <a href="https://doi.org/10.1016/j.autcon.2026.107353" target="_blank">Staged human-in-the-loop UAV–SfM pipeline for delineating ponding-prone subsidence depressions on parking-lot pavements</a></div><div class="m">Zhengtao Xie, Zhentao Liu, Jiaming Liu 외 · Automation in Construction · 2027-01 #컴퓨터비전 #구조점검</div><div class="g">주차장 포장의 침하 웅덩이를 기존 도로 점검 지표로는 면적 단위로 구획하기 어렵다. UAV–SfM DEM에서 포장을 segmentation하고 월류 수위까지 depression filling을 해 웅덩이별 면적·깊이·체적을 산출했으며, 사람이 확인하는 관문을 두 단계 넣었다. 일본 주차장들에서 전문가 기준 대비 사이트 평균 IoU 0.639를 얻어 기존 baseline(최대 0.128)을 크게 앞섰고, 사람이 들이는 작업 시간은 사이트당 2분 미만이었다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107374"><div><div class="t">4. <a href="https://doi.org/10.1016/j.autcon.2026.107374" target="_blank">LLM-driven multi-agent decision support system for Fangcang shelter hospital deployment integrating BIM data and regulatory codes</a></div><div class="m">Guanying Huang, S. Thomas Ng, Long Chen 외 · Automation in Construction · 2027-01 #BIM</div><div class="g">방창(Fangcang) 임시병원 배치는 신속한 공간 개조와 법규 준수를 함께 요구하지만, 단일 LLM은 BIM 데이터와 법규를 정합시키지 못한다. 공간·법규 두 개의 knowledge graph를 바탕으로 에이전트 4개가 협업하는 LLM multi-agent 의사결정지원 시스템을 제안했다. 모든 지표와 난이도에서 93% 이상의 정확도로 단일 LLM baseline을 앞섰다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.cacaie.2026.100271"><div><div class="t">5. <a href="https://doi.org/10.1016/j.cacaie.2026.100271" target="_blank">Bridging meteorological and structural fingerprints for tropical cyclone warning: Multi-timescale response assessment</a></div><div class="m">Zi-Xuan Zeng, E. Deng, Yan-Ke Tan 외 · Computer-Aided Civil and Infrastructure Engineering · 2026-11 #구조점검</div><div class="g">태풍에 대한 구조물 응답 평가는 현장 계측 기반 점추정에 머물러 있고, 사례가 적어 불확실성을 정량화하지 못한다. 현장 모니터링 경로와 기상 예보 경로를 결합한 MFDP framework에 physics-informed tokenization, cross-tower attention, variational Bayesian last layer를 적용했다. 12–17시간 선행 예측에서 TabPFN이 가장 높은 Macro F1을 보였다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116663"><div><div class="t">6. <a href="https://doi.org/10.1016/j.engappai.2026.116663" target="_blank">Agentic artificial intelligence-driven autonomous reconfiguration for flexible production lines: A human–machine collaborative evolutionary framework toward Industry 5.0</a></div><div class="m">Molin Feng · Engineering Applications of Artificial Intelligence · 2027-01 #인간로봇</div><div class="g">유연 생산라인 재구성에서 전문가의 정성적 지식을 진화 최적화에 반영하기 어렵다. 전문가의 규칙·선호·평가를 정량 지침으로 바꾸는 Human–Machine Feedback Fusion Engine을 갖춘 Agentic AI framework HiLEA-R을 제안했다. 4개 Industry 5.0 시나리오 simulation에서 NSGA-II 등을 앞섰다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116672"><div><div class="t">7. <a href="https://doi.org/10.1016/j.engappai.2026.116672" target="_blank">A probabilistic framework for data-conditioned alkali–aggregate reaction modeling: Random fields, Kriging, and Voronoi surrogates</a></div><div class="m">M. Amin Hariri-Ardebili, Golsa Mahdavi · Engineering Applications of Artificial Intelligence · 2027-01 #구조점검</div><div class="g">콘크리트 구조물의 알칼리–골재 반응(AAR)을 불확실성과 공간 이질성까지 포함해 확률적으로 모델링하는 계층 framework를 제안했다. sigmoid 반응속도식을 3점 보정하고, random field·Kriging surrogate·Voronoi 분할로 데이터가 많은 경우부터 희소한 경우까지 대응하는 workflow를 구성했다. 댐 등 대형 구조물의 시간의존 신뢰성 평가와 보수 대책 검토에 쓸 수 있는 팽창 이력 ensemble을 생성한다.</div></div></label>
<label><input type="checkbox" value="10.1108/ecam-04-2026-0777"><div><div class="t">8. <a href="https://doi.org/10.1108/ecam-04-2026-0777" target="_blank">The application of Fourier series in forecasting construction project completion: a case study</a></div><div class="m">Bangun Marpaung, Wei Tong Chen, Ying-Hua Huang 외 · Engineering Construction &amp; Architectural Management · 2026-11-13 #진도관리</div><div class="g">과거 데이터가 부족한 상황에서 공정 진도의 주기성과 비선형성 때문에 준공 시점 예측이 어렵다. 주기 패턴은 Fourier Series로, 장기 추세는 Polynomial Regression으로 잡는 hybrid 모델 Optimum.FSPR을 개발했다. 주간 진도 데이터로 ARIMA·XGBoost 등과 성능을 비교했다(초록 일부 잘림).</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105453"><div><div class="t">9. <a href="https://doi.org/10.1016/j.aei.2026.105453" target="_blank">Physics-informed neural networks for form-finding of unilateral membrane structures</a></div><div class="m">Luigi Sibille, Sigrid Adriaenssens, Carlo Olivieri · Advanced Engineering Informatics · 2027-01 </div><div class="g">단방향(unilateral) 막구조의 형상 탐색(form-finding)을 FEM 대신 PINN으로 푼다. Airy 응력장 기반 막 평형 PDE의 잔차를 collocation point에서 최소화하고, Dirichlet 경계조건을 soft 방식과 hard 방식으로 각각 부과해 비교했다. hard 방식은 경계 오차를 줄여 대체로 더 정확했고, soft 방식은 구현이 단순하면서도 구조적으로 타당한 해를 냈다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105457"><div><div class="t">10. <a href="https://doi.org/10.1016/j.aei.2026.105457" target="_blank">Knowledge graph driven multi-agent reinforcement learning for operation-level human-robot collaborative assembly planning</a></div><div class="m">Jiajun Tian, Yu Guo, Shaohua Huang 외 · Advanced Engineering Informatics · 2027-01 #인간로봇 #안전행동</div><div class="g">복잡한 조립의 인간–로봇 협업 계획에 작업자 피로와 공정 제약을 작업(operation) 단위로 반영하는 framework가 부족하다. 조립 공정 knowledge graph로 action masking을 하고, 사람·로봇 두 agent를 event-triggered 비동기 protocol로 조율하는 multi-objective DQN(HiMo-DQN)을 제안했다. 피로를 고려한 작업 단위 협업 계획을 생성한다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105461"><div><div class="t">11. <a href="https://doi.org/10.1016/j.aei.2026.105461" target="_blank">Geometry-guided spatio-spectral attention operator for efficient flow field prediction</a></div><div class="m">Zelin Chou, Xiaowei Jin, Shujin Laima 외 · Advanced Engineering Informatics · 2027-01 </div><div class="g">경계가 불규칙한 형상 주변의 유동장을 빠르게 예측하는 surrogate 모델을 제안했다. SDF 기반으로 노드를 latent grid에 인코딩한 뒤, Fourier branch(전역 추세)·local CNN(국부 보정)·attention(원거리 상호작용)을 결합하고 물리 일관성 정규화를 더한 GeoSSAO operator를 만들었다. 4개 유동 benchmark에서 SOTA 정확도를 달성했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105463"><div><div class="t">12. <a href="https://doi.org/10.1016/j.aei.2026.105463" target="_blank">A conditional diffusion model-based framework for synergistic multi-physics performance design and its application to generative inverse design of additively manufactured building exterior walls</a></div><div class="m">Wenqiang Xu, Yu Li, Rui Xiao 외 · Advanced Engineering Informatics · 2027-01 #모듈러 #건물성능</div><div class="g">적층제조(3D printing)로 만드는 건물 외벽을 강도·단열 목표값에서 거꾸로 설계하는 문제를 다룬다. 16,000개 데이터셋으로 conditional diffusion을 학습하고, TTST super-resolution으로 출력 형상을 출력 가능한 수준으로 복원했다. 생성한 벽체는 FE 해석 기준 강도 오차 4.0% 미만, 단열 오차 0.02 이하였고, 실제 3D printing과 물리 시험으로 검증했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aej.2026.11.001"><div><div class="t">13. <a href="https://doi.org/10.1016/j.aej.2026.11.001" target="_blank">Mechanisms of phosphate treatments for cementitious materials under thermal and pressure gradients: Implications for subsurface applications</a></div><div class="m">Ren Wei, Xinyu Shi, Enrico Sassoni 외 · Alexandria Engineering Journal · 2026-12 </div><div class="g">지하 인프라(CCS·지열 정 밀봉)에 쓰는 시멘트를 인산염(DAP)으로 처리해 hydroxyapatite를 형성시킬 때, 고온과 압력 구배가 미치는 영향을 조사했다. 75°C와 진공 조건에서 w/c 비 5종의 시멘트 페이스트를 시험했다. 치밀한 페이스트(w/c ≤0.4)는 강도가 증가한 반면, 다공성 페이스트(w/c ≥0.6)는 칼슘 용출로 오히려 열화되어 &#x27;안전 운전 범위&#x27;를 제시했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107323"><div><div class="t">14. <a href="https://doi.org/10.1016/j.autcon.2026.107323" target="_blank">Automated end-to-end generation of residential flat layouts using a sustainable performance-conditioned diffusion model</a></div><div class="m">Wenli Liu, Zhaoji Wu, Xingyu Tao 외 · Automation in Construction · 2027-01 #건물성능</div><div class="g">기존 성능 기반 생성 설계는 생성한 뒤 평가하는 방식이라 비효율적이다. 평면 54,648개에 EUI 라벨을 붙이고 이를 energy depth map으로 인코딩해, multi-ControlNet과 LoRA fine-tuning을 적용한 SustainDiff diffusion 모델로 에너지 목표를 만족하는 주거 평면을 한 번에 생성했다. FID 17.11, 에너지 제어 단조성 87.40%를 달성했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107345"><div><div class="t">15. <a href="https://doi.org/10.1016/j.autcon.2026.107345" target="_blank">LLM-guided adaptive segmentation of tunnel linings from point clouds</a></div><div class="m">Xinghui Tao, Zehao Ye, Guangming Wang 외 · Automation in Construction · 2027-01 #구조점검 #컴퓨터비전</div><div class="g">전문가가 튜닝한 터널 라이닝 point cloud segmentation pipeline은 조건이 바뀌면 성능이 떨어진다. 라벨 없이 memory·state·knowledge를 활용해 LLM multi-agent가 파라미터를 적응시키는 R4Tun을 제안했다. 30개 subset에서 mIoU를 0.18에서 0.43–0.48로 높였고, 기준 조건에 가까운 subset에서는 0.784–0.796에 도달했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107372"><div><div class="t">16. <a href="https://doi.org/10.1016/j.autcon.2026.107372" target="_blank">Visual RAG for automated question answering over large-scale bridge inspection reports</a></div><div class="m">Chaemin Lee, Yangrok Choi, Jungsik Kong · Automation in Construction · 2027-01 #구조점검</div><div class="g">표 위주의 대용량 교량 정밀안전진단 보고서(PDF)에서 필요한 정보를 수작업으로 찾는 부담을 줄이는 연구다. layout-aware parsing, 장(chapter) 단위로 필터링하는 hybrid retrieval, 검색된 페이지 이미지를 함께 넣는 visual answer generation으로 RAG pipeline을 구성했다. 기본 RAG보다 정확도와 faithfulness가 유의하게 향상됐고, long-context 모델과는 성능이 비슷하면서 비용은 그 모델의 1/7.5–1/9.3 수준이었다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.enbuild.2026.118471"><div><div class="t">17. <a href="https://doi.org/10.1016/j.enbuild.2026.118471" target="_blank">Optimization of building performance and embodied carbon for a building envelope with steel modular integrated construction</a></div><div class="m">Miaomiao Hou, Peiying Huang, Qiong Wang 외 · Energy and Buildings · 2026-11 #모듈러 #건물성능</div><div class="g">강재 모듈러(MiC) 학교 건물의 외피를 현장 계측으로 보정한 모델로 다목적 최적화했다. 운송·시공, 에너지, 채광, 결로, 내재 탄소, 비용을 함께 고려했다. 에너지 5.21%, 탄소 2.98%를 절감하고 결로 위험을 51.11% 줄였으며, 강재 접합부의 결로 위험은 4.9배 높아 접합부 단열이 필요함을 보였다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116654"><div><div class="t">18. <a href="https://doi.org/10.1016/j.engappai.2026.116654" target="_blank">RoomCurator: Unified generation, editing, and recommendation for structured three-dimensional room layouts</a></div><div class="m">Haeun Noh, Mingyu Lee, Taehoon Kim 외 · Engineering Applications of Artificial Intelligence · 2027-01 #디지털트윈</div><div class="g">기존 3D 실내 배치 생성 모델은 가구가 경계를 벗어나거나 서로 겹치는 비현실적 결과를 낸다. 가구 간 상대 거리·방향을 graph로 모델링하는 STAR-Net과 제약 최적화를 결합해 생성·편집·추천을 하나로 묶은 RoomCurator를 제안했다. 경계 이탈 0을 보장하고, 실시간 추론으로 대화형 실내 설계를 지원한다.</div></div></label>
