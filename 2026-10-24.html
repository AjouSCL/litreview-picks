main{max-width:820px;margin:0 auto;padding:16px 16px 110px}h1{font-size:19px;margin:8px 0 2px}.sub{color:var(--mute);font-size:13px;margin-bottom:14px}

<h1>논문 선택 — 2026-10-24</h1>
<div class="sub">체크하고 아래 「보내기」를 누르면 DOI 목록이 채워진 메일 작성창이 뜹니다. <b>전송</b>하면 5분 안에 접수 확인 메일이 옵니다.</div>
<h2>신규 11편</h2><div class="sub">체크하면 전문을 받아 노트를 씁니다.</div>
<label><input type="checkbox" value="10.1016/j.aei.2026.105382"><div><div class="t">1. <a href="https://doi.org/10.1016/j.aei.2026.105382" target="_blank">An Integrated Machine Learning and Case-Based Reasoning Framework for Manufacturing Time Estimation of Multi-Family Engineer-To-Order Products</a></div><div class="m">Le Vi Nhan Tam Tran, Abdourahim Sylla, Bruno Agard · Advanced Engineering Informatics · 2027-01 </div><div class="g">Engineer-To-Order(ETO) 제품은 사양이 제각각이라 제조시간을 견적하는 데 엔지니어의 경험과 부담이 크다. Rule-Based Learning 또는 ANN으로 제품군을 자동 식별하고, 제품군별로 case base를 구조화한 뒤 KD-Tree로 검색 범위를 줄인 Case-Based Reasoning(CBR)을 결합해 견적을 전 과정 자동화했다. 프랑스 금속가공 업체의 실제 데이터로 검증했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105391"><div><div class="t">2. <a href="https://doi.org/10.1016/j.aei.2026.105391" target="_blank">Can small language models be trusted for aviation safety analysis? A benchmark study across model sizes using real-world incident narratives</a></div><div class="m">Gaurab Chhetri, Subasish Das · Advanced Engineering Informatics · 2027-01 #안전행동</div><div class="g">로컬에 배포할 수 있는 3B~14B 규모의 open-weight small language model 6종이 항공 안전 사고 서술문을 얼마나 믿을 만하게 분석하는지 벤치마크했다. ASN 사고 서술문 630건으로 ICAO 사고 유형을 zero-shot으로 분류하고, 일부 정보를 가린 8,543건으로 사망·기체 파손 여부를 예측했으며 ablation, 일관성 점검, 지도학습 NLP baseline과의 비교를 함께 수행했다. 성능은 과업과 모델 계열에 따라 크게 달랐다. 사고 보고서 텍스트 분석에 참고할 만하다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116576"><div><div class="t">3. <a href="https://doi.org/10.1016/j.engappai.2026.116576" target="_blank">An adaptive selector-based deep learning model for multi-source feature fusion in multi-step wind power cluster forecasting</a></div><div class="m">Maolin He, Jujie Wang, Weiyi Jiang 외 · Engineering Applications of Artificial Intelligence · 2026-12 </div><div class="g">풍력발전 단지군의 출력은 간헐적이고 시공간 패턴이 복잡해 여러 시점 앞을 예측하기 어렵다. 데이터 출처마다 별도의 neural branch를 두고 channel-wise network와 multi-head attention으로 발전단지별 시간 의존성을 모델링했으며, adaptive selector가 예측 시점에 따라 출처별 fusion 가중치를 조정한다. ablation에서 MAE가 크게 줄었다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116582"><div><div class="t">4. <a href="https://doi.org/10.1016/j.engappai.2026.116582" target="_blank">Sensitivity-driven chance-constrained model predictive control for collision avoidance of unmanned aerial vehicles in dynamic environments</a></div><div class="m">Meiyan Wang, Jinliang Liu, Lijuan Zha 외 · Engineering Applications of Artificial Intelligence · 2026-12 </div><div class="g">불확실하고 동적인 환경에서 UAV가 장애물을 안전하게 피하려면 움직이는 장애물의 형상과 여러 불확실성을 반영한 확률적 제약이 필요하다. Gaussian process로 장애물 궤적을 예측하고, MINVO enclosure와 state–parameter sensitivity 기반 공분산 전파를 써서 chance-constrained MPC(SD-CCMPC)를 구성했다. 현장 점검용 드론의 경로 안전성 확보에 참고할 수 있다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116595"><div><div class="t">5. <a href="https://doi.org/10.1016/j.engappai.2026.116595" target="_blank">Vision-based column dimension measurement framework robust to shooting angle under lightweight calibration</a></div><div class="m">Zhisen Tan, Ka-Veng Yuen, Rumian Zhong 외 · Engineering Applications of Artificial Intelligence · 2026-12 #컴퓨터비전 #진도관리</div><div class="g">기존 비전 기반 기둥 치수 측정은 촬영 각도가 극단적이면 정확도가 떨어진다. Segment Anything Model(SAM) 기반 corner localization으로 subpixel 좌표를 추출하고, 좌표 변환 측정과 간단한 기준물만 쓰는 lightweight calibration을 결합했다. corner localization에서 RMSE를 평균 50.57%, 좌표 변환으로 전체 83.6% 줄였고, calibration 오차는 yaw 0.142°, 거리 2.91 mm였다.</div></div></label>
<label><input type="checkbox" value="10.1061/jcemd4.coeng-18895"><div><div class="t">6. <a href="https://doi.org/10.1061/jcemd4.coeng-18895" target="_blank">Connected Conversations: Mapping the Psychosocial Wellbeing Topic Network in Construction’s Social Media Discourse</a></div><div class="m">Emmanuel B. Boateng, Samuel Frimpong, Riza Yosia Sunindijo 외 · Journal of Construction Engineering and Management · 2027-01-01 #안전행동</div><div class="g">건설 작업자의 스트레스·우울·자살 등 심리사회적 웰빙 문제가 실제로 어떻게 논의되는지 보려고 X·YouTube·Reddit 댓글 2,368건(2015~2022)을 structural topic modeling으로 분석했다. 주제는 작업 특성(33.8%), 산업 문화(22.6%), 정신건강 결과(16.6%), 개입(15.5%), 정신건강 리터러시(11.5%) 다섯 가지로 나뉘었다. 시간이 지나며 문제 중심 담론은 유의하게 줄고(p&lt;0.01) 해결 중심 담론이 늘었다.</div></div></label>
<label><input type="checkbox" value="10.1061/jmenea.meeng-7604"><div><div class="t">7. <a href="https://doi.org/10.1061/jmenea.meeng-7604" target="_blank">Evolutionary Dynamics of Cross-Regional Cooperation Networks in Construction Projects: Case of the Guangdong–Hong Kong–Macao Greater Bay Area</a></div><div class="m">Xiangping Zhang, Geoffrey Qiping Shen, Jason Xin Zhou 외 · Journal of Management in Engineering · 2027-01-01 </div><div class="g">제도가 서로 다른 Guangdong–Hong Kong–Macao 대만구에서 2000~2024년 건설 프로젝트 협력 네트워크가 어떻게 변해 왔는지 분석했다. 프로젝트 조직 218곳의 발주자–공급자 계약 관계를 two-mode social network analysis와 ERGM으로 모델링했다. 네트워크는 분산기, 정책 주도 확장기, COVID-19 시기의 일시적 재집중을 거쳐 균형 잡힌 혼합 구조로 바뀌었다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107321"><div><div class="t">8. <a href="https://doi.org/10.1016/j.autcon.2026.107321" target="_blank">Deep learning for denoising 3D sonar point clouds in underwater scour investigation and infrastructure inspection</a></div><div class="m">Zelin Huang, Luyao Sun, Yanjie Zhu 외 · Automation in Construction · 2027-01 #구조점검 #컴퓨터비전</div><div class="g">교량 세굴을 점검하는 3D 수중 sonar point cloud는 수중 환경과 선박 탑재 장비 때문에 노이즈가 심하다. outlier 제거, 표면 인근 fuzzy noise 억제, inverse manifold reconstruction 기반 밀도 복원의 3단계로 구성되고 supervised/unsupervised 모드를 오갈 수 있는 SIREND-Net을 제안했으며, 현장 실측 데이터셋 USPCDenoise도 구축했다. baseline 10종보다 정확도, 일반화, 효율이 모두 높았다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.cacaie.2026.100256"><div><div class="t">9. <a href="https://doi.org/10.1016/j.cacaie.2026.100256" target="_blank">Damage-TriageFormer: A foundation-model framework for typology-based building damage assessment from mono-temporal imagery</a></div><div class="m">Yiming Xiao, Yu-Hsuan Ho, Sanjay Thasma 외 · Computer-Aided Civil and Infrastructure Engineering · 2026-10 #컴퓨터비전 #구조점검</div><div class="g">재난 후 건물 피해 평가는 대개 단일 심각도 등급에 머물거나 재난 전후 영상 쌍이 있어야 한다. 재난 후 영상 한 장과 건물 footprint만으로 지붕/구조, 부분/전체 피해를 구분하는 5종 typology를 예측하는 Damage-TriageFormer(DINOv3 ViT-L backbone과 2단계 gated head)를 제안하고, 허리케인 2건과 LA 산불 영상으로 DamageTriage-Bench를 만들었다. macro F1은 validation 0.662, test 0.620이었다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116502"><div><div class="t">10. <a href="https://doi.org/10.1016/j.engappai.2026.116502" target="_blank">Mechanics-audited stateful operators for path-dependent finite-element digital twins</a></div><div class="m">Honghong Wang, Yong Zhu · Engineering Applications of Artificial Intelligence · 2026-12 #디지털트윈</div><div class="g">경로 의존적 소성 거동을 다루는 유한요소 digital twin은 변위뿐 아니라 숨은 소성 상태와 평형까지 맞게 예측해야 한다. 절점과 적분점에 recurrent state를 둔 graph operator를 만들고, assembled residual, 에너지, 구성식 오차를 학습 regularization에 넣었다. data-only 모델보다 residual ratio를 4.102에서 2.142로 낮췄지만, active-state 증분 오차는 0.651에서 0.702로 약간 커졌다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116541"><div><div class="t">11. <a href="https://doi.org/10.1016/j.engappai.2026.116541" target="_blank">Cross-scale Mamba with structural guidance for pavement crack segmentation</a></div><div class="m">Dexiang Li, Haijun Zhang, Yuzhu Ji 외 · Engineering Applications of Artificial Intelligence · 2026-12 #컴퓨터비전 #구조점검</div><div class="g">고속 차량 탑재 촬영에서는 배경 간섭이 많아 포장 균열이 끊겨 segmentation되는 문제가 있다. dual-scale 2D selective-scan과 structural gating 기반 cross-scale feature aggregation을 갖춘 경량 cross-scale Mamba 네트워크를 제안했다. 실제 고속도로 장면을 반영한 데이터셋으로 복잡한 환경에서도 균열을 견고하게 segmentation함을 보였다.</div></div></label>
</main>
<div class="bar"><div><span class="n"><b id="n">0</b>편 선택</span>
<button id="gm" disabled>Gmail로 보내기</button><button id="ap" class="alt" disabled>메일 앱으로 보내기</button>
<span id="msg">작성창이 열렸으면 <b>전송</b>을 눌러야 접수됩니다. 5분 안에 「접수」 확인 메일이 옵니다. 안 오면 다른 버튼으로 다시 보내세요.</span></div></div>
<script>
const TO="bjchoi13@gmail.com", ME="bchoi@ajou.ac.kr", KEY="2026-10-24", K="picks-"+KEY, OLD=false;
const boxes=[...document.querySelectorAll("input")], gm=document.getElementById("gm"), ap=document.getElementById("ap");
try{const s=JSON.parse(localStorage.getItem(K)||"[]");boxes.forEach(b=>b.checked=s.includes(b.value))}catch(e){}
const sel=()=>boxes.filter(b=>b.checked).map(b=>b.value);
function upd(){const d=sel();document.getElementById("n").textContent=d.length;
  gm.disabled=ap.disabled=!d.length&&!OLD;   // 검토 칸이 있으면 0편도 보낼 수 있다(전부 지움)
  try{localStorage.setItem(K,JSON.stringify(d))}catch(e){}}
boxes.forEach(b=>b.addEventListener("change",upd));upd();
const su=()=>"[논문선택] "+KEY+" "+sel().length+"편", body=()=>sel().join("\n")+"\n", q=encodeURIComponent;
const done=()=>document.getElementById("msg").style.display="block";
// 폰에서는 Gmail 웹 작성창 주소가 앱·받은편지함으로 넘어가며 내용을 잃는다(2026-09-27 실측). 메일 앱을 주 버튼으로.
if(matchMedia("(pointer:coarse)").matches){gm.className="alt";ap.className="";gm.parentNode.insertBefore(ap,gm)}
gm.onclick=()=>{done();window.open("https://mail.google.com/mail/?authuser="+q(ME)+"&view=cm&fs=1&to="+q(TO)+"&su="+q(su())+"&body="+q(body()),"_blank")};
ap.onclick=()=>{done();location.href="mailto:"+TO+"?subject="+q(su())+"&body="+q(body())};
</script></body></html>
