<h1>논문 선택 — 2026-10-08</h1>
<div class="sub">체크하고 아래 「보내기」를 누르면 DOI 목록이 채워진 메일 작성창이 뜹니다. <b>전송</b>하면 5분 안에 접수 확인 메일이 옵니다.</div>
<h2>신규 11편</h2><div class="sub">체크하면 전문을 받아 노트를 씁니다.</div>
<label><input type="checkbox" value="10.1016/j.aei.2026.105304"><div><div class="t">1. <a href="https://doi.org/10.1016/j.aei.2026.105304" target="_blank">Data-mechanism fusion-based threshold-free operational reliability assessment integrating stochastic degradation process theory with deep learning</a></div><div class="m">Jinjin Xu, Jiahui Cao, Wenxin Zhang · Advanced Engineering Informatics · 2027-01 </div><div class="g">복잡한 전기기계 설비의 운용 신뢰성을 평가할 때 고장 샘플이 부족하고 고장 임계값을 보정하기 어렵다는 문제를 다룬다. 확률적 열화 과정 이론에 LSTM-Attention-Mixture Network(RLAM-Net)를 결합해, 임계값을 따로 보정하지 않고도 동적으로 신뢰성을 평가하는 방법을 제안했다. 비균질 Gamma 열화 시뮬레이션과 풍력 터빈 기어박스로 고장확률을 평가해 검증했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.enbuild.2026.118367"><div><div class="t">2. <a href="https://doi.org/10.1016/j.enbuild.2026.118367" target="_blank">Low-carbon technological innovation diffusion among prefabricated component enterprises: Evolutionary dynamics in weighted networks</a></div><div class="m">Qiang Du, Yaru Ma, Youdan Huang 외 · Energy and Buildings · 2026-10 #모듈러</div><div class="g">프리캐스트 부재(PC) 기업 사이에 저탄소 기술혁신이 어떻게 확산되는지를 다룬다. 기업 간 상호작용 강도가 서로 다르다는 점을 반영한 가중 네트워크 진화게임 모델을 만들고, 네트워크 구조·기술 요인·정책 수단의 효과를 시뮬레이션했다. 가중 네트워크는 국지적 혁신 클러스터를 만들어 확산을 안정시켰고, 여건이 불리할 때는 단일 정책으로는 부족해 정책을 조합해야 했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.jobe.2026.117494"><div><div class="t">3. <a href="https://doi.org/10.1016/j.jobe.2026.117494" target="_blank">A Semi-automatic Performance-Based Assessment Approach for Building Fire Safety Design Driven by Ontology and Knowledge Graph</a></div><div class="m">Yu Chen, Liu Jiang, Xianghui Zeng 외 · Journal of Building Engineering · 2026-10 #BIM #건물성능</div><div class="g">성능 기반 화재안전설계(PBFD)에서 BIM·FDS·Pathfinder·ASET/RSET 결과가 따로 저장돼 근거를 추적하기 어렵다는 문제를 다룬다. PBFD ontology와 knowledge graph로 시나리오 변수, 시뮬레이션 근거, 평가 결론을 의미적으로 연결하는 반자동 평가 프레임워크를 제안했다. 피난 경로의 핵심 지점에서 ASET/RSET 여유를 계산해 국지적 피난 위험을 찾아내고, 평가 결과를 모니터·임계값·피난자 단위까지 거슬러 추적할 수 있게 했다.</div></div></label>
<label><input type="checkbox" value="10.1061/jccee5.cpeng-6893"><div><div class="t">4. <a href="https://doi.org/10.1061/jccee5.cpeng-6893" target="_blank">Reliability Analysis of Unsaturated Soil Slopes Using Advanced Surrogate Models: A Comparative Study of PCE-MCS, K-MCS, and Gradient-Based Methods</a></div><div class="m">Kenue Abdul Waris, B. Munwar Basha · Journal of Computing in Civil Engineering · 2027-01-01 </div><div class="g">불포화 토사 사면의 확률적 안정성을 해석할 때 crude MCS는 계산 비용이 크고, FORM/SORM은 비선형 문제에 약하다는 한계를 다룬다. surrogate 기반 기법인 PCE-MCS와 K-MCS를 FORM·SORM과 함께 crude MCS 기준으로 비교해 파괴확률(pf) 추정의 정확도와 효율을 평가했다. 매개변수 연구에서 pf는 변수의 평균과 변동계수에 따라 비선형으로 변했다.</div></div></label>
<label><input type="checkbox" value="10.1061/jccee5.cpeng-7756"><div><div class="t">5. <a href="https://doi.org/10.1061/jccee5.cpeng-7756" target="_blank">Contour Feature-Driven Deep Learning Method for Arch Dam Point Cloud Registration</a></div><div class="m">Yijing Li, Jihao Fan, Huokun Li 외 · Journal of Computing in Civil Engineering · 2027-01-01 #컴퓨터비전 #구조점검</div><div class="g">아치댐 point cloud는 인공 구조물인 댐체와 불규칙한 기반암으로 이뤄져 정합 정확도가 떨어진다는 문제를 다룬다. transformer와 협업 clustering으로 댐체와 암반의 윤곽을 따로 추출하고, 점 사이의 위치관계에서 12차원 특징을 계산해 deep learning 정합에 넣었다. 이를 통해 MLP가 차원을 줄일 때 생기는 정보 손실과 그로 인한 국부 어긋남·전역 편차를 줄였다.</div></div></label>
<label><input type="checkbox" value="10.1061/jmenea.meeng-7659"><div><div class="t">6. <a href="https://doi.org/10.1061/jmenea.meeng-7659" target="_blank">From Automation to Coevolution: A Systematic Review of Human–AI Interaction Hierarchies and Professional Implications in the Construction Industry</a></div><div class="m">Maruoyan Shi, Mingxuan Liang, Bon-Gang Hwang · Journal of Management in Engineering · 2027-01-01 #인간로봇</div><div class="g">건설 분야의 인간–AI 상호작용 수준과 그에 따라 요구되는 전문역량을 체계화한 리뷰다. PRISMA 방식으로 2016–2025년 문헌 57편을 계량서지·주제 분석했다. 그 결과 AI 자동화–AI 보조–AI·인간 협응–적응적 공진화의 4계층 프레임워크와 계층별 역량 요구를 제시했다.</div></div></label>
<label><input type="checkbox" value="10.1061/jmenea.meeng-7669"><div><div class="t">7. <a href="https://doi.org/10.1061/jmenea.meeng-7669" target="_blank">Digital Backbone of Collaborative Project Delivery: Mapping Organizational Pathways to Common Data Environment Adoption</a></div><div class="m">Hanjing Zhu, Bon-Gang Hwang, Jia Chen Kueh · Journal of Management in Engineering · 2027-01-01 #BIM</div><div class="g">협업형 프로젝트 발주에서 공통데이터환경(CDE) 도입이 조직마다 파편적으로 이뤄지는 문제를 다룬다. 문헌 리뷰와 전문가 인터뷰로 도전요인 14개, 전략 19개, 핵심성공요인(CSF) 14개를 도출하고, 설문을 fuzzy 종합평가와 비모수 검정으로 분석했다. 재정·인적 요인이 가장 큰 도전이었고, 제도적 정책이 가장 효과적인 전략으로 꼽혔으며, 연결성·통합 관련 CSF가 우선시됐다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105311"><div><div class="t">8. <a href="https://doi.org/10.1016/j.aei.2026.105311" target="_blank">TE-SDNet: Temporally Enhanced Sequential Dependency Network for photovoltaic power forecasting</a></div><div class="m">Jie Zhang, Jing Wang, Shilong Ye 외 · Advanced Engineering Informatics · 2027-01 </div><div class="g">태양광(PV) 발전량은 변동성과 주기성이 강하고 환경 요인이 복잡해 기존 모델로는 단기 예측이 부정확하다는 문제를 다룬다. 시간·특징 분리 블록(TFD), 주파수 영역 기반 다중스케일 시간 혼합 블록(MTM), 변수 간 의존성 학습 블록(IDL)으로 이뤄진 TE-SDNet을 제안했다. 초록이 잘려 있어 정량 성능은 확인하지 못했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105339"><div><div class="t">9. <a href="https://doi.org/10.1016/j.aei.2026.105339" target="_blank">Latent space optimization for geometrically nonlinear topology via a condition-performance generative model</a></div><div class="m">Wei Cong, Bingxiao Du, Ikjin Lee 외 · Advanced Engineering Informatics · 2027-01 </div><div class="g">기하 비선형 조건의 위상최적화는 계산 비용이 크고 설계공간의 차원이 높다는 문제를 다룬다. condition-performance VAE(CP-VAE)로 구조 형상·조건·비선형 성능을 연속 latent 공간에 함께 학습해 두고, 온라인 단계에서 이 latent 공간을 최적화하는 2단계 LSO 프레임워크를 제안했다. 2D 벤치마크와 예비 3D 비선형 사례로 검증했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.buildenv.2026.115375"><div><div class="t">10. <a href="https://doi.org/10.1016/j.buildenv.2026.115375" target="_blank">A Digital Twin-enabled Adaptive Optimization Framework for Balancing Holistic Comfort and Energy Efficiency in Underground Spaces</a></div><div class="m">Zijian Ye, Tianlong Liang, Yu Chen · Building and Environment · 2026-10 #디지털트윈 #건물성능</div><div class="g">지하철 등 지하공간에서 승객 쾌적성과 에너지 소비를 함께 맞추기 어렵다는 문제를 다룬다. 열·음·빛 분산 센서, 설문, 유동 데이터, machine learning(SHAP)을 결합한 digital twin 기반 적응형 최적화 프레임워크와 4단계 조기경보 메커니즘을 구축했다. 여름철 대합실 불쾌 비율이 20.4%에서 3.1%로 줄었고, 연간 에너지와 탄소배출은 각각 15.25%, 15.32% 감소했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.ssci.2026.107501"><div><div class="t">11. <a href="https://doi.org/10.1016/j.ssci.2026.107501" target="_blank">The shape of severe workplace injuries: A topological analysis of ten years of OSHA severe-injury reports</a></div><div class="m">Michael Myung Jeong, Younghan Edwin Jung · Safety Science · 2027-02 #안전행동</div><div class="g">중대재해 보고가 이산 분류코드로만 정리돼 사고의 기제가 가려진다는 문제를 다룬다. 2015–2025년 OSHA 중대재해 보고 103,750건의 서술문에 topological data analysis를 적용했다. 사고 서술은 &#x27;기계–절단&#x27;과 &#x27;추락–골절&#x27; 두 영역을 잇는 연속적인 기제–결과 축을 이뤘고, 위험 패턴은 지역보다 산업별로 구분됐다.</div></div></label>
</main>

<button id="gm" disabled>Gmail로 보내기</button><button id="ap" class="alt" disabled>메일 앱으로 보내기</button>
<span id="msg">작성창이 열렸으면 <b>전송</b>을 눌러야 접수됩니다. 5분 안에 「접수」 확인 메일이 옵니다. 안 오면 다른 버튼으로 다시 보내세요.</span></div></div>
<script>
const TO="bjchoi13@gmail.com", ME="bchoi@ajou.ac.kr", KEY="2026-10-08", K="picks-"+KEY, OLD=false;
const boxes=[...document.querySelectorAll("input")], gm=document.getElementById("gm"), ap=document.getElementById("ap");
try{const s=JSON.parse(localStorage.getItem(K)||"[]");boxes.forEach(b=>b.checked=s.includes(b.value))}catch(e){}
const sel=()=>boxes.filter(b=>b.checked).map(b=>b.value);
function upd(){const d=sel();document.getElementById("n").textContent=d.length;
  gm.disabled=ap.disabled=!d.length&&!OLD;   // 검토 칸이 있으면 0편도 보낼 수 있다(전부 지움)
  try{localStorage.setItem(K,JSON.stringify(d))}catch(e){}}
boxes.forEach(b=>b.addEventListener("change",upd));upd();
const su=()=>"[논문선택] "+KEY+" "+sel().length+"편", body=()=>sel().join("\n")+"\n", q=encodeURIComponent;
const done=()=>document.getElementById("msg").style.display="block";
// 폰에서는 Gmail 웹 작성창 주소가 앱·받은편지함으로 넘어가며 내용을 잃는다(2026-09-27 실측). 메일 앱을 주 버튼으로.
if(matchMedia("(pointer:coarse)").matches){gm.className="alt";ap.className="";gm.parentNode.insertBefore(ap,gm)}
gm.onclick=()=>{done();window.open("https://mail.google.com/mail/?authuser="+q(ME)+"&view=cm&fs=1&to="+q(TO)+"&su="+q(su())+"&body="+q(body()),"_blank")};
ap.onclick=()=>{done();location.href="mailto:"+TO+"?subject="+q(su())+"&body="+q(body())};
</script></body></html>
