<label><input type="checkbox" value="10.1016/j.aei.2026.105333"><div><div class="t">2. <a href="https://doi.org/10.1016/j.aei.2026.105333" target="_blank">Interpretable structure-aware perception for local docking of mobile Rebar-Tying robots in precast manufacturing</a></div><div class="m">Feng Zhang, Lu Deng, Cheng Zhang 외 · Advanced Engineering Informatics · 2027-01 #컴퓨터비전 #모듈러 #인간로봇</div><div class="g">프리캐스트 공장에서 이동식 철근 결속 로봇이 반복적이고 텍스처가 없는 철근망 앞에 정밀하게 도킹하지 못하는 문제(perceptual aliasing)를 다룬다. RGB-D에서 deep learning으로 교차점을 검출해 구조 primitive를 뽑고, 공면성·직교성·커버리지를 결합한 Structure-Congruence RANSAC으로 자세를 추정했다. 실제 프리캐스트 공장 시험에서 마커 없이 허용오차 수준의 로컬 도킹을 달성했다.</div></div></label>

<label><input type="checkbox" value="10.1016/j.aei.2026.105309"><div><div class="t">7. <a href="https://doi.org/10.1016/j.aei.2026.105309" target="_blank">Spectral knowledge encoding and spatial anomaly localisation for interpretable power transformer fault detection</a></div><div class="m">Jiayu Duan, Yao Yuan, Song Wang 외 · Advanced Engineering Informatics · 2027-01 #구조점검</div><div class="g">운전 중인 전력 변압기를 진동으로 고장 진단할 때 운전 조건이 바뀌고, 고장 라벨이 부족하고, 해석 가능성이 필요하다는 문제를 다룬다. 스펙트럼 지식을 raster 이미지로 바꿔 ResNet18로 분류하는 지도학습 SpecRas와, 정상 데이터만으로 이상을 탐지하는 HetSpatVAE를 제안했다. 변전소 3곳, 변압기 19대의 진동 구간 4,499개로 평가했고, 변압기 단위 balanced accuracy와 macro-F1은 모두 0.861이었다.</div></div></label>

boxes.forEach(b=>b.addEventListener("change",upd));upd();
const su=()=>"[논문선택] "+KEY+" "+sel().length+"편", body=()=>sel().join("\n")+"\n", q=encodeURIComponent;
