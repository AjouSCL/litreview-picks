<h1>논문 선택 — 2026-11-02</h1>
<div class="sub">체크하고 아래 「보내기」를 누르면 DOI 목록이 채워진 메일 작성창이 뜹니다. <b>전송</b>하면 5분 안에 접수 확인 메일이 옵니다.</div>
<h2>신규 36편</h2><div class="sub">체크하면 전문을 받아 노트를 씁니다.</div>
<label><input type="checkbox" value="10.1016/j.aei.2026.105446"><div><div class="t">1. <a href="https://doi.org/10.1016/j.aei.2026.105446" target="_blank">Toward cognitive design intelligence: a mixed-methods systematic review and an evidence-informed representation-reasoning-synthesis framework for complex product design in the era of foundation models</a></div><div class="m">Zhi Li, Fengyun Fan, Amirhossein Nafei 외 · Advanced Engineering Informatics · 2027-01 </div><div class="g">foundation model 시대에 복합 제품 설계(CPD)에 AI가 어떻게 쓰이는지 정리한 체계적 문헌고찰이다. 2022~2026년 논문 120편을 bibliometric 분석과 근거 코딩으로 합성해 Representation-Reasoning-Synthesis(R-R-S) 프레임워크를 제안했다. 설계 지식 표현, 추론, 대안 생성을 하나로 묶어 설명하는 틀이다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116628"><div><div class="t">2. <a href="https://doi.org/10.1016/j.engappai.2026.116628" target="_blank">A condition-aware adaptive physics-informed residual network for chiller energy consumption modeling</a></div><div class="m">Honggang Li, Yi Yan, Wei Peng 외 · Engineering Applications of Artificial Intelligence · 2026-12 #건물성능</div><div class="g">운전 조건이 바뀌거나 데이터가 적을 때 chiller 에너지 소비 예측이 잘 일반화되지 않는 문제를 다룬다. 1D ResNet backbone에 Stoecker 반경험식을 physics prior로 넣고, fuzzy neural network가 조건에 따라 데이터 loss와 물리 loss의 가중치를 조정하는 CAA-PIResNet을 제안했다. 예측 정확도, 노이즈 강건성, 데이터 효율, 일반화 성능에서 기존 모델보다 나았다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105407"><div><div class="t">3. <a href="https://doi.org/10.1016/j.aei.2026.105407" target="_blank">Cognitive emulation for cross-domain anomaly diagnosis: A collaborative multi-LLM framework with few-shot generalization</a></div><div class="m">Qi Zhang, Xiao Yu, Shuaiwen Cui 외 · Advanced Engineering Informatics · 2027-01 #구조점검</div><div class="g">라벨이 적을 때 쓸 수 있는 산업 이상 진단을 위해 vision-language agent 여러 개가 협업하는 multi-LLM 프레임워크를 제안했다. 진단을 Observe–Retrieve–Contrast–Arbitrate 과정으로 나누고, 소수의 라벨 샘플로 3계층 Diagnostic Memory를 구축한다. 5-shot 조건에서 교량 센서 고장 진단 Accuracy는 91.77%로, Random Forest보다 4.04%p 높았다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105408"><div><div class="t">4. <a href="https://doi.org/10.1016/j.aei.2026.105408" target="_blank">An agent-network approach for resilience evaluation of unmanned autonomous swarm considering bilateral interaction</a></div><div class="m">Tianwen Zhang, Guanghan Bai, Jia Wang 외 · Advanced Engineering Informatics · 2027-01 </div><div class="g">무인 자율 군집에서 군집 행동과 통신 네트워크가 서로 영향을 주고받는 양방향 관계를 반영한 agent-network 공진화 모델을 만들었다. 실제 시공간 성능 궤적을 바탕으로, 궤적 일관성을 고려한 resilience 평가법을 제안했다. 합동 정찰 임무에 적용해 검증했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105432"><div><div class="t">5. <a href="https://doi.org/10.1016/j.aei.2026.105432" target="_blank">Denoising and boundary guidance for Multi-Scale feature learning for transmission line defect detection in aerial inspection</a></div><div class="m">Zhiyuan Hao, Chaoyi Dong, Zuocang Ma 외 · Advanced Engineering Informatics · 2027-01 #컴퓨터비전 #구조점검</div><div class="g">UAV 송전선 점검 영상에서 크기와 형태가 제각각인 결함을 검출하기 위해 Denoising MSE Dynamic R-CNN을 제안했다. FPN 융합 단계의 노이즈 억제, multi-scale edge 강화, boundary-guided residual refinement를 결합했다. 자체 데이터셋에서 AP50:95 63.5%를 기록했고, 세 데이터셋 모두에서 성능이 올랐다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107347"><div><div class="t">6. <a href="https://doi.org/10.1016/j.autcon.2026.107347" target="_blank">Video temporal grounding of equipment actions for construction site monitoring using a hierarchical vision-language model</a></div><div class="m">Gilsu Jeong · Automation in Construction · 2027-01 #컴퓨터비전 #진도관리</div><div class="g">자르지 않은 현장 영상에서 자연어 질의로 특정 건설장비 동작이 일어난 구간을 찾는 video temporal grounding(VTG) 문제를 정의했다. 첫 건설 분야 벤치마크인 ConVTG를 구축하고, 계층적 vision-language 모델 ConGround-DETR을 제안했다. R@0.5 81.93%로 범용 baseline보다 높았다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.cacaie.2026.100263"><div><div class="t">7. <a href="https://doi.org/10.1016/j.cacaie.2026.100263" target="_blank">GM-TRIAD: Conditional Three-Channel Ground-Motion Generation with Native-Resolution Cascade Diffusion</a></div><div class="m">Ziyu Wang, Yang Chen, Yiqiu Lu · Computer-Aided Civil and Infrastructure Engineering · 2026-10 </div><div class="g">비선형 시간이력해석에 쓸 지진동 기록이 시나리오별로 부족한 문제를 다룬다. 대역별 VAE와 low–mid–high diffusion cascade를 결합한 GM-TRIAD로, 시나리오와 응답스펙트럼을 조건으로 3성분 지진동을 생성했다. 설계스펙트럼 조합 1,245개 중 1,188개가 suite 평균 95~105% 기준을 충족했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116588"><div><div class="t">8. <a href="https://doi.org/10.1016/j.engappai.2026.116588" target="_blank">Optimization of inverter efficiency and power quality enhancement in grid-connected solar photovoltaic systems using an advanced control algorithm</a></div><div class="m">Murari Lal, Pradip Kumar Sadhu, Shiv Prakash Bihari 외 · Engineering Applications of Artificial Intelligence · 2026-12 #건물성능</div><div class="g">가정 에너지 관리(HEM)에서 계통 연계형 태양광 인버터의 효율과 전력품질을 높이는 문제를 다룬다. MPPT와 배터리를 포함한 시스템에 MOPSObNPGA 다목적 최적화 제어를 적용하고 MATLAB Simulink로 평가했다. 표준 조건과 동적 조건(일사량·온도·부하 변화) 모두에서 성능이 양호했다.</div></div></label>
<label><input type="checkbox" value="10.1061/jcemd4.coeng-18692"><div><div class="t">9. <a href="https://doi.org/10.1061/jcemd4.coeng-18692" target="_blank">Practitioners’ Perspectives on Early-Stage Decision-Making Factors for Selecting Preferred Building Materials: Multicriteria Decision-Making Framework in the US Construction Industry</a></div><div class="m">Md. Nayeem Hoque, Shafayet Ahmed, Md. Tauhidul Karim 외 · Journal of Construction Engineering and Management · 2027-01-01 </div><div class="g">프로젝트 초기에 건축자재를 고를 때 따를 구조화된 방법이 없다는 문제를 다룬다. 미국의 설계자·엔지니어·시공자를 전국 단위로 설문하고 fuzzy AHP 기반 MCDM 프레임워크를 만들었다. 핵심 요인은 자재비, 인건비, 운영·유지관리비로 나타났다.</div></div></label>
<label><input type="checkbox" value="10.1061/jmenea.meeng-7672"><div><div class="t">10. <a href="https://doi.org/10.1061/jmenea.meeng-7672" target="_blank">Developing an Optimal Work–Rest Schedule for Construction Workers in Hot Weather: A Case Study of South China</a></div><div class="m">Haiyi Zong, Wen Yi, Hanyue Yang 외 · Journal of Management in Engineering · 2027-01-01 #안전행동 #웨어러블</div><div class="g">폭염 속 건설 작업자의 생산성과 건강을 함께 고려한 최적 작업–휴식 일정을 설계했다. 중국 남부 현장 3곳에서 작업자 175명의 생리 데이터와 기상 데이터를 동기화해 계측했다. machine learning으로 최대 작업시간(MWD)과 회복률(ROR)을 추정하고 Monte Carlo 시뮬레이션으로 일정 패턴을 평가했다.</div></div></label>
<label><input type="checkbox" value="10.1061/jmenea.meeng-7902"><div><div class="t">11. <a href="https://doi.org/10.1061/jmenea.meeng-7902" target="_blank">Vision-Language Model-Based System for Automated and Proactive Construction Fence Management to Enhance Severe Weather Preparedness</a></div><div class="m">Jinwoong Lee, Taerim Kim, Soowon Chang 외 · Journal of Management in Engineering · 2027-01-01 #컴퓨터비전 #안전행동</div><div class="g">강풍이 오기 전에 가설 펜스의 안정성을 빠르게 판단하고 대비 조치를 내놓는 vision-language model 기반 시스템을 개발했다. instance segmentation으로 펜스 패널과 부착물을 찾아 풍하중 면적을 추정하고, 공학적 안정성 해석을 거쳐 LLM이 실무 지침을 생성한다. segmentation 성능은 mAP50 0.866이었다.</div></div></label>
<label><input type="checkbox" value="10.1108/ecam-09-2025-1438"><div><div class="t">12. <a href="https://doi.org/10.1108/ecam-09-2025-1438" target="_blank">Enabling large language models for automated compliance checking of BIM models in architectural engineering through semantic modelling and linking</a></div><div class="m">Siteng Zhang, Shihang Zhang · Engineering Construction &amp; Architectural Management · 2026-11-03 #BIM</div><div class="g">BIM 정보요구수준(LOIN) 준수 여부를 LLM으로 자동 검토하기 위해 BIM 자원을 semantic data로 변환하고 ICDD로 연결했다. MCP로 LLM을 graph query, 검토, 이슈 보고 서비스와 이었다. 원시 Turtle을 직접 검토하거나 Graph RAG를 쓰는 방식과 비교했는데, 원시 Turtle 직접 검토는 성능이 낮았다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105420"><div><div class="t">13. <a href="https://doi.org/10.1016/j.aei.2026.105420" target="_blank">Evaluation of NiOA-tuned PatchTST for single-site monthly rainfall forecasting using reanalysis-derived meteorological time series</a></div><div class="m">Amel Ali Alhussan, Marwa M. Eid, Nima Khodadadi 외 · Advanced Engineering Informatics · 2027-01 </div><div class="g">재분석 기상자료에서 뭄바이 단일 지점의 월강수량을 예측했다. Ninja Optimization Algorithm으로 PatchTST transformer의 hyperparameter를 튜닝했다. PSO, GA, DE보다 우수했고 RMSE 0.0077, NSE 0.981을 기록했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105430"><div><div class="t">14. <a href="https://doi.org/10.1016/j.aei.2026.105430" target="_blank">Joint task assignment and energy scheduling for AGVs in automated container terminals under V2G technology and Time-of-Use pricing</a></div><div class="m">Xiao Yang, Yuanwei Yao, Shuanglu Zhang 외 · Advanced Engineering Informatics · 2027-01 </div><div class="g">자동화 컨테이너 터미널에서 AGV를 운송 수단이자 이동형 에너지 저장장치로 보고, 시간대별 요금(TOU)과 V2G 조건에서 작업 배정과 충방전을 함께 스케줄링했다. 지연 페널티와 순전력비를 최소화하는 MILP 모델과 그 해법을 제안했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107322"><div><div class="t">15. <a href="https://doi.org/10.1016/j.autcon.2026.107322" target="_blank">Inverse design of architectural floorplans with gradient-based optimization of binary subdivision graphs</a></div><div class="m">Shaoyi Wang, Ramon Elias Weber · Automation in Construction · 2027-01 </div><div class="g">생성형 모델은 평면 설계를 정밀하게 제어하기 어렵다는 문제를 다룬다. binary subdivision graph에 differentiable soft-split을 적용해, 분할 구조는 유지하면서 실의 면적과 compactness를 gradient로 최적화하는 inverse design 워크플로를 제안했다. 주거 평면 실험에서 접근성 충족도와 면적 정확도가 기존 방법보다 개선됐다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107328"><div><div class="t">16. <a href="https://doi.org/10.1016/j.autcon.2026.107328" target="_blank">Continuous horizontal construction of concrete shells by 3D printing</a></div><div class="m">Yujun Niu, Chaofeng Wang, Hung-Wen Oliver Chung 외 · Automation in Construction · 2027-01 #모듈러</div><div class="g">수직 3DCP의 높이·도달거리 한계를 넘기 위해, 층을 기울여 먼저 출력한 경사면을 지지대로 쓰는 수평 연속 3D 콘크리트 프린팅을 제안했다. 이 방식으로 거푸집 없이 관로, 터널, 지붕 같은 셸을 만든다. 형상, toolpath, G-code, FE 해석을 잇는 디지털 워크플로로 셸 2개를 출력했다. 수직 변형은 18층 이후 안정됐고 해석값과 일치했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107336"><div><div class="t">17. <a href="https://doi.org/10.1016/j.autcon.2026.107336" target="_blank">Global BIM–SLAM map registration using virtual LiDAR scanning and deep learning</a></div><div class="m">Woojin Shim, Sunwoong Paik, Yohan Kim 외 · Automation in Construction · 2027-01 #BIM #디지털트윈</div><div class="g">BIM과 SLAM 점군 사이의 modality 차이와 부분 관측 때문에 정합이 어려운 문제를 다룬다. SLAM 궤적을 따라 BIM을 virtual LiDAR로 스캔해 실제 관측 조건을 재현하고, 사전학습된 deep learning 정합을 fine-tuning 없이 적용했다. 실제 데이터 11개 시퀀스 모두에서 정합에 성공했고, 평균 오차는 회전 0.765°, 이동 0.430 m였다.</div></div></label>
