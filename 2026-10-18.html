<h1>논문 선택 — 2026-10-18</h1>
<div class="sub">체크하고 아래 「보내기」를 누르면 DOI 목록이 채워진 메일 작성창이 뜹니다. <b>전송</b>하면 5분 안에 접수 확인 메일이 옵니다.</div>
<h2>신규 13편</h2><div class="sub">체크하면 전문을 받아 노트를 씁니다.</div>
<label><input type="checkbox" value="10.1016/j.aei.2026.105387"><div><div class="t">1. <a href="https://doi.org/10.1016/j.aei.2026.105387" target="_blank">A physics-guided multi-sensor modal decomposition network for bridge frequency tracking</a></div><div class="m">Zheng-jie He, Tian-Li Huang, Lei Tang 외 · Advanced Engineering Informatics · 2027-01 #구조점검</div><div class="g">운영 중인 교량은 모드 성분이 서로 섞이고 환경·운영 교란을 받아 진동 응답에서 순간주파수(IF)를 추적하기 어렵다. 물리 제약(재구성 일관성, 모드 직교성, 대역 제한)을 건 spatial modal decomposition filter로 다중 센서 응답을 모드별 성분으로 분리하고, peak-weighted loss를 쓴 ANIF-Tracker로 각 성분의 IF를 추정하는 MMDN을 제안했다. 수치 모델, 실험실 실험, 운영 중인 사장교의 장기 계측 데이터로 검증했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116549"><div><div class="t">2. <a href="https://doi.org/10.1016/j.engappai.2026.116549" target="_blank">Enhanced regularized prototypical network for few-shot fault diagnosis of electric submersible pump</a></div><div class="m">Kang Li, Jue Ren, Wenzheng Chen 외 · Engineering Applications of Artificial Intelligence · 2026-12 </div><div class="g">전동 수중펌프(ESP)의 few-shot 고장진단에서 다변량 시계열의 시공간 결합을 모델링하기 어렵고 외란에 취약하다는 문제를 다룬다. crossformer encoder를 embedding 모듈로 쓰고 low-rank 정규화를 더한 enhanced regularized prototypical network를 제안했다. CNOOC의 실제 ESP 고장 데이터에서 기존 SOTA meta-learning 기법보다 일관되게 높은 성능을 보였다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116569"><div><div class="t">3. <a href="https://doi.org/10.1016/j.engappai.2026.116569" target="_blank">Physics-informed deep learning for few-shot damage localization in carbon fiber reinforced polymer composites under thermal variations</a></div><div class="m">Menghan Zhang, Ruihao Liu, Along Du 외 · Engineering Applications of Artificial Intelligence · 2026-12 #구조점검</div><div class="g">CFRP 복합재의 guided wave 기반 손상 위치추정은 온도 변화와 성긴 센서 배치 때문에 기준선이 왜곡되고 영상에 artifact가 생긴다. 1D coordinate attention을 붙인 데이터 경로와 미분 가능한 time-of-flight 층으로 만든 물리 경로를 합친 dual-stream physics-informed deep learning에 물리 제약 hybrid loss를 더했다. few-shot transfer learning으로 온도가 달라져도 강건하게 손상 위치를 찾는다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107307"><div><div class="t">4. <a href="https://doi.org/10.1016/j.autcon.2026.107307" target="_blank">Efficient damage identification in hollow slab girder bridges using a hybrid graph-attention network and differentiable inversion</a></div><div class="m">Wenping Li, Jinglin Xiao, Chen Wang 외 · Automation in Construction · 2027-01 #구조점검</div><div class="g">중공 슬래브 거더교에서 힌지 조인트 열화와 거더 열화가 함께 일어날 때, 기존 FEMU 기반 손상 식별은 차원의 저주 때문에 계산 비용이 크다. 교량을 chain graph로 표현한 topology-aware surrogate인 HG-AttnNet과 자동미분 기반 differentiable inversion을 결합했다. 다른 교량에도 일반화되며, FEMU보다 계산 시간을 99.5% 이상 줄이면서 가장 심하게 열화된 조인트와 거더를 정확히 찾아냈다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.buildenv.2026.115424"><div><div class="t">5. <a href="https://doi.org/10.1016/j.buildenv.2026.115424" target="_blank">AI-Assisted Transient Infrared Imaging for Shape-Aware Detection and Quantification of Building Envelope Air Leakage</a></div><div class="m">Zhenglai Shen, Md Sameem UI Qaum, Som S. Shrestha 외 · Building and Environment · 2026-10 #컴퓨터비전 #건물성능</div><div class="g">건물 외피의 공기 누기 위치를 찾고 누기량을 정량화하는 일은 기존 진단법으로는 어렵다. transient 적외선 영상(TIRI)에 SAM segmentation, OBB 표준화, CNN–LSTM/MLP 회귀를 결합한 AI 프레임워크를 만들었고, 데이터셋은 IR 영상 254개와 누기 샘플 1,820개다. 누기량 예측 R²는 석고보드 0.96, 벽돌 마감 0.85였다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.buildenv.2026.115425"><div><div class="t">6. <a href="https://doi.org/10.1016/j.buildenv.2026.115425" target="_blank">Comparative life-cycle carbon assessment of modular and conventional high-rise building construction</a></div><div class="m">Hongyuan Wei, Qiong Wang, Baojun Zhao 외 · Building and Environment · 2026-10 #모듈러</div><div class="g">모듈러 고층 건물의 요람에서 폐기까지 탄소배출을 평가한 연구가 부족하다. Yantai의 모듈러 고층 건물과 일반 철골 고층 건물을 사례로 50년 공정 기반 LCA(생산·운송·시공·운영·폐기 단계)를 수행했다. 단위면적당 생애주기 배출은 모듈러가 5.6% 낮았고, 생산 단계는 8.2%, 폐기 단계는 14.5% 낮았다. 결과는 재사용과 운송 가정에 민감했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116536"><div><div class="t">7. <a href="https://doi.org/10.1016/j.engappai.2026.116536" target="_blank">Uncertainty-guided active transfer for robotic suction grasping via evidential learning</a></div><div class="m">Congyu Huang, Xiaofeng Liu, Wei Shiung Liew 외 · Engineering Applications of Artificial Intelligence · 2026-12 #인간로봇</div><div class="g">로봇 suction grasping은 예측 불확실성을 정량화하지 못하고 sim-to-real 전이에서 샘플 효율이 낮다. evidential deep learning으로 aleatoric·epistemic 불확실성을 함께 추정하고, 불확실성이 높은 샘플과 낮은 샘플을 섞어 고르는 hybrid sampling 기반 active transfer pipeline을 만들었다. seal quality와 질량중심을 evidential fusion으로 결합해 파지의 강건성을 높였다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116571"><div><div class="t">8. <a href="https://doi.org/10.1016/j.engappai.2026.116571" target="_blank">A shared-backbone detection-recognition framework for end-to-end industrial character reading</a></div><div class="m">Hanchen Lin, Yongmin Guo, Xianchao Zhu 외 · Engineering Applications of Artificial Intelligence · 2026-12 #컴퓨터비전</div><div class="g">산업 현장의 금속 명판에서 문자를 자동으로 읽어 품질 추적에 쓰는 문제를 다룬다. 하나의 공유 backbone으로 문자 detection과 recognition을 함께 수행하는 end-to-end 모델 SBICR-Net을 제안했다. C2f-AP로 밀집한 작은 문자의 경계 인식을 높이고, GLOR로 6/9·M/W 방향 혼동을 줄였으며, LKA-S로 획 구조 표현을 강화했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.jobe.2026.117533"><div><div class="t">9. <a href="https://doi.org/10.1016/j.jobe.2026.117533" target="_blank">Evidence-Constrained Vision–Language Model Framework for Building-Level Post-Earthquake Residual-Morphology Image Pre-Triage</a></div><div class="m">Defeng Xu, Feifei Sun, Songhang He 외 · Journal of Building Engineering · 2026-10 #컴퓨터비전 #구조점검</div><div class="g">지진 후 개별 건물 이미지를 붕괴 형태별로 사전 분류(pre-triage)하는 문제를 다룬다. &#x27;observe first, classify later&#x27; 원칙에 따라 붕괴 근거를 먼저 추출한 뒤 C0–C7 분류 체계로 분류하는 evidence-constrained VLM 프레임워크를 만들었고, VLM은 fine-tuning 없이 썼다. 이미지 2만 장에서 evidence-first prompting은 Macro-F1을 72.1%에서 85.8%로 높였다. 불확실하면 판정을 보류(abstention)하게 하자 자동 처리율 80%에서 위험한 과소평가가 3.2%에서 1.6%로 줄었다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.ssci.2026.107523"><div><div class="t">10. <a href="https://doi.org/10.1016/j.ssci.2026.107523" target="_blank">A dynamic risk assessment method integrating deep learning with Bayesian network: A case study in machining workshop</a></div><div class="m">Jinming Hu, Xiaofeng Hu, Yiping Bai 외 · Safety Science · 2027-02 #컴퓨터비전 #안전행동</div><div class="g">기계가공 작업장은 다공종 작업과 복합 위험이 겹치는데, 계속 갱신되는 모니터링 데이터로 위험을 동적으로 평가하는 방법이 부족하다. YOLOv11로 불안전 행동 13종과 불안전 상태 8종을 검출하고, 그 결과를 31개 노드 Bayesian network에 넣어 확률과 피해 규모를 계속 갱신하며 위험을 평가했다. 대부분의 위험 유형에서 precision이 0.9를 넘었고, 두 위험이 동시에 있으면 위험도가 기준 대비 2배 넘게 올라갔다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.cacaie.2026.100248"><div><div class="t">11. <a href="https://doi.org/10.1016/j.cacaie.2026.100248" target="_blank">A dual-view 3D point cloud learning framework for automated coarse aggregate particle size inspection in continuous production</a></div><div class="m">Aojia Tian, Wei Li, Ming Yang 외 · Computer-Aided Civil and Infrastructure Engineering · 2026-10 #컴퓨터비전</div><div class="g">연속 생산 중인 플랜트에서 굵은 골재 입도를 자동 검사할 때 높이 정보가 없고 가림과 사각지대가 생기는 문제를 다룬다. 비스듬히 설치한 3D 센서 두 대로 point cloud를 얻고, dual-branch PointNet++ backbone과 3단계 cross-view fusion 모듈로 입도를 end-to-end로 판정했다. 입자 단위 분류 정확도는 91.18%로 최고 단일 시점 모델보다 9.11%p 높았고, 인접 등급 오분류는 15.21%에서 8.14%로 줄었으며, 배치 단위 입도분포 MAE는 0.0280이었다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116482"><div><div class="t">12. <a href="https://doi.org/10.1016/j.engappai.2026.116482" target="_blank">Cross-spectral Gaussian Splatting with implicit surface consistency</a></div><div class="m">Haipeng Guo, Junbao Li, Huanyu Liu · Engineering Applications of Artificial Intelligence · 2026-12 #컴퓨터비전 #디지털트윈</div><div class="g">동기화가 불완전한 다중 분광 센서 영상으로 장면을 재구성하면 분광별 외관 차이와 시간 어긋남 때문에 기하가 일관되지 않는다. explicit Gaussian Splatting을 분광과 무관한 neural signed distance field와 결합해, Gaussian에서 렌더링한 depth·normal이 공유 implicit surface를 지도하고 그 zero-level set이 Gaussian 중심을 고정하도록 했다. 이를 cross-spectral 3D 재구성, camera pose 추정, novel-view synthesis에 적용했고 실시간 rasterization은 그대로 유지된다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116483"><div><div class="t">13. <a href="https://doi.org/10.1016/j.engappai.2026.116483" target="_blank">Cryogenic distortion compensation in guided ultrasonic waves using a Physics-Informed Generative Adversarial Network</a></div><div class="m">Shuozhi Wang, Jinyu Wang, Changxian Zheng 외 · Engineering Applications of Artificial Intelligence · 2026-12 #구조점검</div><div class="g">재사용 발사체가 극저온에 노출되면 SHM용 guided ultrasonic wave 신호가 비선형적으로 왜곡되어 손상 특징이 가려진다. Hilbert envelope 영역에서 residual generative 방식으로 학습하고 파동 전파 물리를 prior로 넣은 Physics-Informed GAN을 제안했다. 극저온을 포함한 여러 기준 온도에서 모드를 보존하면서 일관되게 왜곡을 보정했다.</div></div></label>
</main>

<script>
