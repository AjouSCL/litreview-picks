<h1>논문 선택 — 2026-11-18</h1>
<div class="sub">체크하고 아래 「보내기」를 누르면 DOI 목록이 채워진 메일 작성창이 뜹니다. <b>전송</b>하면 5분 안에 접수 확인 메일이 옵니다.</div>
<h2>신규 35편</h2><div class="sub">체크하면 전문을 받아 노트를 씁니다.</div>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107313"><div><div class="t">1. <a href="https://doi.org/10.1016/j.autcon.2026.107313" target="_blank">From practice to dataset: morphological abstraction and procedural generation of hospital layouts</a></div><div class="m">Claire Duclos-Prévet · Automation in Construction · 2027-01 </div><div class="g">병원 초기 설계용 AI 학습 데이터가 부족한 문제를 다룬다. 유럽 설계사무소의 병원 프로젝트 60건에서 형태·치수 규칙을 뽑아 footprint→patio→서비스 배치의 3단계 procedural generation 파이프라인을 만들었다. 기능 스케치 68,400장 데이터셋을 구축했고 GNN–U-Net으로 robustness를 평가했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.cacaie.2026.100265"><div><div class="t">2. <a href="https://doi.org/10.1016/j.cacaie.2026.100265" target="_blank">LiteCrackNAS: A Lightweight Neural Architecture Search Framework with a Diversity-Aware Strategy for Pavement Crack Segmentation</a></div><div class="m">Meihua Wang, Shengzhen Li, Junjie Yao 외 · Computer-Aided Civil and Infrastructure Engineering · 2026-11 #컴퓨터비전 #구조점검</div><div class="g">점검 플랫폼에 올릴 수 있는 경량 포장 균열 segmentation 네트워크를 자동으로 찾는다. U자형 search space를 두고, 서로 비슷한 후보 구조를 학습 전에 걸러내는 diversity-aware NAS를 썼다. 찾아낸 LiteCrackNet은 0.58M 파라미터로 4개 벤치마크에서 F1이 가장 높았고, Jetson Orin NX(TensorRT FP16)에서 127 FPS가 나왔다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.dibe.2026.101119"><div><div class="t">3. <a href="https://doi.org/10.1016/j.dibe.2026.101119" target="_blank">False Non-Compliance in AI-Based PPE Monitoring: Reliability Challenges under Contextual PPE Variability in Construction Environments</a></div><div class="m">Suphawut Malaikrisanachalee, Wittaya Srisomboon, Narongrit Wongwai 외 · Developments in the Built Environment · 2026-11 #컴퓨터비전 #안전행동</div><div class="g">햇빛 가리개를 덧쓴 헬멧을 AI PPE 모니터링이 미착용으로 잘못 판정하는(false non-compliance) 문제를 다룬다. 태국 현장 이미지 1,340장(머리 3,663개)으로 YOLO 검출기 5종과 bilinear/ESPCN 업스케일링을 비교했다. FNCR은 범용 검출기 0.375, contextual 검출기 0.135였고, super-resolution 효과는 검출기에 따라 달랐다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116765"><div><div class="t">4. <a href="https://doi.org/10.1016/j.engappai.2026.116765" target="_blank">Multimodal fusion of visible image and optical flow for concrete vibration state representation and quality assessment</a></div><div class="m">Zhiyu Tao, Xiaofeng Qu, Dong Wang 외 · Engineering Applications of Artificial Intelligence · 2027-01 #컴퓨터비전 #진도관리</div><div class="g">콘크리트 다짐 품질을 정지 이미지만으로 판단하면 표면의 움직임 정보를 놓치는 문제를 다룬다. visible image와 dense optical flow를 fusion하는 dual-stream 모델로 다짐 단계를 분류하고, prototype regression으로 연속적인 다짐 완료 지수를 추정했다. 단일 modality·temporal baseline보다 성능이 좋았고, 현장 실험과 edge 배포까지 검증했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116793"><div><div class="t">5. <a href="https://doi.org/10.1016/j.engappai.2026.116793" target="_blank">Experimental dataset-driven machine learning models for predicting the performance of thermoelectric air-cooling systems</a></div><div class="m">Hamzah M. Jaffar, Zaid Ali Hussein, Saif Ali Kadhim 외 · Engineering Applications of Artificial Intelligence · 2027-01 #건물성능</div><div class="g">초록 없음</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116796"><div><div class="t">6. <a href="https://doi.org/10.1016/j.engappai.2026.116796" target="_blank">Dilated Mamba Graph Convolutional Network for fine-scale hyperspectral estimation of photovoltaic dust accumulation</a></div><div class="m">Peng Zhu, Hao Li, Jing Yu 외 · Engineering Applications of Artificial Intelligence · 2027-01 #건물성능</div><div class="g">초록 없음</div></div></label>
<label><input type="checkbox" value="10.1016/j.ssci.2026.107561"><div><div class="t">7. <a href="https://doi.org/10.1016/j.ssci.2026.107561" target="_blank">Analysis of counterflow-induced congestion propagation in a high-rise office building staircase: evidence from a full-building phased evacuation drill</a></div><div class="m">Taehyeong Kim, Seongkyung Park, Masayuki Mizuno · Safety Science · 2027-03 #안전행동</div><div class="g">고층 건물 계단에서 반대 방향 보행(counterflow)이 만드는 정체가 어떻게 퍼지는지 현장 데이터로 정량화한다. 22층 사무소 건물 전체 대피훈련(약 2,400명) 영상을 계수해 분석했다. 올라가는 보행자 1명 때문에 생긴 정지파가 12개 층(3~14층)으로 번졌고, 정체는 위층일수록 길어져 10초에서 최대 38초까지 갔다. 정체 전선의 속도는 0.861 m/s였다.</div></div></label>
<label><input type="checkbox" value="10.1061/jccee5.cpeng-7485"><div><div class="t">8. <a href="https://doi.org/10.1061/jccee5.cpeng-7485" target="_blank">ActDNN: An Automated System for Activity Recognition and Productivity Estimation for Heavy Construction Equipment</a></div><div class="m">Sneha Verma, Xiang Xie, Wahib Saif 외 · Journal of Computing in Civil Engineering · 2027-03-01 #컴퓨터비전 #진도관리</div><div class="g">정형화된 대규모 데이터 없이도 건설장비의 활동을 인식하고 생산성을 추정하는 ActDNN을 제안한다. 프레임별 multilabel 분류와 활동 전이를 다루는 sequential learning을 결합해 가림·먼지·카메라 각도 변화에 대응했다. 8,926 프레임에서 frame 기반 모델의 정확도는 99.82%였다.</div></div></label>
<label><input type="checkbox" value="10.1061/jccee5.cpeng-7618"><div><div class="t">9. <a href="https://doi.org/10.1061/jccee5.cpeng-7618" target="_blank">Quantifying the Impact of Compressive Sensing Reconstruction on Structural Damage Indicator Extraction</a></div><div class="m">Yang Zhang, Dongyang Zeng, Xi Tian 외 · Journal of Computing in Civil Engineering · 2027-03-01 #컴퓨터비전 #구조점검</div><div class="g">구조물 손상 이미지를 compressive sensing으로 압축·복원할 때 균열 식별과 손상 지표 추출이 얼마나 영향을 받는지 정량화한다. 복원 이미지 9종을 비교하고, spline 보간 기반 최대 내접원 알고리즘으로 균열 폭을 subpixel 정밀도로 측정했다. 원본과 복원본 사이에는 차이가 뚜렷했지만, 압축률이 다른 복원본끼리는 서로 비슷했다.</div></div></label>
<label><input type="checkbox" value="10.1061/jcemd4.coeng-19063"><div><div class="t">10. <a href="https://doi.org/10.1061/jcemd4.coeng-19063" target="_blank">How Digital Investment Drives Project Performance: The Synergistic Role of Context–Capability–Resource Configurations</a></div><div class="m">Yuanyuan Hua, Yuxin Wang, Ying Zhang 외 · Journal of Construction Engineering and Management · 2027-02-01 </div><div class="g">건설기업의 디지털 투자가 프로젝트 성과로 이어지는 경로를 자원–역량–맥락 configuration으로 분석한다. 디지털 전환 중인 기업을 설문하고 fsQCA를 적용했다. 불확실성이 낮을 때는 디지털 자원 조합(인적+데이터, 물적+제도)이, 높을 때는 dynamic capability가 고성과의 필요조건이었다.</div></div></label>
<label><input type="checkbox" value="10.1061/jcemd4.coeng-19276"><div><div class="t">11. <a href="https://doi.org/10.1061/jcemd4.coeng-19276" target="_blank">The Oil Price Goldilocks Zone: How Boom Environments Erode Contractor Profitability in International Construction</a></div><div class="m">Sangwon Han · Journal of Construction Engineering and Management · 2027-02-01 </div><div class="g">유가 호황이 해외건설 업체의 수익성을 오히려 떨어뜨리는지 검증한다. 한국 해외건설 집계 자료(2001–2024)와 16개 대형사 패널(N=320)에 고정효과와 Hansen threshold 추정을 적용했다. 영업이익률은 중간 유가 구간($60–90)에서 4.88%로 가장 높았고, 고유가 구간에서는 수주가 약 31% 늘었는데도 1.49%로 떨어졌다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.asej.2026.104527"><div><div class="t">12. <a href="https://doi.org/10.1016/j.asej.2026.104527" target="_blank">Information consistency and design change propagation in a steel frame BIM workflow</a></div><div class="m">Dong-Soo Kang, Chang-Bok Yoon · Ain Shams Engineering Journal · 2027-01 #BIM</div><div class="g">철골 BIM에서 구조해석 모델과 상세 모델 사이의 정보 일관성과 설계변경 전파를 평가한다. Tekla Structural Designer–Tekla Structures–Trimble Connect 사이에서 파일 기반 전달과 native 연동을 부재 36개로 비교했다. 일관성은 파일 기반 79.2%, native 95.8%였고, native 변경 16건 중 14건은 수정 없이 대상에 반영됐다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107365"><div><div class="t">13. <a href="https://doi.org/10.1016/j.autcon.2026.107365" target="_blank">Bridging scan-to-BIM and facility management: an IFC-driven framework for information automation in existing buildings</a></div><div class="m">Zicheng Zhu, Kun Tian, Matthew Moorhead 외 · Automation in Construction · 2027-01 #BIM #디지털트윈</div><div class="g">Scan-to-BIM 모델이 시설관리(FM)에서 재사용되지 못하는 문제를 다룬다. 분야별 IFC 모델 4종에서 자산·공간·시스템·MEP port 연결을 추출해 FM 스키마로 정규화하고, 정보 준비도 검증과 경량 웹 메시를 붙였다. 그 결과를 BIM Viewer·Data Workspace·Knowledge Graph를 통합한 웹 기반 건물관리 시스템(WDBMS)으로 구현했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107382"><div><div class="t">14. <a href="https://doi.org/10.1016/j.autcon.2026.107382" target="_blank">AI-based real-time control of custom construction manufacturing: comparative evaluation of experience-based, search-based, and hybrid strategies</a></div><div class="m">Ian Flood, Madison E. Hill · Automation in Construction · 2027-01 #모듈러</div><div class="g">맞춤형 탈현장 건설 공장의 실시간 생산 제어를 AI agent로 개선한다. 실제 PC 공장을 시뮬레이션 환경으로 만들고, 강화학습 기반 EDA, 탐색 기반 SDA, 둘을 섞은 HybridDA를 비교했다. EDA와 HybridDA가 rule 기반 방식보다 납기 지연을 크게 줄였고, SDA는 결정 지연(latency) 때문에 성능이 제한됐다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.dibe.2026.101113"><div><div class="t">15. <a href="https://doi.org/10.1016/j.dibe.2026.101113" target="_blank">Circularity in Timber and Steel Modular Buildings: Adaptability, Deconstruction and Reuse</a></div><div class="m">Konstantinos Daniel Tsavdaridis, Dan-Adrian Corfar, Zhengyao Li 외 · Developments in the Built Environment · 2026-11 #모듈러</div><div class="g">목조·철골 볼류메트릭 모듈러 건물이 실제로 재사용될 수 있는지 시스템·모듈·접합부 수준에서 리뷰했다. 문헌 리뷰에 33명 대상 국제 설문을 더해 교차 검증했다. 재사용을 막는 것은 구조적 가능성보다 규제·정보·시장 장벽이었고, 건식·가역 접합과 digital passport가 해법으로 제시됐다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.dibe.2026.101120"><div><div class="t">16. <a href="https://doi.org/10.1016/j.dibe.2026.101120" target="_blank">Beyond the BIM Ceiling: Transitioning from Geometry-Centric Models to AI-Native Knowledge Graphs in the AEC Industry</a></div><div class="m">Khalid Saqer Alotaibi · Developments in the Built Environment · 2026-11 #BIM</div><div class="g">형상 중심 BIM의 한계(&quot;BIM Ceiling&quot;)를 넘기 위해 W3C BOT 온톨로지 기반의 분산 knowledge graph 구조를 제안한다. IFC traversal, AABB 충돌 기반 추론, BOT graph 검색을 benchmark로 비교했다. AABB 추론은 precision 80.6%가 상한이었고, BOT slicing은 payload를 99.5%, 메모리를 32배 줄였다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.enbuild.2026.118539"><div><div class="t">17. <a href="https://doi.org/10.1016/j.enbuild.2026.118539" target="_blank">Construction-stage carbon emissions and mitigation potential of concrete modular construction for dense urban residential renewal</a></div><div class="m">Kunyang Chen, Yuyan Zhang, Qiu Tong 외 · Energy and Buildings · 2026-11 #모듈러</div><div class="g">도심 노후 주거 재건축에서 콘크리트 모듈러 공법이 시공 단계 탄소를 실제로 줄이는지 검증한다. 베이징 사례를 대상으로 LCA 기반 단계별 탄소 산정 모델을 구축했다. 모듈러는 가설 지지재 수요와 폐기물을 크게 줄였고, 저탄소 효과는 주로 시공 과정에서 나왔다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116683"><div><div class="t">18. <a href="https://doi.org/10.1016/j.engappai.2026.116683" target="_blank">Graph neural network prediction of inter-particle contact forces in granular materials under uniaxial compression</a></div><div class="m">Mobina Taghaddosi, Nariman Mahabadi · Engineering Applications of Artificial Intelligence · 2027-01 </div><div class="g">입상체의 입자 간 접촉력을 DEM보다 싸게 예측하는 GNN을 제안한다. DEM으로 일축압축 3D 입자 집합체 데이터를 만들고, 입자를 node, 접촉을 edge로 하는 그래프를 EPD와 GINEConv로 학습했다. 재료 파라미터 없이 형상 입력만으로 R²≈0.996을 얻었고, force chain의 크기와 변형에 따른 변화도 재현했다.</div></div></label>
