<h1>논문 선택 — 2026-10-04</h1>
<div class="sub">체크하고 아래 「보내기」를 누르면 DOI 목록이 채워진 메일 작성창이 뜹니다. <b>전송</b>하면 5분 안에 접수 확인 메일이 옵니다.</div>
<h2>신규 17편</h2><div class="sub">체크하면 전문을 받아 노트를 씁니다.</div>
<label><input type="checkbox" value="10.1016/j.aei.2026.105331"><div><div class="t">1. <a href="https://doi.org/10.1016/j.aei.2026.105331" target="_blank">Deep learning-based crack detection with visual interpretability for rock mass engineering in complex environments</a></div><div class="m">Shaokang Shang, Hai Sun, Yu Fu 외 · Advanced Engineering Informatics · 2027-01 #컴퓨터비전 #구조점검</div><div class="g">지하 암반 구조물의 균열은 형태가 복잡하고 주변 환경의 간섭이 심해 검출이 어렵다. 저자들은 지하 암반 균열 benchmark dataset을 구축해 object detection 알고리즘 9종을 비교했고, dynamic snake convolution 기반 Crack Feature Extraction Module(CFEM)을 YOLOv11-n backbone에 넣어 균열 형상을 적응적으로 포착하도록 했다. 해석 가능한 시각화도 함께 제시한다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105335"><div><div class="t">2. <a href="https://doi.org/10.1016/j.aei.2026.105335" target="_blank">Decoupling visual semantics via explicit representation learning for urban building energy modeling</a></div><div class="m">Yanting Shen, Xun Wang, Danyi Zhao 외 · Advanced Engineering Informatics · 2027-01 #건물성능</div><div class="g">Urban Building Energy Modeling(UBEM)에서 end-to-end black-box 딥러닝 모델은 물리적 의미가 빠져 있다(semantic gap). 저자들은 중간 representation 층에 물리 regularization decoder를 붙인 knowledge-guided explicit representation learning 구조를 제안했다. 그 결과 기하 민감도가 2% 미만에서 50% 이상으로 높아졌고, 도시 벡터 데이터만으로 빠르고 저렴하게 에너지를 추론할 수 있다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.cacaie.2026.100241"><div><div class="t">3. <a href="https://doi.org/10.1016/j.cacaie.2026.100241" target="_blank">Bidirectional Monte Carlo Tree Search for Coordinated Railway Alignment and Dominant-Structure Location Optimization in Fragmented Design Spaces</a></div><div class="m">Qingxin Zeng, Hao Pu, Paul Schonfeld 외 · Computer-Aided Civil and Infrastructure Engineering · 2026-10 </div><div class="g">산악 지형처럼 장애물 때문에 설계 공간이 쪼개진 곳에서 철도 선형과 교량·터널 위치를 함께 최적화하는 연구다. 양 끝점에서 두 tree를 키우는 bidirectional MCTS(MCTS-Connect)를 쓰고, tree 성장이 막히면 교량·터널 대안으로 두 경로를 잇는다. 대안의 입지 적합성은 AHP-CRITIC으로 평가한다. 실제 산악 철도 사례에서 건설비를 수동 설계 대비 3.61%, 기존 MCTS 대비 3.13% 줄였다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116423"><div><div class="t">4. <a href="https://doi.org/10.1016/j.engappai.2026.116423" target="_blank">An automated machine-vision method for coarse aggregate gradation measurement using attention-based instance segmentation</a></div><div class="m">Kaiwen Liu, Ping Wang, Hao Bai 외 · Engineering Applications of Artificial Intelligence · 2026-11 #컴퓨터비전</div><div class="g">콘크리트 굵은골재 입도 측정을 자동화하는 machine vision 방법이다. 영상 pixel 보정 뒤 attention과 feature-path fusion을 더한 instance segmentation 네트워크로 작은 입자까지 분리한다. 입자 부피는 Guldinus 정리로 빠르게 추정해 입도 곡선을 연속적으로 산출한다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116450"><div><div class="t">5. <a href="https://doi.org/10.1016/j.engappai.2026.116450" target="_blank">Hierarchical joint optimization of traffic signals and vehicle trajectories at intersections via deep reinforcement learning</a></div><div class="m">Mengying Li, Jiale Zhao, Xiancai Jiang · Engineering Applications of Artificial Intelligence · 2026-11 </div><div class="g">교차로 신호와 자율주행차(CAV) 궤적을 계층적으로 함께 최적화하는 multi-agent deep reinforcement learning 프레임워크다. 상위의 신호등 agent는 PPO로 현시와 녹색시간을 조정하고, 하위의 차량 agent는 TD3로 종·횡방향 궤적(차로 변경 포함)을 제어한다. 시뮬레이션에서 평균 속도가 7.54~25.5% 올랐고, 대기행렬 길이는 5.37~19.3%, 손실시간은 11.45~31.55% 줄었다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.ssci.2026.107483"><div><div class="t">6. <a href="https://doi.org/10.1016/j.ssci.2026.107483" target="_blank">Escaping the AI cage: construction workers’ perceived risk with AI gives rise to unsafe behaviors</a></div><div class="m">Tianyu Li, Huaiyuan Zhai, Ming Guo 외 · Safety Science · 2027-02 #안전행동</div><div class="g">건설 현장에 AI를 도입할 때 작업자가 느끼는 위험 인식(perceived risk with AI)이 불안전 행동으로 이어지는지 본 연구다. 자기결정이론(SDT)에 기반해, 위험 인식이 정서적 소진과 조직 동일시 약화라는 두 경로를 거쳐 불안전 행동을 늘린다는 모델을 세우고 검증했다. AI가 실패한 경험은 이런 부정적 정서·인지 반응을 더 키운다.</div></div></label>
<label><input type="checkbox" value="10.1061/jcemd4.coeng-18565"><div><div class="t">7. <a href="https://doi.org/10.1061/jcemd4.coeng-18565" target="_blank">Building an Error Management Climate in Construction Projects</a></div><div class="m">Peter E. D. Love · Journal of Construction Engineering and Management · 2026-12-01 </div><div class="g">건설 프로젝트에서 오류를 숨기지 않고 학습 기회로 삼는 조직 분위기(error management climate, EMC)를 만드는 방법을 다룬다. 멜버른의 Level Crossing Removal Project(AU$198억) 내 한 alliance를 5년간 현장 관찰하고 인터뷰·워크숍·문서로 교차 검증했다. 그 결과 리더십의 직접 독려와 사회적 규범을 통한 간접 강화라는 두 경로를 찾았다.</div></div></label>
<label><input type="checkbox" value="10.1061/jmenea.meeng-7749"><div><div class="t">8. <a href="https://doi.org/10.1061/jmenea.meeng-7749" target="_blank">Assessing Postdisaster Recovery to Inform Prediction of Economic Loss in Future Floods</a></div><div class="m">Yang Yang, Junbo Xia, Haoying Han 외 · Journal of Management in Engineering · 2027-01-01 </div><div class="g">홍수 피해를 사건마다 독립적으로 보지 않고, 앞선 홍수의 복구 상태가 다음 홍수의 경제 손실과 어떻게 연결되는지 정량화했다. 홍수 3,754건과 13년치 일별 야간 조도 데이터로 temporal recursive model을 만들고, FEMA가 보고한 건물·내용물 피해로 검증했다. 두 홍수 사이 간격이 4~9개월이면 선행 복구가 이후 손실 34.8% 감소와 연관됐고, 4개월 미만이면 오히려 손실이 컸다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105329"><div><div class="t">9. <a href="https://doi.org/10.1016/j.aei.2026.105329" target="_blank">Quantifying experience-based residential layout quality in floor-plan evaluation with knowledge-grounded LLM rules</a></div><div class="m">Jiachen Bu, Zhenchao Yang, Shiyuqian Wang 외 · Advanced Engineering Informatics · 2027-01 #건물성능</div><div class="g">주거 평면에서 채광·환기, 기능 zoning, 동선, 프라이버시처럼 경험에 기대는 품질을 추적 가능하게 평가하는 workflow다. parametric 평면 형상을 구조화된 공간 근거로 바꾸고, 주거설계 knowledge graph에서 관련 지식을 retrieval한다. multimodal LLM이 근거를 평가 규칙에 매칭하며, 규칙 매칭과 점수 집계는 프로그램으로 검증해 감사 가능하게 했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.cacaie.2026.100240"><div><div class="t">10. <a href="https://doi.org/10.1016/j.cacaie.2026.100240" target="_blank">A Real-Time Vision-Based Framework for Non-Contact Full-Field Monitoring of Traffic-Induced Bridge Responses</a></div><div class="m">Jiachang Gu, Zida Chen, Kang Gao 외 · Computer-Aided Civil and Infrastructure Engineering · 2026-10 #컴퓨터비전 #구조점검 #디지털트윈</div><div class="g">교량 응답을 센서 없이 실시간으로 전 구간 모니터링하는 vision 기반 프레임워크다. 비접촉 weigh-in-motion과 카메라로 차량 하중·제원·궤적을 추출해 시변 분포하중으로 바꾼다. 경량화한 FE database의 영향면으로 주요 지점 응답을 계산하고, residual 보정 모드법으로 전 구간 응답을 재구성한다. 현장 시험에서 영향면법은 R² 0.924, NRMSE는 최대 8.38%였다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116396"><div><div class="t">11. <a href="https://doi.org/10.1016/j.engappai.2026.116396" target="_blank">Machine learning prediction of chloride convection-zone depth in marine tidal concrete with model explainability and experimental validation</a></div><div class="m">Hao Fu, Zaixian Chen, Xinghao Liu 외 · Engineering Applications of Artificial Intelligence · 2026-11 </div><div class="g">조간대 해양 콘크리트의 염화물 대류층 깊이를 예측하는 machine learning 모델이다. 문헌에서 실험값 624건(재료·양생·노출·하중 변수 25개)을 모아 알고리즘 7종을 비교했고, XGBoost가 test R² 0.958로 가장 좋았다. SHAP·PDP로 건습비와 W/B의 비선형 효과를 해석했으며, 독립 실험으로 그 결과를 뒷받침했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105321"><div><div class="t">12. <a href="https://doi.org/10.1016/j.aei.2026.105321" target="_blank">SafeMachine: An evidence-centric architecture for traceable and context-aware machine safety assessment</a></div><div class="m">Sandra Martínez-Sanchis · Advanced Engineering Informatics · 2027-01 </div><div class="g">기계 안전성 평가는 수작업 위주라 규제 요건, 점검 근거, 판정 사이의 추적성이 약하다. SafeMachine은 규제 지식 수집, retrieval-augmented reasoning, multi-agent orchestration을 결합하되 LLM을 자율 판정자로 쓰지 않는다. 근거 검색과 출처 표기를 강제하고, artifact 의존관계에 기반한 traceability model로 평가 과정을 추적 가능하게 만들었다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105326"><div><div class="t">13. <a href="https://doi.org/10.1016/j.aei.2026.105326" target="_blank">History-Aware Deep Reinforcement Learning for real-time robot navigation in dynamic industrial environments</a></div><div class="m">Yizhi Wang, Degang Xu, Xianhan Zhou 외 · Advanced Engineering Informatics · 2027-01 #인간로봇</div><div class="g">계속 변하는 산업 환경에서 자율이동로봇(AMR)이 실시간으로 주행하도록, 과거 이력을 학습에 넣는 History-Aware Deep Reinforcement Learning(HA-DRL)을 제안했다. potential-based reward shaping과 progressive replay로 policy 학습을 개선했다. 시뮬레이션과 실제 산업 현장 모두에서 기존 DRL보다 주행 성능이 좋았고, fine-tuning 없이 실물 로봇으로 옮겨졌다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116216"><div><div class="t">14. <a href="https://doi.org/10.1016/j.engappai.2026.116216" target="_blank">Verification-gated agentic mission-state governance for intelligent industrial multi-robot systems</a></div><div class="m">Guoqin Tang, Qingxuan Jia, Yichen Tan 외 · Engineering Applications of Artificial Intelligence · 2026-11 #인간로봇</div><div class="g">agentic AI가 산업용 다중 로봇의 장기 작업에서 내놓는 행동 제안이 작업 의존성이나 자원 점유와 충돌하는 문제를 다룬다. task forest와 governed blackboard를 mission state로 유지하고, 중앙 serial coordinator가 제안을 검증한 뒤에만 반영한다. 30-seed benchmark에서 평균 완료율은 Medium 0.921, Large 0.898로 DART-DAG·LiP-LP보다 높았고, Medium에서는 무효 commit이 0이 됐다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116414"><div><div class="t">15. <a href="https://doi.org/10.1016/j.engappai.2026.116414" target="_blank">Corrigendum to “Deep learning architectures for autonomous feature selection in residential energy modelling” [Eng. Appl. Artif. Intell. 182 (2026) 116102]</a></div><div class="m">Hafiz Muhammad Athar Farid, Shamaila Iram, Richard Hill 외 · Engineering Applications of Artificial Intelligence · 2026-10 #건물성능</div><div class="g">초록 없음</div></div></label>
<label><input type="checkbox" value="10.1061/jcemd4.coeng-17907"><div><div class="t">16. <a href="https://doi.org/10.1061/jcemd4.coeng-17907" target="_blank">Impact of Fatigue on Mind-Wandering in Drilling Crews for Engineering Safety: A Lab-in-the-Field Experiment</a></div><div class="m">Shen Liaoyuan, Su Hao, Qing Xin 외 · Journal of Construction Engineering and Management · 2026-12-01 #안전행동 #웨어러블</div><div class="g">시추 작업자의 피로가 mind-wandering(MW)을 일으키는 뇌 네트워크 기전을 처음으로 현장(lab-in-the-field)에서 실험한 연구다. 석유·가스 시추 현장에서 피로군과 각성군의 EEG 네트워크와 반응시간을 비교했다. 피로군은 MW 중 반응시간이 유의하게 길었고, global efficiency와 algebraic connectivity는 낮아지고 modularity는 높아지는 뇌 네트워크 재구성이 나타났다.</div></div></label>
<label><input type="checkbox" value="10.1061/jcemd4.coeng-18305"><div><div class="t">17. <a href="https://doi.org/10.1061/jcemd4.coeng-18305" target="_blank">Optimal Selection of Affordable Wearable Devices that Minimize Construction Stresses on Multiple Body Parts</a></div><div class="m">Omar Attalla, Ahmed Attalla, Fam Saeed 외 · Journal of Construction Engineering and Management · 2026-12-01 #웨어러블 #안전행동</div><div class="g">값비싼 외골격 대신 저가 웨어러블 기기로 건설 작업자의 신체 부위별 근골격 부하를 줄이고, 작업자에게 맞는 기기를 고르는 프레임워크다. 공개 재해 데이터로 고위험 부위를 찾고, 실험실 실험(참가자 18명, 기기 11종)에서 기기를 지원 수준 저·중·고로 clustering했다. 이어 neural network로 작업자 특성에 따른 필요 지원 수준을 추정하고, 최적화 모델로 기기를 추천했다.</div></div></label>
