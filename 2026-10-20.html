<h1>논문 선택 — 2026-10-20</h1>
<div class="sub">체크하고 아래 「보내기」를 누르면 DOI 목록이 채워진 메일 작성창이 뜹니다. <b>전송</b>하면 5분 안에 접수 확인 메일이 옵니다.</div>
<h2>신규 13편</h2><div class="sub">체크하면 전문을 받아 노트를 씁니다.</div>
<label><input type="checkbox" value="10.1016/j.aei.2026.105347"><div><div class="t">1. <a href="https://doi.org/10.1016/j.aei.2026.105347" target="_blank">Causal Explanation Enhanced Deep Reinforcement Learning for robust scheduling in degradation-prone flexible job shops</a></div><div class="m">Yuxin Peng, Wei Qin, Youlong Lv 외 · Advanced Engineering Informatics · 2027-01 </div><div class="g">flexible job shop에서 장비 열화가 내생적으로 진행되는데, 기존 DRL 스케줄링은 고장을 외생적 확률사건으로 가정해 단기 효율 위주의 greedy 전략에 치우친다. 이를 풀기 위해 물리적 열화·기회정비 회복 과정을 모델링한 환경 위에 인과 설명을 결합한 CE-DRL 스케줄링 기법을 제안해 스케줄의 강건성과 의사결정 신뢰성을 높였다. 제조 스케줄링 연구지만 탈현장 공장 스케줄링에 응용할 여지가 있다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105383"><div><div class="t">2. <a href="https://doi.org/10.1016/j.aei.2026.105383" target="_blank">Erratum to “Quantifying experience-based residential layout quality in floor-plan evaluation with knowledge-grounded LLM rules” [Adv. Eng. Informat. 77p2 (2026) 1–26/105329]</a></div><div class="m">Jiachen Bu, Zhenchao Yang, Shiyuqian Wang 외 · Advanced Engineering Informatics · 2026-10 </div><div class="g">초록 없음</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105402"><div><div class="t">3. <a href="https://doi.org/10.1016/j.aei.2026.105402" target="_blank">Optimizing robotic connection task sequencing in off-site structural assembly: an obstacle-aware deep reinforcement learning method</a></div><div class="m">Yizhe Wang, Cong Zhang, Yihai Fang · Advanced Engineering Informatics · 2027-01 #모듈러 #인간로봇</div><div class="g">탈현장 구조 조립에서 못박기·나사 체결 같은 로봇 접합 작업의 순서를 공구 용량과 장애물 제약 아래 최적화하는 문제를 다룬다. 용량 제약 경로 문제로 정식화하고, Dijkstra로 미리 계산한 장애물 회피 거리 행렬을 DRL에 넣어 학습 효율을 크게 높였다. 공장 레이아웃의 프레임 접합 사례에서 0.1초 이내에 근사 최적해를 내며 휴리스틱보다 우수했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116563"><div><div class="t">4. <a href="https://doi.org/10.1016/j.engappai.2026.116563" target="_blank">Physics-informed transformer for pseudo-color infrared image super-resolution with application to insulator detection</a></div><div class="m">Changyong Shen, Zixiang Wei, Zhikang Yuan 외 · Engineering Applications of Artificial Intelligence · 2026-12 #컴퓨터비전 #구조점검</div><div class="g">스마트그리드 애자 열화 진단에서 산업용 열화상 카메라는 해상도가 낮고 센서 노이즈가 있다는 문제를 다룬다. 적외선 denoising 블록, 학습형 unsharp masking, high-frequency attention과 thermal-consistency loss를 갖춘 physics-informed transformer FIRE-Net으로 pseudo-color 적외선 영상을 super-resolution했다. 애자 적외선 테스트셋에서 PSNR 약 31.0 dB를 기록했다.</div></div></label>
<label><input type="checkbox" value="10.1061/jccee5.cpeng-7218"><div><div class="t">5. <a href="https://doi.org/10.1061/jccee5.cpeng-7218" target="_blank">Real-Time Rock Mass Class Identification of the Tunnel Face Based on the Spatial-Temporal Characteristics of TBM Tunneling Parameters</a></div><div class="m">Dongxin Liu, Qiuming Gong, Xingfei Xie 외 · Journal of Computing in Civil Engineering · 2027-01-01 </div><div class="g">TBM 굴진 파라미터가 암반 조건에 따라 보이는 시공간적·비유클리드 특성을 이용해 막장 암반 등급을 실시간으로 판별하는 문제를 다룬다. YCJL 프로젝트 8.41 km 구간에서 얻은 2,367개 샘플로 STGCN 모델을 학습하고 downsampling으로 연산량을 줄였다. accuracy 93.04%, F1 89.75%로 주류 모델보다 우수했고, 인접행렬 분석으로 모델을 해석했다.</div></div></label>
<label><input type="checkbox" value="10.1061/jccee5.cpeng-7374"><div><div class="t">6. <a href="https://doi.org/10.1061/jccee5.cpeng-7374" target="_blank">Data–Model Synergy in Asphalt Viscoelasticity: A Fractional-Order Physics-Informed Neural Network Framework with Depth-Resolved Heterogeneity Decoupling</a></div><div class="m">Enhao Zhang, Liyan Shan, Shuang Liu 외 · Journal of Computing in Civil Engineering · 2027-01-01 </div><div class="g">아스팔트 바인더의 점탄성 거동을 모델링하기 위해 fractional-order Kelvin–Voigt 모델을 PINN에 넣은 FO-PINN 프레임워크를 제안한다. Kramers–Kronig 제약, 깊이·주파수 입력 특징, material embedding을 써서 바인더 종류 간 일반화를 확보했다. 광대역 동탄성계수를 global R² &gt; 0.96으로 재현했고, 포장 디지털트윈의 기반 도구로 쓸 수 있다고 제시한다.</div></div></label>
<label><input type="checkbox" value="10.1061/jcemd4.coeng-18541"><div><div class="t">7. <a href="https://doi.org/10.1061/jcemd4.coeng-18541" target="_blank">Developing a Recovery Pattern Model for Construction Workers: A Machine-Learning Approach</a></div><div class="m">Haiyi Zong, Wen Yi, Albert P. C. Chan 외 · Journal of Construction Engineering and Management · 2027-01-01 #안전행동 #웨어러블</div><div class="g">건설 작업자마다 회복 속도가 달라 표준 휴식 일정은 효과가 떨어지는 반면, 완전 개인화는 현장에서 실행하기 어렵다. 중국 5개 현장 작업자 199명에게서 탈진 후 회복 시 생리·개인·환경 변수를 수집하고, time-series clustering으로 빠름·보통·느림 3가지 회복 패턴을 도출했다. 이어 머신러닝으로 작업자의 회복 패턴을 예측해 패턴 기반 휴식 관리의 근거를 마련했다.</div></div></label>
<label><input type="checkbox" value="10.1061/jcemd4.coeng-18680"><div><div class="t">8. <a href="https://doi.org/10.1061/jcemd4.coeng-18680" target="_blank">Tower Crane–Mounted Multisensor System for Real-Time 3D Spatial Mapping in Modular Integrated Construction</a></div><div class="m">Ali Hassan Ali, Tarek Zayed, Muhammad Muddassir 외 · Journal of Construction Engineering and Management · 2027-01-01 #모듈러 #컴퓨터비전 #안전행동</div><div class="g">모듈러 통합 건설(MiC)에서 타워크레인 운전원의 상황 인식이 부족해 생기는 안전 위험을 다룬다. 크레인에 LiDAR와 RGB 카메라를 달고 SLAM 기반 R3LIVE로 운전원 시점의 컬러 3D 지도를 실시간 생성하는 프레임워크를 제안했다. 축소 크레인 모델로 정상·저시정 조건 실내 실험을 해 지도 완성도 등 의사결정 관련 지표로 성능을 검증했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.buildenv.2026.115465"><div><div class="t">9. <a href="https://doi.org/10.1016/j.buildenv.2026.115465" target="_blank">A possible priority-driven mechanism and semantic regularities in human touch behaviour</a></div><div class="m">Pengcheng Zhao, Hua Qian, Peihua Wang 외 · Building and Environment · 2026-10 #안전행동</div><div class="g">실내 재실자의 접촉 행동이 heavy-tailed 통계를 보이는데 그 생성 메커니즘은 불분명하다. 11개 실제 시나리오에서 70만 건 이상의 접촉 이벤트를 분석해 행동의 약 85%가 객체 15%에 집중되는 power-law 패턴을 확인했다. 이를 설명하는 priority-driven 행동 모델을 제안했고, 접촉 시퀀스에 예측에 쓸 수 있는 semantic 규칙성이 있음을 보였다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.cacaie.2026.100250"><div><div class="t">10. <a href="https://doi.org/10.1016/j.cacaie.2026.100250" target="_blank">Transformer-based controllable diffusion model for high-fidelity railway track slab crack image generation</a></div><div class="m">Chao Zou, Zhixiong Chen, Yu Qian 외 · Computer-Aided Civil and Infrastructure Engineering · 2026-10 #컴퓨터비전 #구조점검</div><div class="g">철도 궤도 슬래브 균열 segmentation 학습에 쓸 고품질 라벨 영상이 부족하다는 문제를 다룬다. 배경 영상과 균열 mask를 조건으로 받는 Transformer 기반 controllable diffusion model을 제안해, 원하는 위치에 미세 형상과 장거리 연속성을 갖춘 균열을 생성했다. U-Net 기반 diffusion보다 불규칙 균열의 전역 연결성과 위상 일관성을 잘 보존한다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.dibe.2026.101084"><div><div class="t">11. <a href="https://doi.org/10.1016/j.dibe.2026.101084" target="_blank">A Graph-GRU predictor with model-coupled risk-aware routing closes the loop on semantic indoor trajectories to enhance heritage site resilience</a></div><div class="m">Siliu Fu, Haytham F. Isleem · Developments in the Built Environment · 2026-10 #안전행동</div><div class="g">과잉관광으로 문화유산 시설의 혼잡과 방문객 안전 위험이 커지는 문제를 다룬다. 실내 궤적을 단기 예측하는 경량 Semantic Graph-GRU와, 예측 밀도를 적응형 경로 정책으로 바꾸는 다목적 위험 인지 라우터를 묶어 폐루프 프레임워크를 구성했다. 518만 개 궤적 데이터 기반 시뮬레이션에서 최대 혼잡을 35%, 위험 노출을 66% 줄였다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116462"><div><div class="t">12. <a href="https://doi.org/10.1016/j.engappai.2026.116462" target="_blank">Object detection of overhead power line components, defects, and foreign objects via multi-source co-occurrence reasoning</a></div><div class="m">Minghui Tian, Jianqi Li, Binfang Cao 외 · Engineering Applications of Artificial Intelligence · 2026-12 #컴퓨터비전 #구조점검</div><div class="g">항공 영상에서 가공 송전선의 부품·결함·이물질을 검출할 때 클래스 내 외형 차이, 스케일 차이, 종횡비 차이가 크다는 문제를 다룬다. multi-source co-occurrence reasoning GCN(MSCR-GCN), cross-scale fusion network(FCCFN), 폭·높이 제약을 분리한 GAIoU loss를 YOLO에 결합한 MMGY-Net을 제안했다. 다중 출처 정보를 함께 추론해 검출 표현력과 판별력을 높였다.</div></div></label>
<label><input type="checkbox" value="10.1061/jccee5.cpeng-7973"><div><div class="t">13. <a href="https://doi.org/10.1061/jccee5.cpeng-7973" target="_blank">Building Inclination Measurement Based on Point Cloud Data</a></div><div class="m">Jihyeon Mun, Kyuman Cho, Taehoon Kim · Journal of Computing in Civil Engineering · 2027-01-01 #구조점검 #컴퓨터비전</div><div class="g">트랜싯(theodolite) 같은 기존 측량 기구로 건물 기울기를 재면 측정자에 따라 정확도가 흔들린다는 문제를 다룬다. UAV에 실은 3D LiDAR와 GNSS로 지리참조 point cloud를 얻고, 3D 좌표 기반 기하 연산으로 방향별 기울기와 기울기 등급을 산출하는 방법을 제안했다. 3개 현장에 적용한 결과 로봇 토털스테이션(RTS) 측정과 잘 일치했고, 순위도 일관되게 나왔으며, 측정자 의존 편차가 줄었다.</div></div></label>
</main>

<script>
const TO="bjchoi13@gmail.com", ME="bchoi@ajou.ac.kr", KEY="2026-10-20", K="picks-"+KEY, OLD=false;
const boxes=[...document.querySelectorAll("input")], gm=document.getElementById("gm"), ap=document.getElementById("ap");
try{const s=JSON.parse(localStorage.getItem(K)||"[]");boxes.forEach(b=>b.checked=s.includes(b.value))}catch(e){}
const sel=()=>boxes.filter(b=>b.checked).map(b=>b.value);
function upd(){const d=sel();document.getElementById("n").textContent=d.length;
  gm.disabled=ap.disabled=!d.length&&!OLD;   // 검토 칸이 있으면 0편도 보낼 수 있다(전부 지움)
  try{localStorage.setItem(K,JSON.stringify(d))}catch(e){}}
boxes.forEach(b=>b.addEventListener("change",upd));upd();
const su=()=>"[논문선택] "+KEY+" "+sel().length+"편", body=()=>sel().join("\n")+"\n", q=encodeURIComponent;
const done=()=>document.getElementById("msg").style.display="block";
// 폰에서는 Gmail 웹 작성창 주소가 앱·받은편지함으로 넘어가며 내용을 잃는다(2026-09-27 실측). 메일 앱을 주 버튼으로.
if(matchMedia("(pointer:coarse)").matches){gm.className="alt";ap.className="";gm.parentNode.insertBefore(ap,gm)}
gm.onclick=()=>{done();window.open("https://mail.google.com/mail/?authuser="+q(ME)+"&view=cm&fs=1&to="+q(TO)+"&su="+q(su())+"&body="+q(body()),"_blank")};
