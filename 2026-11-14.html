<h1>논문 선택 — 2026-11-14</h1>
<div class="sub">체크하고 아래 「보내기」를 누르면 DOI 목록이 채워진 메일 작성창이 뜹니다. <b>전송</b>하면 5분 안에 접수 확인 메일이 옵니다.</div>
<h2>신규 20편</h2><div class="sub">체크하면 전문을 받아 노트를 씁니다.</div>
<label><input type="checkbox" value="10.1016/j.cacaie.2026.100270"><div><div class="t">1. <a href="https://doi.org/10.1016/j.cacaie.2026.100270" target="_blank">Layer-wise compression for as-built models of steel components in civil engineering using geometry-specific octree context modeling</a></div><div class="m">Hao Ren, Zhongqiu Fu, Bohai Ji 외 · Computer-Aided Civil and Infrastructure Engineering · 2026-11 #디지털트윈 #구조점검</div><div class="g">강구조 부재를 다시점 지상 레이저 스캐닝(TLS)으로 만든 as-built 점군은 용량이 커서 저장·관리 부담이 크다. 정합 때문에 생기는 밀도 차이를 층별 전처리로 줄이고, 점군을 범주별로 나눈 뒤 범주마다 형상 특성에 맞춘 octree context model로 압축한다. 기존 octree 기반 방법보다 압축 성능이 좋아졌다고 보고한다. 초록이 중간에 잘려 수치는 없다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116684"><div><div class="t">2. <a href="https://doi.org/10.1016/j.engappai.2026.116684" target="_blank">A unified vision-language framework for multi-task pavement crack assessment</a></div><div class="m">Mei Chen, Jiabin Huang, Rui Ding 외 · Engineering Applications of Artificial Intelligence · 2027-01 #컴퓨터비전 #구조점검</div><div class="g">도로 포장 균열 평가에는 장면 수준의 의미 이해와 픽셀 수준의 정밀도가 함께 필요하다. 이를 위해 image description, visual grounding, reasoning segmentation을 하나로 묶은 end-to-end 멀티모달 모델 CrackVLM을 제안한다. dual-prompt injection으로 텍스트 답을 좌표와 임베딩으로 바꿔 mask 생성을 유도하고, selective gradient masking으로 사전학습 임베딩 공간을 보존한다. 균열 분야 최초의 멀티태스크 데이터셋도 구축했다(초록이 잘려 성능 수치는 없음).</div></div></label>
<label><input type="checkbox" value="10.1061/jccee5.cpeng-7318"><div><div class="t">3. <a href="https://doi.org/10.1061/jccee5.cpeng-7318" target="_blank">High-Precision 3D Pavement Data Preprocessing Method Integrating Wavelet and VMD Decomposition</a></div><div class="m">Shihai Ding, Xiaoping Cheng, Changfa Ai 외 · Journal of Computing in Civil Engineering · 2027-03-01 #구조점검</div><div class="g">아스팔트 포장의 고정밀 3D 레이저 점군에 섞인 노이즈와 기울기 왜곡을 제거하는 전처리 방법이다. 점군을 2,048개 2D 단면 프로파일로 나눠 VMD로 IMF를 분해하고, 노이즈가 지배적인 IMF는 wavelet으로 denoise한다. 이차 다항식으로 맞춘 경사항을 빼서 warping을 없앤 뒤 3D로 다시 합친다. Kurtosis와 시각 평가로 성능을 확인했다.</div></div></label>
<label><input type="checkbox" value="10.1061/jccee5.cpeng-7952"><div><div class="t">4. <a href="https://doi.org/10.1061/jccee5.cpeng-7952" target="_blank">Plane-Informed Dynamic Visual SLAM in Low-Texture Indoor Construction Environments</a></div><div class="m">Wenyu Li, Xinyu Chen, Yantao Yu · Journal of Computing in Civil Engineering · 2027-03-01 #컴퓨터비전 #인간로봇</div><div class="g">실내 마감 시공 로봇(조적·미장·타일)은 정밀한 위치 추정이 필요한데, 시공 중인 실내는 텍스처가 적고 작업자와 장비가 움직이는 동적 환경이라 visual SLAM이 불안정하다. 이 연구는 벽·천장·바닥 같은 평면이 지배적인 특징이라는 점에 착안해, 평면 정보를 활용하면서 동적 객체에 강건한 visual SLAM을 제안한다. 초록이 잘려 결과 수치는 없다.</div></div></label>
<label><input type="checkbox" value="10.1061/jcemd4.coeng-17120"><div><div class="t">5. <a href="https://doi.org/10.1061/jcemd4.coeng-17120" target="_blank">Low-Carbon Mass Concrete in Vietnam: A Life Cycle and Cost Analysis</a></div><div class="m">Vu Hong Son Pham, Van Nam Nguyen, Nghia P. Tran 외 · Journal of Construction Engineering and Management · 2027-02-01 </div><div class="g">베트남의 50 MPa 매스 콘크리트에 GGBFS·플라이애시·폐쇄사 같은 산업 부산물을 쓰는 배합 3종을 비교했다. 방법은 냉각수 에너지 모델링을 포함한 cradle-to-gate LCA, 비용 분석, 다기준 평가다. GGBFS 50% 배합(M1)이 지구온난화지수 280.75 kg CO2-eq/m³로 가장 낮았고, 플라이애시 배합(M2)이 USD 43.5/m³로 가장 저렴했다.</div></div></label>
<label><input type="checkbox" value="10.1061/jcemd4.coeng-19075"><div><div class="t">6. <a href="https://doi.org/10.1061/jcemd4.coeng-19075" target="_blank">The Digital Future of Road Maintenance: An MCDM for Evaluating Data-Driven Road Maintenance Strategies for the M-30 Highway</a></div><div class="m">Jorge Jerez Cepa, Marcos García Alberti, María Belén Muñoz-Medina · Journal of Construction Engineering and Management · 2027-02-01 #구조점검</div><div class="g">마드리드 M-30 도시 순환 고속도로를 사례로, 디지털화 중심의 데이터 기반 도로 유지관리 전략들을 비교 평가했다. 유지관리 계약의 KPI에서 뽑은 기능 기준과 지속가능성 기준을 묶고, 전문가 보정 entropy 가중을 쓰는 하이브리드 MCDM을 적용했다. 운영·사회·경제 기준을 통합해 대안 전략을 비교하는 의사결정 틀을 제시한다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107344"><div><div class="t">7. <a href="https://doi.org/10.1016/j.autcon.2026.107344" target="_blank">Automated design for manufacturing and assembly of prefabricated wall panels using BIM and evolutionary algorithms</a></div><div class="m">Lufeng Wang, Yuyang Chen, Wenyu Wang 외 · Automation in Construction · 2027-01 #모듈러 #BIM</div><div class="g">프리패브 벽패널의 현장 조립 배치 설계와 공장 생산을 함께 자동 최적화하는 BIM-DfMA 2단계 방법이다. 1단계에서는 nested EA(Outer EA와 Inner EA)로 현장 배치를 최적화하고, 2단계에서는 public gene pool 기반 EA로 생산을 최적화한다. 유전자 풀 인코딩으로 탐색 공간과 여분 패널 수를 줄였다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107354"><div><div class="t">8. <a href="https://doi.org/10.1016/j.autcon.2026.107354" target="_blank">Integrated viewpoint selection and route optimization for structured-light scanning of complex precast elements</a></div><div class="m">Tianze Chen, Dongsheng Li, Zhengtao Yang 외 · Automation in Construction · 2027-01 #모듈러 #BIM #구조점검</div><div class="g">형상이 복잡한 프리캐스트 부재를 structured-light로 스캔해 Scan-vs-BIM 품질검사를 할 때, 시점 선택과 이동 경로를 함께 최적화하는 계획 프레임워크다. ray tracing으로 후보 시점을 거르고, 센싱 한계·갠트리 이동 비용·BIM 커버리지 기준을 동시에 고려하는 memetic 최적화를 쓴다. 복잡한 부재 4종에서 Scan-vs-BIM 일치도 0.72 이상을 얻었다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.dibe.2026.101105"><div><div class="t">9. <a href="https://doi.org/10.1016/j.dibe.2026.101105" target="_blank">Pixel-level defect segmentation for bridge exterior using an improved query-based Transformer</a></div><div class="m">L. Minh Dang, Gayoon Lee, Sufyan Danish 외 · Developments in the Built Environment · 2026-11 #컴퓨터비전 #구조점검</div><div class="g">UAV로 찍은 교량 외관 이미지에서 결함을 픽셀 단위로 segmentation하는 query-based Transformer다. 흐림·저조도 복원 전처리, 결함이 아닌 고주파 응답을 억제하는 Wavelet-enhanced Cross-Attention, Prototype-guided 구조를 넣었다. 321,000장 이상의 콘크리트 결함 데이터로 학습했고, 기존 SOTA segmentation 모델보다 성능이 높으며 복잡한 배경 노이즈에도 강건했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.dibe.2026.101109"><div><div class="t">10. <a href="https://doi.org/10.1016/j.dibe.2026.101109" target="_blank">A digital twin for interpreting single-sensor anomaly detection in an in-service PSC-I girder bridge: member-level damage-severity scale and time-pattern classification</a></div><div class="m">Gitae Roh, Chi-Ho Jeon, Chang-Su Shim 외 · Developments in the Built Environment · 2026-11 #디지털트윈 #구조점검</div><div class="g">가속도계 1개로 하는 이상 탐지는 지표가 변했다는 사실만 알려준다. 이 연구는 그 변화가 실제 손상인지, 어느 정도인지 해석하려고 공용 중인 PSC-I 거더교에 디지털트윈을 만들었다. 단일 가속도계의 Mahalanobis distance 기록을 재하시험으로 보정한 FE 모델과 연결해 1년간 적용했다. 온도 보정과 14일 지속 규칙으로 시간 패턴 4종을 구분했고, 받침·거더 손상은 30% 정도부터 현장 경보 한계를 넘었다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116714"><div><div class="t">11. <a href="https://doi.org/10.1016/j.engappai.2026.116714" target="_blank">Blast wave propagation prediction in three-dimensional complex urban regions with two-dimensional boundary pressure input via deep learning and energy methods</a></div><div class="m">Shenghan Gao, Dingkun Luo, Yang Huang 외 · Engineering Applications of Artificial Intelligence · 2027-01 </div><div class="g">복잡한 3D 도시 지역에서 폭발파 전파를 빠르게 예측하는 방법이다. 도시를 가로 블록 단위로 나눠 인접 블록 사이의 경계 압력장을 순차적으로 넘겨준다. 블록마다 2D 경계 압력과 에너지 법칙을 쓰는 BTE-UNet으로 3D 폭발파를 예측한다. 대규모 도시의 폭발 하중 계산 비용을 크게 줄여 방폭 설계와 폭발 후 피해 평가에 쓸 수 있다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116775"><div><div class="t">12. <a href="https://doi.org/10.1016/j.engappai.2026.116775" target="_blank">Lightweight spectral-geometric network for elongated and weak industrial surface defect segmentation</a></div><div class="m">Zhiqian He, Yajun Chen, Zhujun Zhang 외 · Engineering Applications of Artificial Intelligence · 2027-01 #컴퓨터비전 #구조점검</div><div class="g">레일 표면처럼 가로세로 비율이 극단적인 검사 이미지에서 작고 대비가 약한 결함을 찾기 위한 경량 segmentation 네트워크 LEADNet이다. spectral-geometric backbone, edge-aware 비대칭 decoder, tolerance-aware edge-sharpening loss로 구성된다. 데이터셋 4종에서 정확도와 효율의 균형이 좋았다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116780"><div><div class="t">13. <a href="https://doi.org/10.1016/j.engappai.2026.116780" target="_blank">Generative adversarial network-augmented and multi-model fusion-based prediction of effective notch stress concentration factors in double-sided rib-to-deck welds of orthotropic steel decks</a></div><div class="m">Fan Zhang, Qiudong Wang, Bohai Ji 외 · Engineering Applications of Artificial Intelligence · 2027-01 #구조점검</div><div class="g">강바닥판(orthotropic steel deck)의 양면 rib-to-deck 용접부에서 effective notch 응력집중계수를 빠르게 예측해 피로 평가에 쓰려는 연구다. FE 해석 301건을 GAN으로 증강하고, 모델 8종과 fusion 전략 3종을 비교했으며 SHAP 해석과 GUI 배포까지 했다. 증강과 fusion의 효과는 모델과 예측 대상에 따라 달랐다. 외측 토에는 원본 데이터로 학습한 stacking, 내측 토에는 simple averaging을 골랐다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116783"><div><div class="t">14. <a href="https://doi.org/10.1016/j.engappai.2026.116783" target="_blank">Spatiotemporal temperature forecasting and maximum-temperature point localization along distributed optical fiber sensing lines in coal mine gobs using a hybrid model based on an inverted Transformer and a bidirectional long short-term memory network</a></div><div class="m">Wei Liu, Ruilin Li, Shiyang Peng · Engineering Applications of Artificial Intelligence · 2027-01 </div><div class="g">탄광 채굴적(gob)의 자연발화를 막기 위해, 분포형 광섬유 센싱 라인의 온도를 예측하고 최고 온도 지점을 찾는 프레임워크다. 측정점 사이에 attention을 거는 iTransformer로 온도를 예측하고, 최고 온도 지점 위치는 2층 BiLSTM 다중 분류로 찾는다. 1-step 예측에서 MAE 1.10, MSE 2.67로 표준 Transformer 대비 오차를 각각 47.04%, 62.64% 줄였다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.jobe.2026.117802"><div><div class="t">15. <a href="https://doi.org/10.1016/j.jobe.2026.117802" target="_blank">Cost Comparison of Conventional and 3D-Printed Concrete Wall Systems for Social Housing: A Case Study from Córdoba, Argentina</a></div><div class="m">LUDUEÑA Andrés, ORTIZ D. Milagro M, SLEDNEW R. Juan F 외 · Journal of Building Engineering · 2026-11 #모듈러</div><div class="g">아르헨티나 코르도바 사회주택의 벽체를 기존 프리패브 BENO 시스템과 3D 프린팅 콘크리트(3DCP) 시제품(53 m²)으로 짓는 경우의 비용을 비교했다. 장비비를 빼면 프린팅 벽체가 7.3% 더 비쌌다. 대신 벽체 노무비는 94.3% 줄고 노무시간은 2,262시간에서 131시간으로 감소했다. 배합 비용의 43.7%는 실리카퓸이 차지했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.enbuild.2026.118482"><div><div class="t">16. <a href="https://doi.org/10.1016/j.enbuild.2026.118482" target="_blank">Quantifying the security-closure thermal penalty: a behaviour-informed calibration framework for building performance simulation in security-constrained housing</a></div><div class="m">Sitotaw Akale Tilaye, Jiayu Zhang, Xiaodong Yang · Energy and Buildings · 2027-01 #건물성능</div><div class="g">방범 때문에 밤에 창문을 닫는 행동을 반영하지 않은 재실 스케줄이 자연환기 냉방 효과를 과대평가하는 정도(SCTP)를 정량화했다. 아디스아바바 48가구의 디지털 일지 관측 3,584건으로 창문 개방 행동을 측정해 EnergyPlus를 보정했다. 저층의 야간 창문 개방률은 8.3%로 기준 스케줄 52.0%보다 훨씬 낮았다. 방범 폐쇄를 반영하면 실내 최고온도가 1.8~2.6 °C 높아지고 냉방 효과는 25~38% 과대평가된 것으로 나왔다. 일지로 보정한 뒤 MBE는 −7.5%였다.</div></div></label>
