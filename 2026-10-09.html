<h1>논문 선택 — 2026-10-09</h1>
<div class="sub">체크하고 아래 「보내기」를 누르면 DOI 목록이 채워진 메일 작성창이 뜹니다. <b>전송</b>하면 5분 안에 접수 확인 메일이 옵니다.</div>
<h2>신규 15편</h2><div class="sub">체크하면 전문을 받아 노트를 씁니다.</div>
<label><input type="checkbox" value="10.1016/j.aei.2026.105300"><div><div class="t">1. <a href="https://doi.org/10.1016/j.aei.2026.105300" target="_blank">Secure resilient cloud–edge workshop scheduling with topology-bounded recovery and failover</a></div><div class="m">Congcheng Gong, Chen Yang, Wenqi Niu 외 · Advanced Engineering Informatics · 2027-01 </div><div class="g">클라우드–엣지 flexible job shop(FJSP)에서 장비 고장 시 빠른 복구와 설비 능력 데이터 보호를 함께 달성하는 문제를 다룬다. 계층적 조정, topology-bounded recovery, 인증 기반 failover, 비공개 백업 설비 선택(2SS-TopK)을 결합한 edge-native 프레임워크를 제안했다. Brandimarte 인스턴스에서 5개 정책을 비교한 결과, 잦은 고장 상황에서 failover 지연이 줄었다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107295"><div><div class="t">2. <a href="https://doi.org/10.1016/j.autcon.2026.107295" target="_blank">LLM-based Structured Intermediate Representation for building regulation encoding</a></div><div class="m">Pinzhang Wu, Avinash Malik, Partha Roop 외 · Automation in Construction · 2027-01 #BIM</div><div class="g">건축법규를 자동 적합성 검토용 형식 표현으로 변환하기 어려운 문제를 다룬다. LLM으로 Structured Intermediate Representation(SIR)을 거쳐 LegalRuleML을 생성하는 2단계 pipeline을 뉴질랜드 건축법(NZBC) 데이터로 구축했다. fine-tuning한 4개 모델이 F1 73.29~77.23%로 기존 SOTA보다 최대 2.40% 높았지만, 전문가가 작성한 SIR(80% 이상)에는 미치지 못했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116383"><div><div class="t">3. <a href="https://doi.org/10.1016/j.engappai.2026.116383" target="_blank">Designing a new decision-making model to evaluate non-governmental organizations&#x27; performance under uncertainty: A case for Türkiye</a></div><div class="m">Sezin Güleryüz · Engineering Applications of Artificial Intelligence · 2026-12 </div><div class="g">재난 대응 NGO의 성과를 불확실성 속에서 평가하는 문제를 다룬다. 기준 가중치는 spherical fuzzy AHP로, 대안 순위는 spherical fuzzy TOPSIS로 정하는 통합 MCDM 모델을 제안하고 튀르키예 사례에 적용했다. 건설과의 접점은 재난지역 인프라 맥락 정도로 약하다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116479"><div><div class="t">4. <a href="https://doi.org/10.1016/j.engappai.2026.116479" target="_blank">A Bayesian-network-guided spatiotemporal model for ship navigation-status prediction in the Three Gorges Reservoir Area</a></div><div class="m">Jie Man, Xueqian Xu, Bing Wu 외 · Engineering Applications of Artificial Intelligence · 2026-12 </div><div class="g">싼샤댐과 거저우바댐 사이 구간에서 화물선 통항 가능 여부를 2~8시간 앞서 예측하는 문제를 다룬다. 18개 노드 Bayesian network로 중간 상태를 보완하고 그래프 구조를 제공한 뒤, graph neural network와 Transformer로 변수 의존성과 시간 변화를 학습했다. 선박 200척의 2024년 AIS·수문·교통관리·기상 데이터 25,216건으로 검증했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116498"><div><div class="t">5. <a href="https://doi.org/10.1016/j.engappai.2026.116498" target="_blank">Safeguarded online self-training for continual tunnel-face blast-hole detection</a></div><div class="m">Lijie Yu, Bangshu Xu, Shuaishuai Wang 외 · Engineering Applications of Artificial Intelligence · 2026-12 #컴퓨터비전</div><div class="g">라벨 없이 계속 쌓이는 터널 막장 영상에서 발파공을 지속적으로 검출하는 문제를 다룬다. 고정 개발셋 gate가 detector와 pseudo-label 메모리 갱신을 받아들일지 판정하는 safeguarded online self-training을 제안했다. 이미지 956장, 발파공 9,728개로 실험해 후보 갱신 12건 중 8건이 채택됐고, 무조건 갱신보다 AP50이 0.0197 높았다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.jobe.2026.117547"><div><div class="t">6. <a href="https://doi.org/10.1016/j.jobe.2026.117547" target="_blank">A Robotic Ultrasonic Pulse Velocity System for Reclaimed Clay Bricks: A statistical comparison between manual and robotic measurements</a></div><div class="m">Dang Hoang Nam Nguyen, Pranav Chougule, Alejandra Holgate 외 · Journal of Building Engineering · 2026-10 #인간로봇</div><div class="g">재사용 점토벽돌의 품질 평가를 자동화하려고 로봇 기반 초음파 펄스속도(UPV) 측정 시스템을 개발했다. 벽돌 10장에서 좌표를 맞춘 수동·로봇 측정값 300쌍을 비교한 결과, R²=0.76, 평균 편향 12.2 m/s(0.59%)였고 평균값 차이는 통계적으로 유의하지 않았다. 로봇 측정으로 작업자에 따른 편차가 줄었다.</div></div></label>
<label><input type="checkbox" value="10.1061/jcemd4.coeng-18788"><div><div class="t">7. <a href="https://doi.org/10.1061/jcemd4.coeng-18788" target="_blank">Patterns and Impacts of OHS Risks among Plumbers in Australia: Insights from 15 Years of National Workers’ Compensation Data</a></div><div class="m">Imriyas Kamardeen, Abid Hasan · Journal of Construction Engineering and Management · 2026-12-01 #안전행동</div><div class="g">호주 건설업 배관공의 산업안전보건(OHS) 위험을 15년치(2009~2023) 산재보상 데이터로 분석했다. 카이제곱 분할표 분석 결과, 물리적 부상이 80%를 차지했고 질병은 근골격계 질환(MSD)과 소음성 난청이 주를 이뤘다. 사망은 석면 관련 질환과 감전이 주원인이었다. 배관공은 건설업 전체 사고의 약 10%를 차지했으며, 영세 사업장과 견습공의 피해가 컸다.</div></div></label>
<label><input type="checkbox" value="10.1061/jcemd4.coeng-18862"><div><div class="t">8. <a href="https://doi.org/10.1061/jcemd4.coeng-18862" target="_blank">How Instrumental and Expressive Ties Shape Team Resilience in Digitally Mediated Construction Projects: The Moderating Role of Communication Visibility</a></div><div class="m">Shan Jiang, Florence Yean Yng Ling, Liang Xiao · Journal of Construction Engineering and Management · 2026-12-01 </div><div class="g">디지털로 소통하는 건설 프로젝트에서 도구적 유대와 표현적 유대가 팀 회복탄력성에 미치는 영향을 분석했다. 중국 건설 프로젝트 설문 결과, 도구적 유대는 지식 통합을 거쳐, 표현적 유대는 팀 성찰을 거쳐 회복탄력성과 연결됐다. 커뮤니케이션 가시성은 도구적 유대의 효과를 선형으로 키웠지만, 표현적 유대에 대해서는 역U자형 조절효과를 보였다.</div></div></label>
<label><input type="checkbox" value="10.1061/jmenea.meeng-7529"><div><div class="t">9. <a href="https://doi.org/10.1061/jmenea.meeng-7529" target="_blank">Progressive Public–Private Partnerships: Evidence from Two Case Studies on Convergence and Divergence in Collaborative Development</a></div><div class="m">Michael J. Garvin, Jonathan L. Gifford, Youngjin Kim 외 · Journal of Management in Engineering · 2027-01-01 </div><div class="g">고정가격형 P3의 대안으로 등장한 progressive P3(사전개발협약 PDA 활용)의 협업 개발 과정을 다룬다. 펜실베이니아 DOT의 교량 P3 사업과 메릴랜드 DOT의 Op Lanes 사업을 비교 사례로 분석했다. 발주자 준비도와 사업 준비 수준이 사업이 실행으로 수렴할지, 개발 단계에서 갈라질지를 가른다는 점을 도출했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105337"><div><div class="t">10. <a href="https://doi.org/10.1016/j.aei.2026.105337" target="_blank">A structured review of railway obstacle detection as an engineering informatics problem: Sensing, representation, decision support, and traceability</a></div><div class="m">Zhichao Chen, Lifang Chen, Jianjun Gong 외 · Advanced Engineering Informatics · 2027-01 #컴퓨터비전</div><div class="g">철도 장애물 검출(ROD)을 인지 benchmark가 아닌 engineering informatics 문제로 재정의한 구조화 리뷰다. 근거 성숙도를 5단계(M0~M4)로 나눈 틀로 문헌을 정리했다. 철도 데이터셋 9종과 visual·3D·fusion·tracking·anomaly detection 기법을 비교하고, 센싱부터 배치 보증·사후 추적성까지 기술 흐름을 종합했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105348"><div><div class="t">11. <a href="https://doi.org/10.1016/j.aei.2026.105348" target="_blank">X-MAG: LLM-driven multi-agent framework for XML-based SysML model generation</a></div><div class="m">Yuzhao Luo, Ming Zhu, Hengzhi Su 외 · Advanced Engineering Informatics · 2027-01 </div><div class="g">초록 없음</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105354"><div><div class="t">12. <a href="https://doi.org/10.1016/j.aei.2026.105354" target="_blank">Automated gaze-based behavioral segmentation and temporal representation for bridge inspection</a></div><div class="m">Daniel Jimenez Gil, Haosen Zhang, Zixin Wang 외 · Advanced Engineering Informatics · 2027-01 #구조점검 #웨어러블</div><div class="g">초록 없음</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107299"><div><div class="t">13. <a href="https://doi.org/10.1016/j.autcon.2026.107299" target="_blank">Knowledge-infused framework for crack diagnosis, condition assessment, and maintenance planning of concrete structures</a></div><div class="m">Pengwei Guo, Zhan Jiang, Yonghua Shu 외 · Automation in Construction · 2027-01 #구조점검</div><div class="g">초록 없음</div></div></label>
<label><input type="checkbox" value="10.1016/j.buildenv.2026.115380"><div><div class="t">14. <a href="https://doi.org/10.1016/j.buildenv.2026.115380" target="_blank">UAV-Assisted Quantitative Infrared Thermography Procedure for Thermal Measurements in Building Inspections</a></div><div class="m">Elena Lucchi, Andrea Garzulino · Building and Environment · 2026-10 #구조점검 #건물성능</div><div class="g">초록 없음</div></div></label>
<label><input type="checkbox" value="10.1016/j.cacaie.2026.100244"><div><div class="t">15. <a href="https://doi.org/10.1016/j.cacaie.2026.100244" target="_blank">Vehicle Trajectory Reconstruction in Long Work Zones Using a Vehicle Group Aware Physics–Behavior Informed Generative Framework</a></div><div class="m">Md Tawkir Ahmed, Sabyasachee Mishra, Mohammad Miralinaghi · Computer-Aided Civil and Infrastructure Engineering · 2026-10 #컴퓨터비전</div><div class="g">긴 공사구간(work zone)의 다중 카메라 영상에서 끊긴 차량 궤적을 복원하는 문제를 다룬다. 차량 그룹을 고려한 Graph Transformer로 여러 후보 궤적을 생성한 뒤, 운동 타당성·끝점 일관성·차량 추종·차로 변경 규칙으로 최종 궤적을 골랐다. 인위적으로 가린 구간, 실제 불연속 구간, 예측 구간 길이와 노이즈 수준 변화, 교차 데이터셋 조건에서 검증했다.</div></div></label>
</main>

<script>
const TO="bjchoi13@gmail.com", ME="bchoi@ajou.ac.kr", KEY="2026-10-09", K="picks-"+KEY, OLD=false;
const boxes=[...document.querySelectorAll("input")], gm=document.getElementById("gm"), ap=document.getElementById("ap");
try{const s=JSON.parse(localStorage.getItem(K)||"[]");boxes.forEach(b=>b.checked=s.includes(b.value))}catch(e){}
const sel=()=>boxes.filter(b=>b.checked).map(b=>b.value);
function upd(){const d=sel();document.getElementById("n").textContent=d.length;
  gm.disabled=ap.disabled=!d.length&&!OLD;   // 검토 칸이 있으면 0편도 보낼 수 있다(전부 지움)
  try{localStorage.setItem(K,JSON.stringify(d))}catch(e){}}
boxes.forEach(b=>b.addEventListener("change",upd));upd();
const su=()=>"[논문선택] "+KEY+" "+sel().length+"편", body=()=>sel().join("\n")+"\n", q=encodeURIComponent;
const done=()=>document.getElementById("msg").style.display="block";
// 폰에서는 Gmail 웹 작성창 주소가 앱·받은편지함으로 넘어가며 내용을 잃는다(2026-09-27 실측). 메일 앱을 주 버튼으로.
if(matchMedia("(pointer:coarse)").matches){gm.className="alt";ap.className="";gm.parentNode.insertBefore(ap,gm)}
gm.onclick=()=>{done();window.open("https://mail.google.com/mail/?authuser="+q(ME)+"&view=cm&fs=1&to="+q(TO)+"&su="+q(su())+"&body="+q(body()),"_blank")};
ap.onclick=()=>{done();location.href="mailto:"+TO+"?subject="+q(su())+"&body="+q(body())};
</script></body></html>
