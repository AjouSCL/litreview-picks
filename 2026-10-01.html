<h1>논문 선택 — 2026-10-01</h1>
<div class="sub">체크하고 아래 「보내기」를 누르면 DOI 목록이 채워진 메일 작성창이 뜹니다. <b>전송</b>하면 5분 안에 접수 확인 메일이 옵니다.</div>
<h2>신규 12편</h2><div class="sub">체크하면 전문을 받아 노트를 씁니다.</div>
<label><input type="checkbox" value="10.1016/j.aei.2026.105334"><div><div class="t">1. <a href="https://doi.org/10.1016/j.aei.2026.105334" target="_blank">Physics-informed Graph Attention-Transformer networks for multi-scale residual displacement prediction in progressive collapse of RC frames</a></div><div class="m">Jia-Hui Ni, Yi-Ping Gan, Rui-Ran Li 외 · Advanced Engineering Informatics · 2027-01 #구조점검</div><div class="g">RC 골조의 연쇄붕괴 평가에 쓰는 비선형 동적 FEA는 계산 비용이 너무 커서 재해 직후 빠른 판단에 쓰기 어렵다. 보-기둥 접합부를 node, 보·기둥을 edge로 두고 슬래브 막작용은 대각 virtual edge로 표현한 physics-informed GAT-Transformer surrogate를 제안했다. 다중 스케일 3D 잔류변위를 ms 단위로 예측해 재해 후 신속한 의사결정을 지원한다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107267"><div><div class="t">2. <a href="https://doi.org/10.1016/j.autcon.2026.107267" target="_blank">From natural language to interoperable BIM: Extensible framework for compliance-aware generative design</a></div><div class="m">Bo Pang, Jiansong Zhang, Jingyi Lai 외 · Automation in Construction · 2027-01 #BIM</div><div class="g">건축 평면 설계와 법규 검토가 따로 진행되면서 검토·수정이 반복되는 문제를 다룬다. 법규 조항과 자연어 설계 의도를 ontology 기반 제약으로 표현하고, 이 제약을 topology 생성 단계에 바로 적용한 뒤 IFC BIM 모델로 컴파일하는 end-to-end framework를 제안했다. 사례 연구에서 법규 준수율, 의도 부합도, 설계 효율, 확장성을 평가했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.enbuild.2026.118329"><div><div class="t">3. <a href="https://doi.org/10.1016/j.enbuild.2026.118329" target="_blank">Natural Language Processing and Shapes Constraint Language-Based Method for Green Building Compliance Validation</a></div><div class="m">Jincheng Han, Shanshan Li, Liang Zhang 외 · Energy and Buildings · 2026-10 #BIM</div><div class="g">녹색건축 인증 검토가 비효율적이라는 문제를 다룬다. ifcOWL을 확장한 Green Building Ontology를 만들고, NLP로 건축 문서에서 엔티티·관계 triple을 추출한 뒤 중국 GB/T 50378-2019 요구사항을 SHACL 규칙으로 코드화해 BIM 기반 자동 준수 검토를 수행했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116332"><div><div class="t">4. <a href="https://doi.org/10.1016/j.engappai.2026.116332" target="_blank">A survey of machine learning-based approaches for the prediction and design of concrete freeze–thaw durability</a></div><div class="m">Shutao Wu, Wuman Zhang, Jiacheng Gu 외 · Engineering Applications of Artificial Intelligence · 2026-11 </div><div class="g">한랭지 인프라에 쓰이는 콘크리트의 동결융해 내구성을 ML로 예측·설계한 최근 연구를 리뷰했다. 지난 10년간의 연구를 통계적으로 정리한 결과, 신경망과 ensemble 계열 모델이 주로 쓰였고 데이터셋은 대체로 작았다. 데이터 일관성, 해석 가능성, 환경 간 일반화 문제를 짚고 physical constraint와 데이터셋 간 knowledge transfer를 향후 방향으로 제시했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116388"><div><div class="t">5. <a href="https://doi.org/10.1016/j.engappai.2026.116388" target="_blank">Dynamic patch bank with a defect filter for cold start in online engineering inspection</a></div><div class="m">Jing Chen, Qingyang Wang, Wenqiang Xu · Engineering Applications of Artificial Intelligence · 2026-11 #컴퓨터비전</div><div class="g">온라인 결함 검사에서 생기는 cold start, label noise, 새 결함 유형 문제를 다룬다. local embedding density 기반 defect filter와 동적 patch bank, elastic weighted feedback을 결합해 재학습 없이도 새 결함을 반영하는 anomaly detection framework를 제안했다. MVTec AD에서 결함 유형당 4장 미만의 샘플로 최고 수준 성능을 냈다(산업 결함 검사 사례이며 건설 현장 적용은 아님).</div></div></label>
<label><input type="checkbox" value="10.1061/jccee5.cpeng-8034"><div><div class="t">6. <a href="https://doi.org/10.1061/jccee5.cpeng-8034" target="_blank">Integrating Kernel-Based Machine Learning Techniques with Geospatial Analysis for Landslide Susceptibility Mapping in Sikkim, India</a></div><div class="m">Saurabh Kumar Anuragi, D. Kishan · Journal of Computing in Civil Engineering · 2027-01-01 </div><div class="g">인프라 피해가 큰 산사태의 위험 지역을 찾기 위해 인도 Sikkim에서 산사태 693건, 비산사태 695건 샘플과 15개 조건 인자로 KLR·SVM 기반 산사태 취약성 지도를 만들었다. polynomial kernel을 쓴 KLR이 accuracy 0.741, AUC 0.829로 가장 좋았다.</div></div></label>
<label><input type="checkbox" value="10.1061/jcemd4.coeng-17434"><div><div class="t">7. <a href="https://doi.org/10.1061/jcemd4.coeng-17434" target="_blank">Governance of Shareholder Expropriation for REITs under Shareholders’ Investor–Operator Dual Roles</a></div><div class="m">Huicang Wu, Hui Sun, Yingzi Liang 외 · Journal of Construction Engineering and Management · 2026-12-01 </div><div class="g">인프라 재원 조달에 쓰이는 REITs에서 투자자이자 운영자인 주주가 지분을 수탈할 위험을 다룬다. 이중역할 투자자, 순수 투자자, 규제기관의 3자 evolutionary game 모델을 세워 분석한 결과, 투자자 역할과 운영자 역할이 겹칠수록 수탈 행동이 억제되고 그 효과가 더 빨리 나타났다.</div></div></label>
<label><input type="checkbox" value="10.1061/jcemd4.coeng-18601"><div><div class="t">8. <a href="https://doi.org/10.1061/jcemd4.coeng-18601" target="_blank">Optimization of Capital Structure for Student Housing through the Public–Private Partnership Model in Higher Educational Institutions</a></div><div class="m">Aman Ahlawat, Kamalendra Kumar Tripathi, Kumar Neeraj Jha · Journal of Construction Engineering and Management · 2026-12-01 </div><div class="g">인도 대학 기숙사를 PPP로 조성할 때의 최적 자본구조를 다룬다. ant colony optimization으로 민간 수익성, 학생 부담 가능성, 공공 재원을 함께 고려하는 다목적 모델을 풀었고 IIT Madras 사례로 검증했다. VGF 60%, 대출금리 5.55%, 임대료 USD 852에서 EIRR 11.03%가 나왔고, 실행 가능한 해 41개 중 23개가 Pareto 최적이었다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.buildenv.2026.115354"><div><div class="t">9. <a href="https://doi.org/10.1016/j.buildenv.2026.115354" target="_blank">The Security-Thermal Comfort Paradox: Quantifying the Hidden Night-Ventilation Performance Gap in Tropical-Highland Public Housing</a></div><div class="m">Tilaye Sitotaw Akale, Jiayu Zhang, Xiaodong Yang · Building and Environment · 2026-09 #건물성능</div><div class="g">에티오피아 Addis Ababa 공공주택에서 패시브 리트로핏 성능이 시뮬레이션보다 낮게 나오는 원인을 재실자 행동에서 찾았다. 48가구를 실측한 결과 야간 창문 개방률은 0.12로, 시뮬레이션 기본값 52%와 크게 달랐다. 냉방 손실 40~60%는 열적 선호보다 보안 규범과 연관됐다. 행동을 반영한 EnergyPlus 스케줄은 ASHRAE Guideline 14 보정 기준을 통과했고, 보안과 양립하는 환기 방식은 과열을 22~34% 줄였다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.ssci.2026.107480"><div><div class="t">10. <a href="https://doi.org/10.1016/j.ssci.2026.107480" target="_blank">The safety and health plan for construction works: preventive planning tool or mere formal compliance</a></div><div class="m">Francisco J. Forteza, Barbara Estudillo, M. Segarra Cañamares 외 · Safety Science · 2027-02 #안전행동</div><div class="g">스페인 건설 현장의 안전보건계획서(H&amp;SP)가 실제 예방 도구로 작동하는지, 형식적 준수에 그치는지를 따졌다. 설계 단계 문서(H&amp;SS/H&amp;SBS)와 H&amp;SP 280쌍의 품질을 평가해 두 문서의 품질을 잇는 모델을 처음 제시했다. 전반적인 품질은 낮았고, 설계 단계 문서의 품질과 작성자의 전문 교육이 H&amp;SP 품질을 높이는 요인이었으며, 간이 문서(H&amp;SBS)는 품질이 유의하게 낮았다.</div></div></label>
<label><input type="checkbox" value="10.1061/jccee5.cpeng-7825"><div><div class="t">11. <a href="https://doi.org/10.1061/jccee5.cpeng-7825" target="_blank">A Robust Measurement Method for Geometric Profiles of Bridges Based on Prior Design Knowledge Orientation</a></div><div class="m">Wei-Nan Han, Jin-Song Zhu, Ze-Yu Zhang 외 · Journal of Computing in Civil Engineering · 2027-01-01 #구조점검</div><div class="g">TLS 점군에서 교량 형상의 핵심 디테일이 빠져 자동 측정이 어렵다는 문제를 다룬다. 부재 점군 slice를 추출하고, 설계 데이터에서 만든 단면 prior knowledge와 template matching으로 기하 제약을 건 뒤 특징점을 이어 부재 선형을 생성했다. 시공 중인 아치교 현장 시험에서 측정 오차 5 mm 이내를 달성했고, 점군 밀도가 달라져도 결과가 안정적이었다.</div></div></label>
<label><input type="checkbox" value="10.1061/jccee5.cpeng-8069"><div><div class="t">12. <a href="https://doi.org/10.1061/jccee5.cpeng-8069" target="_blank">Intelligent Surface Flatness Detection of Waffle Slab Structures Using Terrestrial Laser Scanning</a></div><div class="m">Jianglong Sun, Zeyu Zhang, Shuolin Zhang 외 · Journal of Computing in Civil Engineering · 2027-01-01 #구조점검 #진도관리</div><div class="g">반도체 공장의 waffle slab은 mm 단위 평탄도가 요구되는데, 기존 직선자 검사는 느리고 표본도 듬성듬성하다. ROI 추출과 측면 투영 밀도 필터를 묶은 2단계 denoising으로 현장 잡음을 걸러냈다. 타설 전후 스캔은 기둥 topology graph 기반 RANSAC 조정합과 point-to-plane ICP로 자동 정합해, 거푸집 덮개판으로 생긴 가짜 고도 이상을 제거하는 TLS 기반 평탄도 검사 framework를 제안했다.</div></div></label>
<h2>기존 노트 검토 30편</h2><div class="sub">옵시디언에 있는 안 읽은 노트입니다. <b>체크한 것만 남기고, 체크하지 않은 노트는 지웁니다.</b></div>
<label><input type="checkbox" value="10.1016/j.aei.2026.105205"><div><div class="t">13. <a href="https://doi.org/10.1016/j.aei.2026.105205" target="_blank">A trustworthy agentic AI framework for auditable label-free machinery fault diagnosis in safety-critical engineering systems</a></div><div class="m">Yuntong Chen, Binhao Liu, Yingqi Li 외 · Advanced Engineering Informatics · 2027-01 #구조점검</div><div class="g">LLM이 진동 원신호를 직접 만지지 못하게 막고 물리 tool chain만 호출하게 한 3-agent 구조로 고장 라벨 없이 베어링을 진단해, CWRU에서 95.1%와 미학습 3개 도메인 평균 검출률 95.6%를 얻었다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116046"><div><div class="t">14. <a href="https://doi.org/10.1016/j.engappai.2026.116046" target="_blank">Adaptive long-horizon traffic spatiotemporal forecasting model based on interleaved graph attention and multi-axis selective State Space Modeling</a></div><div class="m">Dongyi He, Yuanquan Gao, Bin Jiang 외 · Engineering Applications of Artificial Intelligence · 2026-10 </div><div class="g">GAT와 Mamba를 한 블록 안에서 번갈아 쌓아 temporal state가 다시 graph attention을 계산하게 만든 GAMMA-Net으로 캘리포니아 PeMS 계열 6개 벤치마크에서 MAE를 최대 16.25% 낮췄다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116186"><div><div class="t">15. <a href="https://doi.org/10.1016/j.engappai.2026.116186" target="_blank">An ontology-machine learning based framework for road accident analysis</a></div><div class="m">Yipeng Liu, Junwu Wang, Jonathan Corker 외 · Engineering Applications of Artificial Intelligence · 2026-10 #안전행동</div><div class="g">교통안전 ontology로 사고 데이터의 feature를 의미 단위로 묶어 차원을 45% 줄이고, SHAP과 risk uplift로 뽑은 고위험 조합을 SWRL 규칙으로 되먹여 지식베이스를 갱신하는 폐루프를 만들었다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105191"><div><div class="t">16. <a href="https://doi.org/10.1016/j.aei.2026.105191" target="_blank">Automated neural architecture discovery and Dual-Model collaborative segmentation for Real-Time and reliable pavement inspection</a></div><div class="m">Zishuo Dong, Allen A. Zhang, Changfa Ai 외 · Advanced Engineering Informatics · 2027-01 #컴퓨터비전 #구조점검</div><div class="g">2D·3D·렌더링 광강도를 함께 넣는 physics-informed 입력에 neural architecture search 와 두 모델의 오차 보정 구조를 얹어 실시간 포장 segmentation 의 정확도와 신뢰도를 함께 올렸다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107250"><div><div class="t">17. <a href="https://doi.org/10.1016/j.autcon.2026.107250" target="_blank">Closed-loop digital twin framework with adaptive deformation prediction and risk assessment for automated deep excavations</a></div><div class="m">Yu Pan, Yin-Fu Jin, Jin-Feng Mo 외 · Automation in Construction · 2026-12 #디지털트윈 #구조점검</div><div class="g">계측값을 가상 모델에 동화해 지반 물성을 역해석으로 갱신하는 폐루프 디지털트윈을 만들어, 굴착 단계별 변형 예측 오차를 정적 모델 대비 31~65% 줄이고 위험 전이 시점을 짚어냈다.</div></div></label>
