<h1>논문 선택 — 2026-11-03</h1>
<div class="sub">체크하고 아래 「보내기」를 누르면 DOI 목록이 채워진 메일 작성창이 뜹니다. <b>전송</b>하면 5분 안에 접수 확인 메일이 옵니다.</div>
<h2>신규 13편</h2><div class="sub">체크하면 전문을 받아 노트를 씁니다.</div>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107335"><div><div class="t">1. <a href="https://doi.org/10.1016/j.autcon.2026.107335" target="_blank">LLM-based processing of design inspection reports for measuring building design quality</a></div><div class="m">Hamada Elshaboury, Fulvio Re Cecconi, Vincenzo Scotti 외 · Automation in Construction · 2027-01 #BIM</div><div class="g">비정형 텍스트로 된 건물 설계 검사 보고서를 활용하기 어렵다는 문제를 다룬다. 설계 결함 정보 모델을 정의하고, LLM에 Few-Shot Learning과 RAG 기반 예시 선택을 결합해 결함 정보를 추출·분류했다. 실제 검사 보고서로 평가했으며, 그 결과로 설계 품질 개선용 결함 데이터베이스를 구축했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107338"><div><div class="t">2. <a href="https://doi.org/10.1016/j.autcon.2026.107338" target="_blank">Improving indoor reality capture under non-ideal image conditions through sequential image standardization and 3D Gaussian Splatting</a></div><div class="m">Chenyu Wang, Yu Liu, Zewei Shi 외 · Automation in Construction · 2027-01 #컴퓨터비전 #디지털트윈</div><div class="g">실내 3D Gaussian Splatting(3DGS)은 동적 가림·약한 텍스처·motion blur 같은 비이상적 이미지에 약하다. 동적 가림 제거, 특징 강화, Gaussian point deblurring을 순차 적용하는 이미지 표준화 workflow를 제안했다. 원래 3DGS 대비 SSIM이 0.831에서 0.908로, PSNR이 26.45에서 32.97 dB로 올랐고 LPIPS는 0.288에서 0.221로 낮아졌다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.dibe.2026.101094"><div><div class="t">3. <a href="https://doi.org/10.1016/j.dibe.2026.101094" target="_blank">BIM-MORE: A Closed-Loop BIM-Driven Computational Decision-Support Framework for Multi-Objective Reinforced Concrete Beam Design</a></div><div class="m">Suphawut Malaikrisanachalee, Narongrit Wongwai, Wittaya Srisomboon 외 · Developments in the Built Environment · 2026-11 #BIM</div><div class="g">RC 보 최적화가 철근 상세와 BIM 구현을 무시해 시공하기 어려운 설계를 내는 문제를 다룬다. parametric BIM, Dynamo 기반 설계, 철근 배근 생성, NSGA-II를 하나의 closed loop로 묶어 비용·처짐을 다목적으로 최적화했다. 5 m 단순보에서 후보 581개 가운데 Pareto 해 72개를 도출했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116626"><div><div class="t">4. <a href="https://doi.org/10.1016/j.engappai.2026.116626" target="_blank">Text-guided three-dimensional representation fusion for robust multi-object tracking in intelligent perception systems</a></div><div class="m">Yang Wu, Chien-Chung Shen · Engineering Applications of Artificial Intelligence · 2026-12 #컴퓨터비전</div><div class="g">가림과 외관 모호성 때문에 multi-object tracking에서 ID가 유지되지 않는 문제를 다룬다. 텍스트 설명과 3D 객체 표현을 spatiotemporal attention(3D-SA/CA)으로 융합하는 T3D-MOT를 제안했다. PoseTrack·MuPoTS에서 ID 일관성이 좋아졌고, KITTI 보행자 데이터로 cross-domain 전이도 검증했다.</div></div></label>
<label><input type="checkbox" value="10.1061/jcemd4.coeng-17832"><div><div class="t">5. <a href="https://doi.org/10.1061/jcemd4.coeng-17832" target="_blank">Modeling Unsafe Behaviors within Construction Crews: A Safety-Based Cognitive Perspective</a></div><div class="m">Qingfeng Meng, Jiangtao Zhao, Zhen Li 외 · Journal of Construction Engineering and Management · 2027-01-01 #안전행동</div><div class="g">건설 작업조 안에서 불안전 행동이 생기고 퍼지는 과정을 안전 인지 관점에서 모델링했다. 개인 심리 특성, 관리자 조치, 작업 상황을 반영한 agent-based model로 시뮬레이션했다. 자기효능감·관리자 동일시 강화, 안전 코칭·통제 강화, 안전행동 비용 절감이 불안전 행동을 줄인다는 결과를 얻었다.</div></div></label>
<label><input type="checkbox" value="10.1061/jcemd4.coeng-18794"><div><div class="t">6. <a href="https://doi.org/10.1061/jcemd4.coeng-18794" target="_blank">Granular Framework for Construction Material Price Forecasting: Econometric and Machine-Learning Approaches</a></div><div class="m">Boge Lyu, Qianye Yin, Iris Denise Tommelein 외 · Journal of Construction Engineering and Management · 2027-01-01 </div><div class="g">건설 자재 가격 변동으로 생기는 원가 추정 리스크에 대응하려고 CSI MasterFormat 6자리 Section 단위로 가격을 예측하는 프레임워크를 만들었다. 원자재 가격과 거시경제 지표를 설명변수로 넣어 LSTM, ARIMA, VECM, Transformer, Chronos-Bolt를 비교했다. 설명변수를 넣으면 모든 모델의 성능이 좋아졌고, 가장 정확한 모델은 LSTM이었다.</div></div></label>
<label><input type="checkbox" value="10.1061/jmenea.meeng-7835"><div><div class="t">7. <a href="https://doi.org/10.1061/jmenea.meeng-7835" target="_blank">Digital Transformation Processes in Large Infrastructure Owners: An Organizational Change Perspective</a></div><div class="m">Tong Peng, Yun Le, Yutong Xue · Journal of Management in Engineering · 2027-01-01 </div><div class="g">대형 인프라 소유기관이 디지털 전환을 추진할 때 구성원이 어떻게 참여하게 되는지를 다룬다. 중국 공항그룹 단일 사례를 조직변화 관점의 cross-level 프로세스 프레임워크로 분석했다. 단계마다 구성원 참여를 깊게 만드는 조직 전략을 도출했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105443"><div><div class="t">8. <a href="https://doi.org/10.1016/j.aei.2026.105443" target="_blank">Facilitating virtual design reviews: CAD and SysML model integration in virtual reality environments</a></div><div class="m">Bjarne Käberich, Lars Everding, Thomas Vietor · Advanced Engineering Informatics · 2027-01 #디지털트윈</div><div class="g">제품 개발 초기의 가상 설계검토를 지원하려는 연구다. SysML 시스템 모델과 CAD 모델을 VR 환경에서 함께 시각화하고 자동으로 연결하는 도구를 개발했다. 한 가상 환경에서 CAD 객체와 시스템 모델 정보를 동시에 보여줘 설계검토와 모델 일관성을 돕는다. 다만 대상은 건설이 아닌 기계 제품이다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.cacaie.2026.100264"><div><div class="t">9. <a href="https://doi.org/10.1016/j.cacaie.2026.100264" target="_blank">Bridge damage diagnosis using robust InSAR-derived displacement features of virtual sensors by graph-informed unsupervised learning and hierarchical Bayesian thresholding</a></div><div class="m">Alireza Entezami, Hassan Sarmadi, Zheng-Han Chen 외 · Computer-Aided Civil and Infrastructure Engineering · 2026-11 #구조점검</div><div class="g">센서를 촘촘히 설치하지 않고도 교량 손상을 진단하려는 연구다. InSAR 변위로 virtual sensor를 구성하고, graph denoising contractive autoencoder(GDCAE) 기반 unsupervised learning과 hierarchical Bayesian thresholding으로 이상을 탐지·위치추정했다. 시간 표본과 측점이 적은 small-sample 조건에서도 손상을 진단하는 방법을 제시했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116635"><div><div class="t">10. <a href="https://doi.org/10.1016/j.engappai.2026.116635" target="_blank">Context-aware multimodal fusion framework for continuous physiological stress assessment in dynamic real-time environments</a></div><div class="m">Kaveti Pavan Kumar, Adeeba Khan, Ankit Singh 외 · Engineering Applications of Artificial Intelligence · 2026-12 #웨어러블</div><div class="g">이질적인 다중 생체신호로 스트레스를 연속 평가하기 어렵다는 문제를 다룬다. 잡음에 강한 differential cross-attention으로 modality를 융합하는 MDCA-Net을 제안했다. 개인·운전·임상 스트레스 데이터셋의 subject-independent 평가에서 좋은 성능을 보여 웨어러블 모니터링에 쓸 수 있음을 제시했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.ssci.2026.107550"><div><div class="t">11. <a href="https://doi.org/10.1016/j.ssci.2026.107550" target="_blank">Safety incident involvement among Tower crane Operators: The Role of safety Climate, psychosocial Stressors, and Individual Response</a></div><div class="m">Ziv Karni-Efrati, Laliv Egozi, Asher Pardo · Safety Science · 2027-03 #안전행동</div><div class="g">타워크레인 운전원의 안전사고 관여(운전 실패·아차사고·타인 부상·장비 손상)와 안전풍토·심리사회적 스트레스·번아웃·안전행동 사이의 관계를 혼합연구로 분석했다. 운전원의 3분의 2 이상이 최근 3개월 동안 사고를 1건 이상 경험했다. 안전풍토가 나쁘고 스트레스가 크면 번아웃과 불안전 행동이 늘었고, 이 둘이 사고 관여와 연관됐다. 생산 압박과 감독 부족도 문제로 드러났다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.cacaie.2026.100261"><div><div class="t">12. <a href="https://doi.org/10.1016/j.cacaie.2026.100261" target="_blank">Multiscale 3D gaussian splatting for digital reconstruction and damage identification of large-scale hydraulic infrastructure</a></div><div class="m">Ziyang Liu, Tongming Qu, Dapeng Zhu 외 · Computer-Aided Civil and Infrastructure Engineering · 2026-12 #구조점검 #컴퓨터비전 #디지털트윈</div><div class="g">km 규모 댐과 mm 규모 균열이 함께 있는 수리 구조물 점검을 다룬다. UAV 사진측량에 Multiscale Gaussian Splatting(MGS)과 2단계 3D 손상 instance segmentation을 결합했다. 실제 댐에서 원래 3DGS보다 재구성 품질과 최적화 안정성이 좋아졌고, 3D 공간에서 결함 위치를 정밀하게 찾았다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.cacaie.2026.100257"><div><div class="t">13. <a href="https://doi.org/10.1016/j.cacaie.2026.100257" target="_blank">Scenario-conditioned flow matching for probabilistic generation of three-component ground-motion waveforms</a></div><div class="m">Yi Ding, Jinjun Hu, Su Chen 외 · Computer-Aided Civil and Infrastructure Engineering · 2026-12 </div><div class="g">성능기반 내진 평가에 필요한 3성분 지진동 가속도 이력을 시나리오 조건에 맞춰 생성하려는 연구다. PGA 진폭 샘플링과 파형 생성을 분리한 2단계 모델 WaveFlowGMM을 제안했다. 진폭은 physics-informed symbolic learning으로 추정하고, 파형은 few-step AlphaFlow flow matching으로 만든다. 시험한 diffusion 모델보다 빠르게 샘플링했다.</div></div></label>
</main>
<div class="bar"><div><span class="n"><b id="n">0</b>편 선택</span>
<button id="gm" disabled>Gmail로 보내기</button><button id="ap" class="alt" disabled>메일 앱으로 보내기</button>
<span id="msg">작성창이 열렸으면 <b>전송</b>을 눌러야 접수됩니다. 5분 안에 「접수」 확인 메일이 옵니다. 안 오면 다른 버튼으로 다시 보내세요.</span></div></div>
<script>
const TO="bjchoi13@gmail.com", ME="bchoi@ajou.ac.kr", KEY="2026-11-03", K="picks-"+KEY, OLD=false;
const boxes=[...document.querySelectorAll("input")], gm=document.getElementById("gm"), ap=document.getElementById("ap");
try{const s=JSON.parse(localStorage.getItem(K)||"[]");boxes.forEach(b=>b.checked=s.includes(b.value))}catch(e){}
const sel=()=>boxes.filter(b=>b.checked).map(b=>b.value);
function upd(){const d=sel();document.getElementById("n").textContent=d.length;
  gm.disabled=ap.disabled=!d.length&&!OLD;   // 검토 칸이 있으면 0편도 보낼 수 있다(전부 지움)
  try{localStorage.setItem(K,JSON.stringify(d))}catch(e){}}
boxes.forEach(b=>b.addEventListener("change",upd));upd();
const su=()=>"[논문선택] "+KEY+" "+sel().length+"편", body=()=>sel().join("\n")+"\n", q=encodeURIComponent;
const done=()=>document.getElementById("msg").style.display="block";
// 폰에서는 Gmail 웹 작성창 주소가 앱·받은편지함으로 넘어가며 내용을 잃는다(2026-09-27 실측). 메일 앱을 주 버튼으로.
if(matchMedia("(pointer:coarse)").matches){gm.className="alt";ap.className="";gm.parentNode.insertBefore(ap,gm)}
gm.onclick=()=>{done();window.open("https://mail.google.com/mail/?authuser="+q(ME)+"&view=cm&fs=1&to="+q(TO)+"&su="+q(su())+"&body="+q(body()),"_blank")};
ap.onclick=()=>{done();location.href="mailto:"+TO+"?subject="+q(su())+"&body="+q(body())};
</script></body></html>
