<h1>논문 선택 — 2026-09-27</h1>
<div class="sub">저장할 논문을 체크하고 아래 「보내기」를 누르면 DOI 목록이 채워진 메일 작성창이 뜹니다. 전송하면 30분 안에 전문을 받아 노트를 씁니다.</div>
<label><input type="checkbox" value="10.1016/j.aei.2026.105219"><div><div class="t">1. <a href="https://doi.org/10.1016/j.aei.2026.105219" target="_blank">Efficient visual–inertial ego-motion estimation for intelligent vehicles via Mamba2 state-space sequence modeling</a></div><div class="m">Xiaowen Tao, Yinuo Wang, Dongpu Cao 외 · Advanced Engineering Informatics · 2027-01 #컴퓨터비전 #웨어러블</div><div class="g">지능형 차량의 ego-motion 추정에서 camera optical flow와 IMU 신호를 긴 시계열로 실시간 fusion하려 하면 Transformer self-attention의 연산량이 병목이 된다. 이를 해결하려고 stacked Mamba2 state-space layer로 camera-IMU token을 융합하고, RPMG 기반 manifold-aware rotation 학습으로 급격한 기동에서도 자세 추정을 안정화했다. 모든 시퀀스에서 APE 회전·병진 오차가 가장 낮았고, 모델 크기는 baseline의 절반이다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105320"><div><div class="t">2. <a href="https://doi.org/10.1016/j.aei.2026.105320" target="_blank">A fault morphology-preserving and cross-source consistency learning method for domain generalization in bearing fault diagnosis</a></div><div class="m">Bin Wang, Pengfei Liang, Haonan Yang 외 · Advanced Engineering Informatics · 2027-01 #구조점검</div><div class="g">구름 베어링 고장 진단에서 운전 조건이 바뀌면 고장 형태가 흐려지고, 대상 조건의 샘플이 부족해지는 domain generalization 문제를 다룬다. 여러 time–frequency 표현을 multi-scale로 융합해 고장 형태를 보존하고, cross-source consistency learning과 condition-adaptive receptive field로 조건별 간섭을 억제했다. 공개 베어링 데이터셋 2종에서 실험했으나, 초록이 잘려 있어 성능 수치는 확인할 수 없다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.ssci.2026.107470"><div><div class="t">3. <a href="https://doi.org/10.1016/j.ssci.2026.107470" target="_blank">The viral deviation: a quantitative analysis of social media engagement metrics on non-compliant flight deck behaviors</a></div><div class="m">Konstantinos Pechlivanis, Spiridon Chazapis, Dimitrios Ziakkas 외 · Safety Science · 2027-02 #안전행동</div><div class="g">SNS 추천 알고리즘이 조종실의 비규정 &#x27;회색지대&#x27; 행동 영상을 더 널리 퍼뜨려 일탈의 정상화(Normalization of Deviance)를 부추기는지 살폈다. Instagram Reels 항공 영상 150편을 netnography 방식으로 층화 분석했다. 회색지대 콘텐츠가 전체의 57%였고 참여도도 더 높았다. 다만 연관성 수준이라 통계적으로 결정적이지는 않다. 결과를 바탕으로 휴대 기기와 고정 장착 기기를 나눠 관리하는 위험 기반 거버넌스 모델을 제안했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.ssci.2026.107472"><div><div class="t">4. <a href="https://doi.org/10.1016/j.ssci.2026.107472" target="_blank">Crowd evacuation dynamics in a multi-exit room under the presence of simulated attackers: An experimental study</a></div><div class="m">Libi Fu, Yizhi Shi, Meiqi Deng 외 · Safety Science · 2027-02 #안전행동 #건물성능 #웨어러블</div><div class="g">흉기 난동 같은 위협 상황에서 다출구 실내 공간의 군중 대피 역학과 생리적 반응이 어떻게 맞물리는지 실험으로 확인했다. 참가자 62명이 공격자 수(0·1·2명)와 출구 배치(1·2·4개)를 조합한 27개 조건에서 54회 대피했다. PeTrack으로 궤적을 추출하고 심박을 함께 측정했다. 공격자가 있으면 기존 fundamental diagram 법칙이 깨지는 것을 확인했고, 결과는 출구 배치 최적화와 군중 안전관리의 근거로 제시했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.ssci.2026.107473"><div><div class="t">5. <a href="https://doi.org/10.1016/j.ssci.2026.107473" target="_blank">Contextual and temporal determinants of injury severity in electric micromobility: a comparative analysis of E-bikes and E-scooters</a></div><div class="m">Izuchukwu Chukwuma Obasi, Chizubem Benson, Damola Victor Akinwande 외 · Safety Science · 2027-02 #안전행동</div><div class="g">전기자전거와 전동킥보드 사용자의 부상 중증도 요인을 비교했다. 미국 NEISS 응급실 사례 2,413건(2021–2022)을 사고 장소와 시간 맥락을 반영해 분석했다. 단순 비교에서는 전기자전거의 중증 비율이 더 높았다. 그러나 다른 요인을 보정하자 차종 자체는 중증도와 독립적 연관이 없었고, 자동차 관여가 중증도에 미치는 영향은 장소에 따라 달랐다.</div></div></label>
</main>
