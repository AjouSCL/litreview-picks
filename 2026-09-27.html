<label><input type="checkbox" value="10.1016/j.aei.2026.105332"><div><div class="t">1. <a href="https://doi.org/10.1016/j.aei.2026.105332" target="_blank">A prediction-informed decision support framework for selective pavement inspection using physics-informed data correction and spatial-semantic learning</a></div><div class="m">Xinyi Yang, Zhe Wu, Yuanyuan Pan 외 · Advanced Engineering Informatics · 2027-01 #구조점검</div><div class="g">포장 점검을 고정 주기로 하면 건전한 도로를 과하게 점검하고 손상 발견은 늦어지는 문제를 다룬다. physics-informed 방식으로 PMS 데이터를 보정하고, spatial-semantic graph로 보강한 모델로 포장상태지수(PCI)를 예측했다(R2 = 0.821). 이 예측을 의사결정 규칙으로 바꿔 선택적 점검 계획을 세웠고, 생애주기 비용효율이 좋아졌다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116299"><div><div class="t">2. <a href="https://doi.org/10.1016/j.engappai.2026.116299" target="_blank">A jacket platform damage identification framework integrating lightweight visual perception and a virtual-real mapping mechanism</a></div><div class="m">Jianghao Li, Zhao Liu, Xingxian Bao 외 · Engineering Applications of Artificial Intelligence · 2026-11 #컴퓨터비전 #구조점검 #디지털트윈</div><div class="g">해양 재킷 플랫폼의 손상을 탐지하는 데서 그치지 않고 3차원 위치까지 특정하는 프레임워크다. YOLOv11n을 Local-Refined Knowledge Distillation과 DNF-CIoU loss로 경량화·개선했고, virtual-real mapping으로 2D detection 결과를 3D 좌표로 변환한다. 추가 연산 부담 없이 mAP50이 3.34% 올랐고, 악천후를 모사한 data augmentation으로 강건성도 확보했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116335"><div><div class="t">3. <a href="https://doi.org/10.1016/j.engappai.2026.116335" target="_blank">Triangulation-sensitivity-guided view selection for structure from motion</a></div><div class="m">Shaojie Zhang, Yinghui Wang, Bin Nan 외 · Engineering Applications of Artificial Intelligence · 2026-11 #컴퓨터비전</div><div class="g">Structure from Motion(SfM)의 view selection이 이미지 유사도나 고정 heuristic에 의존해 triangulation 안정성을 제대로 반영하지 못하는 문제를 다룬다. 1픽셀 섭동이 일으키는 3D 변위로 비대칭 triangulation-sensitivity 행렬을 만들고, 이를 바탕으로 view 순위 산정·양방향 검증·view graph 보완을 수행한다. 이 전략을 COLMAP에 통합해 다양한 장면에서 검증했다.</div></div></label>

<label><input type="checkbox" value="10.1016/j.engappai.2026.116382"><div><div class="t">7. <a href="https://doi.org/10.1016/j.engappai.2026.116382" target="_blank">Heterogeneous feature fusion and maintenance-triggered incremental learning for long-term health assessment and uncertainty-aware prediction of pumped storage units</a></div><div class="m">Xiaoyuan Zhang, Junbiao Zheng, Heng Zhang 외 · Engineering Applications of Artificial Intelligence · 2026-11 #구조점검</div><div class="g">초록 없음</div></div></label>
<label><input type="checkbox" value="10.1061/jccee5.cpeng-7917"><div><div class="t">8. <a href="https://doi.org/10.1061/jccee5.cpeng-7917" target="_blank">Vision-Language Model-Based Demonstrators for Imitation Learning in Construction Robotic Timber Assembly</a></div><div class="m">Lei Huang, Xinhe Yang, Qingyu Yan 외 · Journal of Computing in Civil Engineering · 2027-01-01 #인간로봇 #컴퓨터비전</div><div class="g">건설 로봇의 imitation learning에 필요한 시연 데이터를 VR이나 장갑 같은 원격조작 장비 없이 자동으로 생성하는 연구다. Segment Anything Model(SAM)로 대상 형상을 추출하고, mark-based visual prompting을 조건으로 받은 VLM이 행동을 제안한다. 성공한 에피소드만 골라 behavioral cloning으로 경량 text-conditioned policy를 학습했으며, Isaac Sim의 UR10 로봇팔로 목재 조립 작업에서 평가했다.</div></div></label>
<label><input type="checkbox" value="10.1061/jcemd4.coeng-18256"><div><div class="t">9. <a href="https://doi.org/10.1061/jcemd4.coeng-18256" target="_blank">LiDAR-Based Pavement Marking Detection for Construction Engineering: A Systematic Review of Methods and Applications</a></div><div class="m">Abbas Mohammadi, Mohammad Javad Amani, Abbas Rashidi 외 · Journal of Construction Engineering and Management · 2026-12-01 #컴퓨터비전 #구조점검</div><div class="g">LiDAR 기반 노면 표시 검출 연구 116편을 PRISMA 방식으로 검토한 systematic review다. 방법을 geometric·statistical·전통 ML·deep learning·hybrid의 다섯 갈래로 나눴다. 가림·마모·조명 변화에는 hybrid pipeline이 가장 강건했고, deep learning은 정확도가 높지만 라벨링 부담과 연산량 때문에 현장 적용에 제약이 있다고 정리했다.</div></div></label>
<label><input type="checkbox" value="10.1061/jcemd4.coeng-19126"><div><div class="t">10. <a href="https://doi.org/10.1061/jcemd4.coeng-19126" target="_blank">Forecasting the Construction Duration of Ballastless Track in High-Altitude Tunnels under Unexpected Disturbance</a></div><div class="m">Huailong Li, Hao Li, Ting Deng 외 · Journal of Construction Engineering and Management · 2026-12-01 #진도관리</div><div class="g">고지대 철도터널에서 무도상궤도(ballastless track) 시공 기간을 예측하는 연구다. 협소한 공간, 시간에 따라 변하는 노동생산성, 돌발 교란을 반영하기 위해 system dynamics와 agent-based modeling을 결합한 ABM-SD 하이브리드 시뮬레이션을 만들었다. Monte Carlo 기반 인원 속도 분포와 Bayesian network 교란 모델로 확률적 공기 분포를 도출했고, 중국 남서부 고원 터널 사례로 검증했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107273"><div><div class="t">11. <a href="https://doi.org/10.1016/j.autcon.2026.107273" target="_blank">Database-driven IFC framework for digital twins of existing structures</a></div><div class="m">Jiangpeng Shu, Yuhang Luo, Jiawang Song 외 · Automation in Construction · 2027-01 #BIM #디지털트윈 #구조점검</div><div class="g">IFC가 운영 단계의 이종 데이터(SHM 등)를 다루기 어려워 디지털트윈 구축에 한계가 있는 문제를 다룬다. IFC 모델을 관계형 DB로 변환하고, 점검·SHM 데이터를 IFC 부재와 연결하는 semantic extension과 RESTful API를 제공한다. 사무소 건물과 교량 사례로 검증했으며, 센서·모델 규모별로 관계형 DB와 RDF store의 성능을 비교했다.</div></div></label>
