<!doctype html>

<title>논문 선택 2026-10-12</title>
<style>
:root{--bg:#fff;--fg:#1d1f23;--mute:#6b7078;--line:#e4e6ea;--card:#f7f8fa;--acc:#1a4c8b;--on:#e8f0fb}
@media (prefers-color-scheme:dark){:root{--bg:#16181c;--fg:#e6e8eb;--mute:#9aa0a8;--line:#2c3036;--card:#1e2126;--acc:#7fb0ff;--on:#1f2d42}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:820px;margin:0 auto;padding:16px 16px 110px}h1{font-size:19px;margin:8px 0 2px}.sub{color:var(--mute);font-size:13px;margin-bottom:14px}
label{display:flex;gap:12px;padding:14px;margin:0 0 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer}
label:has(input:checked){background:var(--on);border-color:var(--acc)}
input{width:20px;height:20px;flex:none;margin-top:3px;accent-color:var(--acc)}
.t{font-weight:600}.t a{color:var(--acc);text-decoration:none}.m{color:var(--mute);font-size:13px}.g{margin-top:6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px}
.bar div{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;padding:9px 16px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:var(--bg);cursor:pointer}
button.alt{background:transparent;color:var(--acc)}button:disabled{opacity:.4;cursor:default}.n{margin-right:auto}
#msg{display:none;width:100%;font-size:13px;color:var(--mute)}
h2{font-size:16px;margin:26px 0 4px}h2+.sub{margin-bottom:10px}

<h1>논문 선택 — 2026-10-12</h1>
<div class="sub">체크하고 아래 「보내기」를 누르면 DOI 목록이 채워진 메일 작성창이 뜹니다. <b>전송</b>하면 5분 안에 접수 확인 메일이 옵니다.</div>
<h2>신규 8편</h2><div class="sub">체크하면 전문을 받아 노트를 씁니다.</div>
<label><input type="checkbox" value="10.1016/j.aei.2026.105360"><div><div class="t">1. <a href="https://doi.org/10.1016/j.aei.2026.105360" target="_blank">An efficiency-oriented physics-informed transfer learning framework for transient simulation across diverse properties and conditions in liquid energy pipelines</a></div><div class="m">Jian Du, Haochong Li, Chunying Liu 외 · Advanced Engineering Informatics · 2027-01 #구조점검</div><div class="g">수소·바이오 연료 등으로 넓어진 액체 에너지 관로에서, 유체 물성이나 운전 조건이 바뀔 때마다 PINN을 재학습해야 하는 비효율과 과도 진동 재현의 한계를 다룬다. 유량과 압력 추세의 연동 정도를 trend-gating layer로 반영한 TAG-PINN을 설계하고, 유사도와 물리 법칙에 기반한 transfer learning으로 새 조건에 빠르게 적용한다. 초록이 잘려 있어 성능 수치는 확인되지 않는다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105371"><div><div class="t">2. <a href="https://doi.org/10.1016/j.aei.2026.105371" target="_blank">Verifier-guided knowledge distillation of large language models for auditable thermal comfort reasoning</a></div><div class="m">Moein Younesi Heravi, Inbae Jeong, Youjin Jang 외 · Advanced Engineering Informatics · 2027-01 #건물성능</div><div class="g">재실자 중심 건물 운영에 쓸 수 있도록, 열쾌적 예측(TSV)과 함께 감사 가능한 근거를 제시하는 경량 LLM을 만든다. GPT-4o를 teacher로 LLaMA-3.2-3B에 knowledge distillation을 하고, TSV 가중 loss로 supervised fine-tuning을 거친 뒤, 설명 속 요인-방향 주장을 쾌적 기준과 대조하는 verifier로 DPO를 수행하는 3단계 구조다. 초록이 잘려 있어 결과 수치는 확인되지 않는다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116206"><div><div class="t">3. <a href="https://doi.org/10.1016/j.engappai.2026.116206" target="_blank">Energy-efficient deep learning-based vibration monitoring on parallel ultra-low-power microcontrollers</a></div><div class="m">Amirhossein Kiamarzi, Federica Zonzini, Amirhossein Moallemi 외 · Engineering Applications of Artificial Intelligence · 2026-12 #구조점검</div><div class="g">진동 기반 구조 건전성 모니터링(SHM)을 센서 노드 위 초저전력 MCU에서 직접 수행하는 방법을 다룬다. 정상 데이터 8시간과 9단계 이상 상태를 담은 공개 데이터셋을 내놓았다. 시스템 식별(SysId) 전처리를 결합한 supervised·unsupervised 딥러닝 모델을 GAP9에 올려 가속기와 RISC-V 코어에서의 에너지·성능을 비교했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116503"><div><div class="t">4. <a href="https://doi.org/10.1016/j.engappai.2026.116503" target="_blank">Physics-guided interpretable machine learning for explicit resistance equation discovery in concrete penetration</a></div><div class="m">Changchang Tu, Taiping Guo, Yuhang Mei 외 · Engineering Applications of Artificial Intelligence · 2026-12 </div><div class="g">콘크리트 관입 계산식(Forrestal)의 저항항이 압축강도 하나에만 의존해 실험 데이터를 잘 설명하지 못하는 문제를 다룬다. 문헌 데이터 443건(37개 출처)에서 Forrestal 역해석으로 저항값을 구하고, gradient boosting 모델과 SHAP으로 항을 추려 16항짜리 명시적 저항식을 도출했다. 이 식은 held-out 테스트에서 R²=0.9543, MAPE=14.88%를 기록했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116523"><div><div class="t">5. <a href="https://doi.org/10.1016/j.engappai.2026.116523" target="_blank">Reliability-oriented sensor fault-tolerant strategy for hydraulic systems</a></div><div class="m">Yinhang Zhang, Baoping Cai, Chuntan Gao 외 · Engineering Applications of Artificial Intelligence · 2026-12 </div><div class="g">유압 시스템에서 센서가 고장 나면 오경보와 불필요한 정지가 생기는 문제를 다룬다. 실측 센서값, Kalman filter 예측, LSTM 예측을 이중화 정보원으로 함께 쓰고, 정보원 간 일관성 검사로 고장 센서를 가려낸 뒤 WLS 융합으로 신호를 대체한다. 실험에서 오경보와 정지가 줄고 모니터링 신뢰성이 높아졌다.</div></div></label>
<label><input type="checkbox" value="10.1061/jccee5.cpeng-7388"><div><div class="t">6. <a href="https://doi.org/10.1061/jccee5.cpeng-7388" target="_blank">Automated Roadside Vegetation Management Using LiDAR-Based Geospatial Simulations</a></div><div class="m">Varun Kumar Reja, Tom Kelly, Xiaofang Wen 외 · Journal of Computing in Civil Engineering · 2027-01-01 #구조점검</div><div class="g">인력에 의존하는 도로변 식생 관리를 LiDAR 점군과 지리공간 분석으로 자동화한다. 차량 통행에 비워 둬야 할 공간을 vegetation-free volume(VFV)으로 정의하고, 이 공간을 침범한 식생을 기하 질의로 찾아낸 뒤 수평·수직 밀도 프로파일과 보고서로 내놓는다. 점 단위로 식생 성장과 전정 주기를 시뮬레이션해 유지관리 일정 수립도 지원한다.</div></div></label>
<label><input type="checkbox" value="10.1108/ecam-01-2026-0181"><div><div class="t">7. <a href="https://doi.org/10.1108/ecam-01-2026-0181" target="_blank">From sensing to leveraging: the collaborative enhancement mechanism of intelligent construction enabled by digital twin</a></div><div class="m">Lin Liu, Yuming Liu, Xia Guo 외 · Engineering Construction &amp; Architectural Management · 2026-10-13 #디지털트윈</div><div class="g">지능형 건설 프로젝트에서 디지털트윈의 하위 체계인 센싱망, 의미 지식 융합, 알고리즘 의사결정, 상호운용 표준이 협업 성과에 어떻게 작용하는지 분석한다. 설문 데이터에 SEM과 moderated mediation 분석을 적용했다. 세 하위 체계 모두 협업 성과에 긍정적이었고 의미 지식 융합의 효과가 가장 컸으며, 지식 융합과 의사결정이 센싱과 성과 사이를 순차적으로 매개했다.</div></div></label>
<label><input type="checkbox" value="10.1108/ecam-05-2025-0730"><div><div class="t">8. <a href="https://doi.org/10.1108/ecam-05-2025-0730" target="_blank">Risk-coupling assessment system to improve the safety of urban subway construction</a></div><div class="m">Xiaojuan Li, Junlin Hong, Yifei Ren 외 · Engineering Construction &amp; Architectural Management · 2026-10-13 #안전행동</div><div class="g">도시 지하철 공사에서 인적·장비·환경·관리 위험이 시간에 따라 서로 얽히는 양상을 평가하는 체계를 만든다. 전문가 20명과 설문 396건으로 지표를 정하고, AHP와 엔트로피 가중법으로 가중치를 매긴 뒤 System Dynamics로 24개월 위험 추이를, Cloud Model로 판단의 불확실성을 다뤘다. 공사 기간 내내 인적 위험이 주된 상류 요인이었고, 장비 위험은 12개월 차 무렵 급증해 예방 점검의 시점을 알려 준다.</div></div></label>
</main>
<div class="bar"><div><span class="n"><b id="n">0</b>편 선택</span>
<button id="gm" disabled>Gmail로 보내기</button><button id="ap" class="alt" disabled>메일 앱으로 보내기</button>
<span id="msg">작성창이 열렸으면 <b>전송</b>을 눌러야 접수됩니다. 5분 안에 「접수」 확인 메일이 옵니다. 안 오면 다른 버튼으로 다시 보내세요.</span></div></div>
<script>
const TO="bjchoi13@gmail.com", ME="bchoi@ajou.ac.kr", KEY="2026-10-12", K="picks-"+KEY, OLD=false;
const boxes=[...document.querySelectorAll("input")], gm=document.getElementById("gm"), ap=document.getElementById("ap");
try{const s=JSON.parse(localStorage.getItem(K)||"[]");boxes.forEach(b=>b.checked=s.includes(b.value))}catch(e){}
const sel=()=>boxes.filter(b=>b.checked).map(b=>b.value);
function upd(){const d=sel();document.getElementById("n").textContent=d.length;
  gm.disabled=ap.disabled=!d.length&&!OLD;   // 검토 칸이 있으면 0편도 보낼 수 있다(전부 지움)
  try{localStorage.setItem(K,JSON.stringify(d))}catch(e){}}
boxes.forEach(b=>b.addEventListener("change",upd));upd();
const su=()=>"[논문선택] "+KEY+" "+sel().length+"편", body=()=>sel().join("\n")+"\n", q=encodeURIComponent;
const done=()=>document.getElementById("msg").style.display="block";
// 폰에서는 Gmail 웹 작성창 주소가 앱·받은편지함으로 넘어가며 내용을 잃는다(2026-09-27 실측). 메일 앱을 주 버튼으로.
if(matchMedia("(pointer:coarse)").matches){gm.className="alt";ap.className="";gm.parentNode.insertBefore(ap,gm)}
gm.onclick=()=>{done();window.open("https://mail.google.com/mail/?authuser="+q(ME)+"&view=cm&fs=1&to="+q(TO)+"&su="+q(su())+"&body="+q(body()),"_blank")};
ap.onclick=()=>{done();location.href="mailto:"+TO+"?subject="+q(su())+"&body="+q(body())};
</script></body></html>
