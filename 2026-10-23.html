<h1>논문 선택 — 2026-10-23</h1>
<div class="sub">체크하고 아래 「보내기」를 누르면 DOI 목록이 채워진 메일 작성창이 뜹니다. <b>전송</b>하면 5분 안에 접수 확인 메일이 옵니다.</div>
<h2>신규 30편</h2><div class="sub">체크하면 전문을 받아 노트를 씁니다.</div>
<label><input type="checkbox" value="10.1016/j.aei.2026.105389"><div><div class="t">1. <a href="https://doi.org/10.1016/j.aei.2026.105389" target="_blank">FrameDiT: A dual-stream conditional diffusion Transformer for component layout design of steel braced frame structures</a></div><div class="m">Jiang Li, Wei Wang, Yuqing Gao · Advanced Engineering Informatics · 2027-01 #BIM</div><div class="g">철골 가새골조의 부재 배치 설계가 수작업에 의존하고 보 배치를 다룬 연구가 부족하다는 문제를 다룬다. 다채널 도면과 구조화된 설계 파라미터로 multimodal dataset을 만들고, 건축 조건 이미지를 condition stream으로 쓰는 dual-stream conditional diffusion Transformer(FrameDiT)를 제안했다. 대칭·가새 연결성 loss로 공학적 타당성을 높였고, 생성한 배치를 FE·BIM 모델로 자동 변환하는 workflow까지 구현했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107289"><div><div class="t">2. <a href="https://doi.org/10.1016/j.autcon.2026.107289" target="_blank">Welding quality inspection for industrialized construction: physics-informed approach using small-scale vision-language models</a></div><div class="m">Jiangtao Wen, Gan Zhang, Xiao Li 외 · Automation in Construction · 2027-01 #컴퓨터비전 #모듈러 #인간로봇</div><div class="g">공업화 건설의 로봇 용접 품질검사를 소형 VLM으로 신뢰성 있게 수행하는 방법을 다룬다. 검색한 multimodal 샘플을 anchor로 쓰는 in-context 결함 진단과 physics-guided CoT 기반 파라미터 최적화를 결합한 training-free 프레임워크 VPR-Weld를 제안했다. Qwen3.5-VL-2B로 정상/결함 이진 분류 정확도 0.8673, F1 0.8194를 얻었고, 9개 모델(0.8B–4B)에서 LLM-judge 점수가 참조 없이 약 1.0이던 것이 최적 구성에서 3.4 이상으로 올랐다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107314"><div><div class="t">3. <a href="https://doi.org/10.1016/j.autcon.2026.107314" target="_blank">Ontology-based spatial interlinking of heterogeneous asset data for bridge documentation</a></div><div class="m">Anne Göbels, Oliver Schulz, Mengyan Peng 외 · Automation in Construction · 2027-01 #구조점검 #디지털트윈</div><div class="g">교량 관련 문서가 이질적이고 흩어져 있어 각 자료와 구조물의 공간적 관계를 기계가 읽을 수 없다는 문제를 다룬다. 레거시 문서의 정성적 위치 표현까지 담는 포맷 무관 온톨로지 SPOT·SPOT-AM을 개발해 자산 데이터를 knowledge graph로 연결했다. 실제 레거시 자료 62건을 반자동으로 연결했고, 데이터 변환 없이 이질적 자료를 가로지르는 공간 질의가 가능함을 보였다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.cacaie.2026.100255"><div><div class="t">4. <a href="https://doi.org/10.1016/j.cacaie.2026.100255" target="_blank">An experimental-feedback-driven framework for closed-loop multi-objective design of multicomponent supplementary cementitious material concrete</a></div><div class="m">Zhuxin Cheng, Yingwu Zhou, Wenye Cai 외 · Computer-Aided Civil and Infrastructure Engineering · 2026-10 </div><div class="g">데이터가 희소한 상황에서 다성분 SCM 콘크리트의 강도·염화물 저항성·탄소 포함 비용을 함께 만족하는 배합 설계 문제를 다룬다. CatBoost+BPNN stacking surrogate, active learning 기반 NSGA-II 탐색, 실험 결과를 반복 반영하는 POEU 폐루프 프레임워크를 제안했다. 피드백 3회차에 걸쳐 배합 검증 성공률이 0%에서 100%로 올랐고, 최종 배합은 F28d와 Dnssm 기준을 만족하면서 저비용 경계에 위치했다.</div></div></label>
<label><input type="checkbox" value="10.1061/jccee5.cpeng-6685"><div><div class="t">5. <a href="https://doi.org/10.1061/jccee5.cpeng-6685" target="_blank">Intelligent Prediction of Rock Mass Classification Using TBM Multivariate Time Series and Multichannel Deep Convolutional Neural Networks</a></div><div class="m">Rui Li, Shaoxuan Guo, Qingsong Zhang 외 · Journal of Computing in Civil Engineering · 2027-01-01 </div><div class="g">TBM 굴진 중 실시간으로 수집되는 다변량 시계열에서 막장 전방의 암반 등급을 추정하는 문제를 다룬다. 굴진 파라미터 5개를 PAA로 고정 길이 벡터로 변환·융합한 뒤 multichannel 1D-CNN(MC-1D-CNN)으로 암반 등급을 분류했다. 초록이 잘려 있어 정확도 수치는 확인할 수 없다.</div></div></label>
<label><input type="checkbox" value="10.1061/jcemd4.coeng-17440"><div><div class="t">6. <a href="https://doi.org/10.1061/jcemd4.coeng-17440" target="_blank">Design and Application of a Smart Blasting Platform for Intelligent Construction Management</a></div><div class="m">Xiaokang Rao, Shengxiang Huang · Journal of Construction Engineering and Management · 2027-01-01 #BIM #디지털트윈</div><div class="g">발파 관리의 정보 단절, 낮은 설계 효율, 제한된 모니터링·평가 능력을 해결하려는 연구다. GIS·BIM·AI·GNSS·IoT를 융합한 스마트 발파 플랫폼을 설계해 데이터 수집, 발파 설계, 최적화, 특징 인식, 효과 평가를 통합했다. 수력발전 및 터널 공사 사례에 적용해 플랫폼을 시연했다.</div></div></label>
<label><input type="checkbox" value="10.1061/jmenea.meeng-7715"><div><div class="t">7. <a href="https://doi.org/10.1061/jmenea.meeng-7715" target="_blank">Framework for Material Reusability Assessment in the Building Sector: Insights from UK Steel and Plasterboard Supply Chains</a></div><div class="m">Mohamed Abadi, Jieling Huang, Jillian Yeow · Journal of Management in Engineering · 2027-01-01 #모듈러</div><div class="g">건축 분야 순환경제가 재활용에 머물러 있어, 재사용 가능성을 평가할 기준을 마련하려는 연구다. 영국 철강·석고보드 공급망 이해관계자 30명을 대상으로 인터뷰와 설문을 진행해 재료 속성과 생애주기 단계 두 차원, 24개 기준으로 구성된 평가 프레임워크를 만들었다. 석고보드는 경제적 가치와 해체 용이성이 관문 기준으로 나타났고, 재사용 경로로 모듈러 건설·표준화·가역적 고정 방식 등을 제안했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105392"><div><div class="t">8. <a href="https://doi.org/10.1016/j.aei.2026.105392" target="_blank">From foundation models to construction robotics: A dual stream review, capability matching, and deployment frameworks</a></div><div class="m">Wenxuan Li, Yilin Wang, Chao Mao 외 · Advanced Engineering Informatics · 2027-01 #인간로봇 #컴퓨터비전</div><div class="g">건설 로봇이 비정형 현장에 적응하기 어렵다는 한계를 foundation model 역량으로 보완하는 방안을 dual-stream systematic review로 정리했다. FM이 로봇에 제공하는 역량을 세 계열로 묶은 공급 모델과, 이를 건설 로봇 수요에 대응시키는 capability-matching 모델을 제안했다. 이를 바탕으로 건설 로봇에 FM을 적용하기 위한 배포 지향 프레임워크를 제시했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105397"><div><div class="t">9. <a href="https://doi.org/10.1016/j.aei.2026.105397" target="_blank">Physical object oriented modeling framework for computational fluid dynamics in room-scale airflow simulation</a></div><div class="m">Yue Ma, Wei Ye · Advanced Engineering Informatics · 2027-01 #건물성능</div><div class="g">실내 기류 CFD는 설정 과정이 수작업 위주이고 전문성이 많이 필요하다는 문제를 다룬다. 공조 토출구나 가구 같은 건물 요소를 재사용 가능한 객체로 표현하는 POOM 프레임워크를 제안하고, CAD 도면에서 OpenFOAM까지 자동화한 파이프라인, LLM 기반 agent, 웹 인터페이스를 구현했다. 개념적 SLC 지표로 설정 로직의 복잡도가 줄어드는 것을 보였다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107302"><div><div class="t">10. <a href="https://doi.org/10.1016/j.autcon.2026.107302" target="_blank">Generating Building Information Models via computer-use agents</a></div><div class="m">Zihan Deng, Changyu Du, Stavros Nousias 외 · Automation in Construction · 2027-01 #BIM</div><div class="g">API에 의존하는 기존 BIM 자동화는 유연성이 부족해, 사람이 쓰는 GUI를 직접 조작해 BIM 모델을 만드는 multimodal LLM 기반 multi-agent 프레임워크 BIMgent를 제안했다. 문서 기반 계층적 계획(RAG), dynamic GUI grounding, self-reflective 실행을 결합했다. GUI 조작 4,800회 이상으로 구성된 BIM 작성 과제 45개 벤치마크에서 성공률 77.8%를 기록해 범용 computer-use 모델보다 크게 앞섰다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107317"><div><div class="t">11. <a href="https://doi.org/10.1016/j.autcon.2026.107317" target="_blank">Proxy-coupled masked Gaussian fields for large-scale building instance meshing</a></div><div class="m">Yuanhang Cheng, Xuefeng Cao, Yundi Li 외 · Automation in Construction · 2027-01 #컴퓨터비전 #디지털트윈</div><div class="g">대규모 UAV 다시점 영상으로 건물별 mesh를 만들 때 인접 건물이 서로 붙거나 배경이 섞이는 문제를 다룬다. 초기화 단계부터 건물 identity를 유지하는 instance-aware Gaussian field에 proxy-coupled mask supervision과 건물별 TSDF fusion을 결합했다. GauU-Scene과 자체 LCG 데이터셋에서 경계 정확도와 분리 품질이 향상됨을 확인했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.buildenv.2026.115474"><div><div class="t">12. <a href="https://doi.org/10.1016/j.buildenv.2026.115474" target="_blank">Human cognitive responses to high temperature in normoxic and hypobaric environments</a></div><div class="m">Yue Hu, Liangliang Sun, Yuanjun Xu 외 · Building and Environment · 2026-10 #안전행동</div><div class="g">고온과 저압 저산소 환경이 작업자의 인지 기능을 떨어뜨려 산업재해를 키운다는 문제의식에서, 건강한 남성 14명을 대상으로 기온 28·31·34·37°C와 기압 96.5·65.7 kPa 조건에서 트레드밀 보행 중 인지·생리(HRV)·주관 반응을 측정했다. 정상 기압에서는 인지 저하가 없었지만 65.7 kPa에서는 34·37°C 조건에서 Stroop 억제 통제가 떨어졌다. 탈수율(2% 미만)은 인지에 유의한 영향을 주지 않았다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116494"><div><div class="t">13. <a href="https://doi.org/10.1016/j.engappai.2026.116494" target="_blank">Lightweight edge optimized re-identification of person through Quantum Inspired Spiking Neural Embeddings and compressed deep feature projection</a></div><div class="m">Harish K., J. Indra · Engineering Applications of Artificial Intelligence · 2026-12 #컴퓨터비전</div><div class="g">자원이 제한된 edge 환경에서 겹치지 않는 감시 카메라 간 person re-identification을 경량으로 수행하는 문제를 다룬다. Quantum-Inspired Spiking Neural Embeddings와 압축 deep feature를 128차원으로 융합하고 양자화·발열 인지 파이프라인을 구성했다. MSMT17-ELR에서 97.18%를 달성했다. 건설 현장 작업자 추적에도 응용할 수 있다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116559"><div><div class="t">14. <a href="https://doi.org/10.1016/j.engappai.2026.116559" target="_blank">An integrated group decision making approach using hybrid weighting and adaptive ranking under interval neutrosophic framework for sustainable urban infrastructure planning</a></div><div class="m">Prayosi Chatterjee, Mijanur Rahaman Seikh · Engineering Applications of Artificial Intelligence · 2026-12 </div><div class="g">지역 조건과 전문가 판단의 불확실성 때문에 그린 도시 인프라 설계안(GUIDE)을 평가하기 어렵다는 문제를 다룬다. 주관·객관 가중치를 결합한 하이브리드 가중법과 적응형 순위법에 Dubois–Prade 기반 interval neutrosophic 집계 연산자를 붙인 집단 의사결정 기법을 제안했다. 전문가 신뢰도를 반영해 지속가능 도시 인프라 대안의 순위를 매긴다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116562"><div><div class="t">15. <a href="https://doi.org/10.1016/j.engappai.2026.116562" target="_blank">Trajectory optimization and adaptive learning framework for excavators addressing complex operational requirements</a></div><div class="m">Yujie Guo, Chao Ai, Junxiang Chen 외 · Engineering Applications of Artificial Intelligence · 2026-12 #인간로봇</div><div class="g">복잡한 환경에서 굴착기 궤적의 적응성이 부족해 작업 효율이 낮다는 문제를 다룬다. NSGA-II로 시간·에너지 대리지표·jerk를 최적화한 quintic B-spline 궤적을 시연 데이터로 삼아 ProMPs로 분포를 학습하고, 다중 과업 제약 아래 dual-loop gradient descent–ascent로 새 과업에 맞는 궤적을 생성했다. 초록이 잘려 있어 정량 결과는 확인할 수 없다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116572"><div><div class="t">16. <a href="https://doi.org/10.1016/j.engappai.2026.116572" target="_blank">A multi-prompt transfer learning framework based on segment anything model 2 for segmenting microcracks in engineered cementitious composite images and videos</a></div><div class="m">Yanhui Chen, Jingjie Wei, Hengliang Liu 외 · Engineering Applications of Artificial Intelligence · 2026-12 #컴퓨터비전 #구조점검</div><div class="g">ECC 미세균열은 가늘고 대비가 낮으며 기공·그림자와 혼동되기 쉬워 segmentation이 어렵다. SAM2에 threshold 기반 coarse mask, self-perceptive box, 거리변환 기반 positive/negative point prompt를 결합하고 progressive unfreezing으로 few-shot transfer learning을 수행했다. SAM2의 memory 덕분에 영상 전용 학습 없이도 시간적으로 일관된 균열 추적이 가능했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116593"><div><div class="t">17. <a href="https://doi.org/10.1016/j.engappai.2026.116593" target="_blank">Explainable artificial intelligence for eco-efficient design of three-dimensional printed fiber-reinforced concrete through integrated life cycle assessment</a></div><div class="m">Suhaib Rasool Wani, Ali Alhawiti, Harish Panghal · Engineering Applications of Artificial Intelligence · 2026-12 </div><div class="g">3D 프린팅 섬유보강 콘크리트의 강도를 예측하고 환경영향까지 함께 고려해 설계하는 문제를 다룬다. 문헌 6편에서 모은 225개 관측치에 CatBoost, SHAP/LIME, Monte Carlo, Sobol, cradle-to-gate LCA, Pareto 선별을 적용했다. CatBoost는 R² 0.9319, RMSE 9.056 MPa를 기록했고, 주요 변수는 실리카퓸·물결합재비·수량 순이었다.</div></div></label>
