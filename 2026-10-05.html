<h1>논문 선택 — 2026-10-05</h1>
<div class="sub">체크하고 아래 「보내기」를 누르면 DOI 목록이 채워진 메일 작성창이 뜹니다. <b>전송</b>하면 5분 안에 접수 확인 메일이 옵니다.</div>
<h2>신규 8편</h2><div class="sub">체크하면 전문을 받아 노트를 씁니다.</div>
<label><input type="checkbox" value="10.1016/j.buildenv.2026.115364"><div><div class="t">1. <a href="https://doi.org/10.1016/j.buildenv.2026.115364" target="_blank">Behavior-resolved bioaerosol exposure modeling reveals scale-dependent occupational risk in pediatric wards</a></div><div class="m">Fangli Zhao, Na Li, Xian Lin 외 · Building and Environment · 2026-10 #컴퓨터비전 #안전행동</div><div class="g">병동에서 의료진과 환자가 짧은 거리에서 반복해 접촉할 때 생기는 호흡기 노출 위험을 실제 행동 데이터로 평가하려 했다. 소아 병동 3곳에서 depth camera와 computer vision으로 접촉 2,880건의 거리·얼굴 방향·지속시간·빈도를 비접촉으로 측정하고, 이를 근거리 bioaerosol 노출·dose–response 모델(SARS-CoV-2)에 연결했다. 그 결과 접촉 1회당 위험은 의사가, 하루 누적 위험은 간호사가 더 높았다. 처치 중에는 흉부 물리치료가 가장 위험했고, 마스크는 위험을 낮췄지만 직군 간 순위는 바뀌지 않았다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.cacaie.2026.100242"><div><div class="t">2. <a href="https://doi.org/10.1016/j.cacaie.2026.100242" target="_blank">Overbreak intelligent control method of drilling and blasting tunnel based on hyperparameter-tuned prediction and metaheuristic parameter optimization</a></div><div class="m">Fu Huang, Jian Xiao, Changgeng Xie 외 · Computer-Aided Civil and Infrastructure Engineering · 2026-10 </div><div class="g">드릴앤블라스트 터널의 여굴(overbreak)은 연구가 대부분 예측에 그쳐, 여굴을 실제로 줄이는 제어 방법이 필요했다. 터널 4곳의 레이저 스캐닝 데이터 356세트로 Optuna-CatBoost 여굴 면적 예측 모델을 만들고, 개선한 GWO로 발파 파라미터를 최적화한 뒤 FEM 기반 FSI 해석으로 검증했다. 최적 발파안은 여굴 면적을 44.0% 줄였다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116392"><div><div class="t">3. <a href="https://doi.org/10.1016/j.engappai.2026.116392" target="_blank">Predicting vehicle operators’ neck discomfort under vibration using head posture data: A dynamic two-stage attention-based method</a></div><div class="m">Xing Tang, Fan Zhang, Jinyi Zhi 외 · Engineering Applications of Artificial Intelligence · 2026-11 #웨어러블 #안전행동</div><div class="g">차량 진동이 운전자의 목 불편감과 머리 자세 불안정을 키우는 문제를 다뤘다. 0–2.5 Hz 수직 진동 아래 실험 3건에서 IMU로 머리 각도 RMS를 측정하고 주관적 불편감을 받아, 진동과 3축 머리 자세 특징을 vibration-gated multi-head self-attention으로 융합하는 2단계 attention 네트워크로 고불편 상태를 이진 예측했다. 진동이 커질수록 불편감과 머리 흔들림이 단조 증가했고, 제안 모델을 LSTM·GRU·1D-CNN·GNN 등 baseline과 leakage가 없는 프로토콜로 비교했다(수치는 초록 범위 밖). 장비 운전원 인간공학 모니터링에 응용할 여지가 있다.</div></div></label>

<label><input type="checkbox" value="10.1061/jcemd4.coeng-19136"><div><div class="t">5. <a href="https://doi.org/10.1061/jcemd4.coeng-19136" target="_blank">Multitarget Dynamic Action Recognition Model for Construction Workers Based on Continuous Action Features</a></div><div class="m">Fan Zhang, Feizhi Xiao, Yintao Liu 외 · Journal of Construction Engineering and Management · 2026-12-01 #컴퓨터비전 #안전행동</div><div class="g">건설 작업자의 불안전 행동을 감시할 때 기존 알고리즘의 적응성이 낮은 문제를 다뤘다. 실제 현장에서 촬영한 영상 16.5만 프레임(불안전 행동: Clamber·Lean on·Throw, 안전 행동: Stand·Walk·Squat)으로 데이터셋을 만들고, 1·2차 미분과 유클리드 거리를 결합한 DD-DTW로 연속 동작 특징의 시계열 유사도를 매칭하는 다중 대상 동적 행동 인식 모델을 제안했다. 기존 DTW 등과 비교 실험을 했지만, 초록이 잘려 정확도 수치는 확인할 수 없다.</div></div></label>
<label><input type="checkbox" value="10.1108/ecam-01-2026-0162"><div><div class="t">6. <a href="https://doi.org/10.1108/ecam-01-2026-0162" target="_blank">Hand gesture recognition for safe operation of tower cranes: a thermal image-based method using enhanced YOLOv8</a></div><div class="m">Zhenyu Peng, Hung-Lin Chi, Haitao Wu 외 · Engineering Construction &amp; Architectural Management · 2026-10-05 #컴퓨터비전 #안전행동</div><div class="g">타워크레인 블라인드 인양이나 저조도 상황에서 RGB 기반 수신호 인식이 조명에 취약한 문제를 다뤘다. 실제 현장에서 표준 수신호 25종의 열화상 데이터셋을 구축하고, attention 모듈과 dynamic detection head를 넣어 YOLOv8을 개선했다. precision 97.26%, mAP@0.5 99.05%로 baseline을 포함한 비교 모델들을 앞섰다.</div></div></label>
<label><input type="checkbox" value="10.1108/ecam-04-2026-0787"><div><div class="t">7. <a href="https://doi.org/10.1108/ecam-04-2026-0787" target="_blank">Construction dust detection in existing building renovation under limited annotation: a semi-supervised framework based on improved YOLOv11</a></div><div class="m">Jiale Hu, Wei Tian, Ping Guo 외 · Engineering Construction &amp; Architectural Management · 2026-10-05 #컴퓨터비전 #안전행동</div><div class="g">기존 건물 리모델링 현장의 분진은 경계가 흐리고 형태가 불규칙한 데다 라벨까지 부족해 영상으로 탐지하기 어렵다. DualConv·Dynamic Feature Fusion·Dynamic Tanh를 결합한 경량 YOLOv11n-DFD에 confidence-filtered pseudo-labeling 기반 단일 라운드 semi-supervised 학습을 적용했다. mAP@0.5 0.969 ± 0.002로 supervised baseline보다 0.063 높았고, 더 단순한 파이프라인으로 EMA teacher–student 방식과 비슷한 성능을 냈다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.jobe.2026.117474"><div><div class="t">8. <a href="https://doi.org/10.1016/j.jobe.2026.117474" target="_blank">Depth Vision-Based Indoor Building Behavior Reconstruction in Disaster Scenarios: Integrating Structural Displacement and Non-Structural Motion</a></div><div class="m">Jiale HOU, Yi ZHANG, Chen GU 외 · Journal of Building Engineering · 2026-10 #컴퓨터비전 #구조점검 #디지털트윈</div><div class="g">기존 SHM은 구조물의 전체 응답만 보고 비구조 부재(NSC)의 거동은 측정하지 못하며, 단안 비전은 물리 변위의 스케일을 정하지 못한다. 이 연구는 RGB-D depth vision으로 재난 시 층간 변위와 NSC의 6D 운동을 함께 재구성했다. NSC 자세는 SAM mask로 초기화한 FoundationPose로 추정한다. 실내 구조 모니터링을 고정밀로 자동 측정하고 실내 재난 digital twin의 인지 기반을 마련했다고 하지만, 초록이 잘려 정확도 수치는 없다.</div></div></label>
