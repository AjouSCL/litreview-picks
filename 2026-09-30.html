<h1>논문 선택 — 2026-09-30</h1>
<div class="sub">체크하고 아래 「보내기」를 누르면 DOI 목록이 채워진 메일 작성창이 뜹니다. <b>전송</b>하면 5분 안에 접수 확인 메일이 옵니다.</div>
<h2>신규 27편</h2><div class="sub">체크하면 전문을 받아 노트를 씁니다.</div>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116359"><div><div class="t">1. <a href="https://doi.org/10.1016/j.engappai.2026.116359" target="_blank">Frequency–spatial feature learning with spectrally guided data augmentation for submarine cable fault detection under data scarcity</a></div><div class="m">Xibing Yang, Hui Xiong, Chong Yang 외 · Engineering Applications of Artificial Intelligence · 2026-11 #컴퓨터비전 #구조점검</div><div class="g">해저 케이블의 결함 데이터가 부족하고 불균형하며 수중 영상의 대비가 낮아 결함 탐지가 어렵다. 주파수 기반 GAN(RFGAN)으로 스펙트럼이 일관된 소수 클래스 결함 샘플을 생성하고, 주파수-공간 multi-scale 탐지 네트워크(FS–MSCNet)로 약한 결함 패턴을 검출한다. 저대비·저시정 조건에서도 작고 미세한 결함을 더 안정적으로 탐지했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116366"><div><div class="t">2. <a href="https://doi.org/10.1016/j.engappai.2026.116366" target="_blank">Multifarious support-and-query feature interaction network for few-shot anomaly segmentation</a></div><div class="m">Wei Liu, Xiaobo Lu, Yun Wei 외 · Engineering Applications of Artificial Intelligence · 2026-11 #컴퓨터비전 #구조점검</div><div class="g">고속열차 핵심 부품의 새로운 이상 유형은 샘플이 적어 탐지가 어렵다. few-shot anomaly segmentation 네트워크 MSFINet을 제안했으며, self/mutual attention 기반 feature amplifier, support mask로 support와 query의 공통 특징을 모으는 모듈, 다층 correlation learner로 구성된다. 소수의 샘플만으로 이상 부위를 분할하는 성능을 검증했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116390"><div><div class="t">3. <a href="https://doi.org/10.1016/j.engappai.2026.116390" target="_blank">Deep reinforcement learning for autonomous driving decision-making: Algorithms, applications and challenges</a></div><div class="m">Jing Li, Peng Wu, Xiaoqiang Yang 외 · Engineering Applications of Artificial Intelligence · 2026-11 </div><div class="g">자율주행 의사결정 모듈에 deep reinforcement learning을 적용한 연구를 체계적으로 리뷰했다. 차로 유지·차로 변경·추월·교차로 통과 시나리오별로 DRL의 장점을 분석하고 실제 적용의 과제를 정리했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.jobe.2026.117473"><div><div class="t">4. <a href="https://doi.org/10.1016/j.jobe.2026.117473" target="_blank">DKMT-Net: A Domain-Knowledge-Informed Multi-Task Framework for Hurricane Building Damage Assessment and Attribution</a></div><div class="m">Haiqing Yang, Zekang Ping, Lixin Peng 외 · Journal of Building Engineering · 2026-09 #컴퓨터비전 #구조점검</div><div class="g">기존의 허리케인 후 건물 피해 평가는 위치 파악과 피해 등급 분류에 그치고 피해 원인은 식별하지 못했다. 도메인 지식을 반영한 multi-task 프레임워크 DKMT-Net으로 pixel-level 피해 평가와 image-level 피해 원인 판별을 동시에 수행하며, soft-gated damage prior로 task 간 feature 간섭을 줄였다. 도메인이 바뀌어도 견고한 성능을 보여 재난 대응 자원 배분의 근거를 제공한다.</div></div></label>
<label><input type="checkbox" value="10.1061/jccee5.cpeng-7776"><div><div class="t">5. <a href="https://doi.org/10.1061/jccee5.cpeng-7776" target="_blank">From Point Clouds to IFC-Compliant BIM: A Pipeline for Geometric Modeling of Arch Dam Bodies</a></div><div class="m">Fangxin Li, Ziyu Feng, Xin Xu 외 · Journal of Computing in Civil Engineering · 2027-01-01 #BIM #컴퓨터비전 #구조점검</div><div class="g">아치댐처럼 형상이 비정형인 수리 구조물에는 건물 중심의 기존 BIM 파이프라인이 맞지 않는다. 댐 본체용 IFC 호환 템플릿을 설계하고, point cloud의 semantic segmentation과 parametric 형상 모델링을 결합해 as-built BIM을 재구성하는 파이프라인을 제안했다. 조적 아치댐 사례에 적용해 효과를 입증했다.</div></div></label>
<label><input type="checkbox" value="10.1061/jccee5.cpeng-7915"><div><div class="t">6. <a href="https://doi.org/10.1061/jccee5.cpeng-7915" target="_blank">MAESTRO: Fine-Tuned Multiagent Large Action Model-Based GenAI Assistant Integrating IoT Sensing, Smart Control, and Extended Reality for Human-Building Interaction</a></div><div class="m">Oscar Poudel, Rayan H. Assaad, Andrew B. Park 외 · Journal of Computing in Civil Engineering · 2027-01-01 #디지털트윈 #건물성능</div><div class="g">시설관리자는 IoT 데이터 해석, 매뉴얼 확인, 설비 제어를 서로 다른 대시보드·매뉴얼·제어판에서 따로 처리해 인지 부하가 크다. 에이전트 4개로 이루어진 GenAI 비서 MAESTRO를 만들었다. fine-tuned large action model, retrieval-augmented reasoning, XR 인터페이스, Model Context Protocol을 통합해 절차 질의, 텔레메트리 해석, 감독하의 장치 제어를 하나의 human-building interaction 루프에서 지원한다.</div></div></label>
<label><input type="checkbox" value="10.1061/jcemd4.coeng-18643"><div><div class="t">7. <a href="https://doi.org/10.1061/jcemd4.coeng-18643" target="_blank">Digital Twins for Advancing Emergency Management in the Built Environment: A Systematic Review of Core Capabilities, Trends, and Future Directions</a></div><div class="m">Qipeng Liu, Rui Liu · Journal of Construction Engineering and Management · 2026-12-01 #디지털트윈</div><div class="g">건조 환경의 비상관리(EM)에 쓰인 digital twin 연구를 bibliometric 분석으로 체계적으로 리뷰해 임무 영역·핵심 역량별 지식 지도를 작성했다. 다른 관리 분야에 비해 EM용 DT 연구는 적고 관심도 치우쳐 있으며, 특히 계획·복구 단계에서 성능·사용성의 실증 검증이 부족하다는 공백을 제시했다.</div></div></label>
<label><input type="checkbox" value="10.1061/jcemd4.coeng-18847"><div><div class="t">8. <a href="https://doi.org/10.1061/jcemd4.coeng-18847" target="_blank">A Markov Chain Framework for Assessing Owner Payment Reliability across Multiple Construction Projects</a></div><div class="m">Matin Kadkhoda, S. Mahdi Hosseinian · Journal of Construction Engineering and Management · 2026-12-01 </div><div class="g">복수의 건설 프로젝트에 걸친 발주자의 대금 지급 신뢰도를 정량 평가할 방법이 부족하다. 흡수 Markov chain으로 청구가 제출부터 지급 또는 분쟁까지 옮겨 가는 과정을 모델링했다(OPRM, 정상·비정상 3가지 정식화). Bayesian 사후평균으로 발주자의 포트폴리오 전체 증거를 통합했다. 발주자 11명의 프로젝트 34건으로 보정한 결과, NStat-CP가 적합도가 가장 좋았고 Stationary 모델이 정확도와 해석성의 균형이 가장 좋았다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105295"><div><div class="t">9. <a href="https://doi.org/10.1016/j.aei.2026.105295" target="_blank">Physics-informed neural network inference of a strong-field-suppressed mobility law for multi-ion electromigration in concrete</a></div><div class="m">Yi-fei Chen, Xuan Gao, Liang-yu Tong 외 · Advanced Engineering Informatics · 2027-01 #구조점검</div><div class="g">콘크리트 전기 가속 이온 이동 시험에서 강전계가 걸리면 기존의 상수 이동도 PNP 모델에 예측 편향이 생긴다. physics-informed neural network로 전계에 의존하는 이온 이동도 법칙을 추론해 PNP에 삽입했고, 희소한 데이터로 전기화학장을 재구성했다. 염화물 침투 전선의 편향이 줄었고, 저효율 구간을 피하는 인가 전압 기준을 제시했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105307"><div><div class="t">10. <a href="https://doi.org/10.1016/j.aei.2026.105307" target="_blank">Scaling limits of federated learning for vision-based road damage detection across countries</a></div><div class="m">Shubham Kumar Dwivedi, Deeksha Arya, Yoshihide Sekimoto · Advanced Engineering Informatics · 2027-01 #컴퓨터비전 #구조점검</div><div class="g">국가 간 원자료를 공유하지 않고 도로 파손 탐지 모델을 학습하는 federated learning에서, 참여국 규모와 이질성이 성능에 미치는 영향을 정량화했다. 6개국 데이터로 federated YOLOv8을 단계적으로 확장한 결과 규모가 커질수록 이득이 줄었다. 4개국 구성의 mAP@50(0.41)이 5개국(0.40)과 대등하면서 변동성은 더 낮았다. 도메인 이동은 feature cosine similarity로 측정했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105314"><div><div class="t">11. <a href="https://doi.org/10.1016/j.aei.2026.105314" target="_blank">BridgeDiff: A two-stage conditional diffusion model for bridge point clouds completion</a></div><div class="m">Yunping Fang, Mohammad Reza Salami, Stergios-Aristoteles Mitoulis 외 · Advanced Engineering Informatics · 2027-01 #컴퓨터비전 #BIM #구조점검</div><div class="g">교량 스캔 point cloud는 스캔의 한계로 불완전한 경우가 많아 Scan-to-BIM에 걸림돌이 된다. 조건부 diffusion 기반의 2단계 완성 모델 BridgeDiff를 제안했다. coarse 단계에서 전체 형상을 복원하고 refinement 단계에서 모서리 같은 국부 디테일을 보강한다. 단경간 조적 아치교 1,000개 합성 데이터셋을 공개했고, Chamfer Distance 0.025, EMD 0.118로 기존 방법을 앞섰으며 실제 스캔에서도 일반화 성능을 확인했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105316"><div><div class="t">12. <a href="https://doi.org/10.1016/j.aei.2026.105316" target="_blank">From AI weather prediction to infrastructure resilience: a real-time correction–downscaling framework for tropical cyclone impact forecasting</a></div><div class="m">You Wu, Zhenguo Wang, Naiyu Wang · Advanced Engineering Informatics · 2027-01 </div><div class="g">전 지구 규모의 AI 기상예측을 자산 단위의 태풍 위험 정보로 바꾸기 위해 실시간 편향 보정, 지형 기반 downscaling, fragility 기반 송전망 위험 평가를 결합한 ACDF를 제안했다. 저장성 태풍 11개로 검증한 결과 500 m 해상도 풍속장을 12시간 주기당 약 25초에 생성했고, 관측소 풍속 MAE를 Pangu-Weather 대비 38.8% 줄였으며, 실제로 파손된 송전선도 사전에 지목했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107265"><div><div class="t">13. <a href="https://doi.org/10.1016/j.autcon.2026.107265" target="_blank">Beyond interoperability: a systematic review of semantic web technologies for BIM-enabled facility management (2019–2025)</a></div><div class="m">Rafay Ali Bukhari Syed, Marco D’Orazio, Muhammad Jamaluddin Thaheem 외 · Automation in Construction · 2027-01 #BIM</div><div class="g">BIM 기반 시설관리(FM)에 semantic web 기술(SWT)을 적용한 2019~2025년 논문 41편을 체계적으로 리뷰했다. SWT는 주로 도메인 간 연계에 쓰였고 정보관리가 가장 많이 다뤄졌다. 다만 다른 기술과의 통합이 정적이어서 실시간 연동이 부족하고, 확장성·보안·AI 통합 측면에 공백이 남아 있었다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107284"><div><div class="t">14. <a href="https://doi.org/10.1016/j.autcon.2026.107284" target="_blank">Revealing the hidden framework: Reconstructing occluded structural elements from indoor point clouds</a></div><div class="m">Patricia González-Cabaleiro, Muataz S.A. Albadri, Antonio Fernández 외 · Automation in Construction · 2027-01 #BIM #컴퓨터비전</div><div class="g">실내 point cloud로는 마감재 등에 가려 보이지 않는 구조부재를 복원하기 어렵다. segmentation·기하 피팅과 건설 지식(층간 연속성, 층내 정렬)을 결합해 완전히 가려진 기둥·보까지 추론하고 IFC로 재구성했다. 검출 가능한 부재의 식별률은 기둥 최대 100%, 보 83.3%였고, 단면 오차는 기둥 0.5 cm, 보 1.8 cm 이하였으며, 추론 단계에서 가려진 부재 약 78%를 복원했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107293"><div><div class="t">15. <a href="https://doi.org/10.1016/j.autcon.2026.107293" target="_blank">Diffusion-based intelligent generation of complex spatial joints using deformable tetrahedral grid representation</a></div><div class="m">Yilong An, Yafeng Wang, Ruhao Wang 외 · Automation in Construction · 2027-01 </div><div class="g">복잡한 공간 격자 구조 접합부 설계는 반복 최적화가 필요하고, voxel 생성 방식은 결과물의 역설계 부담이 크다. DMTet 표현 기반 diffusion 프레임워크 JointDiffusion으로 명시적 mesh를 바로 생성하고, 파이프 인터페이스를 복원해 CAD 솔리드로 변환했다. 유효 형상 374개로 학습했으며, 생성된 접합부는 스크리닝 후 원본과 비슷한 역학 응답 범위를 보였다.</div></div></label>
