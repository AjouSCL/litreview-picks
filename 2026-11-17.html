<h1>논문 선택 — 2026-11-17</h1>
<div class="sub">체크하고 아래 「보내기」를 누르면 DOI 목록이 채워진 메일 작성창이 뜹니다. <b>전송</b>하면 5분 안에 접수 확인 메일이 옵니다.</div>
<h2>신규 49편</h2><div class="sub">체크하면 전문을 받아 노트를 씁니다.</div>
<label><input type="checkbox" value="10.1016/j.aei.2026.105474"><div><div class="t">1. <a href="https://doi.org/10.1016/j.aei.2026.105474" target="_blank">Probabilistic remaining useful life prediction using Bayesian Kolmogorov–Arnold Networks</a></div><div class="m">Xin Zheng, Shaopeng Guan · Advanced Engineering Informatics · 2027-01 </div><div class="g">회전 베어링의 잔존수명(RUL)을 예측할 때 점추정만 하고 불확실성을 구분하지 못하는 문제를 다룬다. KAN의 B-spline 제어점을 확률변수로 두고 variational inference를 적용한 Bayesian KAN(B-KAN)을 제안해, RUL과 예측분포를 함께 출력한다. 열화 특징의 영향을 해석하는 경로-응답 근사와 위험 기반 정비전략도 함께 설계했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107371"><div><div class="t">2. <a href="https://doi.org/10.1016/j.autcon.2026.107371" target="_blank">Topology-driven automated generation of geometric digital twins for railway overhead line equipment</a></div><div class="m">M.R. Mahendrini Fernando Ariyachandra, Ioannis Brilakis · Automation in Construction · 2027-01 #디지털트윈 #BIM #컴퓨터비전</div><div class="g">철도 전차선 설비(OLE)의 point cloud를 geometric digital twin으로 바꾸는 작업이 수작업 위주라 노동이 많이 드는 문제를 다룬다. topology-aware segmentation, 규칙 기반 분류, 템플릿 기반 재구성을 결합해 IFC 모델을 자동 생성한다. 18.5km 데이터에서 F1 98.3%(C형 단면)·89.8%(접촉선), RMSE ±5.6cm를 얻었고 작업시간을 98% 줄였다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116687"><div><div class="t">3. <a href="https://doi.org/10.1016/j.engappai.2026.116687" target="_blank">Demand responsive machine activation for energy-aware dynamic hybrid flow shop scheduling under stochastic job arrivals</a></div><div class="m">Zhanwen Wu, Feng Zhang, Weihang Dong 외 · Engineering Applications of Artificial Intelligence · 2027-01 </div><div class="g">확률적으로 작업이 도착하는 hybrid flow shop에서 설비 가동 대수와 수요가 맞지 않아 유휴 에너지가 낭비되는 문제를 다룬다. 설비 전원 상태를 수요 대응형 용량 결정으로 모델링하고, hierarchical reinforcement learning으로 가동 결정과 디스패칭을 함께 조정한다. 생산 서비스 수준은 유지하면서 유휴 에너지 소비를 줄였다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116691"><div><div class="t">4. <a href="https://doi.org/10.1016/j.engappai.2026.116691" target="_blank">An end-to-end comprehensive solution for cross-illumination railway foreign object detection: Domain alignment, illumination adaptation, and edge deployment</a></div><div class="m">Hongxia Niu, Yu Zhou, Tao Hou · Engineering Applications of Artificial Intelligence · 2027-01 #컴퓨터비전</div><div class="g">야간 저조도 환경에서 철도 선로 이물질을 검출하기 어려운 문제를 다룬다. CycleGAN으로 주간 이미지 3,343장을 저조도 도메인으로 변환하고, SLE-Net·AFG-Conv를 갖춘 teacher를 knowledge distillation으로 경량화했다. student 모델은 Raspberry Pi 5에서 138ms latency를 냈고, 실제 선로 현장시험으로 검증했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116717"><div><div class="t">5. <a href="https://doi.org/10.1016/j.engappai.2026.116717" target="_blank">A reinforced sampling-based diffusion model for imbalanced fault diagnosis of governor valve actuators</a></div><div class="m">Zhanpeng Jiang, Yang Liu, Jun Tang 외 · Engineering Applications of Artificial Intelligence · 2027-01 </div><div class="g">터빈 조속밸브 액추에이터는 고장 데이터가 적고 불균형해 진단이 어렵다. 압력·진동 신호를 PM2W-LBP 텍스처 맵으로 변환하고 reinforced-sampling DDPM으로 데이터를 증강한다. 66MW 테스트베드의 5-shot 진단에서 Macro-F1 95.81%를 얻어 기존 LBP(90.50%)보다 높았다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116732"><div><div class="t">6. <a href="https://doi.org/10.1016/j.engappai.2026.116732" target="_blank">An expert-collaborative framework for communication-efficient traffic flow optimization in autonomous driving systems</a></div><div class="m">Yi Wang, Wenqian Shang · Engineering Applications of Artificial Intelligence · 2027-01 </div><div class="g">밀집 교차로에서 자율주행차의 통신 스케줄링과 교통흐름 최적화가 따로 노는 문제를 다룬다. LLM이 상위에서 의미 조정과 전문가 선택을 맡고, 하위 전문가 모듈이 신호제어·대역폭·통신반경을 실행하는 계층형 프레임워크를 제안했다. 여러 시뮬레이션 설정에서 효과를 확인했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116737"><div><div class="t">7. <a href="https://doi.org/10.1016/j.engappai.2026.116737" target="_blank">An efficient end-to-end Deep Reinforcement Learning scheduling framework for Automated Container Terminals</a></div><div class="m">Heng Huang, Gong Gao, Xiao Lai 외 · Engineering Applications of Artificial Intelligence · 2027-01 </div><div class="g">자동화 컨테이너 터미널의 장비 스케줄링에서 기존 RL은 동적·대규모 상황의 탐색 효율과 일반화가 떨어진다. offline 스케줄링 데이터로 online 학습을 유도하는 PPO-EBG 기반 DRL-ACTs를 제안했다. 불확실한 작업 도착과 장비 제약 조건에서 GA·DQN·PPO보다 대체로 우수했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116787"><div><div class="t">8. <a href="https://doi.org/10.1016/j.engappai.2026.116787" target="_blank">From B-scans to insights: Large language model-enhanced dynamic resolution and cross-modal fusion for real-time ground-penetrating radar target interpretation</a></div><div class="m">Feifei Hou, Chenjie Zhao, Xiaobo Wang · Engineering Applications of Artificial Intelligence · 2027-01 #구조점검 #컴퓨터비전</div><div class="g">터널 라이닝·도로·지하관로 점검에 쓰는 GPR에서 소형 표적 인식, 클러터 억제, 결과 해석이 부족한 문제를 다룬다. Dynamic Resolution Optimization과 Cross-Modal Attention Fusion을 탑재한 경량 검출기에 LLM 기반 의미 질의응답과 보고서 자동 생성을 결합했다(LigIntGPR). 소형 표적 검출이 7.96% 향상됐고, 엣지 장치에서 38 FPS를 냈다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116790"><div><div class="t">9. <a href="https://doi.org/10.1016/j.engappai.2026.116790" target="_blank">Data-augmented laser opto-ultrasonic dual detection with cross-source multimodal fusion for in-situ temperature prediction of nuclear power piping</a></div><div class="m">Jiajian Meng, Enpei Zhao, Ning Wang 외 · Engineering Applications of Artificial Intelligence · 2027-01 #구조점검</div><div class="g">원전 배관은 협소하고 열·기계 조건이 가혹해 비접촉으로 온도를 측정하기 어렵다. 레이저 초음파(LUT)와 LIBS 신호를 같은 위치에서 동시에 취득하고, TVM-GAN 증강과 SCTF-Net 융합으로 온도를 예측한다. 학습에 없던 온도 범위에서도 강건한 예측 성능을 보였다.</div></div></label>
<label><input type="checkbox" value="10.1061/jccee5.cpeng-7927"><div><div class="t">10. <a href="https://doi.org/10.1061/jccee5.cpeng-7927" target="_blank">Stability Assessment during Active Back-Support Exoskeleton Use for Construction Tasks</a></div><div class="m">Abiola Akanmu, Akinwale Okunola, Houtan Jebelli 외 · Journal of Computing in Civil Engineering · 2027-03-01 #웨어러블 #안전행동 #인간로봇</div><div class="g">능동형 허리보조 외골격을 입고 골조 목공 작업을 할 때 자세 안정성이 어떻게 변하는지 규명한다. 6가지 목공 세부작업에서 족저압을 발가락·중족·아치·뒤꿈치 영역별로 측정하고, 좌우 차이를 paired t-test로 비교했다. 굽힘·들기·비틀기·설치 자세에서 좌우 비대칭이 유의했고, 특히 아치와 중족부에 집중됐다.</div></div></label>
<label><input type="checkbox" value="10.1061/jccee5.cpeng-8197"><div><div class="t">11. <a href="https://doi.org/10.1061/jccee5.cpeng-8197" target="_blank">Multiobjective Optimization of Earthwork Operations: Joint Scheduling and Energy Management for Hydrogen Hybrid Fleets</a></div><div class="m">Lei Zhang, Tianyou Wang, Dawei Wang · Journal of Computing in Civil Engineering · 2027-03-01 #진도관리</div><div class="g">수소 연료전지 하이브리드 건설장비 군을 운용할 때 스케줄링과 전력 배분을 따로 다루면 실시간 에너지 변화를 반영하지 못한다. 적응형 이산 정밀도를 적용한 개선 다단계 DP(IDP)로 작업 스케줄링과 이중 에너지원 전력 배분을 함께 최적화한다. 실제 토공 시나리오에서 35.14%의 절감 효과를 보였다.</div></div></label>
<label><input type="checkbox" value="10.1061/jcemd4.coeng-18527"><div><div class="t">12. <a href="https://doi.org/10.1061/jcemd4.coeng-18527" target="_blank">Project Portfolio Selection and Scheduling Considering Supplier Diversification</a></div><div class="m">Lianxia Li, Libiao Bai, Yipei Zhang 외 · Journal of Construction Engineering and Management · 2027-02-01 #진도관리</div><div class="g">건설 프로젝트 포트폴리오의 선정·일정 계획(PPSS)에 공급자 다변화를 반영한 연구가 드물다. 이익 최대화와 자원 공급 리스크 최소화를 동시에 다루는 이중목적 모델을 세우고, ε-constraint로 Pareto 해를 구했다. 리스크 최소해는 이익을 69.5% 잃는 대신 리스크를 95.3% 줄였고, 절충해는 이익 손실이 작으면서도 리스크를 크게 줄였다.</div></div></label>
<label><input type="checkbox" value="10.1061/jcemd4.coeng-18631"><div><div class="t">13. <a href="https://doi.org/10.1061/jcemd4.coeng-18631" target="_blank">Understanding Work-Related Disability in the Construction Industry: A Topic Modeling Approach</a></div><div class="m">Cho Hyun Park, Soowon Chang, Mi Hee Park 외 · Journal of Construction Engineering and Management · 2027-02-01 #안전행동</div><div class="g">건설업 업무상 장애 연구의 흐름을 정리하고 향후 방향을 제시한다. 논문 623편에 LDA topic modeling을 적용해 15개 주제를 찾았고, 이를 근골격계 인간공학, 직업 위험과 건강, 장애 관리·복귀 지원의 3개 영역으로 묶었다. 기존 연구는 생물학적 측면에 치우쳐 있으며 신기술의 영향이나 조기 기능지표 등은 공백으로 남아 있다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105428"><div><div class="t">14. <a href="https://doi.org/10.1016/j.aei.2026.105428" target="_blank">Measurement-aligned generative reasoning for traceable manufacturing quality prognosis under scarce industrial data</a></div><div class="m">Yizhang Zhu, Jianyu Zhang, Fanyu Qi 외 · Advanced Engineering Informatics · 2027-01 </div><div class="g">데이터 기반 제조 품질 예측은 물리 메커니즘을 추론하지 못해 분포가 바뀌면 취약하다. 전문가 사전지식을 reasoning fine-tuning으로 주입하고, 측정값 정렬 보상 기반 RL과 Wasserstein critic을 결합한 generative reasoning 프레임워크를 제안했다. 데이터가 적은 조건에서도 추적 가능한 추론 경로를 남기며 품질을 예측한다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105441"><div><div class="t">15. <a href="https://doi.org/10.1016/j.aei.2026.105441" target="_blank">Semantic enhanced multi-object action modeling benchmark and LVLM prompt optimization for airport visual surveillance</a></div><div class="m">Shengjie Zhang, Yang Yang, Yufan Hu 외 · Advanced Engineering Informatics · 2027-01 #컴퓨터비전</div><div class="g">공항 영상감시는 객체 위치와 궤적만 제공할 뿐 여러 객체가 무엇을 하는지는 알려주지 못한다. detection·tracking·captioning을 통합한 Multi-Object Action Modeling 벤치마크 Air-SMOAM을 구축하고, LVLM prompt 최적화 방법을 제안했다. 원거리 소형 객체, 가림, 큰 스케일 변화가 있는 환경에서 ID 정렬된 행동 캡션을 생성한다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105450"><div><div class="t">16. <a href="https://doi.org/10.1016/j.aei.2026.105450" target="_blank">From demonstration to execution: Single-demonstration task and motion learning for robotic manipulation</a></div><div class="m">Tao Ma, Mingkun Wu, Burkhard Corves · Advanced Engineering Informatics · 2027-01 #인간로봇</div><div class="g">기존 LfD는 시연을 여러 번 필요로 하거나 작업 추론과 동작 생성을 따로 다룬다. 시연 한 번에서 agent-centric action segmentation으로 행동 primitive를 추출하고, semantic network와 PDDLStream으로 작업·동작 계획을 통합했다. 배치가 달라진 유사 작업에도 일반화해 실행할 수 있다.</div></div></label>
