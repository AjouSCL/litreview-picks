<style>
:root{--bg:#fff;--fg:#1d1f23;--mute:#6b7078;--line:#e4e6ea;--card:#f7f8fa;--acc:#1a4c8b;--on:#e8f0fb}
@media (prefers-color-scheme:dark){:root{--bg:#16181c;--fg:#e6e8eb;--mute:#9aa0a8;--line:#2c3036;--card:#1e2126;--acc:#7fb0ff;--on:#1f2d42}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}

<h1>논문 선택 — 2026-10-26</h1>
<div class="sub">체크하고 아래 「보내기」를 누르면 DOI 목록이 채워진 메일 작성창이 뜹니다. <b>전송</b>하면 5분 안에 접수 확인 메일이 옵니다.</div>
<h2>신규 7편</h2><div class="sub">체크하면 전문을 받아 노트를 씁니다.</div>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116568"><div><div class="t">1. <a href="https://doi.org/10.1016/j.engappai.2026.116568" target="_blank">Spin adjacency attention network for surface defect segmentation in manufacturing</a></div><div class="m">Xu Wang, Zhaoshui He, Deyi Wang 외 · Engineering Applications of Artificial Intelligence · 2026-12 #컴퓨터비전</div><div class="g">제조 표면의 작은 결함은 정상 영역과 모양이 비슷해 segmentation이 어렵다. 이 문제를 풀려고 회전 변환으로 feature augmentation을 하는 Spin Adaptive Attention과, 비슷한 영역을 세밀한 feature로 가르는 Adjacency Route Attention을 결합한 SAA-Net을 제안했다. NEU-SEG·Magnetic-Tile·MVTec-AD·DAGM에서 mIoU 성능을 검증했으며, 구조물 표면 결함 탐지에도 옮겨 쓸 수 있다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116587"><div><div class="t">2. <a href="https://doi.org/10.1016/j.engappai.2026.116587" target="_blank">Cognitive and mental state-aware autonomous driving with multi-task electroencephalography-based deep learning framework for hazard perception, trust prediction, cognitive load estimation, and brain–computer interface integration</a></div><div class="m">I. Mohamed Shiek Mothi, U. Sabura Banu, M. Mohamed Ismail · Engineering Applications of Artificial Intelligence · 2026-12 #웨어러블 #안전행동</div><div class="g">EEG로 탑승자의 위험 인지·신뢰·인지부하를 추정하고 BCI motor-imagery를 분류하는 multi-task deep learning framework를 제안했다. 인지부하 추정에는 EEG와 HRV를 융합했다. 공개 데이터셋 5종의 특성을 본뜬 합성 EEG에서 random forest·XGBoost·SVM·CNN-RNN·EEG Transformer를 비교했는데, 합성 데이터에서는 정확도가 천장에 가까웠다. 저자들은 이 결과가 실제 판독 가능성이 아니라 시뮬레이션의 분리성을 반영한다고 보고 실데이터로 추가 검증했다. 작업자 인지 상태를 웨어러블로 계측하는 연구에 참고할 수 있다.</div></div></label>
<label><input type="checkbox" value="10.1061/jcemd4.coeng-17714"><div><div class="t">3. <a href="https://doi.org/10.1061/jcemd4.coeng-17714" target="_blank">A Readiness Model for Integrated Project Delivery</a></div><div class="m">Ahmad J. Arar, Erik Poirier, Sheryl Staub-French · Journal of Construction Engineering and Management · 2027-01-01 </div><div class="g">IPD(통합 프로젝트 발주)는 기존 방식과 차이가 커서 현장 경험이 아직 부족하므로, 프로젝트 팀이 IPD를 도입할 준비가 됐는지 평가할 도구가 필요하다. 이를 위해 design science research 원칙에 따라 IPD 역량별 준비도를 진단하는 프로젝트 단위 readiness model과 평가 도구를 개발하고 예비 평가했다. 초기 단계에서 IPD 도입을 계획하고 팀·자원·계획을 맞추는 데 쓸 수 있는 구조화된 틀을 제시한다.</div></div></label>
<label><input type="checkbox" value="10.1061/jcemd4.coeng-19015"><div><div class="t">4. <a href="https://doi.org/10.1061/jcemd4.coeng-19015" target="_blank">Automated Precamber Estimation Framework for PC Components from 2D Images Using a Vision Transformer</a></div><div class="m">Woobin Kwon, Kwan Yun, Hyunsu Lim 외 · Journal of Construction Engineering and Management · 2027-01-01 #컴퓨터비전 #모듈러</div><div class="g">현장에서 프리캐스트 콘크리트(PC) 부재의 프리캠버를 재는 일은 아직 손으로 하는 노동집약 작업이다. 이를 자동화하려고 2D 이미지만으로 프리캠버를 추정하는 framework를 제안했다. 설계 제원을 기준값으로 삼아 기준 물체 없이 기하를 추정하고, hybrid synthetic data로 학습한 ViT 기반 구조를 결합했다. 현장 검증에서 평균 오차는 1.91 mm였고, 수작업보다 점검 시간을 79.82%, 인건비를 91.70% 줄였다.</div></div></label>
<label><input type="checkbox" value="10.1061/jcemd4.coeng-19355"><div><div class="t">5. <a href="https://doi.org/10.1061/jcemd4.coeng-19355" target="_blank">Machine-Learning Models for Predicting Condition Rating of Cast-in-Place and Precast Concrete Bridge Decks</a></div><div class="m">Hadil Helaly, Khaled El-Rayes, Ernest-John Ignacio · Journal of Construction Engineering and Management · 2027-01-01 #구조점검</div><div class="g">미국 National Bridge Inventory에 있는 교량 286,034개의 점검 데이터를 써서 현장타설 바닥판과 프리캐스트 바닥판의 상태등급을 예측했다. OLS·Ridge·LASSO·SVR·random forest·XGBoost 등 6개 machine learning 모델을 비교했고, hyperparameter는 genetic algorithm으로 최적화했다. R²·MAPE·RMSE 등 5개 지표와 5-fold cross-validation, permutation importance로 성능을 평가해 교량 유지보수 의사결정을 지원한다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.aei.2026.105385"><div><div class="t">6. <a href="https://doi.org/10.1016/j.aei.2026.105385" target="_blank">Edge-deployable electro-mechanical feature fusion for structural anomaly detection using dual-pathway energy-harvesting piezoelectric sensing</a></div><div class="m">Hadi Salehi, Arina Chauhan · Advanced Engineering Informatics · 2027-01 #구조점검</div><div class="g">노후 인프라를 상시 SHM하려면 전력 공급·데이터 전송 대역폭·손상 라벨 부족이 걸림돌이다. 이에 능동 진동 계측 경로와 에너지 하베스팅 경로를 함께 쓰는 dual-pathway 압전 센싱 framework를 만들었다. 두 경로의 신호를 electro-mechanical feature fusion으로 합쳐 edge 장치에서 이상을 탐지한다. 5 Hz 가진을 받는 볼트 체결 캔틸레버 판에서 Feather 마이크로컨트롤러와 0.1 F 슈퍼커패시터로 실험실 개념 검증을 했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107333"><div><div class="t">7. <a href="https://doi.org/10.1016/j.autcon.2026.107333" target="_blank">Influence of wall-configuration on the early-age behavior of 3D-printed recycled sand concrete walls under progressive construction loading</a></div><div class="m">Huawei Liu, Xin Li, Yiyuan Zhang 외 · Automation in Construction · 2027-01 #모듈러</div><div class="g">자동화된 콘크리트 벽체 시공에서 초기 재령의 침하와 횡변형을 제어하려면 벽체 형상과 적층 하중 일정을 함께 설계해야 한다. 이를 위해 3D 프린팅 순환모래 콘크리트(3DPCRS) 벽체를 대상으로 초기 재령 시험, 재령을 맞춘 FE 시뮬레이션, 해석적 계산을 결합해 리브 배치와 하중 이력별 거동을 평가했다. 리브 4개 배치가 변형 제어와 재료 사용 사이에서 균형이 가장 좋았고, 3DPCRS는 최대 단기 크리프가 71% 낮았지만 피크 이후 연화는 더 가팔랐다.</div></div></label>
</main>
<div class="bar"><div><span class="n"><b id="n">0</b>편 선택</span>
<button id="gm" disabled>Gmail로 보내기</button><button id="ap" class="alt" disabled>메일 앱으로 보내기</button>
<span id="msg">작성창이 열렸으면 <b>전송</b>을 눌러야 접수됩니다. 5분 안에 「접수」 확인 메일이 옵니다. 안 오면 다른 버튼으로 다시 보내세요.</span></div></div>
<script>
const TO="bjchoi13@gmail.com", ME="bchoi@ajou.ac.kr", KEY="2026-10-26", K="picks-"+KEY, OLD=false;
const boxes=[...document.querySelectorAll("input")], gm=document.getElementById("gm"), ap=document.getElementById("ap");
try{const s=JSON.parse(localStorage.getItem(K)||"[]");boxes.forEach(b=>b.checked=s.includes(b.value))}catch(e){}
const sel=()=>boxes.filter(b=>b.checked).map(b=>b.value);
function upd(){const d=sel();document.getElementById("n").textContent=d.length;
  gm.disabled=ap.disabled=!d.length&&!OLD;   // 검토 칸이 있으면 0편도 보낼 수 있다(전부 지움)
  try{localStorage.setItem(K,JSON.stringify(d))}catch(e){}}
boxes.forEach(b=>b.addEventListener("change",upd));upd();
const su=()=>"[논문선택] "+KEY+" "+sel().length+"편", body=()=>sel().join("\n")+"\n", q=encodeURIComponent;
const done=()=>document.getElementById("msg").style.display="block";
// 폰에서는 Gmail 웹 작성창 주소가 앱·받은편지함으로 넘어가며 내용을 잃는다(2026-09-27 실측). 메일 앱을 주 버튼으로.
if(matchMedia("(pointer:coarse)").matches){gm.className="alt";ap.className="";gm.parentNode.insertBefore(ap,gm)}
gm.onclick=()=>{done();window.open("https://mail.google.com/mail/?authuser="+q(ME)+"&view=cm&fs=1&to="+q(TO)+"&su="+q(su())+"&body="+q(body()),"_blank")};
ap.onclick=()=>{done();location.href="mailto:"+TO+"?subject="+q(su())+"&body="+q(body())};
</script></body></html>
