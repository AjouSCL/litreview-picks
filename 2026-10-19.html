<style>
:root{--bg:#fff;--fg:#1d1f23;--mute:#6b7078;--line:#e4e6ea;--card:#f7f8fa;--acc:#1a4c8b;--on:#e8f0fb}
@media (prefers-color-scheme:dark){:root{--bg:#16181c;--fg:#e6e8eb;--mute:#9aa0a8;--line:#2c3036;--card:#1e2126;--acc:#7fb0ff;--on:#1f2d42}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:820px;margin:0 auto;padding:16px 16px 110px}h1{font-size:19px;margin:8px 0 2px}.sub{color:var(--mute);font-size:13px;margin-bottom:14px}
label{display:flex;gap:12px;padding:14px;margin:0 0 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer}
label:has(input:checked){background:var(--on);border-color:var(--acc)}

.t{font-weight:600}.t a{color:var(--acc);text-decoration:none}.m{color:var(--mute);font-size:13px}.g{margin-top:6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px}
.bar div{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

#msg{display:none;width:100%;font-size:13px;color:var(--mute)}
h2{font-size:16px;margin:26px 0 4px}h2+.sub{margin-bottom:10px}

<h1>논문 선택 — 2026-10-19</h1>
<div class="sub">체크하고 아래 「보내기」를 누르면 DOI 목록이 채워진 메일 작성창이 뜹니다. <b>전송</b>하면 5분 안에 접수 확인 메일이 옵니다.</div>
<h2>신규 11편</h2><div class="sub">체크하면 전문을 받아 노트를 씁니다.</div>
<label><input type="checkbox" value="10.1016/j.aei.2026.105377"><div><div class="t">1. <a href="https://doi.org/10.1016/j.aei.2026.105377" target="_blank">Multi-objective workload-aware scheduling of reliable and energy-efficient UAV swarms: A multi-agent DQN–PPO framework</a></div><div class="m">Lakshay Saini, Anupam Gautam · Advanced Engineering Informatics · 2027-01 </div><div class="g">작업 수요가 변할 때 UAV swarm의 작업량이 고르지 않으면 에너지 소비가 불균형해지는 문제를 다룬다. k-out-of-n:G 구성에 활성화·비활성화(AD) 기능을 넣어 작업량·전력·고장·수리를 함께 모델링하고, 이를 MDP로 정식화해 multi-agent DQN–PPO로 스케줄링한다. 단독 DQN·PPO 컨트롤러를 baseline으로 비교한다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107310"><div><div class="t">2. <a href="https://doi.org/10.1016/j.autcon.2026.107310" target="_blank">Causally informed framework for metro track defect diagnosis, degradation prediction, and maintenance prioritization</a></div><div class="m">Yi Wang, Xiaopei Cai, Xueyang Tang 외 · Automation in Construction · 2027-01 #구조점검 #컴퓨터비전</div><div class="g">육안 점검만으로는 지하철 궤도 결함이 어떻게 진전될지 예측하기 어렵고 후속 점검 우선순위를 정하기도 어렵다. CaDPR은 이미지 feature와 9차원 동반결함 context를 gated multi-encoder로 결합해 패드·클립 열화를 예측하고, 예측 불확실성을 반영해 순위를 할인한다. 2개 노선의 파상마모 노출 쌍 1,312개로 평가했으며, confidence-discounted ensemble ranking이 점수만 쓴 순위보다 nDCG@20을 높였다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.autcon.2026.107315"><div><div class="t">3. <a href="https://doi.org/10.1016/j.autcon.2026.107315" target="_blank">Recovering ontology-normalized layer classes from vector-native PDF drawings via graph-based learning</a></div><div class="m">Andrea Carrara, Mahito Sugiyama, Stavros Nousias 외 · Automation in Construction · 2027-01 #BIM</div><div class="g">vector-native PDF 도면은 기하는 남지만 CAD 레이어 구조를 잃는다. 이를 rasterize하지 않고 graph로 바꿔 ontology로 정규화된 레이어 클래스를 예측하는 pipeline을 제안했다. 도면 381장·벡터 요소 1,210만 개·세부 클래스 307개 벤치마크에서 local geometric context를 넣으면 세부 정확도가 0.342에서 0.438로 올랐고, 장기 학습에서는 세부 0.612·대분류 0.777에 이르렀다. 다만 exporter가 바뀌면 전이 정확도가 0.064–0.122에 그쳤다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.dibe.2026.101087"><div><div class="t">4. <a href="https://doi.org/10.1016/j.dibe.2026.101087" target="_blank">Incorporating Design for Disassembly in Facades: Insights from Prefabricated and On-Site Construction Practices</a></div><div class="m">Sühan Artuğ, Olga Ioannou · Developments in the Built Environment · 2026-10 #모듈러</div><div class="g">순환형 건물을 위해 외벽 상세에 해체를 고려한 설계(DfD)를 어떻게 반영할지 검토한다. 프리패브가 일반화된 네덜란드와 현장 시공 중심의 사례를 비교해 기존 벽체 상세의 해체 가능성을 분석했다. 해체 기준은 공법별로 달리 적용할 수 있고, 바이오 기반 재료도 해체 가능성을 유지하며 대안이 될 수 있다는 결론이다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116529"><div><div class="t">5. <a href="https://doi.org/10.1016/j.engappai.2026.116529" target="_blank">Image restoration via optimizing fidelity with diffusion and gradient regularization</a></div><div class="m">Jiaqi Zhang, Guo Yang, Zheng Pang 외 · Engineering Applications of Artificial Intelligence · 2026-12 #컴퓨터비전</div><div class="g">diffusion prior에만 기대는 기존 image restoration은 표현력에 한계가 있다. FDGR은 diffusion prior에 non-convex gradient regularization을 더하고 이를 frequency domain까지 넓힌 zero-shot restoration framework로, artifact를 억제하면서 edge를 보존한다. 구조 충실도와 지각적 자연스러움을 따로 최적화하는 multi-mode 방식과 plug-and-play sampling을 함께 제안했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116533"><div><div class="t">6. <a href="https://doi.org/10.1016/j.engappai.2026.116533" target="_blank">Data-driven understanding of macro-micro feature evolution in cement-based composites under extreme low-temperature environments</a></div><div class="m">Yuan Feng, Lingyan Zhang, Jian-Xin Lu 외 · Engineering Applications of Artificial Intelligence · 2026-12 </div><div class="g">극지·극저온 저장시설처럼 극한 저온 환경에 놓인 시멘트 복합재는 실험 데이터가 적어 거동을 이해하고 data-driven 설계를 하기 어렵다. 상온 데이터로 Bayesian 최적화한 source model을 만든 뒤 저온 데이터로 fine-tuning하는 knowledge-guided transfer learning을 제안했다. 이를 통해 조성–온도–미세구조–물성 관계를 정리하고 극저온 외삽 예측의 신뢰도를 높였다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116535"><div><div class="t">7. <a href="https://doi.org/10.1016/j.engappai.2026.116535" target="_blank">Early and visible detection of fugitive methane leaks in industrial infrared videos via local-global contrast enhancement</a></div><div class="m">Song Gao, Hao Yang, Yiyuan Cheng 외 · Engineering Applications of Artificial Intelligence · 2026-12 #컴퓨터비전 #안전행동</div><div class="g">적외선 가스 영상에서 메탄 plume은 프레임의 평균 6.12%만 차지하고 대비도 낮아 판독이 어렵다. U-shaped Transformer에 Local Perception Enhancement Module을 넣어 plume을 강조하고 조기 누출을 탐지하는 framework를 만들었고, 적외선 프레임 18만 장으로 학습·평가했다. ROI PSNR 35.41 dB를 얻었고, 강조한 입력을 쓰면 객체 탐지 mIoU가 76%에서 85%로 오르고 false negative가 31.5% 줄었다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116545"><div><div class="t">8. <a href="https://doi.org/10.1016/j.engappai.2026.116545" target="_blank">A forward–inverse convolutional neural network framework for accelerated seepage failure prediction in porous geomaterials</a></div><div class="m">Binqing Wu, Ning Wang, Manuel Pastor 외 · Engineering Applications of Artificial Intelligence · 2026-12 </div><div class="g">다공성 지반재료의 침투 파괴를 고충실도로 시뮬레이션하면 계산 비용이 너무 크다. SPH 시뮬레이션 변수를 구조화된 이미지로 바꾼 뒤, 재료 물성에서 등가 소성변형률 장을 만드는 forward CNN과 변형률 이미지에서 토질 물성을 역추정하는 inverse CNN을 짝지은 framework를 제안했다. forward 모델은 파괴대 형상을 빠르고 정확하게 재현했다.</div></div></label>
<label><input type="checkbox" value="10.1080/01446193.2026.2739473"><div><div class="t">9. <a href="https://doi.org/10.1080/01446193.2026.2739473" target="_blank">A Situation Monitoring, Analysis, and Reporting Team (SMART) framework for structuring Situational Awareness (SA) in construction projects</a></div><div class="m">Prajwal Prabhu, Vishal Singh, Uttam Jodawat · Construction Management and Economics · 2026-10-19 #진도관리</div><div class="g">초록 없음</div></div></label>
<label><input type="checkbox" value="10.1016/j.engappai.2026.116528"><div><div class="t">10. <a href="https://doi.org/10.1016/j.engappai.2026.116528" target="_blank">Sparsified q-deformation of kernel recursive maximum correntropy learning for indoor localization</a></div><div class="m">Wenhao Dong, Xifeng Li, Dongjie Bi 외 · Engineering Applications of Artificial Intelligence · 2026-12 </div><div class="g">RSSI fingerprint 기반 실내 측위는 비가우시안 환경 잡음에 성능이 떨어진다. q-deformation 이론을 적용한 kernel adaptive filter인 qKRMC와, 이를 Nyström 방식으로 희소화한 Nys-qKRMC를 제안하고 가우시안 가정에서 수렴성도 보였다. 실험 4개로 구조가 간결하면서도 측위 정확도가 더 높음을 확인했다.</div></div></label>
<label><input type="checkbox" value="10.1016/j.jobe.2026.117591"><div><div class="t">11. <a href="https://doi.org/10.1016/j.jobe.2026.117591" target="_blank">A non-invasive method for office work-status monitoring combined with indoor environmental quality (IEQ)</a></div><div class="m">Shijia Hu, Yaning Zhao, Da Yang 외 · Journal of Building Engineering · 2026-10 #컴퓨터비전 #건물성능</div><div class="g">사무 작업이 길어지면 건강에 해롭지만, 기존 작업 상태 모니터링은 침습적이고 실내 환경과의 관계를 고려하지 않는다. 모니터에 뜬 사무 소프트웨어 toolbar를 YOLOv8로 인식해 작업 상태와 지속시간을 추정하고, Arduino 센서로 IEQ를 함께 계측했다. 작업 상태 정확도 92.09%, 지속시간 정확도 96.46%를 얻었고, IEQ 가중 임계값을 탐색적 기준점으로 제시했다.</div></div></label>
</main>
<div class="bar"><div><span class="n"><b id="n">0</b>편 선택</span>
<button id="gm" disabled>Gmail로 보내기</button><button id="ap" class="alt" disabled>메일 앱으로 보내기</button>
<span id="msg">작성창이 열렸으면 <b>전송</b>을 눌러야 접수됩니다. 5분 안에 「접수」 확인 메일이 옵니다. 안 오면 다른 버튼으로 다시 보내세요.</span></div></div>
<script>
const TO="bjchoi13@gmail.com", ME="bchoi@ajou.ac.kr", KEY="2026-10-19", K="picks-"+KEY, OLD=false;
const boxes=[...document.querySelectorAll("input")], gm=document.getElementById("gm"), ap=document.getElementById("ap");
try{const s=JSON.parse(localStorage.getItem(K)||"[]");boxes.forEach(b=>b.checked=s.includes(b.value))}catch(e){}
const sel=()=>boxes.filter(b=>b.checked).map(b=>b.value);
function upd(){const d=sel();document.getElementById("n").textContent=d.length;
  gm.disabled=ap.disabled=!d.length&&!OLD;   // 검토 칸이 있으면 0편도 보낼 수 있다(전부 지움)
  try{localStorage.setItem(K,JSON.stringify(d))}catch(e){}}
boxes.forEach(b=>b.addEventListener("change",upd));upd();
const su=()=>"[논문선택] "+KEY+" "+sel().length+"편", body=()=>sel().join("\n")+"\n", q=encodeURIComponent;
const done=()=>document.getElementById("msg").style.display="block";
// 폰에서는 Gmail 웹 작성창 주소가 앱·받은편지함으로 넘어가며 내용을 잃는다(2026-09-27 실측). 메일 앱을 주 버튼으로.
if(matchMedia("(pointer:coarse)").matches){gm.className="alt";ap.className="";gm.parentNode.insertBefore(ap,gm)}
gm.onclick=()=>{done();window.open("https://mail.google.com/mail/?authuser="+q(ME)+"&view=cm&fs=1&to="+q(TO)+"&su="+q(su())+"&body="+q(body()),"_blank")};
ap.onclick=()=>{done();location.href="mailto:"+TO+"?subject="+q(su())+"&body="+q(body())};
</script></body></html>
